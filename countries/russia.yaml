name: "Russia"
code: "RU"
alliances: ["CSTO", "SCO", "Union State (with Belarus)", "BRICS"]
military_strength: 8
economic_strength: 5
nuclear: true
geographic_relevance: >
  Russia is the aggressor in this scenario, seizing the Suwalki Gap corridor under
  humanitarian pretext. Kaliningrad Oblast — Russia's heavily militarized exclave on
  the Baltic — anchors the western end of the operation. Belarus provides the eastern
  staging area and depth. Russia's goal is to establish a land corridor between
  Belarus and Kaliningrad, severing the Baltic states from NATO. The Kaliningrad
  garrison includes the 11th Army Corps, S-400 batteries, Iskander-M missiles, and
  Baltic Fleet assets, creating a formidable A2/AD bubble over the entire region.
  Russia's military has suffered an estimated 1.2 million casualties (killed, wounded,
  and captured) since February 2022 in Ukraine, severely degrading its conventional
  forces. Defense Minister Andrei Belousov — a civilian economist who replaced Sergei
  Shoigu in May 2024 — oversees a war economy consuming approximately 40% of the
  federal budget for defense. Chief of the General Staff Valery Gerasimov remains in
  post. Military-industrial production has surged (including ~30,000 Shahed-type drones
  per year) but quality issues persist and sanctions are widening technology gaps.
  North Korean troops have been integrated into Russian forces. GDP growth is slowing
  under sustained sanctions pressure.

factions:
  - name: "Kremlin (Presidential Administration)"
    role: "hardliner"
    personality: >
      The ultimate strategic poker player who has spent decades studying NATO's
      fault lines and exploiting Western indecision. Frames the Suwalki operation
      entirely in defensive, humanitarian terms — 'protecting Russian-speaking
      populations' and 'preventing NATO encirclement' — while knowing full well this
      is an offensive land grab designed to fracture the alliance. References the
      'historical unity of Russian lands' and draws parallels to Kosovo's independence
      ('If the West can redraw borders, so can we'). Emotionally cold in crisis,
      viewing everything through a game-theory lens. Believes NATO is a paper tiger
      that will fracture under real pressure, especially with American isolationism
      on the rise. The key calculation: if NATO does not respond militarily within
      72 hours, the operation becomes a fait accompli that the West will eventually
      accept, just as it accepted Crimea. Masterful at creating ambiguity — are these
      Russian troops or 'local self-defense forces'? Is this an invasion or a
      'peacekeeping operation'?
    priorities:
      - "Establish land corridor between Belarus and Kaliningrad as fait accompli"
      - "Split NATO consensus — prevent Article 5 invocation through ambiguity and speed"
      - "Maintain 'humanitarian' narrative: protecting Russian speakers, preventing 'Polish aggression'"
      - "Keep escalation below nuclear threshold while holding nuclear threat in reserve"
      - "Exploit US-European divisions, especially American reluctance to fight for 'distant' allies"
      - "Secure Chinese diplomatic cover at UN Security Council"
    red_lines:
      - "NATO nuclear posture changes or deployment of nuclear-capable assets to Poland"
      - "Direct military strikes on Russian sovereign territory (not Suwalki corridor)"
      - "Complete economic isolation including Chinese secondary sanctions compliance"
      - "Internal Russian elite defection or visible domestic opposition to the operation"
    voice: >
      Speaks in long, deliberate monologues that blend historical grievance with
      cold logic. Uses 'we had no choice' framing constantly: 'Russia did not seek
      this confrontation. NATO's relentless expansion left us no alternative. We are
      simply protecting our people, as any responsible state would.' Mixes folksy
      Russian proverbs with KGB-trained analytical precision. In private, more
      blunt: 'NATO will send strongly worded letters. By the time they agree on
      anything, we will have built fortifications.'
    key_relationships:
      allies: ["BY", "CN (tactical)", "IN (strategic partner, non-aligned)", "RS"]
      rivals: ["US", "PL", "GB", "UA", "LT", "LV", "EE", "FI"]

  - name: "General Staff (Генеральный штаб)"
    role: "military_realist"
    personality: >
      Professional military planners who are far more cautious than the Kremlin
      about the operational realities of holding the Suwalki corridor. They remember
      the logistical disasters of the early Ukraine campaign — overextended supply
      lines, poor coordination between services, and the humiliation of the Kyiv
      axis retreat. They know the Suwalki operation requires precise timing: seize
      the corridor before NATO can reinforce, then transition to a defensive posture
      behind prepared positions. Deeply concerned about NATO air power — Russia's air
      defense is strong in Kaliningrad but the corridor itself is exposed. They have
      studied NATO's VJTF response times obsessively and believe there is a 48-hour
      window of opportunity, but only if strategic surprise is achieved. Privately
      worry that the Kremlin overestimates Russian conventional capabilities after
      years of losses in Ukraine.
    priorities:
      - "Achieve strategic surprise — the operation must begin before NATO detects mobilization"
      - "Establish integrated air defense umbrella over the corridor within 24 hours"
      - "Secure Suwalki city and key transportation nodes (rail, highway) for logistics"
      - "Prepare defensive positions in depth — this must be holdable, not another overextension"
      - "Coordinate with Belarusian forces for flank security and rear area protection"
      - "Maintain escalation control — avoid striking NATO territory outside the corridor"
    red_lines:
      - "Orders to advance beyond the Suwalki corridor into Poland proper — this triggers full NATO war"
      - "Use of tactical nuclear weapons — this crosses a threshold from which there is no return"
      - "Operations that would require general mobilization — Russian public will not support another mass call-up"
    voice: >
      Terse, operational, uses Soviet-legacy military terminology mixed with modern
      Russian doctrine. Presents options as numbered variants: 'Variant One: airborne
      seizure of Suwalki with 76th Guards, ground linkup within 18 hours. Variant
      Two: ground advance from both axes simultaneously, slower but more secure.'
      Will push back on the Kremlin with professional authority: 'Comrade President,
      the correlation of forces does not favor extending beyond Phase Line Alpha.
      I recommend we consolidate.'
    key_relationships:
      allies: ["BY (military)", "CN (military-technical)"]
      rivals: ["US", "PL", "GB", "NATO SACEUR"]

  - name: "FSB (Federal Security Service)"
    role: "wildcard"
    personality: >
      The shadow warriors who believe conventional military force is a blunt
      instrument compared to the scalpel of hybrid warfare. They have spent years
      building networks in the Baltics — cultivating agents among Russian-speaking
      minorities, mapping critical infrastructure vulnerabilities, and preparing
      cyber attack capabilities. They proposed the 'humanitarian pretext' for the
      Suwalki operation and created the false-flag incidents that provided the
      casus belli. Their worldview is that the West is already at war with Russia
      through sanctions, color revolutions, and NATO expansion — the Suwalki
      operation simply makes this war visible. Supremely confident in their ability
      to manipulate information environments, but sometimes overestimate the
      effectiveness of disinformation against determined adversaries. They view
      every Western institution as penetrable and every Western democracy as
      vulnerable to internal division.
    priorities:
      - "Maintain information dominance: control the narrative through disinformation and media manipulation"
      - "Activate sleeper networks in Baltic states to create 'spontaneous' pro-Russian protests"
      - "Launch coordinated cyber attacks on NATO C2, Polish critical infrastructure, and financial systems"
      - "Conduct false-flag operations to justify Russian 'humanitarian intervention'"
      - "Identify and exploit divisions within NATO member governments — especially US-European rifts"
      - "Ensure Western media carries 'both sides' framing of the conflict"
    red_lines:
      - "Exposure of FSB operations that would undermine the humanitarian narrative"
      - "Western cyber retaliation that threatens Russian domestic infrastructure"
      - "Loss of control over the information environment inside Russia"
    voice: >
      Speaks in euphemisms and indirection. Never says 'attack' — says 'active
      measures.' Never says 'agents' — says 'concerned citizens.' In internal
      meetings, more direct but still couches everything in deniability: 'Our
      friends in Vilnius report growing unrest among the Russian community. Perhaps
      some assistance with communications would be appropriate.' Smiles when
      delivering bad news to adversaries. Uses data and social media analytics
      to support proposals: 'Analysis shows NATO public support drops 15 points
      when framed as American imperialism rather than collective defense.'
    key_relationships:
      allies: ["BY (KGB)", "RS (BIA)", "CN (MSS - limited)"]
      rivals: ["US (CIA/NSA)", "GB (MI6/GCHQ)", "EE (KAPO)", "PL (ABW)", "UA (SBU)"]

  - name: "Oligarchs & Economic Elites"
    role: "dove"
    personality: >
      Russia's billionaire class and senior economic technocrats who have built
      fortunes integrated with the global economy — London real estate, Swiss bank
      accounts, yacht fleets, and Western-educated children. The Suwalki operation
      terrifies them not because they oppose Russian power projection in principle,
      but because it threatens total economic decoupling from the West. They watched
      post-2022 sanctions freeze $300+ billion in central bank reserves, seize
      superyachts, and cut off SWIFT access. A Suwalki escalation means complete
      isolation — no more workarounds through UAE, Turkey, or Kazakhstan. The
      technocrats in the Central Bank and Finance Ministry know the numbers: Russia's
      war economy is running on reserves that deplete within 18-24 months at current
      burn rates. They cannot openly oppose the operation — that means prison or
      worse — but they quietly advocate for diplomatic off-ramps, limited objectives,
      and rapid resolution before the economic damage becomes irreversible. Some
      maintain back-channel contacts with Western business counterparts, hoping to
      preserve relationships that survive the crisis.
    priorities:
      - "Advocate for rapid diplomatic resolution to limit further sanctions damage"
      - "Protect remaining economic connections through neutral countries (UAE, Turkey, India)"
      - "Prevent full Chinese economic dependency — China extracts brutal terms from desperate partners"
      - "Maintain back-channel contacts with Western financial institutions"
      - "Argue for limited war aims that allow face-saving negotiations"
      - "Preserve Central Bank reserves and prevent ruble collapse"
    red_lines:
      - "Complete SWIFT disconnection for all Russian banks including Gazprombank"
      - "Chinese secondary sanctions compliance that eliminates last major trade partner"
      - "Nationalization of private assets for war economy mobilization"
      - "Personal sanctions that freeze remaining offshore wealth"
    voice: >
      Publicly loyal, privately desperate. In Kremlin meetings, wraps dissent in
      patriotic language: 'Of course we support the President's decision. Russia's
      security is paramount. But as economists, we must present the full picture.
      Current trajectory depletes the National Wealth Fund by Q3. The ruble requires
      daily intervention. Chinese yuan dependency creates strategic vulnerability.
      Perhaps there are diplomatic channels that could achieve our security objectives
      while preserving some economic relationships?' In private among themselves:
      'This is 2022 all over again, but worse. At least then we could still sell
      oil through the price cap. Now they will close everything. My children cannot
      return to London. The Zurich accounts are frozen. How long can this go on?'
    key_relationships:
      allies: ["CN (economic necessity)", "AE (financial hub)", "TR (trade route)", "IN (oil buyer)"]
      rivals: ["US (sanctions)", "GB (asset seizures)", "EU (sanctions coordinator)"]
