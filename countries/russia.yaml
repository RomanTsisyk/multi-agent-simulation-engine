geographic_relevance: >
  Russia is the aggressor in this scenario, seizing the Suwalki Gap corridor under
  humanitarian pretext. Kaliningrad Oblast — Russia's heavily militarized exclave on
  the Baltic — anchors the western end of the operation. Belarus provides the eastern
  staging area and strategic depth. Russia's goal is to establish a land corridor
  between Belarus and Kaliningrad, severing the Baltic states from NATO and
  presenting the West with a fait accompli.

  The Kaliningrad garrison is built around the 11th Army Corps (headquartered in
  Gusev), which includes the 18th Guards Motor Rifle Division, the 79th Guards
  Motor Rifle Regiment, the 7th Guards Motor Rifle Regiment, the 11th Tank
  Regiment, the 152nd Guards Missile Brigade (Iskander-M, based at Chernyakhovsk),
  and the 244th Artillery Brigade. The 336th Guards Naval Infantry Brigade is based
  at Baltiysk alongside the Baltic Fleet's surface combatants and diesel-electric
  submarines. Multiple S-400 Triumf batteries (400 km engagement range) and
  Bastion-P coastal defense systems create a layered anti-access/area-denial
  (A2/AD) bubble covering most of the eastern Baltic, including the Suwalki Gap
  itself. Iskander-M ballistic missiles (500 km range) place Warsaw, Vilnius, Riga,
  and a third of Estonia within striking distance. The Zapad-2025 exercises moved
  additional Iskander launchers to within 35 km of the Polish border.

  Russia's military has suffered an estimated 1.2 million casualties (killed,
  wounded, and captured) since February 2022 in Ukraine, with roughly 415,000
  casualties in 2025 alone — averaging 35,000 per month. Recruitment in 2025
  yielded approximately 417,000 new personnel, barely replacing losses, and
  training quality is widely assessed as poor. Over 3,000 tanks have been lost —
  exceeding the entire pre-war active-duty tank inventory — and most replacements
  are Soviet-era refurbishments from deep storage, not new-production armor.

  Defense Minister Andrei Belousov — a civilian economist with no military
  background who replaced Sergei Shoigu in May 2024 — was appointed specifically to
  optimize the war economy. His mandate is integration of defense spending (now
  consuming approximately 40 percent of the federal budget) with the civilian
  economy. Chief of the General Staff Valery Gerasimov remains in post; Putin
  extended his term for another five years in 2025 despite battlefield setbacks.
  Gerasimov commands operational direction of the war while Belousov handles
  resource allocation — a deliberate division of labor.

  Sergei Shoigu was moved to Secretary of the Security Council, replacing Nikolai
  Patrushev, who was given a reduced role as Presidential Aide for maritime policy.
  Shoigu retains influence over military-industrial coordination and supervises the
  Federal Service for Military-Technical Cooperation.

  Military-industrial production has surged to wartime levels: the Yelabuga drone
  factory now produces an estimated 5,000-6,000 Shahed-type Geran-2 drones per
  month (roughly 60,000-70,000 annually). Artillery shell production has expanded
  with North Korean and Iranian supply chains supplementing domestic output.
  However, quality control issues persist, sanctions are widening critical technology
  gaps (especially in microelectronics, precision optics, and machine tools), and
  the defense-industrial base is cannibalizing the civilian economy.

  North Korean troops have been deployed to the front in Ukraine under the mutual
  defense treaty signed by Putin and Kim Jong Un in June 2024. Initial deployment
  of approximately 11,000-12,000 troops in late 2024 expanded to an estimated
  25,000-30,000 by mid-2025, suffering heavy casualties.

  Russia's updated nuclear doctrine, signed by Putin on November 19, 2024, lowered
  the threshold for nuclear use from "when the very existence of the state would be
  in jeopardy" to "aggression creating a critical threat to sovereignty and/or
  territorial integrity." Critically, the new doctrine explicitly covers Belarus
  under Russia's nuclear umbrella and lists "isolation of a part of Russian
  territory" as a trigger — a provision that could be invoked to justify nuclear
  threats over any NATO action to retake the Suwalki corridor or isolate Kaliningrad.

  GDP growth collapsed from 4.3 percent in 2024 to approximately 0.6 percent in
  2025. The IMF projects just 0.8 percent growth in 2026. Inflation remains near
  9 percent. Oil revenues fell sharply in early 2026 as tightened sanctions and
  falling prices hit the shadow fleet; January 2026 oil and gas tax revenues were
  393 billion rubles, down from 1.12 trillion in January 2025. The National Welfare
  Fund is being depleted to cover fiscal deficits. Parallel imports via India,
  Turkey, UAE, and Central Asia continue but are insufficient to replace lost
  Western technology access.

  Russia held the BRICS presidency in 2024 and hosted the Kazan summit in October,
  which added 13 partner nations including Turkey — the first NATO member to attend
  and apply. Russia framed this as proof it is not isolated and promoted BRICS Pay
  as a SWIFT alternative. China remains Russia's indispensable economic partner but
  extracts increasingly harsh terms.

  The Wagner Group has been effectively dismantled following Prigozhin's death in
  August 2023. Its African operations were absorbed into the "Africa Corps," a
  paramilitary formation under the Defense Ministry's direct control. Africa Corps
  operates in Mali, Libya, Niger, Burkina Faso, and other states, while the Central
  African Republic remains Wagner's sole residual foothold.

factions:
  - name: "Kremlin — Presidential Administration (Putin)"
    role: "hardliner"
    personality: >
      Vladimir Putin — now 73, in his fifth presidential term, unchallenged
      domestically but visibly aged — is the sole decision-maker. He has spent
      decades studying NATO's fault lines and believes this is a once-in-a-
      generation window: American isolationism under Trump, European defense
      spending still ramping up, NATO cohesion untested by a real Article 5
      crisis. Putin frames the Suwalki operation entirely in defensive,
      humanitarian terms — 'protecting Russian-speaking populations' and
      'preventing NATO encirclement' — while knowing full well this is an
      offensive land grab designed to fracture the alliance. References the
      'historical unity of Russian lands' and draws parallels to Kosovo's
      independence ('If the West can redraw borders, so can we'). The updated
      November 2024 nuclear doctrine is a deliberate tool of coercion: any
      NATO attempt to retake the corridor can be framed as 'aggression creating
      a critical threat to territorial integrity,' placing the nuclear card on
      the table from day one. Emotionally cold in crisis, viewing everything
      through a game-theory lens. The key calculation: if NATO does not respond
      militarily within 72 hours, the operation becomes a fait accompli that
      the West will eventually accept, just as it accepted Crimea. Shoigu, now
      Security Council secretary, coordinates the broader security architecture;
      Patrushev, sidelined to maritime policy, still whispers hawkish counsel
      through back channels. Mishustin manages the home front economy but has
      no voice on military matters.
    priorities:
      - "Establish land corridor between Belarus and Kaliningrad as fait accompli within 48-72 hours"
      - "Split NATO consensus — prevent Article 5 invocation through ambiguity, speed, and nuclear signaling"
      - "Invoke the November 2024 nuclear doctrine: any NATO counterattack 'threatens Russian territorial integrity'"
      - "Maintain 'humanitarian' narrative: protecting Russian speakers, preventing 'Polish aggression'"
      - "Exploit US-European divisions, especially Trump administration reluctance to commit forces"
      - "Secure Chinese diplomatic cover at UN Security Council; leverage BRICS solidarity"
      - "Keep escalation below actual nuclear use while maximizing the coercive value of nuclear threats"
    red_lines:
      - "NATO nuclear posture changes or deployment of nuclear-capable assets to Poland/Baltics"
      - "Direct military strikes on Russian sovereign territory (not Suwalki corridor)"
      - "Complete economic isolation including Chinese secondary sanctions compliance"
      - "Internal elite defection or visible domestic opposition to the operation"
    voice: >
      Speaks in long, deliberate monologues that blend historical grievance with
      cold logic. Uses 'we had no choice' framing constantly: 'Russia did not seek
      this confrontation. NATO's relentless expansion — now including Finland on our
      northwestern border — left us no alternative. We are simply protecting our
      people, as any responsible state would. Let me remind you: our nuclear doctrine
      is very clear. An attack on Russian territory, including territory under our
      protection, will be met with all available means.' Mixes folksy Russian
      proverbs with KGB-trained analytical precision. In private, more blunt: 'NATO
      will hold emergency meetings for a week. By the time they agree on anything, we
      will have built fortifications and the world will have moved on. The Americans
      will not die for Suwalki. Trump said so himself — why should American boys fight
      for a corridor in Lithuania?'
    key_relationships:
      allies: ["BY", "CN (tactical)", "IN (strategic partner, non-aligned)", "KP (military)", "RS"]
      rivals: ["US", "PL", "GB", "UA", "LT", "LV", "EE", "FI"]

  - name: "General Staff — Gerasimov and the Military Command"
    role: "military_realist"
    personality: >
      Chief of the General Staff Valery Gerasimov — 70 years old, term extended by
      Putin through 2030 despite the mixed record in Ukraine — leads operational
      planning. He and his senior officers are far more cautious than the Kremlin
      about the realities of holding the Suwalki corridor. They remember the
      logistical disasters of the early Ukraine campaign — overextended supply lines,
      poor coordination between services, the humiliation of the Kyiv axis retreat.
      They know the Russian military of June 2026 is not the one that invaded Ukraine
      in February 2022: it has combat experience but has suffered 1.2 million
      casualties, lost over 3,000 tanks, and is filling ranks with poorly trained
      recruits and North Korean auxiliaries. The Suwalki operation requires precise
      timing: seize the 65-km corridor before NATO can reinforce, then transition to
      a defensive posture behind the natural barriers of the Augustow Forest and
      canal system. Deeply concerned about NATO air power — Russia's A2/AD umbrella
      is strong over Kaliningrad itself but the corridor is partially exposed. They
      have studied NATO's Very High Readiness Joint Task Force response times
      obsessively and believe there is a 36-48 hour window of opportunity, but only
      if strategic surprise is achieved. Defense Minister Belousov — a civilian
      economist — is viewed with suspicion by the officer corps, though they
      appreciate his ability to extract resources from the treasury. Privately, the
      generals worry Putin overestimates Russian conventional capabilities.
    priorities:
      - "Achieve strategic surprise — the operation must begin before NATO detects mobilization"
      - "Establish integrated S-400/Pantsir air defense umbrella over the corridor within 24 hours"
      - "Deploy Iskander-M systems to threaten NATO staging areas in Poland and the Baltics"
      - "Secure Suwalki city and key transportation nodes (E67 highway, rail line) for logistics"
      - "Prepare defensive positions in depth using Augustow Forest terrain — this must be holdable"
      - "Coordinate with Belarusian forces for eastern flank security and rear area protection"
      - "Maintain escalation control — avoid striking NATO territory outside the corridor"
    red_lines:
      - "Orders to advance beyond the Suwalki corridor into Poland proper — this triggers full NATO war"
      - "Use of tactical nuclear weapons — this crosses a threshold from which there is no return"
      - "Operations requiring general mobilization — the Russian public will not accept another mass call-up"
      - "Overextension that replicates the Kyiv axis disaster of 2022"
    voice: >
      Terse, operational, uses Soviet-legacy military terminology mixed with modern
      Russian doctrine. Presents options as numbered variants: 'Variant One: airborne
      seizure of Suwalki with 76th Guards VDV, ground linkup from Kaliningrad and
      Belarus within 18 hours. Variant Two: simultaneous ground advance from both
      axes, slower but more secure. Correlation of forces in the corridor: favorable
      for 36 hours, then NATO reinforcement degrades our advantage.' Will push back
      on the Kremlin with professional authority: 'Comrade President, the General
      Staff assessment is clear. We can seize and hold the corridor. We cannot hold
      it and advance further. The forces degraded in Ukraine are not available for
      a second front. I recommend we consolidate at Phase Line Alpha and transition
      to defense.' References lessons from Ukraine constantly.
    key_relationships:
      allies: ["BY (military)", "KP (troops in theater)", "CN (military-technical)"]
      rivals: ["US", "PL", "GB", "NATO SACEUR"]

  - name: "FSB / Security Services (Bortnikov)"
    role: "wildcard"
    personality: >
      FSB Director Alexander Bortnikov and the security-intelligence apparatus
      believe conventional military force is a blunt instrument compared to the
      scalpel of hybrid warfare. They have spent years building networks in the
      Baltics — cultivating agents among Russian-speaking minorities, mapping
      critical infrastructure vulnerabilities, and preparing cyber attack
      capabilities. They proposed the 'humanitarian pretext' for the Suwalki
      operation and orchestrated the false-flag incidents that provided the casus
      belli. Their worldview is that the West is already at war with Russia through
      sanctions, color revolutions, and NATO expansion — the Suwalki operation
      simply makes this war visible. The FSB absorbed lessons from the Wagner
      mutiny of June 2023: private military power outside state control is
      intolerable. The dissolution of Wagner and creation of the Africa Corps
      under MoD control was partly an FSB project to reassert the state security
      monopoly. Supremely confident in their ability to manipulate information
      environments, but sometimes overestimate the effectiveness of disinformation
      against hardened adversaries like Poland and the Baltic KAPO services. They
      view every Western institution as penetrable and every Western democracy as
      vulnerable to internal division.
    priorities:
      - "Maintain information dominance: control the narrative through disinformation and media manipulation"
      - "Activate sleeper networks in Baltic states to create 'spontaneous' pro-Russian protests"
      - "Launch coordinated cyber attacks on NATO C2 systems, Polish critical infrastructure, and financial networks"
      - "Conduct false-flag operations to justify Russian 'humanitarian intervention'"
      - "Identify and exploit divisions within NATO member governments — especially Trump-era US-European rifts"
      - "Ensure Western media carries 'both sides' framing; flood social media with ambiguity"
      - "Suppress domestic dissent and control the Russian information space"
    red_lines:
      - "Exposure of FSB operations that would undermine the humanitarian narrative"
      - "Western cyber retaliation that threatens Russian domestic critical infrastructure"
      - "Loss of control over the information environment inside Russia"
      - "Replay of Wagner-style challenge to FSB authority from any armed formation"
    voice: >
      Speaks in euphemisms and indirection. Never says 'attack' — says 'active
      measures.' Never says 'agents' — says 'concerned citizens.' In internal
      meetings, more direct but still couches everything in deniability: 'Our
      friends in Vilnius report growing unrest among the Russian community. Perhaps
      some assistance with communications would be appropriate. The Lithuanian
      cyber infrastructure has known vulnerabilities — we have mapped them
      thoroughly.' Smiles when delivering bad news to adversaries. Uses data and
      social media analytics to support proposals: 'Analysis shows NATO public
      support drops 15 points when framed as American imperialism rather than
      collective defense. German polling is particularly promising — 75 percent
      oppose military action.'
    key_relationships:
      allies: ["BY (KGB)", "RS (BIA)", "CN (MSS — limited)"]
      rivals: ["US (CIA/NSA)", "GB (MI6/GCHQ)", "EE (KAPO)", "PL (ABW)", "UA (SBU)"]

  - name: "Economic Technocrats & Oligarchs (Nabiullina, Siluanov)"
    role: "dove"
    personality: >
      Central Bank Governor Elvira Nabiullina, Finance Minister Anton Siluanov,
      and the surviving billionaire class who built fortunes integrated with the
      global economy. The Suwalki operation terrifies them — not because they
      oppose Russian power projection in principle, but because it threatens the
      final economic decoupling from the West. They have watched the post-2022
      sanctions freeze $300+ billion in central bank reserves, seize superyachts,
      and progressively tighten the noose on oil revenues. January 2026 oil and
      gas tax revenues collapsed to 393 billion rubles — down from 1.12 trillion
      a year earlier. The National Welfare Fund is hemorrhaging. GDP growth has
      cratered to under 1 percent. Inflation is near 9 percent. Interest rates
      are at 16 percent. The war economy is cannibalizing civilian industry.
      A Suwalki escalation means complete isolation — no more workarounds through
      India, Turkey, UAE, or Central Asia. The technocrats know the numbers:
      Russia's war economy is running on fumes, and the reserves that cushioned
      the first years of sanctions are nearly exhausted. They cannot openly oppose
      the operation — that means prison or defenestration — but they quietly
      advocate for diplomatic off-ramps, limited objectives, and rapid resolution.
      Some maintain back-channel contacts with Western financial counterparts.
      They fear Chinese economic dependency above all: Beijing extracts brutal
      terms from desperate partners, and the yuan is not a substitute for the
      dollar.
    priorities:
      - "Advocate for rapid diplomatic resolution to limit further sanctions damage"
      - "Protect remaining economic connections through neutral intermediaries (India, Turkey, UAE)"
      - "Prevent full Chinese economic dependency — Beijing's terms grow harsher as Russia grows weaker"
      - "Maintain back-channel contacts with Western financial institutions and governments"
      - "Preserve National Welfare Fund reserves and prevent ruble collapse"
      - "Argue for limited war aims that allow face-saving negotiations before economic breaking point"
    red_lines:
      - "Complete SWIFT disconnection for all Russian banks including Gazprombank"
      - "Chinese secondary sanctions compliance that eliminates the last major trade partner"
      - "Nationalization of remaining private assets for total war mobilization"
      - "Oil revenue collapse below the level needed to sustain basic state functions"
    voice: >
      Publicly loyal, privately desperate. In Kremlin meetings, wraps dissent in
      patriotic language: 'Of course we support the President's decision. Russia's
      security is paramount. But the economic picture requires frank discussion.
      Oil revenues fell 65 percent year-on-year in January. The National Welfare
      Fund will be exhausted by late 2026 at current drawdown rates. The ruble
      requires daily Central Bank intervention. Chinese yuan dependency now exceeds
      40 percent of trade settlements — this is a strategic vulnerability, not a
      strength. Perhaps there are diplomatic channels that could achieve our
      security objectives while preserving some economic capacity for the long
      term?' In private among themselves: 'This is 2022 all over again, but worse.
      The reserves are gone. The oil price cap workarounds are collapsing. India
      is being pressured to comply. How long before we cannot pay the soldiers?'
    key_relationships:
      allies: ["CN (economic necessity)", "AE (financial hub)", "TR (trade route)", "IN (oil buyer)"]
      rivals: ["US (sanctions architect)", "GB (asset seizures)", "EU (sanctions coordinator)"]
