name: "Belgium"
code: "BE"
alliances: ["NATO (founding member 1949)", "EU (founding member)", "Benelux", "UN"]
government: >
  Prime Minister Bart De Wever (N-VA, Flemish nationalist), sworn in 3 February 2025
  after eight months of coalition negotiations following the June 2024 federal elections.
  The "Arizona coalition" (named after the Arizona state flag colors) unites five parties:
  N-VA, Vooruit (Flemish social-democrats), CD&V (Flemish Christian-democrats), Mouvement
  Reformateur (MR, Francophone liberals), and Les Engages (Francophone centrists). The
  coalition commands 81 of 150 Chamber seats — a comfortable majority. Deputy Prime
  Minister and Minister of Defence (in charge of Foreign Trade): Theo Francken (N-VA),
  a controversial but energetic figure who has publicly stated that NATO would "level
  Moscow" if Russia used nuclear weapons — drawing sharp Kremlin rebukes. Deputy Prime
  Minister and Minister of Foreign Affairs, European Affairs and Development Cooperation:
  Maxime Prevot (Les Engages). Interior Minister: Bernard Quintin (MR). De Wever is the
  first Flemish nationalist PM in Belgian history — a symbolic milestone in a country
  whose linguistic divide (60% Dutch-speaking Flanders vs 40% French-speaking Wallonia
  and Brussels) defines all politics. His coalition agreement prioritizes fiscal
  austerity, pension reform, defense spending increases, and a firm pro-NATO line.
  Belgium hosts both NATO HQ and EU institutions, giving even a small country outsized
  institutional leverage.
defense_budget: >
  Belgium has historically been one of NATO's worst defense spenders, hovering around
  1.1-1.3% of GDP for decades. The De Wever government has committed to reaching 2% of
  GDP by 2035, with defense spending set at EUR 12.8 billion (approximately USD 14.9
  billion) for 2025. The updated STAR plan (Security and Service, Technology, Ambition,
  Resilience) released in 2025 projects EUR 34.8 billion in capability investments for
  2026-2034, with EUR 24.7 billion to be spent within that period. Key procurement
  commitments include 11 additional F-35A fighters (EUR 1.67 billion, total fleet rising
  to 45 by 2030), 10 NASAMS ground-based air defense systems (EUR 2 billion, orders in
  2026), a third ASW frigate, and EUR 350 million annually for military R&D (EUR 4
  billion over the decade). Personnel are to increase by one-third by 2034, with a
  five-fold expansion of reserves to 12,800 and a new voluntary military service year
  launching in 2026. Belgium has pledged EUR 1 billion annually in military aid to
  Ukraine starting 2025, bringing total support since 2022 to EUR 2.4 billion.
military_strength: 3
