          context: "Chinese military engagement is limited compared to Russian, but Chinese investment in oil infrastructure matters to FANB economic interests in PDVSA."
        - country: "CU"
          sentiment: "security_partner"
          context: "Cuban intelligence officers trained Venezuelan military counterintelligence for two decades. 32 Cubans killed on Jan 3 created a blood bond but also exposed Cuba's vulnerability."
      rivals:
        - country: "US"
          sentiment: "existential_threat"
          context: "The power that destroyed FANB's air defenses in hours and extracted the president from his compound. Multiple FANB generals are indicted in US courts on narco-trafficking charges."
