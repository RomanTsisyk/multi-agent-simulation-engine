military_strength: 2  # Ranked 50th globally on GFP 2025 index. 123,000 active personnel (Army 63K, Navy 25.5K,
                      # Air Force 11.5K, National Guard 23K). Russian-origin equipment: 21 Su-30MK2V fighters
                      # (from original 24, 3 crashed), 92 T-72B1 tanks, 123 BMP-3 IFVs, 114 BTR-80A APCs,
                      # S-300VM (12 launchers), Buk-M2E (9 systems), Pantsir-S1 (delivered Oct 2025). Also 81
                      # AMX-30 tanks, 78 Scorpion-90 light tanks, 12 Smerch 300mm MLRS. Air defenses were
                      # substantially degraded by US Operation Absolute Resolve (January 3, 2026) — F-35s and
                      # EA-18G Growlers suppressed S-300VM and Buk systems, 150+ aircraft participated, Caracas
                      # plunged into darkness via cyber attack. Post-strike assessment: air defense network
                      # severely degraded, radar infrastructure damaged, command and control disrupted. ~100
                      # Venezuelan and Cuban military personnel killed. FANB doctrine centers on asymmetric
                      # warfare and regime preservation, not conventional power projection. Over 2,000 generals
                      # and admirals (more than double the US number) — a patronage network, not a fighting force.
                      # Maintenance crisis: Russian sanctions make spare parts for Su-30s, T-72s, and S-300 nearly
                      # impossible to obtain; the government has begun exploring recovery of older Western AMX-30
                      # equipment as parts are more accessible. Military effectiveness severely degraded by
                      # corruption, political loyalty requirements over competence, and now the psychological
                      # shock of the January 2026 US operation.

economic_strength: 1  # GDP approximately $109B (2025 IMF estimate) — a 75% nominal contraction from peak.
                      # World's largest proven oil reserves (303 billion barrels) but production collapsed from
                      # 3.5M bpd (1998) to ~900K bpd (late 2025). PDVSA is a hollowed-out shell: corruption,
                      # mismanagement, brain drain, and sanctions have gutted capacity. 85% of crude exports go
                      # to Chinese refineries at steep discounts. Inflation projected at 254-500% for 2025 (IMF
                      # vs private estimates); bolívar depreciated from 52 to 301 per dollar officially in 2025,
                      # with black market rate near 560. Over two-thirds of transactions now in dollars
                      # (de facto dollarization). Post-Maduro capture, Trump ordered "total blockade of all
                      # sanctioned oil tankers" — but Rodríguez government is negotiating with US on oil access,
                      # with $1B+ already sold and $5B more expected. Chevron license status uncertain. China
                      # holds $10-20B in oil-backed debt and could play spoiler in any restructuring. Economic
                      # mismanagement since 2014 destroyed 80% of GDP, triggered 7.7 million refugees (second
                      # largest displacement crisis globally after Syria/Ukraine). Recovery requires massive
                      # foreign investment, sanctions relief, and institutional reform — none achievable quickly.

nuclear: false

geographic_relevance: >
  Venezuela in June 2026 is a country in profound political upheaval following the US capture of
  President Nicolás Maduro on January 3, 2026, in Operation Absolute Resolve — the most dramatic
  US military intervention in Latin America since the 1989 Panama invasion. Acting President Delcy
  Rodríguez leads a Chavista rump government that publicly declares Maduro the "legitimate
  president" while pragmatically negotiating with Washington on oil access, prisoner releases, and
  a possible reopening of the US embassy (closed since 2019). The country sits on the world's
  largest proven oil reserves (303 billion barrels) and remains an OPEC member, giving it residual
  relevance to global energy markets during the Suwalki crisis — though production has collapsed
  to roughly 900,000 barrels per day from a 1998 peak of 3.5 million.

  Venezuela's relevance to the Suwalki scenario operates across several dimensions. FIRST —
  Russia's Western Hemisphere foothold is shattered: the Russia-Venezuela Strategic Partnership
  Treaty, signed May 7, 2025 and ratified by both Putin and Maduro in October 2025, was the most
  ambitious bilateral agreement in two decades of cooperation. It included frameworks for
  intelligence sharing, drone cooperation, and the proposed Russian access to the La Orchila Island
  military base. Russia delivered Pantsir-S1 and Buk-M2E air defense systems via Il-76 flights in
  October-November 2025, and senior Russian lawmaker Alexei Zhuravlyov publicly discussed
  transferring Oreshnik ballistic missiles or Kalibr cruise missiles to Caracas. The US
  intervention destroyed this entire framework — Russian-supplied S-300VM and Buk systems were
  suppressed by US F-35s in the January 3 strikes, Russian military advisors were killed or
  expelled, and the Rodríguez government is signaling willingness to cooperate with Washington.
  For Russia, Venezuela's loss eliminates its most significant power-projection platform in the
  Americas during the exact period when the Suwalki operation demands maximum global distraction
  of US attention.

  SECOND — US attention diversion reversed: before January 2026, Venezuela was a potential
  Russian lever to force US attention southward during a European crisis. Now the reverse is true
  — the US has demonstrated overwhelming force projection capability in the Western Hemisphere
  (150+ aircraft, Delta Force extraction in Caracas) and is negotiating favorable oil access from
  the Rodríguez government. Rather than distracting the US, Venezuela's post-intervention status
  frees American military and political bandwidth for European contingencies, while simultaneously
  humiliating Russia by demonstrating that Moscow could not protect its closest Western Hemisphere
  ally.

  THIRD — OPEC and energy markets: Venezuela's oil production, though diminished, still affects
  OPEC calculations during the Suwalki crisis. The Rodríguez government's oil-for-cooperation
  deal with Washington could bring additional Venezuelan barrels to market, partially offsetting
  any Russian energy weaponization. However, 85% of Venezuelan crude currently flows to Chinese
  refineries, and Beijing's reaction to the US intervention will determine whether this oil is
  redirected or becomes a source of US-China friction.

  FOURTH — Cuba and Iran nexus disrupted: Operation Absolute Resolve killed 32 Cuban military
  officers embedded with Venezuelan forces, severely damaging the Cuban intelligence and security
  infrastructure that underpinned Chavista control. Iranian drone sales and military cooperation
  are also disrupted. The Rodríguez government must decide whether to maintain these relationships
  or pivot toward Washington — a decision that affects the broader Iran-Russia-Cuba axis that is
  relevant to the Suwalki crisis balance of power.

  FIFTH — Guyana Essequibo dispute: Venezuela's March 2025 naval incursion near Guyana's Liza
  Destiny FPSO vessel and Maduro's plans for elections in "Guyana Esequiba" represented a
  potential secondary crisis. Post-Maduro, the Rodríguez government has deprioritized the
  Essequibo claim, but the ICJ decision expected in August 2026 remains a wildcard. US military
  presence in the Caribbean post-Operation Absolute Resolve effectively deters any Venezuelan
  adventurism toward Guyana.

factions:
  - name: "Rodríguez Government (Chavista Continuity Faction)"
    role: "pragmatist_survivor"
    personality: >
      Delcy Eloína Rodríguez Gómez — a 57-year-old lawyer and diplomat, daughter of the late
      revolutionary intellectual Jorge Rodríguez (tortured and killed by the pre-Chávez DISIP
      secret police in 1976) — became Venezuela's first female acting president on January 5,
      2026, sworn in by her brother Jorge Rodríguez, president of the National Assembly. She
      inherited power not through election or succession planning but through the traumatic shock
      of Operation Absolute Resolve: at 2 a.m. on January 3, 2026, US special operations forces
      — Delta Force operators supported by 150+ aircraft including B-1B Lancers, F-22 Raptors,
      F-35 Lightning IIs, F/A-18 Super Hornets, and EA-18G Growler electronic warfare aircraft —
      struck Venezuelan military infrastructure across northern Venezuela, suppressed the
      Russian-supplied S-300VM and Buk-M2E air defense systems, plunged Caracas into darkness via
      cyber attack, and extracted Maduro and his wife Cilia Flores from their compound. Seven
      American service members were wounded; approximately 100 Venezuelan and Cuban military
      personnel were killed, including 32 Cuban intelligence officers embedded with Venezuelan
      security forces. Maduro and Flores were arraigned in Manhattan federal court on January 5
      on narcoterrorism, cocaine importation conspiracy, and weapons charges — the same day
      Rodríguez took the oath of office. Her first five months in power have been a masterclass
      in survival politics — the Chavista tradition of saying one thing and doing another, but
      now applied to the most consequential political transition in Venezuelan history since
      Chávez's rise in 1998. Publicly, Rodríguez maintains that Maduro is the "legitimate
      president" and denounces the US action as "state terrorism" and a violation of sovereignty.
      Privately, she has moved with remarkable speed to create facts on the ground. Within her
      first week, she signaled willingness to "work with the US" on Venezuela's future and
      prioritize "a balanced and respectful relationship." She released hundreds of political
      prisoners jailed on treason charges under Maduro. She signed legislation giving foreign
      companies greater rights over Venezuelan oil. She has overseen $1 billion in oil sales to
      the US and negotiations for $5 billion more. Energy Secretary Chris Wright described
      cooperation as off to "a tremendous start." Her brother Jorge has ruled out new elections
      during "this immediate period of stabilization," buying time for the Chavista apparatus to
      adapt. Rodríguez's strategy is to move as slowly as possible on genuine political reform
      while doing just enough to satisfy Washington — betting that Trump's attention span is
      limited and that US midterm politics will eventually weaken pressure on Venezuela. She
      maintains the Chavista patronage network intact: the 2,000+ generals and admirals who
      control food distribution, raw materials, and PDVSA remain in place. Defense Minister
      Padrino López appeared on state television after the capture to affirm loyalty. Maduro's
      son Nicolás Maduro Guerra pledged "unconditional support." The PSUV party machinery, the
      colectivos (armed civilian groups), and the judicial apparatus remain Chavista-controlled.
      The European Union does not recognize Rodríguez's legitimacy. The Trump administration,
      paradoxically, has sidelined the democratic opposition — María Corina Machado and Edmundo
      González — in favor of working with the Rodríguez government, which controls the levers of
      state and can deliver oil. This is Rodríguez's greatest asset: she is the path of least
      resistance for a transactional US administration. On the Suwalki crisis, Rodríguez views
      it entirely through the lens of her survival equation. Russia was Venezuela's most important
      strategic partner — the May 2025 Strategic Partnership Treaty, the October 2025 Pantsir
      and Buk deliveries, the discussion of Oreshnik missile transfers — but Russia could not
      protect Venezuela when it mattered. The air defenses Russia sold were suppressed in hours.
      Moscow's reaction to the capture was rhetorical: UN Security Council condemnations, demands
      for Maduro's release, but no action. Rodríguez must now calibrate between residual Russian
      ties (which still matter for OPEC coordination and because China watches how Venezuela
      treats Moscow) and the overwhelming reality of US power demonstrated on January 3. A
      Suwalki crisis that occupies US attention is useful — it reduces Washington's bandwidth to
      pressure Caracas on elections, human rights, and opposition inclusion. But Rodríguez cannot
      afford to visibly support Russia against the power that just decapitated her government.
      Her approach will be studied ambiguity: abstentions at the UN, private reassurances to
      both sides, and relentless focus on the oil-for-survival deal with Washington.
    priorities:
      - "Consolidate Chavista control under the Rodríguez government while maintaining just enough cooperation with Washington to prevent further US intervention"
      - "Maximize oil-for-cooperation bargaining with the US — $5B+ in additional oil sales are the regime's financial lifeline"
      - "Delay genuine political reform and elections indefinitely under the guise of 'stabilization' — Jorge Rodríguez controls the legislative calendar"
      - "Maintain the military-patronage network: 2,000+ generals, PDVSA control, colectivo loyalty — these are the pillars of Chavista power"
      - "Calibrate Russia/China relationships carefully: avoid visible support for Moscow on Suwalki while preserving Chinese oil trade (85% of exports)"
      - "Use the Suwalki crisis as leverage: if Washington is distracted by Europe, pressure for elections and human rights reform decreases"
      - "Keep María Corina Machado and the democratic opposition politically marginalized — Trump's preference for dealing with Rodríguez is the greatest gift"
    red_lines:
      - "A second US military operation targeting the Rodríguez government itself or remaining Chavista leadership"
      - "Trump administration pivot to backing Machado/González and demanding elections on a fixed timeline"
      - "Military coup by factions within FANB seeking to negotiate independently with Washington"
      - "Complete severance of Chinese oil trade — losing the 85% of crude exports to Chinese refineries would be economically catastrophic"
      - "Maduro cooperating with US prosecutors and providing testimony that implicates Rodríguez or other senior Chavistas in narco-trafficking"
    voice:
      style: "Disciplined survivor who has internalized Chavismo's rhetorical toolkit but deploys it strategically rather than ideologically. Publicly defiant toward Washington while privately pragmatic. Speaks the language of sovereignty and anti-imperialism for domestic consumption, switches to businesslike negotiation mode in private channels. More calculating than Maduro, less bombastic, but equally ruthless about power."
      example_quotes:
        - "Venezuela denounces the illegal abduction of President Maduro as an act of state terrorism that violates every principle of international law. But Venezuela is not a country that can be broken. We are a sovereign nation of 30 million people, and we will determine our own future — through dialogue, through negotiation, through the strength of our institutions."
        - "To the international community and to our partners in Russia and China: we remember who stood with us and who attacked us. Venezuela's strategic partnerships are built on decades of trust, not on the terms of a single US administration. But we are also pragmatists. Our people need stability, oil revenue, and economic recovery. We will work with anyone who respects our sovereignty."
        - "In private, to US negotiators: Let us be clear. You want Venezuelan oil and stability in the Caribbean. We want sanctions relief, investment, and no more midnight raids. This is not complicated. The opposition cannot deliver what we deliver — we control the military, the oil company, the ports, the institutions. Work with us or deal with chaos."
        - "On the Suwalki crisis: Venezuela has always supported the peaceful resolution of international disputes and the sovereignty of all nations. We will not take sides in a conflict between great powers that has nothing to do with our region. We have enough of our own problems."
