geographic_relevance: >
  Syria's relevance to the June 2026 Suwalki Gap crisis has been transformed by the
  December 2024 fall of the Assad regime. The country that once hosted Russia's most
  strategically important overseas military installations — the Tartus naval facility
  (Russia's only Mediterranean warm-water port) and Khmeimim air base near Latakia
  (its primary Middle Eastern air power projection platform) — is now governed by a
  transitional authority under Ahmed al-Sharaa that has fundamentally reoriented Syria's
  geopolitical alignment from the Russian-Iranian axis toward the Western-Turkish orbit.

  Russia's position in Syria has deteriorated dramatically since December 2024. The
  Russian Navy completed its withdrawal from Tartus by early March 2025, relocating
  vessels to Novorossiysk and Tobruk (Libya). S-400 and Tor air defense systems were
  hastily transferred from Khmeimim to Tartus during the regime's final days in
  December 2024. The Syrian caretaker government formally ended the treaty permitting
  Russian military presence in January 2025, voiding both the 49-year Tartus lease
  and the unlimited Khmeimim agreement. However, after al-Sharaa's October 2025
  meeting with Putin in Moscow, Russia resumed military flights to Khmeimim,
  suggesting a renegotiated but reduced presence is being worked out. For the Suwalki
  scenario, Syria's primary significance is threefold: first, Russia can no longer
  freely draw upon Syrian-based forces for European redeployment because its Syrian
  footprint has collapsed; second, the loss of reliable Mediterranean basing degrades
  Russia's ability to project naval power into the Atlantic approaches; third, Syria's
  pivot toward the West (al-Sharaa visited the White House in November 2025, the EU
  pledged 620 million euros in January 2026) represents a broader geopolitical defeat
  for Moscow that weakens its narrative of global influence.

  Iran's position in Syria has been utterly destroyed. The IRGC-Quds Force withdrew
  nearly all personnel after Assad's fall. Hezbollah bases were either destroyed by
  Israeli strikes or ransacked by HTS forces. Al-Sharaa has stated that Assad's
  collapse "set the Iranian project back 40 years" and Syria has banned Iranian
  citizens and goods from entering the country as of January 2025. Tehran lost an
  estimated $50 billion in investment, its Mediterranean access corridor, and the
  land bridge supply route to Hezbollah in Lebanon.

  Meanwhile, the US completed its withdrawal from the al-Tanf garrison on 11 February
  2026, with Syrian forces taking control of the base. Approximately 900 US troops
  remain in northeastern Syria, primarily at the Qasrak base in Hasakeh province,
  focused on counter-ISIS operations. Israel has established a military buffer zone
  beyond the Golan Heights, with at least 10 military posts inside the former UN
  demilitarized zone and Syrian territory, and has declared its presence "indefinite."
  Israel-Syria talks facilitated by the UAE and US are in "advanced stages," focused
  on de-escalation and intelligence-sharing rather than full normalization.

  Syria's new army — targeting 200,000-300,000 troops by integrating HTS fighters,
  30,000 SNA members, and 15,000 SDF personnel — remains poorly equipped. Israeli
  strikes destroyed most heavy weapons depots and military infrastructure across the
  country during and after the regime change. The economy is devastated: GDP of roughly
  $20 billion (down from $60 billion pre-war), GNI per capita of $830, and the World
  Bank estimates $216 billion needed for reconstruction. The EU lifted all sanctions
  in May 2025; the US waived Caesar Act sanctions via executive order in June 2025
  (Congress repealed them in December 2025). GDP growth is projected at roughly 10%
  for 2026, driven by sanctions relief and returning diaspora, but from an
  extraordinarily low base.

factions:
  - name: "Presidential Authority — Ahmed al-Sharaa and HTS Core Leadership"
    role: "pragmatist"
    personality: >
      Ahmed al-Sharaa — born in 1982, formerly known as Abu Mohammed al-Julani — has
      executed one of the most remarkable political transformations in modern Middle Eastern
      history. A former al-Qaeda affiliate who founded Jabhat al-Nusra in 2012, he
      systematically broke with al-Qaeda in 2016, rebranded as Hayat Tahrir al-Sham, and
      spent years building governance institutions in Idlib province while cultivating a
      moderate Islamist image. His November-December 2024 offensive, dubbed Operation Deterrence
      of Aggression, launched on 27 November 2024 from Idlib, captured Aleppo within days,
      swept through Hama and Homs, and entered Damascus on 8 December 2024, toppling the
      Assad dynasty after 53 years of Ba'athist rule. Assad fled to Moscow. The speed of the
      collapse — less than two weeks — stunned the world and demonstrated both HTS's military
      capability and the utter hollowness of the Assad regime.

      Al-Sharaa was declared transitional president on 29 January 2025 during the Syrian
      Revolution Victory Conference in Damascus. On 13 March 2025, he signed the Constitutional
      Declaration of the Syrian Arab Republic, establishing a five-year transitional period
      (2025-2030) with a presidential system in which the president appoints ministers directly
      — the position of prime minister was abolished. The transitional government was formally
      sworn in on 29 March 2025 with 23 ministers. Critically, al-Sharaa retains decisive
      control over security services, key ministries, judicial appointments, and government
      formation. Islamic law serves as the principal source of jurisprudence under the new
      constitutional framework, though freedoms of opinion and expression are nominally
      preserved. A People's Assembly was established as an interim parliament to oversee
      drafting of a permanent constitution.

      Al-Sharaa's diplomatic achievements in 2025 have been extraordinary for a former
      designated terrorist. In November 2025, the UN Security Council removed his terrorist
      designation. Both the US and UK de-listed HTS as a proscribed terrorist organization.
      He visited the White House in November 2025 — the first Syrian head of state to do so
      since independence in 1946 — where he met Trump and secured a further six-month
      sanctions waiver. Syria joined the Global Coalition Against ISIS as its 90th partner.
      EU Commission President von der Leyen visited Damascus in January 2026, announcing a
      620-million-euro assistance package. He has also visited Moscow (October 2025, meeting
      Putin to discuss the Russian bases), Riyadh, Abu Dhabi, Paris, and addressed the UN
      General Assembly.

      On the military front, al-Sharaa announced agreement with over 60 armed factions to
      dissolve and integrate into the Ministry of Defense by January 2025. He promoted 42
      officers to Colonel, 5 to Brigadier General, and 2 to Major General (including Defense
      Minister Abu Qasra and Chief of Staff al-Naasan) in December 2024. Two-thirds of senior
      military commanders are former HTS members. The new Syrian army has recruited roughly
      half of its 200,000-person target by mid-2025, incorporating 30,000 SNA fighters and
      15,000 SDF personnel, but remains lightly armed after Israeli strikes destroyed most
      heavy weapons depots. The January 2026 offensive against the SDF in the northeast —
      capturing Raqqa, Deir ez-Zor, and advancing into al-Hasakah — demonstrated the new
      army's offensive capability but also its reliance on tribal militia auxiliaries. The
      14-point ceasefire of 18 January 2026, brokered by US envoy Tom Barrack, resulted in
      80% of the former DAANES territory being ceded to Damascus.

      For the Suwalki crisis, al-Sharaa's Syria is firmly in the Western-Turkish orbit. He
      views Russia as a declining patron whose leverage has collapsed, Iran as an existential
      enemy whose regional project he personally destroyed, and the US-EU-Turkey axis as
      Syria's path to reconstruction funding and international legitimacy. He will not publicly
      antagonize Russia (he needs the Khmeimim/Tartus renegotiation to conclude favorably),
      but neither will he support Russian adventurism in Europe. His government's top priority
      is reconstruction, sanctions relief, and establishing Syria as a functioning state after
      14 years of civil war. The Suwalki crisis is a distant European problem that al-Sharaa
      will navigate by aligning with whichever side offers the most tangible support for
      Syria's recovery — which is unambiguously the Western coalition.
