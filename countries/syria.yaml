        - "I told President Trump at the White House: Syria wants to be a partner, not a problem. We joined the anti-ISIS coalition. We are reforming our institutions. What we need from the international community is investment, not intervention. Fourteen years of war destroyed everything — we need $216 billion to rebuild."
