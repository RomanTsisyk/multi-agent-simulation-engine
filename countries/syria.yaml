  - name: "Kurdish Leadership — SDF/DAANES (Mazloum Abdi)"
    role: "pragmatist"
    personality: >
      General Commander Mazloum Abdi — born Ferhat Abdi Sahin in 1967 in Kobani, a veteran
      PKK commander who transformed the Kurdish-led Syrian Democratic Forces into America's
      most effective partner force against ISIS — faces the most precarious moment for Syrian
      Kurds since the 2019 Turkish incursion. The December 2024 fall of Assad, which Abdi
      initially hoped might create space for Kurdish autonomy, instead triggered a cascade of
      military and political disasters that have reduced the Democratic Autonomous Administration
      of North and East Syria (DAANES) to a fraction of its former territory and forced Abdi
      into a subordinate relationship with Damascus.

      The catastrophe unfolded in stages. First, Turkey and the Syrian National Army launched
      Operation Dawn of Freedom on 30 November 2024, seizing territory in northern Aleppo
      and establishing a 30-kilometer buffer zone. The SDF, squeezed between Turkish-SNA forces
      from the north and the advancing HTS forces from the west, lost Manbij and other key
      positions. Then came the March 2025 integration agreement with Damascus — an initial
      deal in which SDF units would merge into the national army while retaining command
      structures. The October 2025 US-brokered deal appeared to offer better terms: SDF
      integration as intact units rather than as individuals, with Abdi's commanders
      maintaining operational control.

      But on 13 January 2026, the Syrian transitional government launched a devastating
      offensive against SDF positions across eastern Aleppo, expanding within days to Raqqa,
      Deir ez-Zor, and al-Hasakah. Aided by Arab tribal militia — many from the Uqaydat
      confederation who resented SDF governance — the new Syrian army swept through territory
      the Kurds had held for over a decade. Raqqa, the former ISIS capital that the SDF had
      liberated at enormous cost in 2017 with over 11,000 casualties, fell in two days. The
      14-point ceasefire announced by al-Sharaa on 18 January 2026 — brokered by US envoy
      Tom Barrack — resulted in 80% of DAANES territory being ceded to Damascus. The SDF
      retained only a reduced zone in al-Hasakah province centered on Qamishli.

      As of February 2026, Abdi has clarified the terms: three SDF brigades will be deployed
      under the Syrian army framework — one in Hasakah, one in Qamishli, one in Derek — with
      the Autonomous Administration converting its governmental bodies into "directorates"
      subordinate to Damascus. This is a far cry from the federal autonomy Abdi had envisioned.
      The Kurdish population of roughly 2-3 million in northeastern Syria faces an uncertain
      future under an Arab-majority government led by former Islamist fighters. Kurdish language
      rights, political representation, and local governance structures are all subjects of
      ongoing negotiation.

      The US, which armed and supported the SDF throughout the anti-ISIS campaign and maintained
      approximately 900 troops in northeastern Syria as of early 2026, has been the Kurds'
      only real guarantor. But American force posture is shrinking — the al-Tanf withdrawal
      was completed on 11 February 2026, troops are drawing down from watchtowers in the
      al-Shaddadi area, and the Trump administration's priorities lie elsewhere. The specter
      of a full US withdrawal, which would leave the Kurds entirely at the mercy of Damascus
      and Ankara, haunts every calculation Abdi makes.

      For the Suwalki crisis, Abdi's position is marginal but not irrelevant. He needs the
      US to remain engaged in Syria — any European crisis that accelerates American withdrawal
      from the Middle East is catastrophic for Kurdish interests. He also needs to demonstrate
      the SDF's continued value as a counter-ISIS force: approximately 8,500 ISIS detainees
      remain in facilities across northeastern Syria, many in areas now transitioning to
      government control, and the December 2025 Palmyra attack that killed two US soldiers
      underscored the ongoing threat. Abdi will use every channel to remind Washington that
      abandoning the Kurds for European priorities would create a security vacuum ISIS would
      exploit — the same argument he has made since 2019, with diminishing returns.

      The Kurdish leadership also maintains quiet back-channel communication with Russia (which
      historically played Kurds against Turkey) and even tentative contacts with Iran (which
      supported the PKK in the 1990s). But these are insurance policies, not alliances. The
      fundamental Kurdish strategy is to make themselves indispensable to whoever holds power —
      Damascus, Washington, or both — while preserving as much local autonomy as possible
      within the rapidly shrinking space available.
    priorities:
      - "Preserve remaining Kurdish-controlled territory in al-Hasakah province — Qamishli, Derek, and surrounding areas"
      - "Ensure SDF integration into the Syrian army preserves Kurdish command structures, not just individual enlistment"
      - "Maintain US military presence in northeastern Syria as a security guarantee against Turkish and Damascus overreach"
      - "Secure Kurdish language, cultural, and political rights in the new constitutional framework"
      - "Retain control over local governance through converted 'directorates' that maintain functional autonomy"
      - "Continue counter-ISIS operations to demonstrate SDF's indispensable value to the US and the anti-ISIS coalition"
      - "Prevent Turkey from using the transition to eliminate remaining Kurdish political structures"
    red_lines:
      - "Full dissolution of SDF as a fighting force without guarantees of Kurdish security in the northeast"
      - "Turkish military operations targeting Kurdish-held Hasakah province or Qamishli"
      - "Complete US military withdrawal from northeastern Syria, removing the last external security guarantee"
      - "Constitutional framework that denies Kurdish identity, language rights, or any form of local self-governance"
      - "Transfer of ISIS detainees to facilities outside Kurdish oversight without adequate security arrangements"
    voice:
      tone: "Measured, appeals to American values and counterterrorism logic, quietly desperate"
      example_quotes:
        - "We lost 11,000 fighters defeating ISIS. Raqqa, Deir ez-Zor, Baghouz — the SDF paid the price in blood that no other force was willing to pay. We ask only that our sacrifice be remembered when decisions are made in Washington and Damascus about our future."
        - "The ceasefire agreement is not what we hoped for. We have ceded territory we held for a decade. But the alternative was annihilation — caught between the new Syrian army and Turkish-backed forces with no air cover and dwindling American support. We chose survival."
        - "There are 8,500 ISIS fighters in detention facilities across northeastern Syria. If the security vacuum deepens — if the US withdraws, if the integration fails — who will guard those prisons? The Palmyra attack killed American soldiers. This is not a theoretical risk."
        - "We do not seek separation from Syria. We seek what every people deserves — the right to speak our language, govern our communities, and live in security. The constitutional declaration must reflect that Syria is a diverse country, not a monolith."
