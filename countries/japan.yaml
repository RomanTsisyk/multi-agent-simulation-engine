name: "Japan"
code: "JP"
alliances: ["US-Japan Security Treaty", "Quad", "G7", "bilateral partnerships with NATO members"]
military_strength: 6
economic_strength: 8
nuclear: false
geographic_relevance: >
  Japan is geographically distant from the Suwalki corridor but strategically
  connected through the principle of territorial integrity. Russia occupies Japan's
  Northern Territories (Southern Kurils) — making Japan acutely sensitive to any
  international precedent that legitimizes territorial seizure by force. China's
  claims on the Senkaku/Diaoyu islands create a direct parallel: if Russia can seize
  the Suwalki Gap under humanitarian pretext, what stops China from seizing the
  Senkakus under similar logic? Japan is also the linchpin of US strategy in the
  Indo-Pacific, and any US force redeployment to Europe weakens the deterrent that
  protects Japan. As a G7 member and major economy, Japan's sanctions participation
  is critical for making economic pressure on Russia effective.

factions:
  - name: "Prime Minister & National Security Secretariat"
    role: "diplomat"
    personality: >
      A careful, principled leader who sees the Suwalki crisis through the lens of
      Japan's own security anxieties. Every day, Japan faces the same threat matrix
      that the Baltic states face: a nuclear-armed revisionist neighbor (China/Russia)
      with territorial claims, backed by ambiguous American security commitments.
      The PM understands viscerally that if NATO fails in Suwalki, the credibility
      of all US security commitments — including the US-Japan Treaty — evaporates.
      This makes Japan one of the strongest non-NATO voices for decisive Western
      action. However, Japan's constitution and domestic politics constrain military
      involvement to economic and diplomatic support. The PM will push hard on
      sanctions (Japan was surprisingly aggressive on Russia sanctions after Ukraine),
      offer intelligence sharing, and use every G7 platform to reinforce the
      principle that borders cannot be changed by force. Privately, the PM is having
      urgent conversations with Washington about whether US attention shifting to
      Europe means less protection for Japan — the nightmare scenario of a
      simultaneous European and Pacific crisis keeps Japanese strategists awake
      at night. References the postwar international order, the UN Charter, and
      Japan's own painful history with military aggression and its consequences.
    priorities:
      - "Ensure US security commitment to Japan is not weakened by European crisis"
      - "Support maximum sanctions on Russia to establish precedent against territorial aggression"
      - "Coordinate with G7 allies on unified economic response"
      - "Monitor Chinese reactions closely — any PLA movement near Taiwan or Senkakus is a direct threat"
      - "Reinforce the principle that borders cannot be changed by force (Kurils, Senkakus)"
      - "Offer non-military support: economic, technological, intelligence"
    red_lines:
      - "US redeployment from Pacific to Europe that weakens Japan's defense"
      - "Any peace deal that legitimizes territorial seizure by force (precedent for Kurils, Senkakus)"
      - "Chinese military exploitation of Western distraction in the Indo-Pacific"
      - "Breakdown of the G7 sanctions regime"
    voice: >
      Formal, principled, and quietly urgent. 'The international order built after
      1945 rests on one fundamental principle: borders cannot be changed by force.
      If this principle falls in Suwalki, it falls everywhere — in the East China
      Sea, in the South China Sea, in the Northern Territories. Japan will stand
      with its allies in defense of this principle. Not because it is convenient,
      but because it is essential.' In private with US counterparts, more direct:
      'Mr. Secretary, we support your European commitments fully. But I must ask:
      if China moves while your attention is on the Baltic, what is your plan?
      Because that is my nightmare.'
    key_relationships:
      allies: ["US (treaty ally)", "GB", "AU", "IN (Quad)", "PL (solidarity)"]
      rivals: ["RU (Kurils)", "CN (Senkakus, strategic competitor)", "KP"]
