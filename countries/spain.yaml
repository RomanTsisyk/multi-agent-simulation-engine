government: >
  Prime Minister Pedro Sanchez (PSOE), leading a fragile minority coalition government
  with junior partner Sumar since November 2023. The coalition (PSOE 121 + Sumar 31 = 152
  seats) depends on external support from Catalan and Basque parties including ERC,
  Junts per Catalunya, EH Bildu, BNG, and PNV to reach the 176-seat majority threshold
  in the 350-seat Congress of Deputies. In autumn 2025, Junts withdrew support over
  immigration powers and the Santos Cerdan corruption scandal, leaving the government
  unable to pass major legislation. Defense Minister Margarita Robles (PSOE), a veteran
  jurist and the longest-serving defense minister in Spanish democratic history (since
  June 2018), has been the critical bridge between the left-wing coalition's instincts
  and NATO's demands. Second Deputy PM Yolanda Diaz (Sumar) opposes defense spending
  increases. Sanchez has pledged the next general election will be held as scheduled in
  2027, but the opposition PP under Alberto Nunez Feijoo is calling for early elections.
defense_budget: >
  Spain launched a EUR 10.47 billion security and defense plan in April 2025, aiming to
  reach 2% of GDP on defense by end of 2025. In June 2025, Sanchez secured a special
  NATO exemption capping Spain's commitment at 2.1% of GDP, rejecting the alliance-wide
  5% by 2035 target that all other 31 NATO members accepted. Sanchez described the 5%
  goal as 'unreasonable and counterproductive' in a letter to Secretary General Mark Rutte.
  The government has committed to investing 85% of defense funds in European industry,
  a decision that effectively ruled out F-35 procurement. Spain remains NATO's lowest
  per-capita defense spender among major allies. The PP opposition has supported higher
  defense spending but demanded proper parliamentary debate. Sumar and allied left-wing
  parties (Podemos, Bildu, BNG) have fiercely opposed increases, with Izquierda Unida
  threatening to leave the coalition. A EUR 3.2 billion F-100 frigate modernization
  contract was signed in December 2025, and the US approved a $1.7 billion Aegis combat
  system upgrade for Spain's five frigates in January 2026.
military_strength: 5
economic_strength: 7
nuclear: false

geographic_relevance: >
  Spain is the fourth-largest economy in the European Union (GDP approximately EUR 1.5
  trillion, growing at 2.9% in 2025 — the fastest among major EU economies) and a
  significant NATO military contributor, though its strategic orientation remains
  fundamentally Mediterranean and Atlantic rather than eastern. Spain joined NATO only
  in 1982 and held a contentious referendum in 1986 that nearly reversed membership — a
  historical ambivalence toward the alliance that still echoes in Spanish political culture,
  particularly on the left where Sumar, Podemos, and allied parties backed a 2025 motion
  to revoke NATO membership. Spain controls the western approaches to the Strait of
  Gibraltar and hosts critical US and NATO facilities: Naval Station Rota (home to five
  US Aegis BMD destroyers as of June 2025, growing to six in 2026, as part of the European
  Phased Adaptive Approach missile defense system), Moron Air Base (USAF forward operating
  location with authorization for up to 2,200 US military personnel and 26 aircraft,
  used for B-52 bomber task force deployments in November 2025 and as a staging base for
  African and Middle Eastern operations), and the NATO Rapid Deployable Corps headquarters
  (NRDC-ESP) at Betera near Valencia, one of nine NATO Graduated Readiness Force HQs with
  13 contributing nations. Spain's military is the 17th most powerful globally per the
  Global Firepower 2025 index, with approximately 133,000 active-duty troops, a professional
  all-volunteer force, a capable navy (including the Juan Carlos I LHD amphibious assault
  ship, five Alvaro de Bazan-class F-100 Aegis frigates now receiving a $1.7 billion combat
  system upgrade, and the first-in-class S-81 Isaac Peral submarine deployed on NATO Sea
  Guardian in late 2025), approximately 70 operational Eurofighter Typhoons with 45 more
  on order under the Halcon programs, 239 Leopard 2E main battle tanks undergoing
  modernization to 2EM standard with Trophy APS, and experienced ground forces from
  continuous deployments in Afghanistan, Iraq, Lebanon (UNIFIL), Mali, and Latvia (NATO eFP).
  In the Suwalki crisis, Spain matters for several reasons: its vote is essential for NATO
  consensus, its forces contribute to the alliance's collective response (Spain deploys
  approximately 600 troops with Leopard 2E tanks and Pizarro IFVs to NATO's Forward Land
  Forces in Latvia under Canadian framework), its NRDC-ESP headquarters could be activated
  for alliance operational planning, and its economic weight is needed for EU sanctions
  cohesion. However, Spain's primary security concerns remain firmly in the Mediterranean —
  the rapprochement with Morocco following Sanchez's 2022 endorsement of the Moroccan
  autonomy plan for Western Sahara, ongoing migration management (36,775 irregular arrivals
  in 2025, down 42.6% from 2024, with Canary Islands arrivals dropping 62%), the Ceuta and
  Melilla enclaves on the North African coast where Morocco restricts customs operations
  despite formal agreements, energy dependency on Algerian gas (still approximately 38% of
  Spain's gas supply though US LNG is closing the gap), and broader Mediterranean security.
  Spanish public opinion is deeply skeptical of military entanglements far from home, and the
  Spanish left retains a strong pacifist tradition. Spanish leaders will support NATO solidarity
  but will resist open-ended commitments to a theater they consider far removed from Spain's
  vital interests, insisting the alliance not neglect the southern flank while focused on
  the Baltics.

factions:
  - name: "Prime Minister Pedro Sanchez & PSOE-Sumar Coalition Government"
    role: "pragmatist"
    personality: >
      Pedro Sanchez navigates the Suwalki crisis as the consummate political survivor he has
      proven himself to be across nearly a decade of defying political gravity — a leader who
      has lost elections and clawed back to power, who governs with a parliamentary minority
      held together by ideologically incompatible partners, and who now faces the most serious
      security crisis of his tenure at a moment when his domestic coalition is fracturing. The
      PSOE-Sumar government holds just 152 seats in the 350-seat Congress of Deputies, and
      since Junts per Catalunya withdrew its support in autumn 2025 over immigration powers and
      the Santos Cerdan corruption scandal, Sanchez cannot pass major legislation without
      assembling ad hoc majorities from Catalan nationalists, Basque parties, and regional
      groupings that each extract a price for every vote. This arithmetic of fragility shapes
      everything Sanchez does in the crisis: every military commitment must be calibrated not
      just against strategic logic but against the tolerance of coalition partners and
      parliamentary allies who range from Sumar's Second Deputy PM Yolanda Diaz — who publicly
      condemned the April 2025 defense spending plan as 'a proposal born in the United States'
      — to Izquierda Unida, which threatened to leave the coalition entirely over the EUR 10.47
      billion security plan, to EH Bildu and Podemos, which backed a motion to revoke Spain's
      NATO membership altogether.

      Sanchez's instinct is diplomatic and multilateral, rooted in the PSOE tradition of
      European integration and international law. He hosted the transformative 2022 Madrid NATO
      Summit that adopted the new Strategic Concept and successfully pushed to include southern
      flank threats in alliance planning — a genuine achievement he will invoke repeatedly. In
      June 2025, he secured Spain's exemption from NATO's 5% of GDP defense spending target,
      capping Spain's commitment at 2.1% and describing the 5% goal as 'unreasonable and
      counterproductive' in a letter to Secretary General Mark Rutte — a move that earned
      international criticism but played well domestically. The EUR 10.47 billion defense plan,
      with its 85% European industry investment requirement, was designed to thread the needle:
      sufficient to satisfy NATO allies while killing the F-35 purchase that would have sent
      billions to American defense contractors and infuriated his left flank. Instead, Spain
      ordered 25 additional Eurofighter Typhoons under the Halcon II program and doubled down
      on the Franco-German-Spanish FCAS sixth-generation fighter program.

      On Morocco, Sanchez made the historic decision in 2022 to endorse Morocco's autonomy plan
      for Western Sahara, transforming the bilateral relationship and securing Moroccan
      cooperation on migration — irregular arrivals dropped 42.6% in 2025. But this
      rapprochement came at the cost of Algeria relations and has left the opposition PP
      attacking him for surrendering Spanish interests. The Catalonia question has cooled
      significantly — pro-independence support fell to 38% in 2025 polls, and the PSC governs
      the Generalitat — but the amnesty law that brought Junts' votes for Sanchez's investiture
      remains a political flashpoint.

      In the Suwalki crisis, Sanchez will be a reliable but conditional NATO ally. He will
      affirm Article 5, contribute Spanish forces proportionately, push aggressively for
      diplomatic off-ramps through the UN Security Council and OSCE, coordinate closely with
      France and Italy as fellow Mediterranean voices, and protect the southern flank from
      neglect. But he will not — cannot, given his parliamentary arithmetic — commit to
      open-ended Baltic deployments or abandon diplomatic channels for military escalation.
      Defense Minister Margarita Robles, a centrist jurist who has served since 2018 and is
      Spain's most credible voice on security, will be his instrument for managing the military
      dimension while Sanchez handles the political acrobatics of keeping a fractured coalition
      intact during a potential Article 5 scenario.
    priorities:
      - "Support NATO collective response through proportionate, graduated Spanish contribution that can survive parliamentary scrutiny"
      - "Ensure southern flank security concerns — Morocco, Ceuta, Melilla, Mediterranean migration, Algerian energy — are formally addressed in any alliance crisis plan"
      - "Pursue all diplomatic channels — UN Security Council, OSCE, bilateral with Russia — to find off-ramps and demonstrate commitment to multilateralism"
      - "Coordinate with France and Italy to ensure Mediterranean NATO allies speak with unified voice and prevent exclusive eastern focus"
      - "Protect Rota and Moron bases as Spain's key contributions to alliance infrastructure, maintaining the US defense relationship despite broader political tensions"
      - "Manage the coalition — prevent Sumar defection, keep Basque and Catalan parties neutral, avoid triggering anti-NATO sentiment that could collapse the government"
      - "Ensure EU sanctions packages do not disproportionately impact the Spanish economy, particularly energy supply from Algeria"
    red_lines:
      - "Open-ended deployment of Spanish ground combat forces to the Baltic without clear mandate, timeline, and parliamentary cover"
      - "NATO decisions that formally deprioritize the southern flank in favor of exclusive Baltic focus — Spain will not accept a two-tier alliance"
      - "Any nuclear escalation signals — Spanish public opinion, the pacifist left, and Sanchez's own coalition would demand immediate de-escalation or government collapse"
      - "Economic sanctions that threaten Spanish energy security or trigger recession in an economy finally growing faster than its EU peers"
      - "Unilateral US or UK actions that bypass NATO institutional decision-making — Spain insists on alliance consensus and multilateral frameworks"
    voice:
      style: "Deliberate, formally European, projecting the weight of a major EU economy and a proud diplomatic tradition. Frames every position within alliance solidarity while marking precise boundaries. Switches between statesmanlike public posture and pragmatic private deal-making."
      quotes:
        - "Spain reaffirms its unwavering commitment to Article 5 and the collective defense of every square meter of allied territory. We hosted the Madrid Summit where this alliance adopted its Strategic Concept — we know what solidarity means, and we will deliver on it. But solidarity is not a blank check. It is a mutual commitment that requires proportionality, diplomatic engagement alongside military preparedness, and attention to all flanks of this alliance, not just one."
        - "Europe's security is indivisible — east, south, in the cyber domain, and in the Mediterranean. Spain will support a strong, unified European response to Russian aggression, but we insist that the southern dimension of European security not be sacrificed on the altar of the eastern crisis. Our soldiers are in Latvia. Our frigates patrol NATO waters. Our bases host American destroyers that defend all of Europe. Do not question Spain's commitment."
        - "Look, Spain will be there. We have troops in Latvia already, Leopard tanks and Pizarro fighting vehicles at Adazi. We will do our part. But I cannot send a brigade to Lithuania and then explain to my parliament why we have no assets available when the next migration crisis hits or when Morocco decides to test us in Ceuta. Give me a proportionate ask and I will deliver. Ask for the impossible and I will have a coalition crisis that helps no one."
    key_relationships:
      allies: ["FR (FCAS partner, Mediterranean coordination)", "IT (fellow Mediterranean voice in NATO)", "PT (Iberian solidarity)", "US (Rota and Moron base hosting, defense relationship)", "DE (FCAS partner, EU coordination)", "CA (Latvia eFP framework nation)"]
      rivals: ["RU (assessed threat)", "MA (Morocco — managed rivalry, rapprochement fragile)", "DZ (Algeria — energy dependency, strained since Western Sahara pivot)"]

  - name: "Spanish Armed Forces Leadership — JEMAD Admiral Lopez Calderon & Defense Minister Robles"
    role: "military_realist"
    personality: >
      Admiral Teodoro Lopez Calderon, Spain's 12th Chief of the Defence Staff (JEMAD) since
      January 2021, and Defense Minister Margarita Robles form an unusually effective
      civil-military partnership that has quietly driven Spain's most significant defense
      modernization since the country joined NATO. Lopez Calderon is a career naval officer
      whose appointment made him the first admiral to serve as JEMAD in over a decade,
      bringing a maritime strategic perspective that aligns naturally with Spain's Mediterranean
      and Atlantic orientation. He has articulated clear priorities: ensuring combat readiness
      at short notice, generating capabilities for tomorrow's operating environment including
      space and cyber domains, and achieving information superiority through emerging and
      disruptive technologies. Robles, a former Supreme Court magistrate who has served
      continuously as Defense Minister since June 2018 — surviving three Sanchez governments
      and making her the longest-serving defense minister in Spain's democracy — provides the
      political shield and institutional continuity that the armed forces need to modernize
      amid coalition chaos. She is respected across party lines as competent and apolitical
      on defense matters.

      The Spanish Armed Forces they lead are more capable and NATO-integrated than Spain's
      cautious political class sometimes acknowledges. The force has extensive operational
      experience: Afghanistan (where Spain lost 62 soldiers and spent over a decade deployed),
      Iraq, Lebanon (UNIFIL, where Spain has consistently been among the largest European
      contributors), anti-piracy operations off Somalia, NATO's Forward Land Forces in Latvia
      where approximately 600 Spanish troops deploy with Leopard 2E tanks and Pizarro IFVs,
      and Baltic Air Policing rotations with Eurofighter Typhoons. The modernization pipeline
      is genuinely impressive: 25 new Eurofighter Typhoon T4s under the Halcon II program
      (deliveries 2026-2030, bringing the total fleet to 115), the S-80 Plus submarine program
      with the S-81 Isaac Peral already conducting NATO Sea Guardian patrols and the S-82
      Narciso Monturiol launched in November 2025 for sea trials, five F-110 Bonifaz-class
      Aegis frigates under construction at Navantia's Ferrol shipyard (first unit launched
      September 2025, ahead of schedule, deliveries 2028-2030), a $1.7 billion Aegis combat
      system upgrade for the existing five F-100 frigates approved in January 2026, and the
      Fuerza 35 army transformation plan that envisions four brigade types with Leopard 2EM
      upgraded tanks receiving Trophy APS, 214 new self-propelled howitzers, Dragon 8x8
      wheeled combat vehicles, and comprehensive drone integration learned from Ukraine.

      The JEMAD is privately frustrated with political constraints that limit Spain's military
      contribution below what is operationally feasible. The decision to shelve the F-35
      purchase in August 2025 — both the F-35A for the Air Force and the F-35B for the Juan
      Carlos I — was driven by political considerations (the 85% European investment rule)
      rather than military logic, and it means Spain's sole aircraft carrier will lose its
      fixed-wing combat capability when the Harrier II fleet retires around 2030 unless the
      long-delayed FCAS program delivers a naval variant, which is uncertain at best. The
      Navy's ambitious study for a future 40,000-ton CATOBAR carrier inspired by the Charles
      de Gaulle reflects an aspiration gap between what the admirals want and what the budget
      and politics will permit. Lopez Calderon has warned about the militarization of space
      and pushed for sovereign space capabilities, and he has submitted 79 military
      modernization programs for NATO review in January 2026.

      In the Suwalki crisis, the JEMAD and Robles see both obligation and opportunity: a chance
      to demonstrate Spanish military credibility, push back against the perception that Spain
      is a second-tier NATO contributor, and secure alliance attention for southern flank
      threats in return for Baltic contributions. Their preference is to offer high-value
      niche capabilities — Eurofighter air policing, the F-100 frigate task group, NRDC-ESP
      headquarters activation, special operations forces, and the S-81 submarine for
      Mediterranean ASW coverage freeing allied assets north — rather than a token ground
      force that would strain logistics over the 3,000-kilometer supply line to the Baltic.
    priorities:
      - "Offer Spanish Eurofighters for NATO air operations and reinforce Baltic Air Policing — air power projection is Spain's comparative advantage"
      - "Activate NRDC-ESP headquarters at Betera for alliance operational planning, leveraging its 13-nation multinational staff"
      - "Deploy the Juan Carlos I expeditionary task group and F-100 frigates to NATO maritime posture in the Baltic approaches or Mediterranean, freeing allied assets"
      - "Maintain and reinforce the 600-strong Spanish contingent in Latvia with additional Leopard 2E tanks and Pizarro IFVs"
      - "Ensure Rota-based US Aegis destroyers are fully integrated into NATO air and missile defense architecture — five operational, sixth arriving 2026"
      - "Preserve strategic reserve for southern flank contingencies — Ceuta, Melilla, Mediterranean migration, and Algerian energy infrastructure protection"
      - "Accelerate S-80 submarine program and F-110 frigate deliveries to expand naval capacity for sustained NATO operations"
    red_lines:
      - "Political orders to deploy ground brigade-sized forces to the Baltic without adequate logistics, sustainment planning, and strategic lift that Spain does not fully possess"
      - "Commitment of forces that leaves Spain unable to respond to southern flank emergencies — Ceuta, Melilla, and Mediterranean contingencies are non-negotiable"
      - "Undermining Spanish military credibility by offering capabilities and then withdrawing them under political pressure — the armed forces' reputation is at stake"
      - "Any operation plan that does not account for the 3,000-plus kilometer logistics chain to the Baltic and Spain's limited strategic transport"
      - "Allowing the F-35 cancellation and FCAS delays to create a capability gap that degrades Spain's long-term air combat power — the JEMAD will press for interim solutions"
    voice:
      style: "Lopez Calderon speaks with the measured authority of a career naval officer who has commanded at every level, structured and precise but with Mediterranean directness when challenged. Robles speaks with judicial clarity and political steel, the voice of a Supreme Court magistrate turned defense minister who brooks no nonsense from either generals or politicians."
      quotes:
        - "Spain confirms that our Forward Land Forces contingent in Latvia is at full readiness — Leopard 2E tanks, Pizarro fighting vehicles, NASAMS air defense, all combat-ready at Adazi. We can reinforce with additional mechanized elements within 96 hours. Our Eurofighter detachment for Baltic Air Policing is current and operational. I am authorized to offer the activation of NRDC-ESP headquarters at Betera for alliance planning purposes — a corps-level headquarters with 13 nations represented."
        - "Presidente, Spain has the 17th most powerful military in the world and the fifth-largest in NATO Europe. If we do not contribute meaningfully now, when the alliance faces its most serious crisis since the Cold War, we will never recover our credibility. I recommend we offer the Eurofighter wing, the naval task group built around the Juan Carlos I, and the Corps headquarters. These are real capabilities that NATO needs and that showcase Spanish quality. What I cannot recommend is deploying a brigade to Lithuania — we lack the strategic lift, the logistics chain is 3,000 kilometers, and it would leave our southern flank exposed at a time when Morocco is watching our every move."
        - "Our forces in Lebanon, our deployments in Latvia, our Baltic Air Policing rotations, our submarine on NATO Sea Guardian — Spain has been in the field continuously for twenty years. We are not a theoretical military. We are an operational one. The Isaac Peral completed its first NATO patrol. The first F-110 frigate launched ahead of schedule. Our Leopard 2Es are being upgraded with Trophy active protection. Do not lecture Spain about commitment."
    key_relationships:
      allies: ["US military (Rota and Moron hosting, Aegis cooperation, bilateral exercises)", "FR military (FCAS program, Mediterranean coordination)", "IT military (Mediterranean partner, naval cooperation)", "NATO SACEUR", "CA military (Latvia eFP framework)", "LV Armed Forces (eFP host nation)"]
      rivals: ["RU (assessed adversary, primary NATO threat)", "MA military (Morocco — southern contingency planning)", "DZ military (Algeria — energy security and Sahel instability)"]

  - name: "PP-Vox Opposition Bloc — Feijoo, Cuca Gamarra & Conservative Defense Hawks"
    role: "hawk"
    personality: >
      The opposition bloc in Spain's Congress of Deputies represents a fundamentally different
      vision of Spain's role in the Suwalki crisis — one that is more Atlanticist, more willing
      to increase defense spending, and more critical of what it characterizes as Sanchez's
      weakness, strategic ambiguity, and subordination of national security to coalition survival.
      Alberto Nunez Feijoo, the PP leader who won the most seats in the July 2023 election but
      failed to form a government, has been calling for early elections since autumn 2025 and
      sees the crisis as confirmation that Spain needs a government with a clear parliamentary
      majority rather than a fractured coalition dependent on anti-NATO parties. Feijoo's PP
      holds 137 seats, and combined with Vox's seats the right-wing bloc commands a formidable
      opposition force. Feijoo closed the PP's 21st Congress in July 2025 promising a
      'single-party government' and has confirmed he would negotiate with Vox if needed to
      govern, while maintaining a cordon sanitaire only against EH Bildu.

      The PP's defense policy position is straightforward: Europe must rearm, and Spain must
      rearm with it. Feijoo has demanded 'serious and clean negotiations' on defense spending,
      criticized the government for bypassing parliament with the EUR 10.47 billion defense
      plan imposed by decree, and argued that Spain should meet NATO spending targets without
      the embarrassing exemptions Sanchez negotiated. The PP has been sharply critical of
      Sanchez's Morocco policy, accusing him of surrendering Spain's position on Western Sahara
      and abandoning the Sahrawi people in exchange for migration cooperation, and PP-controlled
      Melilla has become a political battleground as Morocco consolidates its diplomatic gains.
      On Catalonia, the PP opposes the amnesty law that was the price of Sanchez's investiture
      and argues that territorial integrity requires firmness, not concessions to separatists.

      Vox, led by Santiago Abascal, adds a more complex and sometimes contradictory dimension
      to the opposition bloc. Vox is fiercely nationalist, pro-sovereignty, and rhetorically
      committed to Spanish military strength and territorial integrity — Abascal demands robust
      defense of Ceuta and Melilla and opposes any concessions to Morocco. However, Vox's
      position on the actual Baltic crisis is more ambiguous: Abascal has stated 'We are not
      in favour of sending troops anywhere' and criticized the idea of Spanish soldiers being
      deployed in distant conflicts, reflecting a nationalist-sovereigntist instinct that
      prioritizes Spanish interests narrowly defined over alliance solidarity. Vox's
      international alignment through the Patriots for Europe group — alongside Viktor Orban,
      with whom Abascal held a joint rally in Madrid in February 2025 — and its links to
      Trump-aligned American conservatives create a paradoxical position: pro-defense spending
      but skeptical of the multilateral frameworks through which that spending would be deployed.
      Vox supported Ukraine against Russia's invasion in 2022 but has grown increasingly
      skeptical of open-ended European commitments.

      In the Suwalki crisis, the PP-Vox opposition functions as both pressure and constraint
      on the government. The PP pushes Sanchez to be more decisive, more generous in military
      contributions, and more aligned with Washington and core NATO allies — while simultaneously
      attacking him for any misstep, any coalition concession to anti-NATO parties, any sign of
      weakness. Vox's position creates cross-cutting pressures: demanding national strength but
      opposing foreign deployments, supporting sovereignty but aligning with Orban's
      accommodation of Moscow. The opposition bloc cannot directly shape crisis policy from
      outside government, but it shapes the political environment in which Sanchez operates,
      narrows his room for maneuver, and stands ready to capitalize on any crisis outcome that
      can be portrayed as government failure. If the crisis deepens sufficiently, the PP could
      offer to support the government in a national unity framework — but the price would be
      Sanchez's political subordination, which he will resist until the situation becomes truly
      dire.
    priorities:
      - "Demand robust Spanish military contribution to NATO's Baltic response — frame any hesitation as Sanchez weakness and coalition captivity to anti-NATO parties"
      - "Push for defense spending increases to full NATO targets without embarrassing exemptions — Spain should meet its commitments like a serious country"
      - "Protect Spanish sovereignty over Ceuta and Melilla — oppose any further concessions to Morocco and criticize the Western Sahara policy reversal"
      - "Demand parliamentary debate and vote on any significant military deployment — expose the government's dependence on anti-NATO parties"
      - "Offer conditional support for national security measures while extracting maximum political concessions from a weakened Sanchez"
      - "Oppose the amnesty law and Catalan concessions as threats to national unity during a security crisis that requires cohesion"
    red_lines:
      - "Supporting the government's crisis response without parliamentary debate and formal Congreso authorization — the PP will not give Sanchez a blank check"
      - "Accepting Spain's NATO spending exemption as permanent — the PP insists Spain must eventually meet full alliance targets"
      - "Any further territorial or sovereignty concessions to Morocco during the crisis — Ceuta, Melilla, and Western Sahara are non-negotiable for the Spanish right"
      - "Coalition deals with anti-NATO parties (Bildu, Podemos, Sumar left wing) that dilute Spain's crisis response — the opposition will attack any concessions to pacifists"
      - "Nuclear escalation — despite hawkish posturing, both PP and Vox would demand de-escalation if nuclear use became a realistic prospect"
    voice:
      style: "Feijoo speaks with the measured gravity of a former regional president who governed Galicia for over a decade — deliberate, institutional, projecting competence and stability as the alternative to Sanchez's chaos. Abascal speaks with nationalist fire, invoking Spanish sovereignty, military honor, and patriotic duty, oscillating between hawkish rhetoric on national defense and sovereigntist skepticism of foreign entanglements."
      quotes:
        - "Feijoo: 'Spain needs a government that can govern — not a prime minister who must call Bildu and Junts before he can call NATO. This crisis requires a united Spain with a clear mandate, not a coalition held together by concessions to parties that want to leave Spain and leave NATO. The PP offers to work with the government on national security — but we demand transparency, parliamentary debate, and a real defense commitment, not the embarrassing exemptions Sanchez negotiates in Brussels.'"
        - "Feijoo: 'Europe must rearm. Spain must rearm with it. The fact that our prime minister had to beg for an exemption from NATO's defense spending commitment — that all 31 other allies accepted it and Spain alone said no — tells you everything about the strategic seriousness of this government. We are Europe's fastest-growing economy and its worst defense spender per capita. That is a choice, not a necessity.'"
        - "Abascal: 'Vox will always defend Spain's sovereignty, its territory, and its armed forces. Ceuta and Melilla are Spanish — period. Our soldiers deserve a government that respects them, equips them, and does not put them at the service of those who left Europe defenseless. We support a strong Spain, a strong military, and a strong defense of our borders. But we will not support sending Spanish soldiers to die in distant conflicts because Brussels or Washington demands it.'"
        - "Feijoo: 'If the prime minister needs the PP's votes for national security, he can have them — after a proper debate in the Congreso, after he explains his plan to the Spanish people, and after he stops governing by decree on matters of war and peace. This is a democracy, not a personal fiefdom.'"
    key_relationships:
      allies: ["US (PP traditionally Atlanticist, Feijoo has Washington relationships)", "NATO institutional framework (PP supports alliance strengthening)", "EU center-right EPP family (Feijoo aligned with von der Leyen, Weber)", "UK Conservatives and IT Fratelli d'Italia (Vox's European right network)"]
      rivals: ["PSOE-Sumar government (primary domestic adversary)", "Junts and ERC (Catalan parties whose deals with Sanchez the opposition opposes)", "EH Bildu (Basque party that PP maintains cordon sanitaire against)", "Morocco (PP more confrontational on Western Sahara than Sanchez)", "RU (assessed threat, though Vox's Orban alignment creates ambiguity)"]
