name: "Mexico"
code: "MX"

government: >
  President Claudia Sheinbaum Pardo (MORENA), inaugurated 1 October 2024 — Mexico's
  first female president, a climate scientist with a PhD from UC Berkeley and former
  mayor of Mexico City. Her cabinet: Secretary of Foreign Affairs Juan Ramon de la Fuente
  (former UNAM rector and Mexico's UN ambassador 2019-2024); Secretary of National Defense
  (SEDENA) Gen. Ricardo Trevilla Trejo; Secretary of the Navy (SEMAR) Adm. Raymundo
  Pedro Morales Anguiano; Secretary of Finance Rogelio Ramirez de la O (retained from
  AMLO cabinet); Secretary of Environment Alicia Barcena (former Foreign Minister under
  AMLO, former ECLAC Executive Secretary, potential candidate for UN Secretary-General in
  2026). MORENA and its coalition partners (PT, PVEM) hold a supermajority in the Chamber
  of Deputies (364 of 500 seats) and near-supermajority in the Senate (83 of 128 seats),
  giving Sheinbaum extraordinary legislative power. The controversial 2024 judicial reform
  — making Mexico the first country to elect all judges by popular vote — was implemented
  with June 2025 judicial elections. Sheinbaum enjoys approximately 67-69% approval as of
  mid-2025, making her the most popular president in Latin America, though ratings have
  declined from an 85% peak in February 2025. Her administration continues AMLO's "Fourth
  Transformation" (4T) project while bringing a more technocratic, internationally
  engaged style.

alliances: ["USMCA", "G20", "Pacific Alliance (observer)", "CELAC", "UN General Assembly", "MIKTA", "Comprehensive and Progressive Agreement for Trans-Pacific Partnership (CPTPP)"]

