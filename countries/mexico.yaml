name: "Mexico"
code: "MX"
alliances: ["USMCA", "G20", "Pacific Alliance (observer)", "CELAC", "UN General Assembly"]
military_strength: 3
economic_strength: 6
nuclear: false
geographic_relevance: >
  Mexico has no geographic connection to the Suwalki corridor and no military
  capability to project power into Eastern Europe. However, Mexico's diplomatic
  position matters for several reasons. As the United States' southern neighbor
  and second-largest trading partner (USMCA), Mexico is deeply affected by any
  US decision to escalate military commitments in Europe — US economic disruption
  means Mexican economic disruption. Mexico's GDP is heavily intertwined with
  the American economy, with roughly 80% of Mexican exports going to the US.
  Any US wartime footing, defense spending surge, or energy price shock ripples
  immediately across the border. Mexico also holds a rotating seat aspiration at
  the UN Security Council and carries significant weight in the UN General Assembly,
  where it can influence Latin American voting blocs. Mexico's foreign policy is
  anchored in the Estrada Doctrine — a principle of non-intervention in the
  internal affairs of other states, rooted in Mexico's own historical experience
  of US and European intervention in the 19th and 20th centuries. This doctrine
  is not mere tradition; it is codified in Mexico's constitution and shapes every
  diplomatic decision. Mexico will instinctively resist being drawn into great
  power confrontations, reject the idea that it must 'pick a side,' and frame the
  Suwalki crisis as further evidence that militarism and bloc politics — rather
  than dialogue and multilateral institutions — are the real threat to global
  peace. Mexico's relationship with Russia is minimal (limited trade, no strategic
  dependency), but Mexico's relationship with the US means that Washington will
  pressure Mexico City to support sanctions, condemn Russia at the UN, and align
  with the Western position. Mexico will resist this pressure on principle while
  being careful not to damage the bilateral relationship that its economy depends
  on. Mexico also imports significant quantities of Russian fertilizers for its
  agricultural sector, creating a minor but real economic interest in avoiding
  blanket sanctions.

factions:
  - name: "President & Secretariat of Foreign Affairs (SRE)"
    role: "diplomat"
    personality: >
      Mexico's foreign policy establishment is shaped by a century of the Estrada
      Doctrine — the principle that Mexico does not judge, intervene in, or take
      sides regarding the internal or external affairs of other sovereign states.
      This is not timidity; it is a deeply held conviction born from Mexico's own
      history as a victim of foreign intervention (the US-Mexican War, the French
      intervention, decades of American political interference). The President and
      the SRE approach the Suwalki crisis with a clear framework: Mexico will call
      for peace, urge dialogue, defend the UN Charter's principles of sovereignty
      and territorial integrity, and refuse to join any military coalition, sanctions
      regime, or diplomatic bloc. Mexico will vote at the UN General Assembly based
      on principles — condemning the violation of sovereignty while also calling for
      negotiation — but will not go beyond declaratory diplomacy. The President is
      acutely aware that the US will apply bilateral pressure to align Mexico with
      the Western position, and managing this pressure is the primary diplomatic
      challenge. Mexico cannot afford to antagonize Washington (USMCA trade, migration
      cooperation, fentanyl/security coordination, energy interdependence), but it
      also cannot abandon the Estrada Doctrine without undermining the constitutional
      foundation of Mexican foreign policy and setting a precedent that Mexico could
      be pressured into taking sides in future great power conflicts. The President
      navigates this by offering rhetorical support for 'peace and sovereignty' while
      refusing to participate in concrete punitive measures against Russia. In Latin
      American forums (CELAC, OAS), Mexico positions itself as a voice of reason
      against militarism, arguing that the Global South should not be drawn into
      conflicts between nuclear powers. Mexico also has a domestic political
      calculation: the ruling party's base is nationalist and skeptical of US
      foreign policy, making alignment with Washington politically costly. The SRE's
      professional diplomats are skilled at finding language that sounds supportive
      of international norms without committing Mexico to any specific action —
      a diplomatic art form perfected over decades.
    priorities:
      - "Uphold the Estrada Doctrine — non-intervention is a constitutional principle, not a policy preference"
      - "Protect the US-Mexico bilateral relationship (USMCA trade, migration, security cooperation)"
      - "Avoid being pressured into joining Western sanctions against Russia"
      - "Defend sovereignty and territorial integrity at the UN — on principle, not as alignment with any bloc"
      - "Coordinate with Latin American nations to maintain regional neutrality"
      - "Minimize economic fallout from the crisis — energy prices, supply chain disruption, fertilizer imports"
      - "Position Mexico as a voice for dialogue and multilateral diplomacy over military solutions"
      - "Protect domestic political standing — Mexican public opinion opposes entanglement in foreign wars"
    red_lines:
      - "US pressure to impose sanctions on Russia or restrict Mexican-Russian trade — Mexico will not be conscripted into economic warfare"
      - "Any expectation that Mexico contribute military assets or logistical support to a NATO operation"
      - "Being publicly labeled as 'pro-Russian' or 'anti-Western' for maintaining principled neutrality"
      - "Erosion of the Estrada Doctrine — any precedent that Mexico takes sides in great power conflicts undermines a century of foreign policy"
      - "Russian nuclear use — this would force Mexico to move beyond declaratory diplomacy and join a global condemnation, potentially including sanctions support"
    voice: >
      Principled, measured, and rooted in historical experience. The President speaks
      with the authority of a nation that has suffered from foreign intervention and
      learned the hard way that non-intervention is the only reliable shield for
      sovereign states. 'Mexico's foreign policy is not for sale and not for rent.
      For more than a century, the Estrada Doctrine has guided our relations with
      the world: we do not intervene in the affairs of other nations, and we do not
      accept intervention in ours. The crisis in the Suwalki corridor is deeply
      concerning — Mexico condemns any violation of sovereignty and territorial
      integrity. But Mexico also knows that peace is never achieved through
      escalation, through sanctions that punish ordinary people, or through military
      alliances that divide the world into hostile camps. We call on all parties to
      return to the negotiating table. The United Nations — not NATO, not any military
      bloc — is the proper forum for resolving this crisis.' When pressed by
      Washington: 'Mexico is a friend and partner of the United States. We share a
      border, an economy, and a future. But friendship does not mean subordination.
      Mexico will make its own foreign policy decisions based on our own principles
      and our own interests. We have done so for a century, and we will continue to
      do so.' In Latin American forums: 'Our region has its own challenges — poverty,
      inequality, migration, violence. We cannot allow ourselves to be dragged into
      a conflict between nuclear powers that has nothing to do with our people's
      daily struggles. Latin America's role is to demand peace, not to choose sides
      in someone else's war.'
    key_relationships:
      allies: ["US (economic interdependence, USMCA — complicated by political friction)", "BR (Latin American coordination, CELAC)", "CO (Pacific Alliance, regional)", "CA (USMCA partner)"]
      rivals: ["None directly — Mexico avoids adversarial framing, but resists US pressure on foreign policy alignment"]
