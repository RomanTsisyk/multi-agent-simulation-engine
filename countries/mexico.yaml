      - "Sanctions on Russia that increase costs of fertilizers, energy, or basic goods for Mexico's working class — MORENA's base is economically vulnerable"
      - "Diversion of social program spending toward any security or foreign policy commitment related to the European crisis"
      - "Erosion of the constitutional principles of non-intervention that MORENA claims as part of Mexico's revolutionary heritage"
