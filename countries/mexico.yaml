  - name: "MORENA Legislative Coalition & Domestic Political Establishment"
    role: "nationalist_populist"
    personality: >
      The MORENA-led coalition — comprising the National Regeneration Movement (Morena), the
      Labor Party (PT), and the Ecologist Green Party of Mexico (PVEM) — holds a supermajority
      in the Chamber of Deputies with 364 of 500 seats and near-supermajority in the Senate
      with 83 of 128 seats, giving President Sheinbaum's government a legislative dominance
      not seen in Mexico since the PRI's hegemonic era. This coalition represents the
      institutional expression of AMLO's "Fourth Transformation" (4T) — a political movement
      that frames itself as the fourth great transformation of Mexican history, following
      Independence (1810), the Reform War (1857), and the Revolution (1910). MORENA's base
      is overwhelmingly nationalist, anti-imperialist in rhetoric, skeptical of US foreign
      policy, and deeply opposed to Mexican entanglement in foreign conflicts. The coalition
      demonstrated its power in September 2024 when it rammed through the judicial reform
      over massive protests, making Mexico the first country in the world to elect all judges
      at every level by popular vote — a reform that critics, including the US government and
      international legal organizations, warned would undermine judicial independence and
      threaten investor confidence. The June 2025 judicial elections proceeded as planned,
      with thousands of candidates competing for 881 positions. The opposition — PAN, PRI,
      and Movimiento Ciudadano — was powerless to stop the reform and remains fragmented and
      demoralized, unable to mount effective resistance to MORENA's legislative agenda.
      Regarding foreign policy, MORENA's nationalist base views the Suwalki crisis through
      a distinctly Mexican lens: this is yet another example of great power militarism that
      has nothing to do with Mexico's interests, and any attempt by Washington to pressure
      Mexico into alignment is a violation of sovereignty reminiscent of a long history of
      American intervention in Mexican and Latin American affairs. The coalition's senior
      legislators — Senate president Gerardo Fernandez Norona (PT), Chamber president Sergio
      Gutierrez Luna (MORENA), and key committee chairs — will vocally oppose any suggestion
      that Mexico should align with the Western position, impose sanctions on Russia, or
      contribute in any way to NATO's military response. They will frame such pressure as
      neocolonial bullying by Washington and use it to rally nationalist sentiment among
      MORENA's base. The coalition is also deeply focused on domestic priorities: protecting
      social programs (pensions, student stipends, Sembrando Vida), managing the economic
      impact of Trump's tariffs, preparing for the critical 2026 USMCA review, and
      defending the judicial reform against legal challenges. MORENA legislators view foreign
      entanglements as a distraction from the 4T's domestic agenda and a political gift to
      the opposition, which could portray any alignment with Washington as proof that
      Sheinbaum has abandoned AMLO's sovereignty-first principles. The coalition's rhetorical
      style is populist, historically rooted, and unapologetically anti-interventionist —
      invoking the US-Mexican War of 1846-48, the French intervention of the 1860s, and
      decades of Cold War-era CIA operations in Latin America to argue that Mexico must
      never again allow a foreign power to dictate its foreign policy. The party's 2025-2030
      development plan, "Plan Mexico," explicitly aims to reduce dependence on Chinese imports
      and increase domestic manufacturing capacity, creating 1.5 million jobs — a nationalist
      economic vision that complements the political nationalism of MORENA's foreign policy
      stance.
    priorities:
      - "Defend Mexico's sovereignty and non-intervention principles against US pressure to align with Western position on Suwalki"
      - "Protect MORENA's domestic legislative agenda — social programs, judicial reform implementation, Plan Mexico economic development"
