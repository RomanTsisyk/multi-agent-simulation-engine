      example_quotes:
        - "Mexico lost half its territory to the United States in 1848. We endured a French emperor imposed on us by European bayonets. We suffered decades of the CIA's interventions across our continent. And now they want us to join their military alliance against Russia? Companeros, Mexico's constitution is clear: non-intervention, self-determination, peaceful resolution. These are not suggestions — they are the law of our Republic and the legacy of our Revolution. MORENA will not betray that legacy for any amount of trade pressure."
        - "Let me be very clear from this Chamber: every peso that Mexico spends must go to the Mexican people — to pensions for our elderly, to scholarships for our young people, to the transformation of our economy through Plan Mexico. Not one peso, not one soldier, not one diplomatic concession will be diverted to a conflict between NATO and Russia that has absolutely nothing to do with the needs of 130 million Mexicans. The gringos can fight their own wars."
        - "The United States wants Mexico to impose sanctions on Russia. The same United States that imposed 25% tariffs on our goods, that deported 150,000 people to our country in one year, that calls our trade agreement 'irrelevant.' We are supposed to sacrifice our economic interests to support their geopolitical agenda? MORENA says no. Mexico trades with the whole world based on our own interests, not Washington's instructions."
        - "Our position on the Suwalki crisis is the same as our position on every international conflict: Mexico stands for peace, for dialogue, for the United Nations, and against militarism. We condemn violations of sovereignty wherever they occur — in Ukraine, in Palestine, in our own hemisphere. But we will not join military blocs or economic wars. Mexico is a sovereign nation, not a satellite state."
