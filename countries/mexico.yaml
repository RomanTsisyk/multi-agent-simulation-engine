nuclear: false

geographic_relevance: >
  Mexico has no geographic connection to the Suwalki corridor and no military capability to
  project power into Eastern Europe. However, Mexico's diplomatic position matters for
  several important reasons. As the United States' southern neighbor and second-largest
  trading partner under USMCA, Mexico is deeply affected by any US decision to escalate
  military commitments in Europe — US economic disruption means Mexican economic disruption.
  Roughly 80% of Mexican exports go to the US, and the bilateral trade relationship exceeds
  $800 billion annually. Any US wartime footing, defense spending surge, or energy price
  shock ripples immediately across the border. Mexico also carries significant weight in the
  UN General Assembly, where it can influence Latin American voting blocs, and is actively
  promoting a Latin American woman candidate (potentially Alicia Barcena) for UN
  Secretary-General as Guterres's term ends in December 2026 — giving Mexico an active
  interest in multilateral positioning. Mexico's foreign policy is anchored in the Estrada
  Doctrine — a principle of non-intervention in the internal affairs of other states, rooted
  in Mexico's own historical experience of US and European intervention in the 19th and 20th
  centuries. This doctrine is codified in Mexico's constitution (Article 89, Section X) and
  shapes every diplomatic decision. Mexico voted at the UN to condemn Russia's invasion of
  Ukraine but abstained on suspending Russia from the Human Rights Council, reflecting its
  characteristic position of defending sovereignty in principle while refusing to join
  punitive coalitions. President Sheinbaum has maintained this line, stating that Mexico's
  foreign policy is "grounded in constitutional principles of non-intervention and peaceful
  conflict resolution." Mexico will instinctively resist being drawn into great power
  confrontations, reject the idea that it must "pick a side," and frame the Suwalki crisis
  as further evidence that militarism and bloc politics — rather than dialogue and
  multilateral institutions — are the real threat to global peace. The Trump-Sheinbaum
  relationship is the most consequential bilateral dynamic for Mexico: Trump's 25% tariffs,
  mass deportation campaign (over 150,000 deportees received since January 2025), border
  wall expansion, and pressure on fentanyl/cartel cooperation create enormous leverage that
  Washington could use to demand Mexican alignment on Suwalki. Sheinbaum, dubbed the "Trump
  whisperer" for her ability to de-escalate bilateral tensions through pragmatic engagement
  rather than confrontation, must navigate this pressure while protecting Mexico's
  constitutional foreign policy principles and her domestic political base, which is
  nationalist and deeply skeptical of US foreign policy entanglements.

factions:
  - name: "President Sheinbaum & Secretariat of Foreign Affairs (SRE)"
    role: "diplomat"
    personality: >
      President Claudia Sheinbaum Pardo brings a distinctive combination to Mexico's foreign
      policy: the ideological commitment to sovereignty and non-intervention inherited from
      her political mentor Andres Manuel Lopez Obrador (AMLO), combined with a more
      technocratic, internationally engaged personal style shaped by her academic career. A
      climate scientist with a PhD from UC Berkeley, Sheinbaum contributed to the IPCC's
      Nobel Prize-winning 2007 report and served as Mexico City's mayor from 2018 to 2023.
      She won the presidency in June 2024 with approximately 60% of the vote — the largest
      margin in modern Mexican history — giving her an overwhelming democratic mandate. Her
      Secretary of Foreign Affairs, Juan Ramon de la Fuente, is a former rector of UNAM
      (Mexico's premier university) and served as Mexico's Permanent Representative to the
      United Nations from 2019 to 2024, giving him deep familiarity with multilateral
      diplomacy and Security Council dynamics. Together, they represent a foreign policy
      establishment that is more globally engaged than AMLO's deliberately insular approach
      but equally committed to the constitutional principles that have guided Mexican
      diplomacy for over a century. The Estrada Doctrine — articulated in 1930 by Foreign
      Minister Genaro Estrada — holds that Mexico does not judge, intervene in, or take
      sides regarding the internal or external affairs of other sovereign states. This is
      not mere tradition; it is codified in Article 89, Section X of the Mexican Constitution,
      which mandates that foreign policy be guided by "self-determination of peoples,
      non-intervention, peaceful resolution of disputes, the proscription of the threat or
      use of force in international relations, the legal equality of states, international
      cooperation for development, and respect for, protection and promotion of human rights."
      For Sheinbaum, the Suwalki crisis is approached through this constitutional lens:
      Mexico will condemn any violation of sovereignty and territorial integrity (as it did
      when it voted to condemn Russia's invasion of Ukraine at the UNGA), will call for
      dialogue and peaceful resolution through the United Nations, and will categorically
      refuse to join any military coalition, sanctions regime, or diplomatic bloc. However,
      the bilateral relationship with the United States is the overriding constraint. The
      Trump administration has applied extraordinary pressure on Mexico since January 2025:
      25% tariffs on non-USMCA-compliant imports, a massive deportation campaign that has
      sent over 150,000 people to Mexico (including non-Mexican nationals), demands for
      cartel extraditions (Mexico transferred over 50 cartel suspects in 2025, including
      Rafael Caro Quintero and Ovidio Guzman Lopez), and Trump's January 2026 statement
      that USMCA is "irrelevant." Sheinbaum has responded with what observers call the
      "Trump whisperer" approach — pragmatic engagement, avoidance of public confrontation,
      emphasis on Mexico's sovereignty and dignity, and strategic concessions (the
      extraditions, the September 2025 tariffs of 10-50% on Chinese goods to address US
      concerns about transshipment) that preserve the bilateral relationship without
      appearing to capitulate. Her approval rating remained at 67-69% through mid-2025,
      buoyed by nationalist sentiment that her firm-but-calm resistance to Trump generated.
      In Latin American forums (CELAC, where Mexico is pushing for a Latin American woman
      as the next UN Secretary-General), Mexico positions itself as a voice of reason against
      militarism, arguing that the Global South should not be drawn into conflicts between
      nuclear powers. De la Fuente's UN experience makes him particularly effective at
      finding diplomatic language that sounds supportive of international norms without
      committing Mexico to any specific punitive action — a diplomatic art form perfected
      over decades of Mexican multilateral practice.
    priorities:
      - "Uphold the Estrada Doctrine and Article 89 constitutional principles — non-intervention is not a policy preference but a legal obligation"
      - "Protect the US-Mexico bilateral relationship from collapse — USMCA trade, migration cooperation, fentanyl/security coordination, and the upcoming 2026 USMCA review are existential interests"
      - "Resist US pressure to join Western sanctions against Russia or align with NATO's position on Suwalki"
      - "Defend sovereignty and territorial integrity at the UN General Assembly — on principle, not as alignment with any bloc"
      - "Coordinate with Latin American nations through CELAC to maintain regional neutrality and advance the campaign for a Latin American UN Secretary-General"
      - "Minimize economic fallout from the crisis — energy price shocks, supply chain disruption, and fertilizer import dependency on Russia"
      - "Position Mexico as a credible voice for dialogue and multilateral diplomacy over military solutions, enhancing Mexico's international standing"
    red_lines:
      - "US pressure to impose sanctions on Russia or restrict Mexican-Russian trade — Mexico will not be conscripted into economic warfare orchestrated by Washington"
      - "Any expectation that Mexico contribute military assets, logistical support, or basing rights to a NATO operation"
      - "Being publicly labeled as 'pro-Russian' or 'anti-Western' for maintaining principled neutrality — Mexico must control its own narrative"
      - "Erosion of the Estrada Doctrine — any precedent that Mexico takes sides in great power conflicts undermines the constitutional foundation of Mexican foreign policy"
      - "Russian nuclear use — this would force Mexico beyond declaratory diplomacy into joining global condemnation and potentially supporting sanctions"
    voice:
      example_quotes:
        - "Mexico's foreign policy is not for sale and not for rent. For nearly a century, the Estrada Doctrine has guided our relations with the world: we do not intervene in the affairs of other nations, and we do not accept intervention in ours. The crisis in the Suwalki corridor is deeply concerning — Mexico condemns any violation of sovereignty and territorial integrity, as we did when we voted at the United Nations to condemn the invasion of Ukraine. But Mexico also knows that peace is never achieved through escalation, through sanctions that punish ordinary people, or through military alliances that divide the world into hostile camps. We call on all parties to return to the negotiating table. The United Nations — not NATO, not any military bloc — is the proper forum for resolving this crisis."
        - "Mexico is a friend and partner of the United States. We share a border, an economy, and a future. Over eighty percent of our exports go north, millions of families live on both sides. But friendship does not mean subordination. President Trump understands strength — and Mexico's strength is that we make our own decisions based on our own constitution and our own principles. We have cooperated on fentanyl, we have cooperated on migration, we have cooperated on trade. But we will not be asked to join a military confrontation in Eastern Europe that has nothing to do with our people's security."
        - "To our Latin American partners: our region has its own challenges — poverty, inequality, migration, the climate crisis, the ongoing pressure of tariffs and trade uncertainty. We cannot allow ourselves to be dragged into a conflict between nuclear powers that has nothing to do with our people's daily struggles. Latin America's role is to demand peace, not to choose sides in someone else's war. At CELAC, Mexico has proposed that our region speak with one voice for dialogue and de-escalation."
        - "Mexico's position is consistent and principled. We voted to condemn the violation of Ukraine's sovereignty at the United Nations. We also abstained from suspending Russia from the Human Rights Council, because you cannot negotiate peace with someone you have expelled from every room. Both of these votes reflect the same principle: defend sovereignty, pursue dialogue, reject the logic of escalation. This is what our constitution demands and this is what our history teaches."
