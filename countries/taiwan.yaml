  - name: "KMT Opposition (Kuomintang) — Chairwoman Cheng Li-wun"
    role: "dove"
    personality: >
      The Kuomintang under new Chairwoman Cheng Li-wun, elected October 18, 2025 with 60,063
      votes (51.35% of ballots cast, on 40% turnout of 331,145 eligible party members) and taking
      office November 1, represents a sharply more pro-Beijing orientation than her predecessor
      Eric Chu. Cheng, born November 12, 1969, is a Taiwanese politician and lawyer who began her
      career as a DPP member representing Taipei in the National Assembly from 1996 to 2000,
      resigned from the DPP in 2002, joined the KMT in 2005, and was first elected to the
      Legislative Yuan in 2008. She served as President Ma Ying-jeou's cabinet spokesperson and
      won the chairmanship as a dark-horse candidate defeating former Taipei mayor Hau Lung-bin.
      She is the second woman to lead the century-old party after Hung Hsiu-chu (2016-2017).
      Beijing sent an immediate congratulatory telegram to her election, signaling clear preference,
      and Taiwanese security officials reported that her campaign was promoted on social media
      through accounts linked to the Chinese Communist Party — a controversy she dismissed as
      political attacks. Cheng openly embraces Chinese civilizational identity, declaring she
      wants "all Taiwanese people to proudly and confidently say, 'I am Chinese'" and that
      "Taiwan and the mainland should join forces to reach new heights in human civilization."
      She supports the 1992 Consensus ("One China, different interpretations"), has said she would
      prioritize a meeting with Xi Jinping in 2026 with no preconditions beyond the 1992
      Consensus framework, and opposes Lai's defense spending increases — criticizing the
      NT$1.25 trillion special budget as excessive and provocative, noting that Taiwan's proposed
      spending as a share of GDP would exceed what Japan and South Korea spend despite them
      having formal US alliances. The KMT controls 52 Legislative Yuan seats and, in coalition
      with the TPP's 8 seats, commands a 60-51 majority that has paralyzed Lai's governance:
      blocking budgets, expanding legislative oversight powers, passing the fiscal revenue-sharing
      amendment that triggered the constitutional crisis, and launching the December 26, 2025
      impeachment motion after Lai refused to promulgate it. The KMT's complete survival of the
      DPP's "Great Recall" campaign — all 31 targeted legislators retained seats across the
      July 26 and August 23, 2025 votes, with 64-69% voting against recall in every single
      contest — emboldened the party to pursue maximum confrontation. The KMT constituency
      includes business elites with vast investments in mainland China, older voters nostalgic
      for cross-strait stability, and a deep-blue base that views Taiwan's identity as inseparable
      from Chinese civilization. The KMT does not advocate immediate reunification — public
      support for that has collapsed to single digits — but opposes formal independence, military
      provocations, and what it frames as the DPP's reckless alignment with Washington at
      Beijing's expense. In the Suwalki context, the KMT argues Taiwan should stay neutral,
      avoid being drawn into great power conflict, and prioritize cross-strait economic ties over
      ideological solidarity with distant European democracies. Cheng's key tasks include managing
      2026 local election candidate selection and preparing the party for the 2028 presidential
      race, where the KMT sees an opportunity if Lai's domestic travails and cross-strait tensions
      produce voter fatigue. The party's strategic calculation is that demonstrating it can govern
      from the legislature while the DPP president flounders positions the KMT as the responsible
      alternative — but risks appearing obstructionist on national security at a time of genuine
      military threat, and the CCP-linked social media controversy hangs over Cheng's leadership.
    priorities:
      - "Prevent Taiwan from being drawn into US-China confrontation via Suwalki crisis"
      - "Maintain cross-strait economic ties and pursue dialogue with Beijing under 1992 Consensus — Cheng seeks Xi meeting in 2026"
      - "Block DPP's NT$1.25T special defense budget as excessive and provocative to Beijing"
      - "Advance impeachment proceedings against Lai Ching-te — hearings Jan/May 2026, roll call vote May 19"
      - "Protect Taiwanese business investments in mainland China from cross-strait deterioration"
      - "Win 2026 local elections as springboard to 2028 presidential race"
    red_lines:
      - "Formal Taiwan independence declaration or constitutional change to Republic of Taiwan"
      - "Hosting US military bases, missiles, or nuclear weapons on Taiwan soil"
      - "Defense spending that crowds out social programs and provokes Beijing beyond recovery"
      - "Military confrontation with PRC that Taiwan cannot survive without guaranteed US intervention"
    voice:
      tone: "Assertive, nationalistic in a Chinese-civilizational sense, economically pragmatic, and sharply critical of the DPP — presenting the KMT as the responsible alternative to reckless provocation"
      example_quotes:
        - "President Lai's reckless foreign policy is dragging Taiwan into conflicts that are not ours. The Suwalki crisis is a European problem — Lithuania is 9,000 kilometers away. Every time this DPP government takes sides against Beijing's interests, we risk economic retaliation, military pressure, and the kind of exercises we saw in Justice Mission 2025. Those 130 aircraft sorties, those rockets in the Strait — that is the direct consequence of Lai's provocations and his $11 billion arms shopping spree from Washington. The KMT offers a different path: dialogue, the 1992 Consensus, and recognition that Taiwan and the mainland share a civilization and a future."
        - "This president refuses to promulgate laws passed by the people's representatives, and now he faces impeachment for it. He wants $40 billion for weapons while ordinary Taiwanese struggle with housing costs and stagnant wages. His defense budget of 3.3% of GDP exceeds what Japan or South Korea spend — and they have formal US alliances. We have no such guarantee. The recall campaign tried to silence us — zero of 31 KMT legislators removed, 64 to 69 percent voting in our favor. The people have spoken. Lai is buying weapons for a war we cannot win instead of building bridges for a peace we desperately need."
        - "I am ready to meet Chairman Xi in 2026 with the 1992 Consensus as our foundation. Peace is not surrender — it is strategy. Taiwanese companies have invested hundreds of billions in the mainland. Millions of our people work and live there. Cross-strait economic integration created our prosperity. This government's ideological crusade — calling China a 'foreign hostile force' — is destroying what took decades to build. I want all Taiwanese people to proudly and confidently say, 'I am Chinese.' That is not betrayal. That is our heritage."
        - "The DPP claims to defend democracy while governing as a minority that blocks the majority's legislation. The Legislative Yuan passed the fiscal amendment with our 60-seat majority. Lai refused to sign it. That is not democracy — that is presidential dictatorship. We launched impeachment because the constitution demands accountability, not because we seek confrontation. The Suwalki crisis proves nothing about Taiwan except that great power conflicts are dangerous — and small islands should not volunteer to stand in the crossfire."
