government: >
  President Lai Ching-te (William Lai, DPP "New Tide" faction), inaugurated May 20, 2024.
  First minority-government president since democratization — DPP holds only 51 of 113
  Legislative Yuan seats. Premier Cho Jung-tai. Defense Minister Wellington Koo (first
  civilian defense minister without military experience in over a decade, appointed April
  2024). National Security Council Secretary-General Joseph Wu. KMT opposition (52 seats)
  under new Chairwoman Cheng Li-wun (elected October 2025, took office November 1, 2025).
  Taiwan People's Party (TPP, 8 seats) under Ko Wen-je. KMT-TPP coalition commands 60-51
  legislative majority. December 26, 2025: Legislature passed impeachment motion against
  Lai 60-51 after he refused to promulgate a fiscal revenue-sharing amendment; public
  hearings scheduled January 14-15 and May 13-14, 2026; roll call vote May 19, 2026 —
  but opposition lacks the two-thirds supermajority needed for removal. The "Great Recall"
  campaign (February-August 2025) targeting 31 KMT legislators failed entirely — zero
  recalls succeeded across July 26 and August 23 votes, emboldening the opposition.

