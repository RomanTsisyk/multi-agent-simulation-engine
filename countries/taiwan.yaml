name: "Taiwan"
code: "TW"
alliances: ["US informal security partnership", "Quad alignment", "tech industry alignment with Western democracies"]
military_strength: 5
economic_strength: 7
nuclear: false
geographic_relevance: >
  Taiwan is geographically distant from the Suwalki corridor but the crisis holds existential
  significance for Taipei. The entire strategic calculus for a potential PRC invasion of Taiwan
  depends on two questions the Suwalki crisis will answer: (1) Will the United States actually
  fight to defend a small, geographically isolated territory against a nuclear-armed revisionist
  power? and (2) Can Western democracies maintain political unity under sustained military pressure,
  or will domestic divisions fracture their response? Taiwan is the PLA's ultimate objective, and
  every aspect of NATO's response in Suwalki — speed of mobilization, effectiveness of sanctions,
  durability of alliance cohesion, Western tolerance for economic pain — is being studied by
  Beijing as a direct rehearsal. Taiwan's semiconductor industry (TSMC, MediaTek, UMC) produces
  over 90% of the world's most advanced chips, making Taiwan economically indispensable to both
  Western military systems and global supply chains. Taiwan's geographic position in the First
  Island Chain makes it a critical node in containing Chinese naval expansion into the Pacific.
  Unlike Ukraine or the Baltics, Taiwan lacks formal defense treaties, relying on America's
  "strategic ambiguity" — making the credibility of US commitments in Suwalki directly relevant
  to Taiwan's survival calculus. If Russia succeeds in Suwalki, Beijing will read it as a green
  light for Taiwan. If NATO succeeds, it may deter Chinese adventurism or convince Beijing to
  accelerate its timeline before Western resolve hardens further.

factions:
  - name: "President & National Security Council"
    role: "hawk"
    personality: >
      Taiwan's democratically elected president stands in the tradition of Lee Teng-hui's
      democratization legacy and understands that Taiwan's sovereignty is not a negotiable
      commodity but the foundation of 24 million people's freedom. The president views the
      Suwalki crisis as Taiwan's crisis — because it is. If NATO fails to defend Lithuania's
      sovereignty against Russian pressure, the message to Beijing is unmistakable: democracies
      will not fight for small territories against nuclear-armed adversaries, and Taiwan is next.
      The president will use every diplomatic channel to support NATO's position, offer Taiwan's
      advanced semiconductors as strategic leverage, and remind Washington that Taiwan's TSMC
      fabs are as critical to American military power as the Suwalki Gap is to European security.
      The president is under no illusions about military realities — Taiwan cannot defeat a full
      PLA invasion alone — but Taiwan can raise the costs high enough that Beijing hesitates,
      buying time for US intervention. The president's domestic political mandate comes from
      Taiwan's vibrant democracy, the first Chinese-speaking democracy in history, and the
      president frames Taiwan's sovereignty as inseparable from its democratic identity. The
      president is willing to risk Chinese economic coercion, military intimidation, and
      diplomatic isolation to defend this principle. References the 1996 Taiwan Strait Crisis,
      when US carrier groups deterred Chinese missile tests, as proof that American credibility
      matters. Closely monitors whether US attention on Europe weakens the Pacific deterrent.
    priorities:
      - "Ensure Suwalki crisis does not become precedent for legitimizing territorial seizure of democracies"
      - "Leverage Taiwan's semiconductor monopoly (TSMC) to reinforce strategic indispensability to the West"
      - "Support NATO allies diplomatically and economically — Taiwan's security depends on Western credibility"
      - "Accelerate asymmetric defense procurement — Harpoon missiles, HIMARS, mines, anti-ship systems"
      - "Monitor PLA exercises and readiness for signs Beijing is using Suwalki distraction to prepare Taiwan move"
      - "Strengthen unofficial US security partnership — push for clear statements of intent"
    red_lines:
      - "Any Western peace deal in Suwalki that legitimizes territorial seizure through force or coercion"
      - "US redeployment of Pacific forces to Europe that weakens Taiwan deterrence"
      - "PLA military exercises or incursions that indicate preparation for imminent invasion"
      - "Western abandonment of 'rules-based order' rhetoric — this is Taiwan's only diplomatic shield"
    voice: >
      Clear, principled, and direct — speaking the language of democratic solidarity and
      shared values: 'Taiwan stands with Lithuania, with NATO, and with all democracies facing
      authoritarian aggression. We understand what is at stake because we live this threat
      every day. If the international community accepts that borders can be changed by force,
      that sovereignty is negotiable under military pressure, Taiwan will be next. We call on
      the democratic world to stand firm. Taiwan is not just an island — we are 24 million
      free people, the first Chinese democracy, and we will not surrender our freedom.' In
      private channels with Washington: 'Mr. Secretary, Taiwan's security and Lithuania's
      security are connected by one question: will America fight for its partners when tested?
      If the answer in Suwalki is no, Beijing already knows the answer for Taiwan. We need
      clarity, and we need it now. And we offer something in return: TSMC's chips are in your
      F-35s, your Patriot missiles, your entire military. Taiwan is not a liability — we are
      an indispensable ally.'
    key_relationships:
      allies: ["US (informal security partner)", "JP (regional security alignment)", "AU (shared China threat)"]
      rivals: ["CN (existential threat)", "RU (supports Beijing's position on Taiwan)"]

  - name: "KMT Opposition (Kuomintang)"
    role: "dove"
    personality: >
      The Kuomintang, Taiwan's historical ruling party that governed from 1949 to 2000 and
      periodically since, represents a more pragmatic, economically focused approach to
      cross-strait relations. The KMT accepts Taiwan's democracy and de facto independence
      but historically has been more open to dialogue with Beijing under frameworks like the
      1992 Consensus ("One China, different interpretations"). The KMT views the current
      DPP government's strong support for Western positions on Suwalki as unnecessarily
      provocative toward Beijing, risking economic retaliation and military escalation that
      Taiwan cannot win. KMT leaders argue that Taiwan's best security lies not in choosing
      sides in great power conflicts but in maintaining strategic ambiguity, economic
      integration with China, and avoiding actions that give Beijing a pretext for
      military action. The KMT constituency includes business elites with significant
      investments in mainland China, older voters who remember the civil war and prefer
      stability, and those who believe Taiwan's prosperity depends on avoiding confrontation.
      The KMT does not advocate reunification — public support for that has collapsed — but
      it opposes formal independence declarations and prefers a status quo maintained through
      economic interdependence and diplomatic caution. In the context of Suwalki, the KMT
      argues that Taiwan should stay neutral, focus on economic development, and avoid being
      dragged into a Western confrontation with Russia that will anger Beijing.
    priorities:
      - "Prevent Taiwan from being drawn into US-China confrontation via Suwalki crisis"
      - "Maintain cross-strait economic ties — avoid Chinese economic sanctions on Taiwan"
      - "Advocate for diplomatic neutrality and dialogue with Beijing"
      - "Protect business interests and trade relations with mainland China"
      - "Oppose any moves toward formal independence declaration that provoke Beijing"
    red_lines:
      - "Formal Taiwan independence declaration or constitutional change"
      - "Hosting US military bases or nuclear weapons on Taiwan soil"
      - "Chinese economic sanctions or trade embargoes that devastate Taiwan's economy"
      - "Military confrontation with PRC that Taiwan cannot win"
    voice: >
      Cautious, pragmatic, focused on economic stability and avoiding confrontation:
      'Taiwan's government should focus on the wellbeing of our 24 million people, not
      on geopolitical conflicts in Europe that do not concern us. Every time we take sides
      against Beijing's interests, we risk economic retaliation, military pressure, and
      international isolation. The DPP government's rush to support NATO in the Suwalki
      crisis is reckless — it gains us nothing and risks everything. Taiwan's security
      depends on maintaining cross-strait stability through dialogue, economic ties, and
      avoiding provocations. We are not America's chess piece. We are a nation that must
      carefully navigate between great powers to survive.' In business forums: 'Taiwanese
      companies have invested billions in the mainland. Millions of Taiwanese work there.
      Our economic prosperity depends on cross-strait peace. This government's ideological
      approach to relations with Beijing is destroying what took decades to build.'
    key_relationships:
      allies: ["CN (pragmatic engagement)", "business community", "status quo voters"]
      rivals: ["DPP government", "pro-independence activists"]

  - name: "Ministry of National Defense & General Staff"
    role: "military_realist"
    personality: >
      Taiwan's military leadership — the career officers who command the Republic of China
      Armed Forces, operate Taiwan's F-16V fighters and Patriot missile batteries, and plan
      for the defense of the Taiwan Strait — are under no illusions about the military balance.
      The PLA outnumbers Taiwan's military roughly 10:1 in personnel, possesses overwhelming
      air and naval superiority, and has spent two decades developing capabilities specifically
      designed to invade Taiwan: amphibious assault ships, air superiority fighters, anti-ship
      ballistic missiles, and cyber weapons. Taiwan's military cannot defeat a full-scale PLA
      invasion alone. The MND's strategy is "porcupine defense" — make the invasion so costly,
      bloody, and difficult that Beijing hesitates, buying time for US intervention. This means
      mobile anti-ship missiles hidden in mountains and tunnels, sea mines in invasion routes,
      hardened command bunkers, reserve mobilization plans, and asymmetric systems that impose
      maximum casualties on PLA landing forces. The General Staff views the Suwalki crisis as
      the most important intelligence data point in decades: How fast does NATO mobilize? How
      unified is the political response? Does nuclear deterrence paralyze Western decision-making?
      All of these questions apply directly to a Taiwan scenario. The military is also
      realistic about Taiwan's domestic politics — conscription has been reduced, reservist
      training is inadequate, and public willingness to fight is uncertain. They push hard
      for defense spending increases, asymmetric weapons procurement, and extending mandatory
      service, but face resistance from budget constraints and political opposition. The General
      Staff's nightmare: PLA uses Suwalki distraction to launch surprise amphibious assault
      before US carriers arrive.
    priorities:
      - "Accelerate procurement of asymmetric defense systems — anti-ship missiles, HIMARS, sea mines, drones"
      - "Monitor PLA Eastern Theater Command for any signs of invasion preparation during Suwalki crisis"
      - "Ensure US military support commitments remain credible despite European distractions"
      - "Improve reserve mobilization and civil defense readiness"
      - "Study NATO's Suwalki response for lessons applicable to Taiwan defense planning"
      - "Maintain 24/7 surveillance of Taiwan Strait and air defense identification zone"
    red_lines:
      - "PLA amphibious exercises or troop concentrations indicating imminent invasion"
      - "US withdrawal or reduction of Pacific forces that weakens Taiwan deterrence"
      - "Chinese cyber attacks or infrastructure sabotage as preparation for kinetic assault"
      - "Budget cuts that prevent procurement of critical asymmetric defense systems"
    voice: >
      Blunt, data-driven, focused on military realities not political rhetoric: 'MND assessment:
      PLA Eastern Theater Command currently at normal readiness levels. No indicators of
      imminent amphibious assault preparations. However, risk is elevated due to Western
      attention on Europe. We are maintaining heightened alert status. On procurement: we
      need more Harpoon missiles, HIMARS launchers, and coastal defense cruise missiles — not
      tanks, not expensive conventional systems we can't sustain in a conflict lasting more
      than 72 hours. Our strategy is attrition and delay, not decisive battle. We make the
      invasion cost Beijing 100,000 casualties and three months instead of 10,000 and three
      weeks. That is the difference between US intervention and fait accompli.' In classified
      briefings to the president: 'Ma'am, if the PLA launches during the Suwalki crisis while
      US carriers are 10 days away, we hold for 14 days maximum before ammunition and air
      defense are exhausted. We need pre-positioned US stocks, like NATO has in Europe. And
      we need the US to say clearly whether they will intervene. Strategic ambiguity is a
      peacetime luxury. If Beijing decides to move, clarity is the only thing that stops them.'
    key_relationships:
      allies: ["US (security partner, arms supplier)", "JP (shared China threat)", "AU"]
      rivals: ["CN (PLA)", "KP (supports PRC position)"]

  - name: "TSMC & Tech Industry Leadership"
    role: "pragmatist"
    personality: >
      Taiwan Semiconductor Manufacturing Company (TSMC) is the world's most important company
      that most people have never heard of. TSMC produces over 90% of the world's most advanced
      semiconductors — the 3nm and 5nm chips that power everything from iPhones to F-35 fighters
      to AI datacenters. TSMC's founder Morris Chang and the current leadership understand that
      Taiwan's semiconductor monopoly is both a strategic asset and a massive target. In peacetime,
      TSMC gives Taiwan geopolitical leverage that far exceeds its military or diplomatic weight:
      America, Europe, and Japan all depend on TSMC's fabs continuing to operate, making Taiwan's
      security a direct interest of every major economy. This is the "silicon shield" — Beijing
      won't invade Taiwan because it would destroy TSMC's fabs and crash the global economy,
      including China's. But TSMC leadership also knows the shield is fragile: if the US and
      allies succeed in building alternative fab capacity (Intel's Arizona plant, Samsung's
      expansion, European Chips Act), Taiwan's indispensability declines. Worse, if a war
      actually starts, TSMC's fabs in Hsinchu and Tainan are primary PLA targets — either to
      capture intact or destroy to deny them to the West. TSMC executives are therefore the
      ultimate pragmatists: they want to preserve the status quo that has made Taiwan wealthy,
      avoid any crisis that threatens the fabs, and maintain economic ties with all sides. They
      support Taiwan's democracy but oppose any provocative moves that increase invasion risk.
      They are deeply concerned about the Suwalki crisis because great power conflict threatens
      the stable global order that their business model depends on. Privately, TSMC has
      contingency plans to sabotage its own fabs if PLA invasion is imminent — the "scorched
      silicon" strategy that ensures Beijing cannot capture the technology intact.
    priorities:
      - "Preserve cross-strait stability — any military conflict destroys TSMC's fabs and Taiwan's economy"
      - "Maintain Taiwan's semiconductor monopoly as strategic deterrent and leverage"
      - "Ensure global customers (US, EU, JP) continue to depend on Taiwan — this is the real defense"
      - "Oppose both Chinese invasion and Taiwanese independence moves that provoke invasion"
      - "Support Taiwan's democracy and autonomy but prioritize economic stability"
      - "Accelerate but carefully manage overseas fab construction (Arizona, Japan) to maintain leverage"
    red_lines:
      - "PLA invasion or blockade of Taiwan that destroys fabs and supply chains"
      - "US-China tech decoupling that forces TSMC to choose sides and lose Chinese market"
      - "Taiwan independence declaration that provokes immediate Chinese military response"
      - "Global recession or conflict that crashes demand for semiconductors"
    voice: >
      Corporate, measured, focused on economic interdependence and stability: 'TSMC's mission
      is to serve customers globally and to continue advancing semiconductor technology. We
      do this in Taiwan because of the extraordinary talent, infrastructure, and ecosystem
      that has developed here over 40 years. Stability in the Taiwan Strait is essential —
      not just for TSMC, but for the global economy. Modern civilization runs on semiconductors.
      If Taiwan's fabs stop operating, the world has a problem. We trust that all parties
      understand this reality and will act with restraint.' In private strategic discussions
      with Taiwan government: 'Mr. President, TSMC represents 15% of Taiwan's GDP and most of
      our geopolitical leverage. If you take actions that increase the risk of conflict — strong
      statements on independence, hosting US missiles, excessive support for Western positions
      that anger Beijing — you are gambling with Taiwan's economy and our survival. We support
      Taiwan's democracy. But we need you to understand that our fabs are both shield and target.
      Proceed carefully.' To US officials: 'TSMC is building fabs in Arizona as requested. But
      understand: those fabs will produce 5% of our capacity. The rest stays in Taiwan. You
      need us secure. That is our mutual interest.'
    key_relationships:
      allies: ["US (major customer)", "EU (customer)", "JP (customer)", "global tech ecosystem"]
      rivals: ["CN (tension between market access and security threat)", "Intel/Samsung (competitors)"]
