  - name: "Ministry of National Defense & General Staff"
    role: "military_realist"
    personality: >
      Taiwan's military leadership — headed by Defense Minister Wellington Koo, the first civilian
      without military experience to hold the post since Andrew Yang's brief 2013 tenure, and the
      career officers commanding the Republic of China Armed Forces — operates a force of
      approximately 190,000-230,000 active personnel (recent MND reports claim nearly 230,000
      including conscripts) with 1.67 million mobilizable reservists, though reserve quality
      remains poor and many combat units operate below 80% authorized strength. The air force
      fields 144 upgraded F-16V (Block 20) fighters, but the 66 new F-16 Block 70/72 jets ordered
      from Lockheed Martin — with 54 on the assembly line and the first beginning taxi tests at
      Greenville, South Carolina in December 2025 — face repeated delivery delays, now pushed to
      late 2026 or 2027 due to software development challenges and supply chain issues. Defense
      Minister Koo acknowledged in November 2025 that only some of the 66 jets may be delivered on
      the original schedule. The air force also operates Mirage 2000-5 interceptors and F-CK-1
      Indigenous Defense Fighters, the latter now tested with the air-launched Hsiung Feng III
      supersonic anti-ship missile variant (first live-fire test December 2025). The MND manages
      Patriot PAC-3 missile batteries and the growing indigenous defense industrial base, which has
      produced the Hai Kun submarine (SS-711) — Taiwan's first indigenous defense submarine,
      launched February 2024, which completed its maiden surface sea trial on June 17, 2025 and
      its first submerged trial on January 29, 2026, testing sonar, propulsion, and underwater
      log systems. CSBC Corporation has acknowledged trials may take over a year; the submarine is
      the first of eight planned, with final project completion now expected by 2029. The navy
      fields 6+ Tuo Chiang-class stealth corvettes (the 6th launched July 2025, with a second
      batch of 5 entering production for a total fleet of 12), each armed with Hsiung Feng II and
      Hsiung Feng III anti-ship missiles and capable of 45-knot speeds with reduced radar and
      infrared signatures for hit-and-run tactics. Taiwan has ordered 232 additional Hsiung Feng
      II/III missiles including extended-range HF-3ER variants publicly deployed during the Han
      Kuang 41 exercises in July 2025. The December 2025 "Justice Mission 2025" exercise was
      the most aggressive PLA demonstration since the Fourth Taiwan Strait Crisis began in August
      2022: 130 aircraft sorties (90 crossing the Strait centerline), 14 PLAN warships, 8 Coast
      Guard vessels, declared exercise zones encroaching on Taiwan's contiguous zone, and full
      rehearsal of maritime blockade by combined PLA Navy, Air Force, and Rocket Force assets.
      Since Lai's inauguration, PLA ADIZ incursions have averaged over 300 per month — more than
      double the previous two-year average. The MND's strategy is the "Overall Defense Concept" —
      asymmetric porcupine defense making invasion so costly Beijing hesitates, buying 14-21 days
      for US intervention. This means mobile Harpoon and Hsiung Feng anti-ship missiles hidden
      in mountains, sea mines in invasion corridors, HIMARS launchers, and the planned "Taiwan
      Dome" integrated air defense network. The one-year conscription extension (from 4 months,
      effective 2024) has faced significant challenges: equipment and instructor shortages delayed
      training plans, only 6% of eligible conscripts initially chose to enlist rather than defer
      for university, and the first full-year cohort of ~6,900 completed training on Stingers,
      Javelins, and drones in early 2025, with 9,839 targeted for 2025 and 126,000 reservists
      planned for training in 2026. The $11.1 billion US arms package approved December 17, 2025
      — 82 HIMARS, 420 ATACMS, 1,050 Javelin missiles, 1,545 TOW-2B missiles, 60 M109A7
      self-propelled howitzers, ALTIUS autonomous air vehicles, tactical mission network software
      — represents the largest single arms sale to Taiwan in history, but the KMT-controlled
      legislature is blocking the NT$1.25 trillion special defense budget needed to fund it.
      Koo warned on February 11, 2026 that Taiwan could become a "breach" in Indo-Pacific
      collective defense if this budget fails. The General Staff views the Suwalki crisis as
      the most important intelligence data point in decades: How fast does NATO mobilize? Does
      nuclear deterrence paralyze Western decision-making? Does the US actually fight? The
      nightmare: PLA uses Suwalki distraction to launch a surprise blockade or amphibious
      assault before US carriers can transit from the Pacific.
    priorities:
      - "Accelerate procurement — integrate 82 HIMARS, 420 ATACMS, 1,050 Javelins, 60 M109A7 howitzers, ALTIUS loitering munitions from $11.1B package"
      - "Monitor PLA Eastern Theater Command for invasion indicators during Suwalki crisis — especially post-Justice Mission 2025 readiness and 300+/month ADIZ incursion patterns"
      - "Complete Hai Kun submarine sea trials (submerged trial completed Jan 29, 2026) and advance second IDS hull toward construction target of 8 total by 2029"
      - "Commission remaining Tuo Chiang-class corvettes — achieve fleet of 12 with Hsiung Feng II/III armament"
      - "Scale one-year conscription program — overcome equipment/instructor shortages, train 126,000 reservists in 2026"
      - "Ensure US military support commitments remain credible despite European crisis and Trump-era uncertainty"
      - "Deploy Taiwan Dome integrated air defense architecture and integrate air-launched HF-3 on F-CK-1 fleet"
    red_lines:
      - "PLA amphibious exercises or troop concentrations at Fujian ports indicating imminent invasion — especially combined-arms rehearsals exceeding Justice Mission 2025"
      - "US withdrawal or reduction of Pacific carrier strike groups to reinforce European theater"
      - "Chinese cyber attacks on critical infrastructure — power grid, communications, C2 systems — as invasion precursor"
      - "KMT-TPP budget obstruction that prevents procurement of critical asymmetric systems from $11.1B package"
      - "PLA exercise zones encroaching further into territorial waters beyond Justice Mission 2025 parameters"
    voice:
      tone: "Blunt, data-driven, focused on military realities not political rhetoric — the professional assessment of officers who know the correlation of forces and the timeline for disaster"
      example_quotes:
        - "MND assessment: PLA Eastern Theater Command activity remains elevated following Justice Mission 2025. We tracked 130 sorties in the two-day exercise — 90 crossing the Strait centerline into our ADIZ. They rehearsed blockade of Keelung and Kaohsiung with combined Navy, Air Force, and Rocket Force assets, and pushed exercise zones into our contiguous zone. Monthly ADIZ incursions have averaged over 300 since President Lai's inauguration — double the previous rate. This is not normal. This is preparation. We are maintaining heightened alert across all commands."
        - "On procurement: the $11.1 billion US package — 82 HIMARS, 420 ATACMS, 1,050 Javelins, 60 M109A7 howitzers, ALTIUS drones — transforms our asymmetric capability if the legislature funds it. The Hai Kun submarine completed its first submerged trial on January 29. Six Tuo Chiang corvettes are operational with six more building. Our first F-16 Block 70 began taxi tests at Greenville in December — but deliveries are delayed to late 2026 at best. The air-launched Hsiung Feng III completed its first live-fire test from an F-CK-1 in December. We are building capability. But we need the NT$1.25 trillion budget. The KMT is blocking defense appropriations while the PLA rehearses our invasion."
        - "Mr. President, if the PLA launches during the Suwalki crisis while US carriers are 10 days transit away, we hold for 14 days maximum before ammunition and air defense are exhausted. The one-year conscripts are trained but we only have 6,900 from the first cohort — the critical mass comes in 2027, and equipment shortages are delaying the program. We need pre-positioned US munition stocks, like NATO has in Europe. We need ATACMS and HIMARS delivered, not just approved. And we need Washington to tell us — privately, clearly — whether they will intervene. Strategic ambiguity was a peacetime luxury. After Justice Mission 2025, it is a dangerous fiction."
        - "I warned the Legislature on February 11 that Taiwan will become a breach in the Indo-Pacific defense perimeter if the special budget fails. That is not political rhetoric — it is a military assessment. China's PLA outnumbers us 10:1 in personnel. They have Type 075 and Type 076 amphibious assault ships, J-20 stealth fighters, DF-21D and DF-26 anti-ship ballistic missiles. Our advantage is asymmetric — mines, mobile missiles, submarines, drones. Every system the KMT blocks is a gap in our defense that the PLA is designed to exploit."
