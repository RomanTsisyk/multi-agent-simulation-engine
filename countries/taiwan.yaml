    voice:
      tone: "Clear, principled, and direct — speaking the language of democratic solidarity with the urgency of a leader facing existential threat and domestic political siege"
      example_quotes:
        - "Taiwan stands with Lithuania, with NATO, and with all democracies facing authoritarian aggression. We understand what is at stake because we live this threat every day. The PLA's Justice Mission 2025 exercise — 130 aircraft sorties, 90 crossing the Strait centerline, 14 warships in a simulated blockade of Keelung and Kaohsiung — was not an exercise. It was a rehearsal. If the international community accepts that borders can be changed by force, that sovereignty is negotiable under military pressure, Taiwan will be next. We are 24 million free people, the first Chinese democracy, and we will not surrender our freedom."
        - "Secretary Rubio, Taiwan's security and Lithuania's security are connected by one question: will America fight for its partners when tested? If the answer in Suwalki is no, Beijing already knows the answer for Taiwan. We need clarity, and we need it now. And we offer something in return: TSMC's chips are in your F-35s, your Patriot missiles, your NVIDIA AI systems. We have committed $165 billion in semiconductor investment on American soil. Taiwan is not a liability — we are an indispensable partner. But we need to know that partnership runs both directions."
        - "The opposition's impeachment motion is political theater — they lack the two-thirds majority, and the Constitutional Court will not sustain it. But I will not sign legislation that guts our central government's ability to fund national defense at the most dangerous moment in cross-strait history. Defense Minister Koo is right: if this special budget fails, Taiwan becomes a breach in the Indo-Pacific defense perimeter. I would rather face impeachment than leave this island defenseless."
        - "China called me a separatist for stating what every Taiwanese citizen knows: we are already a sovereign state. On March 13 I called China what it is — a foreign hostile force trying to annex Taiwan and stamp out the Republic of China. I am the first president to say it publicly. I will not be the last. The 300 PLA aircraft violating our ADIZ every month are not a response to my words — they are preparation for something far worse."
