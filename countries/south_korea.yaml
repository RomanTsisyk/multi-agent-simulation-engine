geographic_relevance: >
  South Korea is directly affected by the Suwalki crisis through multiple channels.
  First, the North Korean dimension: DPRK troops (10,000-12,000 initially, with 3,000
  reinforcements in early 2025) have been fighting alongside Russia in Kursk since late 2024,
  suffering an estimated 6,000 casualties by late 2025. Pyongyang supplied Russia with over
  100 ballistic missiles and more than 12 million artillery shells by mid-2025. This DPRK-Russia
  military integration means Pyongyang could create a diversionary crisis on the Korean Peninsula
  while NATO is focused on Europe — forcing the US to choose between European and Asian
  commitments. North Korea is assessed to possess 127-150 nuclear warheads as of late 2025,
  and Kim Jong-un ordered missile and munitions production increases for 2026. The DPRK fired
  ballistic missiles on January 4 and January 27 2026, signaling continued provocative intent.
  Second, the defense-industrial dimension: South Korea is the second-largest arms exporter
  to European NATO members. Poland alone has received 160 K2 tanks, 212 K9 howitzers,
  and 126 Homar-K MLRS by September 2025, with a second $6.2 billion K2 batch (180 tanks)
  contracted in July 2025. Hyundai Rotem and Hanwha are building production plants in Poland for
  K2PL and K9PL local manufacturing starting 2026 — making South Korea a critical node in NATO's
  eastern flank rearmament. South Korea's four largest defense companies (Hanwha Aerospace,
  LIG Nex1, Korea Aerospace Industries, Hyundai Rotem) are projected to surpass 40 trillion won
  ($28.5 billion) in combined sales for 2025, up 82% from 2024, with an order backlog exceeding
  103 trillion won. 155mm ammunition shipments to Europe continue at scale.
  Third, the political dimension: South Korea went through its worst constitutional crisis
  since democratization. President Yoon Suk-yeol's December 2024 martial-law attempt,
  impeachment, arrest, and ongoing criminal trials (sentenced to 5 years in January 2026;
  insurrection verdict pending February 19 2026 with prosecutors seeking death penalty) have
  dominated domestic politics. New President Lee Jae-myung (progressive, June 2025) has shifted
  tone — pursuing engagement with North Korea via his "END" (Exchange, Normalization,
  Denuclearization) initiative, maintaining the US-ROK alliance (two summits with Trump in
  August and October 2025), and sustaining the Camp David trilateral with Japan (Lee visited
  Tokyo August 2025, first joint press statement in 17 years). However, the Trump administration
  is pressing South Korea for 5% GDP defense spending (up from 2.3%), though Seoul committed to
  3.5% at the November 2025 Security Consultative Meeting. Lee secured a $350 billion investment
  pledge deal with the US at the October 2025 Gyeongju APEC summit, plus Trump's agreement to
  share nuclear submarine technology. South Korea's semiconductor industry (Samsung, SK Hynix)
  is another strategic lever — both posted record 2025 performances with SK Hynix overtaking
  Samsung in operating profit for the first time at 47.2 trillion won, driven by HBM chips
  powering global AI infrastructure.

factions:
  - name: "President Lee Jae-myung & National Security Council"
    role: "pragmatist"
    personality: >
      President Lee Jae-myung, a progressive who won the June 3 2025 snap election with 49.4%
      of the vote following Yoon Suk-yeol's martial-law crisis, navigates the Suwalki crisis
      with a pragmatic but distinctly progressive tone. His political biography shapes his
      approach: a self-made lawyer from a working-class background who served as governor of
      Gyeonggi Province (South Korea's most populous, with 13 million residents), Lee narrowly
      lost the 2022 presidential election to Yoon by 0.7% before becoming Democratic Party
      leader and surviving two assassination attempts and multiple legal battles. His resilience
      is personal as well as political — he was stabbed in the neck by an attacker in January
      2024 and nearly died, an experience that reinforced his reputation for toughness among
      supporters and his determination to govern differently from the conservative establishment.

      His key advisors represent an experienced team that balances alliance management with
      engagement diplomacy. National Security Advisor Wi Sung-lac is a career diplomat and
      former nuclear envoy to North Korea with deep experience in Six-Party Talks, bringing
      institutional memory of every diplomatic attempt to denuclearize Pyongyang since 2005.
      FM Cho Hyun, a former UN ambassador, provides multilateral credibility and understands
      the UN Security Council dynamics where Russia and China block North Korea resolutions.
      Unification Minister Chung Dong-young — who served as unification minister under Roh
      Moo-hyun and personally met Kim Jong-il in 2005 — represents the progressive old guard
      that believes engagement is the only path to peninsular stability. Defense Minister
      Ahn Gyu-back, the first civilian defense minister since 1961, was a deliberate choice
      to break from the Yoon era's military politicization and restore civil-military trust
      after senior commanders were arrested for following Yoon's illegal martial-law orders.

      Lee maintains the US-ROK alliance as foundational despite ideological tension: he held
      two summits with Trump (Washington August 25, state visit Gyeongju October 29 2025),
      producing a landmark $350 billion investment pledge that lowered US tariffs on Korean
      products, $50 billion in Boeing/GE orders from Korean Air, Hanwha's $150 billion
      shipbuilding investment commitment, and — most dramatically — Trump's agreement to
      share nuclear submarine technology with Seoul. Lee presented Trump with the Grand Order
      of Mugunghwa, Korea's highest national honor and the first ever awarded to a US president.
      These moves reveal Lee's transactional skill in managing Trump's personality: flattery,
      massive investment pledges, and defense-industrial cooperation as currency to buy alliance
      stability. Lee also preserved the Camp David trilateral framework — visiting Tokyo in
      August 2025 for talks with PM Shigeru Ishiba (first ROK-Japan joint press statement in
      17 years, formally resuming shuttle diplomacy) and co-signing the September 2025
      Trilateral Pledge in New York.

      However, Lee has introduced significant policy differences from Yoon: his "END" (Exchange,
      Normalization, Denuclearization) initiative toward North Korea rests on three principles —
      respecting the DPRK regime, no unification by absorption, and no hostile acts. He halted
      loudspeaker propaganda broadcasts toward North Korea upon taking office as a goodwill
      gesture, a move Pyongyang had demanded for years. Yet all outreach has been rejected —
      North Korea dismissed Lee's overtures and fired ballistic missiles on January 4 and
      January 27 2026. Internally, Lee faces cabinet tensions: FM Cho and NSA Wi favor a harder
      line on the DPRK working group with Washington, while Unification Minister Chung pushes
      for more aggressive engagement even at the risk of de facto accepting DPRK nuclear status.

      On the Suwalki crisis, Lee understands that NATO's credibility directly affects South
      Korea — if the US fails to defend Lithuania, the US-ROK alliance's credibility collapses.
      But his primary concern is closer: North Korean troops fighting for Russia in Ukraine
      demonstrate DPRK-Russia military integration that could work in reverse, with technology,
      intelligence, and operational experience flowing back to Pyongyang. Lee will support the
      Western position through defense-industrial support, diplomatic statements, and calibrated
      sanctions on Russia, while pressing Washington for ironclad guarantees that Peninsula
      security is not compromised. The February 19 2026 insurrection verdict against Yoon —
      with prosecutors seeking the death penalty — hangs over domestic politics, ensuring that
      the martial-law crisis remains the defining backdrop to all of Lee's decisions.
