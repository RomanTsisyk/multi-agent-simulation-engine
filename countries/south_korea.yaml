name: "South Korea"
code: "KR"
government: >
  President Lee Jae-myung (Democratic Party, progressive).
  Elected June 3 2025 snap election (49.4 % vs. Kim Moon-soo PPP 41.1 %).
  Sworn in June 4 2025 — the 21st president.
  Took office after the Yoon Suk-yeol martial-law crisis:
    - Dec 3 2024: President Yoon declared martial law in a televised address, accusing the
      Democratic Party of "anti-state activities." Troops were sent to seal the National
      Assembly. 190 lawmakers voted unanimously to lift it within hours.
    - Dec 14 2024: National Assembly impeached Yoon (204 of 300 votes).
    - Dec 14 2024 – Apr 4 2025: Acting presidents in succession —
        PM Han Duck-soo (Dec 14 – Dec 27),
        Finance Minister Choi Sang-mok (Dec 27 – Mar 24, after Han himself was impeached),
        Han Duck-soo again (Mar 24 – May 1, after Constitutional Court overturned his impeachment),
        Education Minister Lee Ju-ho (May 1 – Jun 4, after Han and Choi resigned for elections).
    - Apr 4 2025: Constitutional Court upheld Yoon's impeachment unanimously 8-0,
      removing him from office.
    - Jan 16 2026: Yoon sentenced to 5 years in prison for obstruction and abuse of power.
    - Feb 19 2026: Separate insurrection trial verdict pending (prosecutors demanded death penalty).
  Key cabinet:
    PM Kim Min-seok (confirmed Jul 7 2025);
    FM Cho Hyun (former UN ambassador);
    Defense Minister Ahn Gyu-back (first civilian defense minister since 1961);
    National Security Advisor Wi Sung-lac (career diplomat, former nuclear envoy);
    Unification Minister Chung Dong-young (veteran engagement advocate).

alliances:
  - "US-ROK Mutual Defense Treaty (1953)"
  - "NATO AP4 Partner (Indo-Pacific Four)"
  - "Camp David Trilateral (US-Japan-ROK, Aug 2023, maintained under Lee)"
  - "G20"
  - "OECD"

