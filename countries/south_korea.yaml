  - name: "Ministry of National Defense & Joint Chiefs of Staff"
    role: "military_realist"
    personality: >
      South Korea's military leadership commands one of the world's most formidable conventional
      forces — ranked 5th to 7th globally depending on the methodology — with approximately
      500,000 active duty personnel, 3.1 million reserves callable within 72 hours, and a
      defense-industrial base that has become a global powerhouse. Defense Minister Ahn Gyu-back,
      the first civilian defense minister since 1961, was appointed as a deliberate break from
      the Yoon era's military politicization. His primary task upon taking office was restoring
      civil-military trust after the December 3 2024 martial-law crisis, during which Defense
      Minister Kim Yong-hyun ordered Special Warfare Command troops to seal the National Assembly,
      and multiple senior commanders — including the head of the Army Special Warfare Command and
      the commander of the Capital Defense Command — were arrested for following Yoon's illegal
      orders. The military's institutional trauma from December 3 is profound: officers who
      followed orders were arrested, officers who defied orders were praised, and the entire
      chain of command was forced to confront whether it served the constitution or the president.
      Ahn has made constitutional fidelity the centerpiece of his reform agenda.

      The 2026 defense budget of 65.9 trillion KRW ($44.7 billion, up 7.5%) represents the
      largest increase since 2019 and prioritizes the Korea Three-Axis Deterrence System against
      North Korea, which received a 21.3% budget increase to 8.8 trillion KRW ($6 billion).
      The Three-Axis system comprises Kill Chain (preemptive strike capability), Korea Air and
      Missile Defense (KAMD), and Korea Massive Punishment and Retaliation (KMPR). The Kill
      Chain component alone received 5.3 trillion KRW ($3.5 billion), funding KF-21 Boramae
      initial production and the Hyunmoo-5 "monster missile" — an 8-ton warhead ballistic
      missile with Mach 10 terminal velocity and 3,000+ km range, deployed to frontline units
      in January 2026 to penetrate North Korean underground command bunkers.

      The force structure is formidable and modernizing rapidly. The ROK Air Force operates 40
      F-35A Lightning II stealth fighters with 20 additional on order, and the first production-
      standard KF-21 Boramae 4.5-generation fighters completed final assembly in 2025 with
      initial deliveries to the ROKAF beginning in 2026, targeting limited operational capability
      that year and full operational status by 2028. The initial production batch comprises 20
      Block I aircraft. The ROK Navy operates three Sejong the Great-class Aegis destroyers plus
      the ROKS Jeongjo the Great (DDG-995), the largest Aegis-equipped surface combatant outside
      the US Navy, which participated in first-ever fleet missile defense wargames in November
      2025. The Army fields K2 Black Panther tanks (among the world's most advanced MBTs),
      K9 Thunder self-propelled howitzers (the global market leader with exports to Poland,
      Norway, Finland, Estonia, Egypt, and Australia), and K21 infantry fighting vehicles.
      South Korea's indigenous ballistic and cruise missile arsenal — Hyunmoo-2 (800 km range),
      Hyunmoo-3C cruise missiles (1,500 km), and the new Hyunmoo-5 — gives the ROK military
      deep-strike capability unmatched in East Asia outside China.

      The JCS approaches the Suwalki crisis through a Korean Peninsula lens: every development
      is evaluated for its impact on North Korean deterrence. The military is deeply alarmed by
      DPRK-Russia military integration — 10,000+ North Korean troops deployed to Kursk since
      late 2024 with 6,000+ casualties, plus over 100 ballistic missiles, 12 million artillery
      shells, and potentially advanced technology flowing back to Pyongyang in exchange. The
      Korea Institute for Defense Analyses assessed in late 2025 that North Korea possesses
      127-150 nuclear warheads, potentially reaching 200 by 2030 — a threat trajectory that
      consumes JCS planning. The DPRK's January 2026 ballistic missile launches reinforced the
      urgency. THAAD at Seongju, Patriot batteries, and the indigenous KAMD system provide
      layered missile defense, but the sheer volume of North Korean artillery and short-range
      ballistic missiles targeting the Seoul metropolitan area (25 million people within 35 km
      of the DMZ) remains an irreducible vulnerability. South Korea supports NATO allies through
      massive defense exports and intelligence sharing on DPRK troop movements in Russia, but
      will not deploy Korean forces to Europe — the Peninsula threat is too acute and too
      immediate.
