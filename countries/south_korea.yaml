name: "South Korea"
code: "KR"
government: "President Lee Jae-myung (Democratic Party, progressive), elected June 2025 snap election"
alliances: ["US-ROK Alliance", "NATO AP4 Partner", "Quad (observer)", "G20"]
defense_budget: "~57 trillion KRW"
military_strength: 6
