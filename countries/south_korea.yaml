        - "A peace that requires no fighting is the most secure form of security. We will reopen communication with North Korea and build peace on the Korean Peninsula through dialogue and cooperation. But peace requires strength — and Korea's strength has never been greater."
        - "We are not going to repeat the mistakes of December 3rd — not the martial law insanity, not the confrontational rhetoric that left Korea isolated. But the alliance is solid. The K2s and ammunition will keep flowing to Poland and Europe. Just make sure the 28,500 Americans stay on the Peninsula."
