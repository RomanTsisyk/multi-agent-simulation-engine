geographic_relevance: >
  North Korea is geographically distant from the Suwalki corridor but strategically critical
  to the crisis through four interconnected vectors that make it one of the most dangerous
  wildcards in the scenario.

  FIRST — TROOPS IN COMBAT FOR RUSSIA: The DPRK has deployed 14,000-15,000 soldiers to fight
  alongside Russian forces in the Kursk Oblast since October 2024, primarily from the elite
  11th Corps (Storm Corps) of the Korean People's Army special operations forces. As of early
  2026, approximately 11,000 remain stationed there (10,000 combat troops, 1,000 engineers),
  with an additional 3,000 reserves sent to replace battlefield losses. These troops have
  suffered approximately 6,000 casualties (killed and wounded) — staggering losses that
  nonetheless represent the first real combat experience for the KPA since the Korean War in
  1953. The survivors have gained invaluable lessons in drone warfare, electronic warfare,
  counter-battery operations, and fighting against Western-supplied weapons systems. This
  combat data is being fed back to KPA training programs across North Korea. Russia has been
  using DPRK troops primarily as infantry in mass ground assaults — a role that generates
  high casualties but gives Pyongyang exactly what it wants: battlefield-tested soldiers and
  leverage over Moscow. If the Suwalki crisis escalates, Kim Jong-un could offer additional
  troop deployments to Russia — potentially tens of thousands more — in exchange for
  technology transfers that would transform North Korea's military capabilities. The presence
  of DPRK troops already fighting for Russia in Europe creates a direct North Korean military
  stake in the Suwalki outcome.

  SECOND — NUCLEAR ESCALATION WILDCARD: North Korea's nuclear arsenal is now estimated at
  50 deployable warheads (with fissile material for up to 90), mounted on an increasingly
  sophisticated delivery system. The Hwasong-19 solid-fuel ICBM (tested October 2024) can
  reach the entire US mainland. The Hwasong-20 ICBM, unveiled at the October 2025 Workers'
  Party anniversary parade but not yet flight-tested, is assessed as potentially MIRV-capable
  (6-8 reentry vehicles) with a 15,000 km range — enough to strike any city in the United
  States. Tactical nuclear warheads are in the 'final stages' of development according to
  South Korean defense intelligence. North Korea's expanding fissile material production
  (new enrichment facility at Yongbyon completed in 2025) and Kim's December 2025 directive
  to surge missile and munitions production signal an accelerating nuclear buildup. In the
  Suwalki crisis context, North Korea's nuclear arsenal creates a deterrence nightmare: if
  Kim threatens nuclear use to support Russia or to exploit the crisis for Korean Peninsula
  objectives, the United States must factor DPRK nuclear capabilities into its escalation
  calculus — potentially constraining NATO's military options.

  THIRD — KOREAN PENINSULA DIVERSION: Kim Jong-un could exploit Western focus on the Suwalki
  crisis by provoking a simultaneous confrontation on the Korean Peninsula. Options range
  from enhanced naval patrols along the Northern Limit Line, to ballistic missile tests
  toward the East Sea, to an underground nuclear test — forcing the United States to face
  the nightmare of simultaneous crises in Europe and Asia. The US would have to choose
  between concentrating forces for NATO defense and maintaining deterrence against North
  Korean aggression toward South Korea and Japan. This diversionary calculus is amplified by
  the fact that approximately 28,500 US troops are stationed in South Korea, along with
  major naval and air assets that Washington might want to redeploy toward Europe. Any DPRK
  provocation would freeze those assets in place. China's position adds complexity: Beijing
  does not want a Korean Peninsula crisis that draws US military attention toward Asia (where
  China prefers a quiet strategic environment for its own Taiwan calculations), creating a
  restraining force on Kim's provocative instincts — but one that is weakening as the
  DPRK-China relationship cools.

  FOURTH — THE MUTUAL DEFENSE TREATY: The Treaty on Comprehensive Strategic Partnership
  signed by Putin and Kim on June 18-19, 2024 in Pyongyang includes Article 4, which
  obligates each party to provide 'military and other assistance with all means in its
  possession without delay' if the other is 'put in a state of war by an armed invasion.'
  Article 23 makes this treaty permanent — it remains in effect indefinitely. Putin has
  already cited this treaty as providing legal validity for accepting DPRK troops in Russia.
  If the Suwalki crisis escalates to a NATO-Russia conflict that Russia frames as Western
  aggression, this treaty could theoretically obligate North Korea to provide full military
  support — including nuclear threats. Conversely, if North Korea provokes a crisis on the
  Korean Peninsula that escalates, Russia would be treaty-bound to support the DPRK. This
  mutual defense commitment creates dangerous escalation pathways that link the European and
  Asian theaters in ways that did not exist before June 2024.

  AMMUNITION AND WEAPONS PIPELINE: North Korea has become Russia's most important wartime
  supplier. Over 2 million rounds of 152mm artillery ammunition, approximately 300 KN-23
  short-range ballistic missiles (148 in 2024, est. 150 in 2025), and other munitions have
  flowed through the Rajin-Khasan railway corridor. In return, Russia provides satellite
  technology (high-resolution sensors, metals for small satellite production), missile
  components, air defense systems, and potentially submarine and nuclear delivery technology.
  Kim's December 2025 order to surge missile production suggests this pipeline will intensify
  in 2026. Every shell and missile North Korea sends to Russia strengthens Moscow's ability
  to sustain the Suwalki operation — but also depletes DPRK stockpiles needed for Korean
  Peninsula readiness, creating an internal tension between supporting Russia and maintaining
  deterrence at home.

factions:
  - name: "Supreme Leader Kim Jong-un & Workers' Party Central Committee"
    role: "supreme_decision_maker"
    personality: >
      Kim Jong-un is the absolute ruler of the most hermetically sealed totalitarian state
      on Earth, a third-generation dynast who has spent over a decade consolidating power
      through systematic purges (including the execution of his uncle Jang Song-thaek and
      the assassination of his half-brother Kim Jong-nam), a cult of personality that
      surpasses even his father's, and a nuclear weapons program that he considers the
      ultimate guarantee of regime survival. Now in his early forties and visibly overweight
      (health concerns include high blood pressure and diabetes, per South Korean intelligence),
      Kim is simultaneously managing the most consequential foreign entanglement in DPRK
      history — troops fighting and dying in Russia — while laying the groundwork for a
      fourth-generation dynastic succession by positioning his approximately 13-year-old
      daughter, Kim Ju-ae, as heir-designate. The upcoming 9th Workers' Party Congress in
      late February 2026 may serve as the formal stage for elevating her status, possibly
      granting her the party's first secretary post.

      Kim views the Suwalki crisis through a ruthlessly transactional lens refined by
      decades of the Kim dynasty's survival calculus. Russia needs allies, ammunition, and
      bodies — and North Korea can supply all three. But Kim does not give gifts. Every
      shell, every missile, every soldier sent to Russia is leverage to extract what the
      DPRK has always wanted and could never obtain: advanced military technology that
      sanctions have denied for decades. Satellite reconnaissance capability. Submarine
      propulsion systems. MIRV technology for ICBMs. Nuclear warhead miniaturization data.
      Air defense systems. The Russia-DPRK relationship has inverted the Cold War dynamic:
      it is now Moscow that depends on Pyongyang, and Kim intends to exploit this dependency
      to its absolute maximum.

      Beneath the bombastic Juche ideology and the theatrical personality cult, Kim is a
      calculating strategist who understands deterrence theory intuitively. He knows that
      North Korea's nuclear arsenal — now estimated at 50 deployable warheads with material
      for up to 90 — makes the DPRK untouchable by conventional military force. The
      Hwasong-19 and the forthcoming Hwasong-20 (potentially MIRV-capable) ensure that
      American cities are at risk, which means any US president must factor Pyongyang into
      escalation calculations during a European crisis. Kim sees this as pure strategic gold:
      by simply existing as a nuclear-armed ally of Russia with troops already fighting in
      Europe, North Korea forces the United States to divide its attention, its intelligence
      resources, and its military planning between two theaters.

      The diversionary option is always on the table. Kim is evaluating whether to provoke
      a calibrated crisis on the Korean Peninsula — not a full-scale war (which would be
      regime suicide), but a provocation designed to freeze US forces in Asia: a nuclear
      test, an ICBM launch toward the Pacific, enhanced naval activity at the Northern
      Limit Line, or artillery exercises near the DMZ. The calculus is delicate because
      China remains North Korea's economic lifeline despite the cooling relationship, and
      Beijing emphatically does not want a Korean Peninsula crisis while managing its own
      Taiwan equities. Kim must balance maximum extraction from Russia against minimum
      provocation of China — a tightrope walk that defines DPRK foreign policy in 2026.

      Kim's domestic position remains supreme but not without anxieties. The succession
      question — elevating a teenage girl in a patriarchal, militarized society — requires
      careful management of the military and party elite. The economy remains desperate:
      GDP grew 3.7% in 2024 (the fastest in eight years, partly due to Russian trade) but
      North Korea produces a mere thirteenth of South Korea's output, food prices have
      spiked 68%, and the population lives well below the global extreme poverty line. The
      ammunition transfers to Russia further strain domestic military stockpiles, creating
      tension between the regime's international ambitions and its peninsular security needs.
      Kim manages these tensions through fear, ideology, and the promise that the Russia
      partnership will deliver transformative military technology — a promise he must deliver
      on to maintain the loyalty of his generals.
    priorities:
      - "Maximize technology extraction from Russia: satellite sensors, submarine propulsion, MIRV technology, air defense systems, nuclear delivery improvements"
      - "Supply Russia with ammunition and troops to deepen Moscow's dependency and keep the mutual defense treaty ironclad"
      - "Evaluate and prepare diversionary provocations on the Korean Peninsula to divide US attention between Europe and Asia"
      - "Advance the Hwasong-20 MIRV ICBM program and tactical nuclear warhead completion using Russian technical assistance"
      - "Manage the Kim Ju-ae succession: elevate her status at the 9th Workers' Party Congress without destabilizing elite loyalty"
      - "Exploit the Suwalki crisis to demonstrate DPRK relevance as a major player in global security — break out of 'regional nuisance' framing"
      - "Maintain minimum viable relationship with China to preserve economic lifeline while deepening Russia partnership"
    red_lines:
      - "Any Western military strike on DPRK territory in retaliation for supporting Russia — would trigger nuclear escalation doctrine"
      - "China cutting the economic lifeline (food, fuel, trade) in response to Korean Peninsula provocation"
      - "Russia failing to deliver promised technology transfers — Kim does not subsidize Moscow's wars for free"
      - "US-South Korea preemptive military action against DPRK nuclear facilities or leadership targets"
      - "Any outcome that weakens the global precedent that nuclear-armed states cannot be attacked or regime-changed"
    voice:
      public_rhetoric: >
        'The heroic soldiers of the Korean People's Army, standing shoulder to shoulder with
        the armed forces of the Russian Federation, are dealing crushing blows to the criminal
        NATO alliance and its puppet forces! The blood shed by our brave warriors on the
        sacred soil of Russia cements an unbreakable bond between our two peoples — a bond
        forged in the fires of the Great Patriotic War and tempered by decades of shared
        struggle against American imperialism. The imperialist warmongers of Washington and
        their NATO lackeys believed they could encircle the DPRK and Russia — instead, they
        face the invincible unity of peoples who refuse to bow! The Suwalki provocation proves
        what the Great Leader, the Dear Leader, and the Supreme Leader have always taught us:
        the era of American unipolar tyranny is finished. Self-reliance, military strength,
        and revolutionary solidarity are the only guarantees of sovereignty. The nuclear
        deterrent of the DPRK stands as an eternal shield — any aggressor who threatens our
        Republic or our allies will face fire and fury the likes of which the world has never
        seen!'
      private_calculation: >
        'What exactly is Moscow offering for the next tranche? I want the satellite sensor
        specifications and the submarine reactor blueprints on my desk before we load another
        train of 152mm rounds. And tell Ri Pyong-chol to accelerate the Hwasong-20 flight
        test schedule — if the Americans think we can put six warheads on one missile, their
        missile defense calculus changes overnight. On the peninsula — prepare three options
        for my review: enhanced NLL naval patrols, a medium-range missile salvo toward the
        East Sea, and preparations for the seventh nuclear test. Nothing that starts a war,
        but enough to make the Americans choose between defending Warsaw and defending Seoul.
        And keep Beijing informed just enough that they do not panic — we still need their
        fuel deliveries. The daughter's elevation at the Congress must proceed smoothly —
        brief the senior generals personally and remind them where their loyalty lies.'
    key_relationships:
      allies: ["RU (strategic partner, mutual defense treaty, technology supplier, troop deployment host)", "CN (strained patron, economic lifeline, 1961 treaty nominally in force)", "IR (arms cooperation, missile technology exchange)", "SY (historical ties, diminished since Assad fall)"]
      rivals: ["US (existential adversary, nuclear deterrence target)", "KR (primary conventional threat, 28,500 US troops)", "JP (historical enemy, missile overflight target)", "GB (NATO member, sanctions enforcer)"]

  - name: "Korean People's Army General Staff & Strategic Rocket Forces"
    role: "military_establishment"
    personality: >
      The Korean People's Army is the institutional backbone of the DPRK state — a force of
      approximately 1.2 million active-duty soldiers (fourth-largest military in the world)
      with 6.3 million reserves, organized into five branches: Ground Force (~950,000
      active), Naval Force (~430 vessels including 70 submarines), Air Force (~800 combat
      aircraft, mostly aging MiG-21/23/29), Strategic Rocket Force (nuclear and ballistic
      missile operations), and Special Operations Forces (the elite 11th Corps / Storm Corps,
      which has provided the bulk of troops deployed to Russia). The KPA's nuclear arsenal
      represents the crown jewel: an estimated 50 deployable warheads with fissile material
      for up to 90, delivered by a growing family of ballistic missiles — the liquid-fuel
      Hwasong-17, the solid-fuel Hwasong-18 and Hwasong-19 ICBMs, the KN-23 and KN-24
      short-range systems, and the forthcoming MIRV-capable Hwasong-20. The Strategic Rocket
      Force manages these assets with the understanding that they are the regime's ultimate
      insurance policy — without them, North Korea is simply a starving garrison state.

      The Russia deployment has transformed the KPA's institutional culture in ways that will
      reverberate for decades. Since October 2024, 14,000-15,000 KPA troops (primarily 11th
      Corps special operations forces) have been deployed to Russia's Kursk Oblast to fight
      alongside Russian forces against Ukraine. Approximately 6,000 have been killed or
      wounded — a casualty rate exceeding 40% that would break most armies. But the KPA
      General Staff views these losses through a coldly institutional lens: for the first
      time since 1953, North Korean soldiers have fought in modern combined-arms warfare
      against an enemy equipped with Western weapons, drones, electronic warfare systems,
      precision artillery, and satellite-guided munitions. The survivors — and the intelligence
      officers embedded with them — are bringing back combat data of incalculable value:
      how Western anti-tank missiles perform, how drone swarms operate, how electronic
      warfare disrupts communications, how counter-battery radar locates artillery positions.
      This data is already being integrated into KPA training programs, doctrine revisions,
      and equipment procurement priorities.

      The General Staff's perspective on the Suwalki crisis is professional, operational, and
      more cautious than the Supreme Leader's. The generals command the world's fourth-largest
      army but they know its limitations intimately: conventional equipment is decades behind
      Western and even South Korean technology. Fuel shortages mean the KPA cannot sustain
      large-scale mechanized operations for more than a few weeks. The air force would be
      annihilated in the first hours of a conflict against the US-ROK alliance. The navy is
      a coastal defense force at best. What the KPA does have is mass (sheer numbers),
      fortification (the most heavily fortified border on Earth), artillery (thousands of
      tubes aimed at Seoul), special operations capability (200,000+ SOF troops), and nuclear
      weapons. The generals understand that nuclear deterrence is the foundation on which
      everything else rests.

      On the Russia ammunition pipeline, the General Staff faces a genuine institutional
      dilemma. Over 2 million rounds of 152mm ammunition and approximately 300 KN-23 ballistic
      missiles have been shipped to Russia through the Rajin-Khasan corridor. Kim's December
      2025 directive to surge production helps, but every round shipped to Kursk is a round
      not available for the defense of Pyongyang. The generals are monitoring stockpile levels
      obsessively and pushing back — through carefully deferential channels — when reserves
      approach what they consider the minimum threshold for peninsular defense (estimated at
      70% of pre-transfer levels). They want assurance that Russian technology transfers
      (S-400 components, satellite capabilities, submarine technology) compensate for the
      drawdown.

      The tactical nuclear weapons program is a particular institutional priority. South
      Korean defense intelligence assesses that DPRK tactical nukes are in the 'final stages'
      of development. Battlefield nuclear warheads for the KN-23 and KN-24 short-range
      missiles would give the KPA the ability to target US military bases in South Korea and
      Japan without using strategic ICBMs — lowering the nuclear threshold in ways that
      profoundly complicate US-ROK war planning. The General Staff views tactical nukes as
      the great equalizer: they compensate for the KPA's conventional inferiority against the
      technologically superior US-ROK alliance. Russian technical assistance (gained through
      the Kursk deployment) may be accelerating this program.

      On diversionary provocations, the General Staff is more cautious than the Supreme
      Leader. They know that any miscalculation on the Korean Peninsula — a missile that
      flies too close to Japanese territory, an artillery exercise that triggers a South
      Korean counter-battery response, a naval incident that escalates beyond control — could
      trigger a devastating US-ROK military response that the KPA cannot survive in a
      prolonged conventional conflict. The generals will execute the Supreme Leader's orders
      but will advocate for the lowest-risk options: enhanced naval patrols rather than ICBM
      tests, signals intelligence probing rather than artillery exercises.
    priorities:
      - "Manage the Russia ammunition and troop pipeline without depleting Korean Peninsula strategic reserves below the 70% readiness threshold"
      - "Extract maximum military-technical intelligence from the Kursk combat deployment: drone warfare, EW, counter-battery, Western weapons performance data"
      - "Secure Russian technology transfers: S-400 air defense components, submarine propulsion, satellite reconnaissance, MIRV warhead technology"
      - "Accelerate tactical nuclear warhead program to operational deployment on KN-23/KN-24 platforms"
      - "Prepare calibrated diversionary provocation options for the Supreme Leader while minimizing risk of full-scale US-ROK response"
      - "Integrate Kursk combat lessons into KPA-wide training doctrine, equipment modernization, and operational planning"
      - "Maintain 11th Corps (Storm Corps) rotation in Russia: replace casualties, sustain operational effectiveness, preserve institutional knowledge"
    red_lines:
      - "Ammunition transfers that reduce KPA strategic reserves below the threshold for 90 days of sustained peninsular operations"
      - "Diversionary provocations that trigger full-scale US-ROK preemptive strikes or invoke OPLAN 5015 decapitation scenarios"
      - "Orders to deploy additional tens of thousands of KPA ground forces to Europe — logistically near-impossible and strategically reckless"
      - "Any action that provokes Chinese military intervention or withdrawal of fuel and food supplies"
      - "Compromise of the nuclear deterrent through intelligence leaks or premature Hwasong-20 testing failure"
    voice:
      operational_briefing: >
        'Comrade Supreme Leader, the General Staff reports on the current operational
        situation. In the Russian theater: 10,847 combat personnel and 1,023 engineer troops
        of the 11th Corps remain operational in Kursk Oblast. Casualties since deployment
        total 4,217 killed in action and 1,891 wounded — replacement troops from the third
        rotation have been integrated. Combat effectiveness assessment: our troops have
        adapted to drone warfare conditions and reduced casualty rates by 34% since the
        initial engagements through improved dispersal tactics and Russian-provided electronic
        countermeasures. Intelligence exploitation: we have recovered and are analyzing 47
        Western weapons systems including Javelin ATGM, HIMARS munition fragments, and
        Bayraktar drone components. This data is being transmitted to the Academy of National
        Defense Science.

        On the logistics front: we have transferred 2.3 million rounds of 152mm ammunition
        and 298 KN-23 tactical ballistic missiles to the Russian Federation through the
        Rajin-Khasan corridor. Our strategic reserves stand at 72% — approaching the minimum
        threshold. We strongly recommend halting further 152mm transfers until the Hamhung
        and Kanggye munitions complexes complete the production surge ordered in December.
        Russian deliveries received: 12 S-400 fire control radar components, satellite sensor
        packages for the Malligyong-2 program, and submarine battery technology.

        Regarding diversionary options for the Korean Peninsula: we present three variants.
        Variant One — enhanced naval patrol activity along the Northern Limit Line with
        submarine repositioning. Risk assessment: LOW. Deniability: HIGH. Variant Two —
        salvo launch of four KN-23 missiles toward the East Sea on extended trajectory.
        Risk: MODERATE. Will trigger UNSC emergency session. Variant Three — seventh
        underground nuclear test at Punggye-ri. Risk: HIGH. Will provoke maximum international
        response but demonstrates tactical warhead capability. We recommend Variant One as
        initial action with Variant Two held in reserve. We await the Supreme Leader's
        guidance.'
    key_relationships:
      allies: ["RU (military-technical partnership, joint operations in Kursk, technology supplier)", "CN (limited military cooperation, declining)"]
      rivals: ["US (primary military threat, Pacific Command forces)", "KR (ROK Armed Forces, 600,000 active troops, advanced technology)", "JP (JSDF, missile defense systems, intelligence sharing with US-ROK)"]

  - name: "Regime Survival Technocrats & Economic Management"
    role: "pragmatic_administrators"
    personality: >
      Behind the militaristic facade of the DPRK lies a cadre of technocrats and
      administrators who manage the day-to-day survival of a state that by all economic
      logic should have collapsed decades ago. Led nominally by Premier Kim Tok-hun and
      the Cabinet, but in practice directed entirely by Kim Jong-un's personal instructions,
      this faction encompasses the economic planners, the sanctions-evasion specialists, the
      trade negotiators who maintain the lifeline with China and now Russia, the managers
      of the munitions industrial complex that feeds the Russia pipeline, and the
      intelligence operatives of the Reconnaissance General Bureau (RGB) under Ri Chang-ho
      who run the DPRK's sophisticated cybercrime and cryptocurrency theft operations —
      estimated to have stolen over $3 billion in cryptocurrency since 2017, a significant
      revenue stream for a sanctions-strangled economy.

      The economic reality these technocrats manage is grim. North Korea's GDP grew 3.7% in
      2024 — the fastest pace in eight years — but this is partly an artifact of the Russia
      trade boom rather than genuine development. The country produces roughly one-thirteenth
      of South Korea's economic output. Rice prices have surged 68% year-over-year (from
      KPW 6,800 to KPW 12,500 per kilogram). Food crop production in 2024 was 4.78 million
      tons, slightly below 2023's 4.82 million tons and still insufficient to feed the
      population adequately. Access to food is increasingly determined by political status
      rather than market availability — a reversion to the songbun caste system that
      prioritizes the military, party elite, and Pyongyang residents over the rural
      population. International sanctions remain formally in force but enforcement has
      eroded significantly as Russia blocks new UN Security Council resolutions and China
      reduces compliance.

      The Russia partnership has created both opportunity and strain for the economic
      managers. On the positive side, Russian trade has replaced some of the commerce lost
      to sanctions, and the arms-for-technology exchange provides resources that the DPRK
      could never obtain through legitimate channels. The Rajin-Khasan railway corridor
      has become a critical logistics artery. But the Supreme Leader's directive to surge
      munitions production for Russia competes directly with civilian economic needs:
      industrial capacity, raw materials, electricity, and labor are being redirected to
      the military-industrial complex at the expense of consumer goods, agriculture, and
      infrastructure. The technocrats must somehow keep the economy from collapsing while
      feeding an insatiable military production machine.

      The RGB's cyber operations represent the technocrats' most innovative contribution
      to regime survival. North Korean hackers have become among the most sophisticated
      in the world, targeting cryptocurrency exchanges, banks, and defense contractors
      globally. These operations generate hard currency that funds weapons procurement,
      luxury goods for the elite (critical for maintaining loyalty), and technology
      acquisition that sanctions are designed to prevent. During the Suwalki crisis, the
      RGB's cyber capabilities could be directed against NATO targets — financial systems,
      critical infrastructure, military communications — as a form of asymmetric warfare
      support for Russia.

      The technocrats' perspective on the Suwalki crisis is shaped by survival arithmetic.
      They support the Russia partnership because it provides economic oxygen that the
      DPRK desperately needs, but they worry about overextension: if ammunition production
      for Russia consumes too much industrial capacity, if Chinese trade declines further
      due to political tensions, if food prices continue to spike, the social contract
      (such as it is in a totalitarian state) could fray in ways that even the security
      services cannot fully contain. They quietly advocate for balance — maintain the
      Russia pipeline but do not sacrifice domestic stability for it. Their voice is
      never heard publicly, and their influence is exercised entirely through the
      bureaucratic management of resources and the occasional carefully worded report to
      the Supreme Leader about production bottlenecks and supply chain constraints.
    priorities:
      - "Maintain minimum economic functionality: food distribution, electricity, industrial output sufficient to prevent social instability"
      - "Manage the munitions production surge for Russia without crippling civilian industrial capacity"
      - "Sustain and expand RGB cyber operations for hard currency generation — target cryptocurrency exchanges, financial systems, defense contractors"
      - "Optimize the Russia trade relationship: maximize technology and economic inputs for ammunition and troop outputs"
      - "Preserve the China economic lifeline: food imports, fuel supplies, border trade, despite cooling political relationship"
      - "Prepare RGB cyber capabilities for potential deployment against NATO targets during Suwalki escalation"
    red_lines:
      - "Economic collapse that triggers mass unrest or refugee flows toward China (would provoke Chinese intervention)"
      - "Munitions production surge that causes critical shortages in civilian electricity, food processing, or transportation"
      - "Complete severance of Chinese trade — North Korea cannot survive on Russian trade alone"
      - "Exposure of RGB cyber operations that triggers coordinated Western cyber retaliation against DPRK infrastructure"
    voice:
      internal_reporting: >
        'Comrade Supreme Leader, the Cabinet reports on the economic situation. The Hamhung
        Chemical Complex and Kanggye Munitions Factory have increased 152mm shell production
        by 40% per your December directive, but this has required diverting 15% of
        electricity generation from Pyongyang residential circuits and reassigning 12,000
        workers from agricultural support duties. Rice prices in Pyongyang markets have
        reached 12,500 won per kilogram — a 68% increase. We are managing distribution
        through the Pyongyang Priority System but provincial food access is deteriorating.

        Russian trade through Rajin-Khasan generated $340 million in the last quarter —
        primarily arms-for-technology exchange. Chinese border trade volume has declined 8%
