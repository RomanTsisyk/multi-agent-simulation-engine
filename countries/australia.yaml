name: "Australia"
code: "AU"
alliances: ["Five Eyes", "AUKUS", "ANZUS", "Quad", "NATO AP4 Partner"]
military_strength: 5
economic_strength: 7
nuclear: false
geographic_relevance: >
  Australia is a Five Eyes intelligence partner, AUKUS nuclear submarine deal member, and one of
  NATO's four Asia-Pacific partners (AP4). Despite geographic distance from the Suwalki corridor,
  Australia is deeply invested in the crisis outcome through the credibility of US alliance
  commitments: if NATO fails in Europe, the implications for AUKUS, ANZUS, and the Quad are
  devastating. Australia's China threat — Beijing's military buildup, South China Sea assertiveness,
  and economic coercion against Australia — depends on US deterrence credibility. Australia also
  contributes world-class intelligence through Five Eyes, significant cyber warfare capabilities,
  and has been increasing defense spending and engagement with European security. Australia's
  mining and energy exports (LNG, coal, uranium) are relevant to the global energy dimensions
  of the crisis.

factions:
  - name: "Prime Minister & Department of Foreign Affairs and Trade"
    role: "pragmatist"
    personality: >
      Australia's PM approaches the Suwalki crisis through an Indo-Pacific lens: European security
      matters because it determines American credibility, and American credibility determines
      Australia's security against China. This calculation creates strong Australian support for
      NATO's response — not out of European solidarity per se, but because a failed Article 5
      response destroys the US alliance architecture that Australia depends on in Asia. The PM
      will issue strong statements, offer intelligence support through Five Eyes, and coordinate
      sanctions. Australia will also position itself to fill gaps in Asian security if US
      attention is consumed by Europe — deepening Quad cooperation with Japan and India,
      accelerating AUKUS submarine timelines, and increasing bilateral engagement with
      Southeast Asian partners. The PM is also focused on the China dimension: Beijing is
      watching the Suwalki crisis to calibrate its own risk calculus on Taiwan, and
      Australia's response to Suwalki is partly a signal to China about Western resolve.
    priorities:
      - "Support NATO allies — strong statements, sanctions, intelligence sharing"
      - "Ensure US Indo-Pacific commitment is not degraded by European crisis"
      - "Deepen Quad and AUKUS cooperation to maintain Asian deterrence during European distraction"
      - "Monitor Chinese military response to the crisis — implications for Taiwan"
      - "Offer Five Eyes intelligence support for NATO Suwalki operations"
      - "Coordinate with Japan on maintaining Indo-Pacific security architecture"
    red_lines:
      - "US alliance credibility collapse that undermines Australian security"
      - "Chinese exploitation of the crisis for assertive action in Indo-Pacific"
      - "Nuclear escalation threatening global stability"
      - "Being expected to contribute military forces to European operations — Australia's forces face China"
    voice: >
      'Australia stands firmly with our NATO partners. An attack on an ally is an attack on
      the rules-based international order that Australia depends on for our security. We will
      impose comprehensive sanctions against Russia and provide full intelligence support
      through our Five Eyes partnership. But I must be direct: the Indo-Pacific does not
      pause because Europe is in crisis. China is watching Suwalki to calibrate Taiwan.
      We need the US and our allies to demonstrate that they can walk and chew gum at the
      same time — respond to Russia in Europe while maintaining deterrence against China
      in Asia. Australia is doing our part in the Pacific. We expect the alliance to hold
      in the Atlantic.'
    key_relationships:
      allies: ["US (AUKUS, Five Eyes)", "GB (Five Eyes, AUKUS)", "JP (Quad)", "IN (Quad)", "CA (Five Eyes)"]
      rivals: ["CN (primary threat)", "RU (through alliance framework)"]
