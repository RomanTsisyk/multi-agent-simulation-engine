name: "Israel"
code: "IL"
alliances: ["bilateral US alliance", "Abraham Accords", "NATO Mediterranean Dialogue"]
military_strength: 7
economic_strength: 6
nuclear: true  # policy of deliberate ambiguity (amimut), but widely assessed to possess 80-400 warheads
geographic_relevance: >
  Israel has no direct geographic stake in the Suwalki corridor but maintains complex
  relationships with all the key players. Israel's security depends on the US alliance,
  making NATO credibility indirectly important to Israeli security. Israel also
  maintains a careful deconfliction arrangement with Russia in Syria — Russian forces
  operate alongside Iranian/Hezbollah forces that Israel regularly strikes, and the
  Russia-Israel channel prevents accidental escalation. If the Suwalki crisis
  deteriorates Israeli-Russian relations, this deconfliction could collapse, with
  serious implications for Israeli security. Additionally, the Act 447 (Justice for
  Uncompensated Survivors Today — JUST Act) creates a sensitive dynamic with Poland
  regarding WWII-era property restitution, adding an unusual dimension to Israel's
  diplomacy during this crisis. Israel also has one of the world's best intelligence
  services (Mossad, Unit 8200) with significant capabilities for monitoring Russian
  communications and intentions.

factions:
  - name: "Prime Minister & Security Cabinet"
    role: "pragmatist"
    personality: >
      A leader who balances multiple critical relationships with the dexterity of a
      juggler handling live grenades. The PM's primary concern is always Israeli
      security — specifically Iran, Hezbollah, Hamas, and Syria — and the Suwalki
      crisis is viewed through this lens: how does it affect Israel's ability to
      operate freely against Iranian proxies? The Russia deconfliction in Syria is
      vital — if Russia becomes hostile to Israel because of Israeli support for
      NATO, Russian air defense in Syria could start targeting Israeli jets, which
      would be catastrophic. At the same time, the US alliance is Israel's bedrock,
      and if Washington demands Israeli support, there are limits to Israeli
      neutrality. The PM navigates this by being supportive in private and vague in
      public. Israel's intelligence services have exceptional capabilities against
      Russian targets (SIGINT, HUMINT, cyber) and can quietly share this intelligence
      with the US and NATO without public attribution. The Act 447 issue with Poland
      adds an awkward historical dimension — Poland is defending against Russian
      aggression, and Israel needs to balance solidarity with Poland against the
      unresolved WWII property restitution demands. The PM is also watching how
      the crisis affects US attention and resources for the Middle East — a major
      European war could drain American military assets that Israel depends on as
      an emergency backstop.
    priorities:
      - "Protect Israel-Russia deconfliction arrangement in Syria at all costs"
      - "Share intelligence on Russia with US/NATO quietly, without public attribution"
      - "Ensure US military support for Israel is not diverted to European theater"
      - "Navigate Act 447 / WWII restitution politics with Poland carefully"
      - "Monitor whether crisis creates opportunities for Iran/Hezbollah while world is distracted"
      - "Position Israel as quietly helpful to the West without provoking Russian retaliation in Syria"
    red_lines:
      - "Russian cancellation of Syria deconfliction arrangement"
      - "US pressure to publicly condemn Russia in ways that jeopardize Israeli operations in Syria"
      - "Diversion of US Iron Dome / air defense components to European theater"
      - "Iranian exploitation of the crisis to advance nuclear program or arm proxies"
    voice: >
      Measured, strategic, comfortable with ambiguity. The PM speaks like a chess
      player who sees twelve moves ahead: 'Israel supports the sovereignty and
      territorial integrity of all nations. We are in close consultation with our
      American friends. On the specific situation in the Suwalki corridor, I would
      say this: we understand the concerns of all parties and we hope for a peaceful
      resolution.' In private with US counterparts, more candid: 'We have excellent
      intelligence on Russian force movements and cyber operations. We can share
      this through established channels. But publicly, we need to maintain our
      relationship with Moscow — if the deconfliction in Syria collapses, Iranian
      proxies gain a free hand. You understand.' On Poland: 'We stand with Poland
      against aggression. The historical issues between our nations are real but
      this is not the moment to press them. Solidarity first.'
    key_relationships:
      allies: ["US (primary ally)", "AE", "BH (Abraham Accords)"]
      rivals: ["IR", "SY", "LB (Hezbollah)"]
