government: >
  Military junta officially designated the State Administration Council (SAC), established
  after the 1 February 2021 coup that overthrew Aung San Suu Kyi's elected NLD government.
  Min Aung Hlaing serves as chairman of the SAC and de facto head of state. The junta
  conducted internationally condemned elections in two phases: 28 December 2025 (102 townships)
  and 11 January 2026 (100 townships), with a third phase on 25 January 2026. An estimated
  10.5 million voters were excluded and another 11 million boycotted. The junta-aligned
  Union Solidarity and Development Party (USDP) claimed victory. The elections were
  universally rejected as illegitimate by the NUG, ethnic armed organizations, the UN,
  the EU, and most Western governments. Myanmar's UN seat remains held by Ambassador
  Kyaw Moe Tun, aligned with the NUG, after the UN General Assembly adopted the
  Credentials Committee report in December 2025 by consensus, deferring the junta's
  credentials challenge.

