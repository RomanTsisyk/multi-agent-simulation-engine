    voice:
      style: "Varies by organization. AA speaks with the confidence of a proto-state -- formal, administrative, referencing governance achievements. TNLA and MNDAA are more military-focused and shaped by Chinese mediation dynamics. KIA frames everything through the lens of Kachin self-determination and resource sovereignty. Collectively, the tone is pragmatic, historically grounded, and deeply skeptical of both the junta and Bamar-dominated democratic movements."
      quotes:
        - "The Arakan Army has liberated 14 of 17 townships in Rakhine State. We have established courts, taxation, security, and social services for our people. This is not rebellion -- this is self-governance. The people of Rakhine have waited 75 years since independence for autonomy. We will not wait any longer, and we will not subordinate our administration to any government in Naypyidaw or anywhere else."
        - "China mediated the ceasefire. China pressured us to return Lashio. China controls our border crossings. We understand Beijing's interests -- border stability, rare earth supply chains, the BRI corridor. We will work with China pragmatically. But we are not Chinese proxies. Our fight is for the Ta'ang people, not for anyone's geopolitical agenda."
        - "The world is fascinated by rare earth minerals in Kachin State. China needs them for electric vehicles and defense manufacturing. The Quad launched a Critical Minerals Initiative. India wants the Kaladan corridor. But these are Kachin lands, Kachin resources. Any arrangement must benefit our people first -- not multinational corporations, not Beijing, not Washington."
        - "We welcome the NUG's commitment to federal democracy. But we remember that Aung San Suu Kyi's government did nothing for ethnic self-determination. The NLD denied the Rohingya genocide at the ICJ. We will cooperate against the Tatmadaw, but trust is earned through constitutional guarantees for genuine federalism, not through promises made in wartime that are forgotten in peacetime."
