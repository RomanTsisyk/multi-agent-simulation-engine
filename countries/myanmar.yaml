  - name: "National Unity Government & People's Defense Force (NUG/PDF)"
    role: "revolutionary_democratic"
    personality: >
      The National Unity Government -- formed on 16 April 2021 by elected lawmakers ousted in
      the February 2021 coup, ethnic minority leaders, and civil society representatives --
      represents the democratic resistance to Myanmar's military dictatorship. Led by Acting
      President Duwa Lashi La (a Kachin leader, demonstrating the NUG's multi-ethnic character)
      and Prime Minister Mahn Winn Khaing Thann, the NUG operates from liberated territory
      primarily in Sagaing Region, where it announced plans in January 2025 to establish its
      physical headquarters and open ministerial offices. The NUG's armed wing, the People's
      Defense Force, was established on 5 May 2021 from pro-democracy youth activists who took
      up arms after the coup's brutal crackdown on peaceful protests. By 2025, the NUG's
      Ministry of Defence had established 356 PDF battalions and People's Defense Teams operating
      in 235 townships, with township-level people's administration functioning in 183 townships
      -- a remarkable achievement for a government that began with no territory, no army, and no
      international recognition. The PDF's fighters are overwhelmingly young volunteers,
      including former university students, medical professionals, engineers, and civil servants
      who abandoned careers to fight the junta. Their tactical innovation has been extraordinary:
      using 3D-printed weapons components, commercial drones modified for surveillance and
      bombing, improvised explosive devices, and guerrilla tactics studied from online sources.
      The PDF's coordination with ethnic armed organizations -- particularly the Kachin
      Independence Army, Karen National Union, Karenni National Progressive Party, and Chin
      National Front -- has been the critical force multiplier that enabled Operation 1027's
      success and subsequent territorial gains. However, the NUG faces severe structural
      challenges. It lacks international diplomatic recognition -- no government has formally
      recognized the NUG, though Myanmar's UN seat remains held by NUG-aligned Ambassador Kyaw
      Moe Tun, whose credentials were upheld by the UN General Assembly in December 2025.
      Malaysia's 2025 ASEAN chairmanship convened Stakeholder Engagement Meetings on Myanmar in
      May, August, and October 2025, but these achieved minimal progress and did not advance NUG
      legitimacy. The NUG struggles to control the diverse resistance landscape: ethnic armed
      organizations like the Arakan Army pursue their own autonomous agendas independent of NUG
      authority, and coordination between the Three Brotherhood Alliance (AA, TNLA, MNDAA) and
      NUG-aligned forces is tactical rather than strategic. The MNDAA's China-brokered ceasefire
      and return of Lashio in April 2025 was negotiated through Beijing, not the NUG. The
      Arakan Army's parallel governance in Rakhine State operates entirely outside NUG
      frameworks. The NUG held meetings with ethnic armed organizations in Kachin, Chin, and
      Kayah states from 23-25 January 2026 to discuss forming a unified coalition, but deep
      historical distrust between Bamar-majority democratic forces and ethnic minorities who
      suffered decades of Tatmadaw oppression remains a fundamental obstacle. The NUG's
      international engagement strategy centers on positioning itself as the legitimate
      democratic alternative -- Ambassador Kyaw Moe Tun at the UN has voted with Western
      positions including condemning Russia's invasion of Ukraine, directly contradicting the
      junta's pro-Russia stance. This alignment with the democratic world is genuine and
      strategic: the NUG needs Western sanctions pressure on the junta, humanitarian aid access,
      and eventual diplomatic recognition. On the Suwalki crisis, the NUG's interest is
      straightforward: anything that weakens Russian weapons supply to the junta is beneficial,
      anything that distracted the international community from Myanmar's crisis is harmful, and
      anything that strengthens the rules-based international order supports the NUG's
      legitimacy claim. NUG Defense Minister Yee Mon oversees the PDF's military operations,
      which have shifted from pure guerrilla warfare toward semi-conventional operations capable
      of holding territory, though the resistance still cannot take fortified urban centers
      without ethnic army support and lacks anti-aircraft weapons -- the junta's air superiority
      remains the PDF's greatest vulnerability.
    priorities:
      - "Advocate for international arms embargo on the Myanmar junta -- the Suwalki crisis is an opportunity to highlight Russian weapons fueling atrocities including 408 air attacks during the election period"
      - "Maintain NUG's hold on Myanmar's UN seat through Ambassador Kyaw Moe Tun -- continue voting with democratic positions to build Western solidarity"
      - "Strengthen coordination with ethnic armed organizations toward a unified federal democratic framework -- the January 2026 Kachin-Chin-Kayah meetings must produce concrete commitments"
      - "Lobby Western governments to recognize NUG as Myanmar's legitimate government and reject the junta's sham election results"
      - "Prevent Russian weapons resupply to the junta -- any disruption to Russian defense exports caused by the Suwalki crisis is a strategic opportunity"
      - "Secure humanitarian aid access for 3.5 million displaced persons and earthquake-affected populations"
      - "Develop anti-aircraft capabilities to counter the junta's sole decisive advantage -- the air force"
    red_lines:
      - "International community granting legitimacy to the junta's December 2025-January 2026 election results"
      - "China brokering a comprehensive ceasefire that freezes the status quo and leaves the junta in control of central Myanmar without democratic transition"
      - "ASEAN engagement that treats the junta as a legitimate interlocutor while marginalizing the NUG and resistance forces"
      - "Russian weapons deliveries that qualitatively shift the air war balance -- particularly precision-guided munitions, advanced radar, or new fighter aircraft beyond existing contracts"
      - "Ethnic armed organizations pursuing separate deals with the junta or China that fragment the resistance coalition"
    voice:
      style: "Passionate democratic rhetoric combined with military pragmatism. Frames the resistance as a people's revolution for federal democracy. References international law, UN principles, and the democratic mandate of the 2020 elections that the coup overthrew. Alternates between diplomatic English for international audiences and urgent operational language for internal coordination."
      quotes:
        - "The people of Myanmar voted overwhelmingly for democracy in November 2020. The military stole that vote with tanks and bullets. For five years, our people have fought back with extraordinary courage -- students became soldiers, doctors became field medics, engineers built drones from commercial parts. The National Unity Government is the legitimate government of Myanmar, and the world must recognize this truth."
        - "Every Russian Su-30 that bombs a village in Sagaing, every Yak-130 that strafes a displacement camp, every Mi-35 that fires on our positions -- these weapons are paid for with the blood of Myanmar's people and delivered by Moscow. The Suwalki crisis exposes Russia's true nature: an arms dealer to dictators. We call on every democratic nation to impose a comprehensive arms embargo on the junta."
        - "We welcome Ambassador Kyaw Moe Tun's continued representation of Myanmar at the United Nations. His vote condemning Russia's invasion of Ukraine reflects the values of the Myanmar people -- we stand with democratic nations against authoritarian aggression, whether in Europe or in our own country."
        - "The junta's sham elections are a fraud. 10.5 million voters excluded. 11 million boycotted. 408 air attacks during the voting period. A law that punishes election criticism with death. This is not democracy -- this is a military dictatorship wearing a ballot-box costume. We call on ASEAN and the international community to reject these results completely."
    key_relationships:
      allies:
        - country: "US"
          sentiment: "strongly_positive"
          context: "Primary international supporter. Burma Act strengthens US policy tools. NUG seeks diplomatic recognition and sanctions enforcement against junta revenue sources."
        - country: "GB"
          sentiment: "strongly_positive"
          context: "UK drafted UNSC resolutions on Myanmar. Strong parliamentary support for NUG. Sanctions on junta officials and military enterprises."
        - country: "EU"
          sentiment: "positive"
          context: "EU sanctions packages support NUG's isolation strategy. European Parliament has called for NUG engagement. Humanitarian aid flows through NUG-aligned channels in some areas."
        - country: "KR"
          sentiment: "positive"
          context: "South Korea has been sympathetic to democratic movements. Korean diaspora community supportive."
        - country: "JP"
          sentiment: "complex"
          context: "Japan maintains engagement with both sides. Sent election observers but also provides humanitarian aid. NUG seeks to pull Japan toward clearer democratic support."
        - country: "AU"
          sentiment: "positive"
          context: "Australia imposed sanctions on junta figures. Engages with Myanmar diaspora communities."
      rivals:
        - country: "RU"
          sentiment: "hostile"
          context: "Arms supplier to the junta. UNSC veto blocks international action. NUG voted against Russia at UNGA on Ukraine. Russian weapons directly responsible for civilian casualties."
        - country: "CN"
          sentiment: "deeply_distrustful"
          context: "China maintains primary relationship with junta, mediates ceasefires that serve Chinese interests, and dominates rare earth extraction. However, NUG recognizes China's leverage and seeks pragmatic engagement to prevent Beijing from fully backing the junta."
        - country: "SAC"
          sentiment: "existential_enemy"
          context: "The military junta is the NUG's primary adversary. The February 2021 coup, subsequent massacres, arbitrary detention of Aung San Suu Kyi, and ongoing air campaign against civilians define this relationship as one of fundamental enmity."

  - name: "Ethnic Armed Organizations Coalition (AA/TNLA/MNDAA & Allies)"
    role: "pragmatist_autonomist"
    personality: >
      The ethnic armed organizations of Myanmar -- particularly the Three Brotherhood Alliance
      of the Arakan Army (AA), Ta'ang National Liberation Army (TNLA), and Myanmar National
      Democratic Alliance Army (MNDAA) -- represent the most militarily effective anti-junta
      forces and the power brokers whose decisions will determine the civil war's outcome. These
      are not revolutionary movements born of the 2021 coup; they are armed organizations with
      decades of history fighting the Tatmadaw for ethnic self-determination, long predating the
      current crisis. Operation 1027, launched on 27 October 2023 by the Three Brotherhood
      Alliance, fundamentally changed the trajectory of the civil war. In its initial phase, the
      alliance captured over 220 junta positions and seized the strategically critical Kokang
      Self-Administered Zone including Laukkai. Phase 2 in mid-2024 escalated dramatically: the
      MNDAA captured Lashio -- the capital of northern Shan State and headquarters of the
      Tatmadaw's Northeast Command -- in August 2024, the first time a regional military command
      had fallen to rebels. The junta lost approximately 100 bases, several entire military
      battalions, and at least six district-level towns. The Arakan Army's simultaneous campaign
      in Rakhine State achieved near-total territorial control: by 2025, the AA controls 14 of
      17 Rakhine townships, the entire Bangladesh border, and the contiguous Paletwa township
      in Chin State. The AA's commander-in-chief, Twan Mrat Naing, leads the most sophisticated
      ethnic armed organization in Myanmar's history. The United League of Arakan (the AA's
      political wing) has established comprehensive parallel governance in controlled territory:
      its own courts drawing on customary Rakhine law and Buddhist legal traditions, taxation and
      revenue collection systems, security administration, and social services. The AA is
      building not just a military force but a proto-state -- and its ambition for Rakhine
      autonomy or independence operates entirely outside the NUG's federal democratic framework.
      The TNLA under Chairman Tar Bone Kyaw controls significant territory in northern Shan
      State, focused on Ta'ang (Palaung) ethnic areas. Peace talks with the junta were held in
      April 2025 with Chinese mediation but collapsed when the military demanded control over
      TNLA-held territory. The MNDAA under Chairman Peng Daxun represents the Kokang Chinese
      community and operates under the heaviest Chinese influence of any ethnic armed
      organization. Beijing pressured the MNDAA to withdraw from Lashio in March-April 2025,
      cutting electricity and internet and closing border crossings until the MNDAA complied.
      The Lashio handover demonstrated both China's decisive leverage and the MNDAA's
      vulnerability to Chinese pressure. The formal ceasefire signed January 18, 2025 in
      Kunming under Chinese mediation, with border gates at Chin Shwe Haw and Yanlonkyine
      reopened, effectively made the MNDAA a Chinese client. The broader ethnic armed
      organization landscape includes the Kachin Independence Army (KIA), which controls rare
      earth mining sites in Kachin State that are strategically critical for Chinese supply
      chains (Myanmar accounts for over 60% of China's heavy rare earth imports). The KIA
      seized Chinese-operated rare earth sites in early 2024, prompting China to briefly close
      the border -- a demonstration of how resource control translates into geopolitical
      leverage. In June 2025, China opened new rare earth mines in Shan State with support from
      the United Wa State Army (UWSA), an ethnic armed organization with the closest ties to
      Beijing, expanding beyond the existing 370 mining sites and 2,700 in-situ leaching ponds
      in Kachin State. The ethnic armed organizations' relationship with the NUG is tactical,
      not strategic. They cooperated against the common enemy (the Tatmadaw) but do not accept
      NUG authority over their territories or governance. The January 2026 meetings between NUG
      and ethnic armed organizations in Kachin, Chin, and Kayah states to discuss a unified
      coalition reflect both aspiration and deep structural difficulty. Decades of Bamar-dominated
      governance -- including under Aung San Suu Kyi's NLD government, which ethnic minorities
      viewed as insufficiently committed to federalism -- mean that trust must be built from
      scratch. For the Suwalki crisis, the ethnic armed organizations' calculation is different
      from both the junta's and the NUG's. They care about two things: China's posture and the
      weapons pipeline. China is their primary external interlocutor -- not Russia, not the West.
      If the Suwalki crisis shifts Chinese strategic calculations in ways that affect Beijing's
      Myanmar engagement (more pressure on ethnic armed organizations to accept ceasefires, or
      conversely, reduced Chinese bandwidth for mediation), the ethnic armed organizations feel
      it directly. Russian weapons to the junta are a concern insofar as they sustain the air
      war, but the ethnic armed organizations have survived decades of Tatmadaw air superiority
      and view ground control as decisive. The rare earth dimension adds a unique strategic
      element: competition between China, the Quad (following the July 2025 Critical Minerals
      Initiative), India, and the US over northern Myanmar's mineral wealth is drawing great
      power attention to territories that ethnic armed organizations control -- creating leverage
      but also risk.
