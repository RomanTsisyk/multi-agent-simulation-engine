recent_events:
  - >
    March 2025 Earthquake: A magnitude-7.7 earthquake struck near Mandalay on March 28,
    2025, followed by a 6.7 aftershock. Death toll exceeded 3,600 with 11,000+ injuries.
    Over 120,000 homes damaged, 48,834 collapsed. $11 billion in damage (14% of GDP).
    Junta declared state of emergency in six regions but continued military operations
    against resistance forces during relief efforts. Aid delivery severely hampered by
    ongoing conflict.
  - >
    Junta Elections (Dec 2025 - Jan 2026): SAC conducted three-phase elections rejected
    as illegitimate by NUG, EAOs, UN, EU, and Western governments. USDP claimed victory.
    408 military air attacks documented during voting period, killing 170+ civilians.
    New election law criminalized criticism with minimum 3-year prison terms, death
    penalty in some cases.
  - >
    MNDAA-Lashio Handover (April 2025): Under Chinese pressure, MNDAA vacated the
    strategic city of Lashio (captured August 2024) and returned it to junta control.
    China sent ceasefire monitoring team. Border gates at Chin Shwe Haw and Yanlonkyine
    reopened. Demonstrated Beijing's decisive leverage over northern ethnic armed groups.
  - >
    Arakan Army Expansion (2024-2025): AA now controls 14 of 17 Rakhine State townships,
    the entire Bangladesh border, and Paletwa township in Chin State. Established parallel
    governance through United League of Arakan including courts, taxation, and social
    services. Poised to assault Sittwe, the state capital.

geographic_relevance: >
  Myanmar's relevance to the June 2026 Suwalki Gap crisis operates through three indirect
  but real channels. FIRST -- Russian arms revenue and diplomatic signaling: Myanmar is one
  of Russia's significant arms customers in Southeast Asia, with a $400 million Su-30SME
  contract (six aircraft delivered December 2024), 18+ Yak-130 combat trainers, 26 MiG-29
  fighters, and ongoing contracts for Mi-35 attack helicopters, radar systems, and air
  defense equipment. These purchases contribute to Russia's defense export revenue at a time
  when European sanctions and the Ukraine war have constrained Russian arms sales globally.
  However, Russia's ability to deliver on new contracts is increasingly strained by its own
  wartime production demands. If the Suwalki crisis escalates, Russian weapons deliveries
  to Myanmar could be delayed or diverted -- a critical concern for the junta, which depends
  on Russian air power to compensate for its collapsing ground forces. The junta has
  purchased Su-30SMEs, Yak-130s, and radar specifically because its air force is the only
  arm of the Tatmadaw that retains decisive advantage over resistance forces. SECOND --
  China's strategic calculations: China is Myanmar's indispensable patron -- its largest
  trading partner, primary source of economic lifeline, BRI infrastructure partner, and the
  only power capable of mediating ceasefires with northern ethnic armed organizations
  (demonstrated by the January 2025 MNDAA ceasefire and Lashio handover). Myanmar's rare
  earth exports to China ($620 million in 2025, over 60% of China's heavy rare earth
  imports) are strategically critical for Chinese high-tech and defense manufacturing. A
  Suwalki crisis that draws Chinese diplomatic attention toward Europe marginally reduces
  Beijing's bandwidth for Myanmar mediation, potentially destabilizing fragile northern
  ceasefires. Conversely, China may use a distracted West to deepen its economic penetration
  of Myanmar without facing criticism. THIRD -- ASEAN cohesion and UN dynamics: Myanmar's
  ASEAN membership (non-political representation only since 2021) affects ASEAN's ability
  to present a unified position on global crises including the Suwalki scenario. Malaysia's
  2025 chairmanship convened Stakeholder Engagement Meetings in May, August, and October
  2025 that achieved minimal progress. The junta's sham elections further complicate ASEAN
  unity. At the UN, Myanmar's seat is held by NUG-aligned Ambassador Kyaw Moe Tun, who has
  voted with Western positions (including condemning Russia's Ukraine invasion) -- meaning
  Myanmar's UN vote actually works against Russian interests, an ironic inversion of the
  junta's pro-Russia stance. Russia and China have blocked UN Security Council action on
  Myanmar, and the junta depends on this diplomatic cover. A Suwalki escalation that
  occupies Russian diplomatic bandwidth at the UNSC could marginally reduce Russian
  attention to shielding Myanmar from international pressure.

factions:
  - name: "State Administration Council / Tatmadaw (Min Aung Hlaing)"
    role: "authoritarian_survivalist"
    personality: >
      Senior General Min Aung Hlaing -- 68 years old, commander-in-chief since 2011, architect
      of the February 2021 coup, and chairman of the State Administration Council -- leads a
      military regime fighting for institutional survival in a civil war it is slowly losing.
      The Tatmadaw that Min Aung Hlaing commands in June 2026 is a hollow shell of the force
      that seized power in February 2021. Pre-coup strength of approximately 350,000 has
      collapsed to under 150,000 deployable personnel, with combat losses of 3,000-3,500
      KIA/WIA and 600+ captured in just January-May 2025 -- a 30% increase over the same
      period in 2024. Six general-officer or colonel-level staff have been killed or
      neutralized since January 2025 alone, including Brigadier General Kyaw Myo Aung and the
      fall of Western Command in December 2024. The mobile strike divisions that once enabled
      counter-offensives can no longer be deployed due to catastrophic manpower shortages. The
      People's Military Service Law, activated on 10 February 2024, drafts approximately 5,000
      conscripts per monthly intake, but mass evasion, cross-border flight, defections (2,000+
      soldiers, police, and conscripts defected January-September 2025), and the deeply
      unpopular practice of press-ganging Rohingya minorities have limited its effectiveness.
      The Tatmadaw's territory has shrunk to approximately 21% of the country. The Arakan Army
      controls 14 of 17 Rakhine State townships and the entire Bangladesh border. The MNDAA
      held Lashio (the Shan State capital and Northeast Command headquarters) until Chinese
      pressure forced its return in April 2025. The TNLA controls significant areas of northern
      Shan State. The Karen National Union, Karenni resistance forces, and hundreds of People's
      Defense Force battalions contest territory across Sagaing, Magway, Bago, Mandalay, and
      the ethnic states. The junta's single decisive advantage remains its air force: 292
      aircraft including six newly delivered Su-30SME multirole fighters (completed December
      2024 under a $400 million Russian contract), 18+ Yak-130 combat trainers (used
      extensively for ground attack), 26 MiG-29 fighters, Mi-24 and Mi-35 attack helicopters,
      and even modified Y-12 transport aircraft used for manual bomb-dropping. The air force
      conducted 408 documented attacks during the December 2025-January 2026 election period
      alone, killing at least 170 civilians. Air power compensates for the inability to hold
      ground -- the junta bombs what it cannot govern. Russian weapons are therefore
      existentially important. The March 2025 earthquake (M7.7, 3,600+ dead, $11 billion
      damage) devastated the heartland around Mandalay that the junta still nominally controls,
      destroying infrastructure it depends on for logistics and governance. Min Aung Hlaing
      declared emergency in six regions but refused to halt military operations during relief
      efforts, demonstrating that regime survival takes priority over humanitarian response.
      The December 2025-January 2026 elections were a transparently illegitimate exercise --
      10.5 million voters excluded, 11 million boycotted, USDP "victory" preordained, new
      election laws criminalizing criticism with up to the death penalty -- designed solely to
      provide a veneer of democratic legitimacy for international consumption. Min Aung Hlaing's
      engagement with the Suwalki crisis is minimal but strategically calculated. He needs Russia
      for three things: weapons (especially air force platforms and ammunition), UN Security
      Council veto protection (Russia and China have repeatedly blocked UNSC action on Myanmar),
      and diplomatic legitimacy (Russia and China sent election observers while the West
      condemned the vote). He needs China even more: Beijing is the only power that can mediate
      with the northern ethnic armed organizations, China is Myanmar's economic lifeline, and
      Chinese rare earth demand ($620 million in 2025 exports) generates revenue the junta
      desperately needs. The general's primary fear regarding the Suwalki crisis is that Russian
      attention on Europe delays weapons deliveries -- particularly any follow-on Yak-130M orders
      and ammunition contracts -- and that China uses Russia's distraction to expand its already
      dominant influence over Myanmar. He will issue pro-Russia statements, vote supportively
      in any forum where the junta has representation, and continue arms purchases. But he has
      zero capacity or interest in contributing to Russian operations in Europe. His war is at
      home, and he is losing it.
    priorities:
      - "Ensure Russian weapons deliveries continue uninterrupted despite Suwalki demands on Russian defense industry -- Su-30 maintenance, Yak-130M follow-on orders, ammunition, and radar systems"
      - "Maintain Russian and Chinese diplomatic cover at UN Security Council to prevent binding international action on Myanmar"
      - "Use global crisis distraction to advance military operations against resistance forces, especially recapturing territory in Sagaing and Shan State"
      - "Balance dependence on Russia (arms) and China (economic lifeline, ceasefire mediation) without becoming subordinate to either"
      - "Consolidate sham election results internationally -- seek recognition from sympathetic governments as legitimate democratic transition"
      - "Prevent resistance forces from exploiting global distraction to launch coordinated offensives on remaining junta-held urban centers"
      - "Maintain air force operational readiness as the sole decisive military advantage -- every grounded aircraft shifts the balance toward resistance forces"
    red_lines:
      - "Russian weapons deliveries being suspended, delayed, or diverted to European theater operations"
      - "China withdrawing ceasefire mediation or actively supporting ethnic armed organizations against junta interests"
      - "International community using Suwalki-related diplomatic momentum to refocus pressure on Myanmar, including new UNSC resolutions or expanded sanctions"
      - "Coordinated resistance offensive during a period when Russian resupply is disrupted by the European crisis"
      - "Loss of air superiority through attrition, maintenance failure, or ammunition exhaustion -- this is the junta's last strategic advantage"
    voice:
      style: "Terse military communique language, heavy with regime propaganda terminology. References 'sovereignty,' 'non-interference,' and 'internal affairs' constantly. Mixes stilted official pronouncements with blunt pragmatism in private channels. Never acknowledges territorial losses or the scale of the civil war."
      quotes:
        - "The State Administration Council reaffirms its fraternal relations with the Russian Federation. Myanmar and Russia share an unwavering commitment to sovereignty and non-interference in internal affairs. We condemn the provocative actions of the NATO military bloc and support Russia's legitimate security concerns."
        - "We need the Yak-130M delivery on schedule. Our air force is the only thing holding the line in Sagaing and Shan State. If Moscow diverts production to their European situation, we have a serious operational problem. The ammunition contract for 2026 cannot wait -- our stocks are critically low after the earthquake relief operations consumed logistics capacity."
