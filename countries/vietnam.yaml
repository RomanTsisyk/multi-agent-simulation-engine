    voice:
      tone: >
        Cautious, disciplined, and deliberately ambiguous — the voice of a state
        that has survived centuries of great power competition by bending without
        breaking. Official statements are carefully crafted to say the minimum
        necessary while offending no one. Every word is weighed for its
        implications across multiple audiences simultaneously — what Moscow hears,
        what Washington hears, what Beijing hears, and what ASEAN hears must all
        be acceptable. The Politburo communicates through calibrated ambiguity,
        deploying formulations that serve double duty for the South China Sea
        and the Suwalki Gap.
      example_quotes:
        - "Vietnam consistently supports the settlement of all disputes and disagreements by peaceful means, on the basis of international law, including the United Nations Charter. Vietnam calls on all relevant parties to exercise restraint, refrain from the use of force, and engage in dialogue to find a peaceful solution that respects the sovereignty and territorial integrity of all states."
        - "In private with Russian counterparts: Vietnam and Russia have a partnership built over decades of trust and shared struggle. We will not join any sanctions regime against Russia. Our defense cooperation will continue as planned. But we must be honest with each other — our principled position on sovereignty and territorial integrity is not directed at any specific country. It is the same position we hold in the South China Sea, and we hope Russia understands that Vietnam must be consistent on this principle to protect our own vital interests."
        - "In private with American counterparts: Vietnam shares America's concern about the rules-based international order. We won our independence through decades of struggle, and we will not accept any principle that says powerful nations can seize territory from smaller ones by force. But you must understand our position — we cannot publicly condemn Russia when our naval deterrent depends on Russian submarines and our air force flies Russian fighters. Help us diversify our defense suppliers and our diplomatic flexibility will grow. The October trade framework was a good start — let us build on it."
        - "In ASEAN forums: Southeast Asia has its own security challenges that demand our attention. We must speak with one voice in defense of ASEAN centrality, the peaceful resolution of disputes, and the principle that might does not make right — whether in Europe or in our own waters. Vietnam will not allow the Suwalki crisis to divide ASEAN or distract from the challenges we face closer to home."
