      - "Monitor Chinese military activity in the South China Sea — any opportunistic escalation during a European crisis is a direct and immediate threat to Vietnamese sovereignty"
      - "Maintain ASEAN consensus on non-alignment, centrality, and peaceful dispute resolution to preserve the multilateral framework Vietnam depends upon"
    red_lines:
      - "Disruption of Russian arms deliveries or spare parts — Vietnam cannot defend its South China Sea claims without operational Kilo submarines and Su-30MK2 fighters"
      - "Western secondary sanctions that force Vietnam to choose between Russian military hardware and Western trade and investment — this is the nightmare scenario"
      - "Any international precedent that legitimizes territorial seizure by force — this directly threatens Vietnam's legal position on the Paracels and Spratlys"
