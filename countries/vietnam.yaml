      - "Defend the principle of territorial integrity and peaceful dispute resolution under UNCLOS — this is Vietnam's primary shield against Chinese expansionism in the South China Sea"
      - "Maintain and deepen the US Comprehensive Strategic Partnership — the US is a critical strategic counterbalance to China and Vietnam's largest export market"
      - "Avoid being forced into a binary choice between Russia and the West — Vietnam's security depends on maintaining relationships with both simultaneously"
