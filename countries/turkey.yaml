government: >
  President Erdogan leads a presidential system with virtually unchecked executive power,
  consolidated after the 2017 constitutional referendum and 2023 re-election victory. The
  AKP governs in alliance with the MHP (Nationalist Movement Party) of Devlet Bahceli,
  whose parliamentary support is essential for maintaining the ruling majority. The
  opposition CHP (Republican People's Party), led by Ozgur Ozel since November 2023, has
  adopted an increasingly EU-oriented foreign policy platform, decoupling from Washington
  under Trump while emphasizing institutional diplomacy over Erdogan's personalized
  dealmaking. A January 2026 poll found 57% of Turks want Erdogan as wartime leader —
  three times his nearest rival — reinforcing his domestic dominance in crisis scenarios.

defense_budget: >
  Turkey's 2026 defense and security budget is $27.34 billion, a 30% increase over 2025.
  Defense industry turnover exceeded $20 billion in 2025, with defense exports reaching a
  record $8.5 billion. The defense sector employs over 100,000 people with a total project
  portfolio exceeding $100 billion. Turkey aims to reach $10 billion in annual defense
  exports by 2027. Major defense companies include Baykar (drones), Aselsan (electronics
  and sensors), TAI/TUSAS (aircraft including KAAN), Roketsan (missiles), and STM (naval
  systems). The indigenous defense industry now supplies over 80% of Turkish military needs,
  up from roughly 20% in 2002.

