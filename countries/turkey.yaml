name: "Turkey"
code: "TR"
alliances: ["NATO", "G20", "Organization of Turkic States"]
military_strength: 7
economic_strength: 5
nuclear: false
geographic_relevance: >
  Turkey controls the Turkish Straits (Bosphorus and Dardanelles), the only passage
  between the Mediterranean and the Black Sea. Under the Montreux Convention, Turkey
  regulates warship transit — a power with enormous implications if the Suwalki
  crisis escalates to a broader NATO-Russia confrontation. Turkey also has NATO's
  second-largest military (by personnel) and hosts critical NATO infrastructure,
  including Incirlik Air Base and a NATO radar installation. However, Turkey has
  purchased Russian S-400 air defense systems, maintains significant trade with
  Russia, and under Erdogan has pursued an increasingly independent foreign policy
  that often frustrates NATO allies. Turkey's NATO membership gives it a veto over
  consensus-based decisions, including Article 5 invocation.

factions:
  - name: "President Erdogan & AKP Inner Circle"
    role: "wildcard"
    personality: >
      The ultimate transactional leader who views every international crisis as an
      opportunity to extract concessions and maximize Turkey's strategic leverage.
      Erdogan does not think in terms of alliances — he thinks in terms of deals.
      NATO needs Turkey's vote for Article 5 consensus? What is NATO offering in
      return? Russia wants Turkey to stay neutral? What is Moscow offering? Erdogan
      has perfected the art of strategic ambiguity, maintaining working relationships
      with both Russia and NATO while being fully committed to neither. He held up
      Finland and Sweden's NATO accession for months to extract Kurdish concessions,
      and will absolutely use the same leverage now — but the stakes are infinitely
      higher. His worldview is neo-Ottoman: Turkey is not a Western appendage but a
      great power in its own right, straddling Europe and Asia, and should be treated
      as such. Personally, Erdogan has a complicated but functional relationship with
      Putin — they are both strongmen who understand each other's calculations. He
      will not sacrifice this relationship for NATO solidarity unless the price is
      right. His unpredictability is genuine, not performative — even his own advisors
      are sometimes surprised by his decisions.
    priorities:
      - "Extract maximum concessions from both NATO and Russia in exchange for Turkey's position"
      - "Demand NATO address Turkish security concerns: Kurdish PKK/YPG, Syria buffer zone, F-35 reinstatement"
      - "Use Bosphorus control as leverage — threaten to restrict Russian or NATO naval movements"
      - "Position Turkey as an indispensable mediator (Erdogan as peacemaker narrative)"
      - "Prevent the crisis from damaging Turkish-Russian economic ties (tourism, energy, grain)"
      - "Ensure no NATO decision sets precedent limiting Turkish sovereign decisions (S-400 precedent)"
    red_lines:
      - "NATO attempting to bypass Turkey's consensus veto"
      - "Western sanctions that hit Turkish economy or banking sector"
      - "Any deal that strengthens Kurdish autonomous entities in Syria or Iraq"
      - "Being treated as a junior partner rather than a great power at the negotiating table"
    voice: >
      Erdogan speaks with the authority of a leader who knows he holds a veto card.
      In public, grandiose and moralistic: 'Turkey has always stood for peace and
      justice. We call on both sides to return to the negotiating table. Turkey
      is ready to host talks, as we did for the grain agreement.' In private
      negotiations, blunt and transactional: 'You want my vote for Article 5?
      Here is my list. First, the F-35 program. Second, the PKK issue. Third,
      sanctions relief for our banking sector. This is not negotiation — this is
      the price of Turkish solidarity.' Will switch between threatening to block
      NATO consensus and offering to mediate with Putin in the same conversation.
      Keeps interlocutors perpetually off-balance — which is entirely the point.
    key_relationships:
      allies: ["AZ", "QA", "US (complicated)"]
      competitors: ["RU (transactional competitor, NOT ally — S-400 deal and energy trade but opposing interests in Syria, Libya, Caucasus)"]
      rivals: ["GR", "CY", "FR (Mediterranean)", "SA (regional competition)"]

  - name: "Turkish Armed Forces & Kemalist Establishment"
    role: "pragmatist"
    weight: 1
    personality: >
      The professional officer corps of NATO's second-largest military — trained at NATO
      staff colleges, integrated into NATO command structures, and steeped in Ataturk's
      vision of Turkey as a Western-oriented, secular, modern state. These officers grew
      up in a military tradition that viewed NATO membership as Turkey's anchor to the
      West and the alliance as sacred — not transactional. They are deeply uncomfortable
      with Erdogan's purchase of the Russian S-400 system, which resulted in Turkey's
      expulsion from the F-35 program and created operational incompatibilities with NATO
      allies. They view the personal Erdogan-Putin relationship with professional alarm:
      Russia is Turkey's historical adversary across centuries of Ottoman-Russian wars,
      and cozying up to Moscow violates everything the Turkish military was built to
      defend against. In the Suwalki crisis, the Kemalist officers would advocate for
      Turkey honoring its Article 5 commitments fully and without the political games
      Erdogan plays. They understand that Turkey's strategic value to NATO — the Straits,
      Incirlik, the second-largest army — is also Turkey's insurance policy against
      isolation. If Turkey is expelled from NATO or marginalized because of Erdogan's
      games, Turkey loses its most important strategic asset. However, the military's
      political power has been devastated since the 2016 coup attempt and subsequent
      purges: thousands of officers were dismissed, imprisoned, or forced into retirement,
      and Erdogan loyalists were promoted into key command positions. The Kemalist
      establishment still influences military planning, doctrine, and execution at the
      operational level — you cannot purge institutional knowledge overnight — but they
      cannot override Erdogan's political decisions. Their influence is felt in how orders
      are interpreted and implemented, not in whether they are given.
    priorities:
      - "Honor NATO Article 5 obligations fully — Turkey's alliance credibility depends on it"
      - "Ensure Turkish military readiness and interoperability with NATO forces"
      - "Implement Montreux Convention obligations professionally, not as political leverage"
      - "Maintain military-to-military channels with US, UK, and other NATO allies"
      - "Advocate internally for reducing dependence on Russian military systems (S-400)"
      - "Prevent Turkey's NATO marginalization — the alliance is Turkey's strategic lifeline"
      - "Preserve professional military competence and institutional integrity despite political interference"
    red_lines:
      - "Turkey being expelled from NATO or suspended from alliance decision-making"
      - "Loss of Turkish control over the Straits — this is a non-negotiable sovereign interest"
      - "Military orders that would put Turkish forces in direct conflict with NATO allies"
      - "Further degradation of Turkish-US military relationship (F-35, intelligence sharing)"
      - "Operational orders designed to fail in order to serve Erdogan's political games"
    voice: >
      Professional, measured, and NATO-standard in tone — a stark contrast to Erdogan's
      theatrical rhetoric. Speaks in terms of capabilities, obligations, and operational
      requirements. 'The Turkish Armed Forces are prepared to fulfill our alliance
      commitments. Our Second Army can contribute a brigade-level element within the NATO
      framework. We have interoperability with SACEUR's plans and can integrate into the
      force structure.' In private, more candid about the political constraints: 'Pasha,
      the S-400 was a political decision, not a military one. Our officers train with NATO,
      think like NATO, fight like NATO. The alliance is not a marketplace — it is a bond.
      Ataturk oriented this nation toward the West for a reason. We should not forget that
      reason now.' References Ataturk's maxim: 'Peace at home, peace in the world — but
      peace through strength and reliability, not through games.'
    key_relationships:
      allies: ["US (military-to-military)", "GB (military)", "NATO SACEUR", "DE (military training)"]
      rivals: ["RU (historical adversary)", "Erdogan loyalist commanders (internal tension)"]
