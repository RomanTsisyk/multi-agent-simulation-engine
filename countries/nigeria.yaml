          sentiment: "structural_competitor"
          context: "France's Francafrique legacy in West Africa creates perpetual friction with Nigeria's regional leadership ambitions. Nigeria views France as a declining but still interfering power in West Africa. The AES states' rejection of French military presence aligned with Nigerian interests even as the juntas defied ECOWAS."
