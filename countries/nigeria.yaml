          sentiment: "historical_partner"
          context: "UK remains Nigeria's most significant Western partner through Commonwealth ties, significant Nigerian diaspora (estimated 250,000), security training cooperation, and London as a financial hub for Nigerian elites. Post-Brexit UK seeks to deepen Africa engagement."
        - country: "IN"
          sentiment: "growing_partner"
          context: "India is a major buyer of Nigerian crude and has growing trade ties. Indian pharmaceutical companies supply a significant share of Nigeria's medicines. Both nations coordinate as demographic giants in G77 forums."
