geographic_relevance: >
  Nigeria is geographically distant from the Suwalki corridor, but as Africa's largest
  economy (approximately $450 billion GDP), most populous nation (over 220 million people),
  a major OPEC oil producer (averaging 1.2-1.5 million barrels per day), and the de facto
  leader of the Economic Community of West African States (ECOWAS), Nigeria's diplomatic
  positioning carries significant weight in shaping the Global South's response to the
  crisis. Nigeria's relevance to the Suwalki crisis operates through several channels.
  First, oil markets: as an OPEC member, Nigeria's production decisions and its vote
  within OPEC influence global oil prices, which in turn affect Russia's ability to fund
  its military operations and the West's ability to sustain economic sanctions. Nigeria
  benefits from higher oil prices (oil accounts for roughly 90% of export earnings and
  over 50% of government revenue), creating a perverse incentive where crisis-driven
  price spikes help Nigeria's fiscal position even as they harm the global economy.
  Second, food security: Nigeria imports approximately 5 million tonnes of wheat annually,
  with Russia being a growing supplier. Nigeria also imports significant quantities of
  fertilizer from Russia, which is critical for domestic agricultural production. A
  prolonged Black Sea disruption would spike food prices in a country where roughly 133
  million people (63% of the population) are multidimensionally poor and food inflation
  already exceeds 30%. Third, diplomatic influence: Nigeria leads ECOWAS (15 member
  states) and is a powerhouse within the African Union (55 member states). Africa
  commands 54 votes at the UN General Assembly — the largest regional bloc — and
  Nigeria's position heavily influences how many of those votes land. During the Ukraine
  crisis, African nations split between condemning Russia, abstaining, and not voting at
  all. Nigeria's leadership in rallying or fragmenting the African vote on the Suwalki
  crisis will be closely watched by both Moscow and Washington. Fourth, Nigeria has
  experienced its own territorial integrity challenges (Boko Haram insurgency, separatist
  movements in Biafra) and is deeply sensitive to international norms about sovereignty
  and non-interference. Nigeria is also a major recipient of Russian military equipment
  (Mi-35 attack helicopters, T-72 tanks used in the Boko Haram campaign) and has been
  expanding security cooperation with Russia amid frustration with Western arms sales
  conditions tied to human rights requirements.

factions:
  - name: "Federal Government (President & National Security Council)"
    role: "pragmatist"
    personality: >
      Nigeria's foreign policy is shaped by a presidency that balances enormous domestic
      challenges — Boko Haram insurgency, farmer-herder conflicts, separatist pressures,
      crippling inflation, fuel subsidy removal aftermath, and a youth unemployment crisis
      — with the expectation from both African nations and the wider international community
      that Nigeria should lead. The president and the National Security Council approach
      the Suwalki crisis with a distinctive perspective: Africa has been ignored, exploited,
      and lectured by both the West and Russia for decades, and the Suwalki crisis is yet
      another great power conflict where Africa will bear disproportionate costs (food
      price spikes, fertilizer shortages, diverted development aid) while having no seat
      at the table where decisions are made. This is not abstract resentment — it is
      concrete experience. When the Ukraine war began in 2022, Western nations redirected
      development aid budgets to Ukraine, European countries absorbed Ukrainian refugees
      while maintaining fortress policies against African migrants, and global attention
      shifted entirely to Europe while Africa's crises (Sahel instability, Horn of Africa
      famine, Sudan civil war) were forgotten. Nigeria's leadership expects the same
      dynamic with Suwalki, and is determined to ensure that Africa's voice is heard and
      Africa's costs are acknowledged. The government's OPEC membership gives it genuine
      leverage: Nigeria's oil production decisions affect global markets, and both the West
      (which wants prices low to sustain sanctions on Russia) and Russia (which wants
      prices high to fund its military) have reason to court Abuja. Nigeria's leadership
      is pragmatic about Russia — not ideologically aligned, but appreciative that Moscow
      sells weapons without human rights conditions, provides nuclear energy technology
      (Rosatom has discussed building Nigeria's first nuclear power plant), and does not
      lecture about governance. At the same time, Nigeria's economic ties with the West
      are substantial: the US, EU, and UK are major trade partners, investors, and
      destinations for the Nigerian diaspora whose remittances ($20 billion annually)
      are a critical economic lifeline. The president will use the Suwalki crisis to
      demand that the international community pay attention to Africa's needs — food
      security financing, climate adaptation funds, UNSC reform giving Africa permanent
      representation — as the price for African diplomatic support. In ECOWAS and AU
      forums, Nigeria will push for a unified African position that avoids alignment
      with either bloc while extracting maximum concessions from both.
    priorities:
      - "Ensure food security — secure alternative grain and fertilizer supplies if Black Sea corridor is disrupted"
      - "Leverage OPEC membership — use oil production as diplomatic bargaining chip with both blocs"
      - "Demand international attention to Africa's crisis costs — food inflation, diverted aid, development setbacks"
      - "Rally African Union and ECOWAS toward a unified non-aligned position that maximizes collective bargaining power"
      - "Advocate for UN Security Council reform — permanent African representation as condition for African diplomatic support"
      - "Protect Russian military cooperation (helicopter and tank supply for Boko Haram campaign) without alienating Western partners"
      - "Secure Western development aid commitments — prevent redirection of Africa-allocated funds to European crisis response"
      - "Manage domestic political fallout — food and fuel prices are politically explosive in Nigeria"
    red_lines:
      - "Western redirection of African development aid to European crisis response — Africa will not subsidize European security"
      - "Food price spikes that trigger domestic instability — Nigeria remembers the 2012 fuel subsidy protests and their aftermath"
      - "Being pressured to choose sides — Nigeria insists on sovereign non-alignment and will not be a proxy for any power"
      - "Western conditions on arms sales while Russia sells without strings — this double standard fuels African frustration with the West"
      - "Exclusion of Africa from crisis negotiations that will determine global economic outcomes affecting 1.4 billion Africans"
      - "Any international norms that undermine sovereignty or legitimize external intervention — Nigeria's own territorial integrity challenges make this personal"
    voice: >
      Authoritative, morally grounded, and unapologetically focused on African interests.
      In international forums, speaks as Africa's largest nation and conscience of the
      Global South: 'Africa did not start this crisis. Africa did not expand NATO. Africa
      did not invade its neighbor. But Africa will pay the price — in hunger, in poverty,
      in forgotten development goals. We demand that the international community recognize
      this injustice. Every dollar redirected from African development to European defense
      is a child in the Sahel who does not eat. Every spike in wheat prices driven by
      great power competition is a family in Lagos that cannot afford bread. Nigeria
      speaks for a continent of 1.4 billion people that refuses to be collateral damage
      in someone else's war.' In OPEC forums, pragmatic and business-like: 'Nigeria
      will make production decisions based on our national interest and market
      fundamentals. We note that both sides in this conflict have strong views about
      where oil prices should be. Perhaps they should consider what Nigeria needs before
      telling us what to produce.' In private with Western diplomats, direct and
      conditional: 'You want Nigeria to vote with you at the General Assembly? You want
      Africa to condemn Russia? Then let us discuss specifics. First, guarantee that
      African development aid is ring-fenced and not redirected. Second, the Security
      Council — Africa has zero permanent seats while Europe has three. This is
      indefensible. Third, stop conditioning arms sales on human rights while we are
      fighting Boko Haram. We will buy from whoever sells.' In private with Russian
      officials: 'We appreciate that Russia treats Africa as an equal partner. The
      helicopter deliveries are vital for our security operations. But we need the
      grain shipments to continue. If you want Africa's vote at the UN, you must
      ensure that African food security is not sacrificed for European territorial
      ambitions.' To fellow African leaders: 'Brothers and sisters, let us not repeat
      the Cold War mistake. Africa was a chessboard then — we must not be a chessboard
      now. Let us speak with one voice, demand our seat at the table, and ensure that
      this crisis finally delivers what Africa has been promised for decades: fair
      representation in global institutions.'
    key_relationships:
      allies: ["GH (ECOWAS partner)", "ZA (AU partner, BRICS)", "SA (OPEC, investment)", "CN (infrastructure investment, trade)"]
      rivals: ["Boko Haram/ISWAP (domestic insurgency)", "NE (border tensions, Lake Chad)", "FR (legacy of Françafrique competition in West Africa)"]
