          sentiment: "hostile_neighbor"
          context: "The July 2023 Niger coup and subsequent ECOWAS sanctions standoff humiliated Nigeria. Niger's withdrawal from ECOWAS in January 2025, alignment with Russia via Wagner/Africa Corps, and border tensions create an active security threat on Nigeria's 1,500km northern border."
        - country: "RU"
          sentiment: "complicated_supplier"
          context: "Russia sells Mi-35M helicopters and T-72 tanks critical for the Boko Haram campaign without human rights conditions, provides nuclear energy technology through Rosatom discussions, and supplies grain and fertilizer. But Russia's support for Sahelian juntas that defied ECOWAS undermines Nigerian regional authority. Nigeria wants Russian weapons and grain but resents Russian influence operations in its neighborhood."

  - name: "Nigerian Armed Forces High Command"
    role: "security_hawk"
    personality: >
      The Nigerian Armed Forces, under Chief of Defence Staff General Olufemi Oluyede
      (appointed October 2025, succeeding General Christopher Musa who became Minister of
      Defence in December 2025), represent a military institution simultaneously fighting on
      multiple fronts while attempting to modernize and professionalize. Nigeria's military is
      ranked 31st globally and 3rd in Africa by the 2025 Global Firepower Index, with over
      215,000 active personnel, making it the largest military in West Africa and one of the
      most combat-experienced forces on the continent. However, this experience has come at
      enormous cost. The northeast counterinsurgency against Boko Haram and its more
      dangerous offshoot, the Islamic State West Africa Province (ISWAP), has consumed the
      military's attention and resources for over fifteen years. ISWAP — which split from
      Boko Haram in 2016 and has since eclipsed its parent organization in territorial
      control, military capability, and administrative governance — launched a devastating
      offensive campaign in May 2025, overrunning fifteen Nigerian military supercamps in
      Borno State in what was dubbed the "holocaust of the camps," seizing main battle tanks,
      armored vehicles, weapons, and ammunition while employing kinetic drones and foreign
      fighters with unprecedented tactical sophistication. This catastrophe exposed the
      military's structural vulnerabilities: overstretched forces, inadequate equipment
      maintenance, poor intelligence coordination, and dependence on foreign weapons systems
      that are difficult to maintain. The 2026 defense budget allocates 5.41 trillion naira
      ($3.9 billion), with the Nigerian Army receiving 1.504 trillion naira — the largest
      share. But approximately 70% of the defense budget goes to personnel costs, leaving
      insufficient funds for equipment, maintenance, and modernization. The military's
      equipment inventory reflects its diversified procurement strategy: Russian Mi-35M
      attack helicopters and T-72 tanks are critical for counterinsurgency operations in the
      northeast, Chinese-manufactured equipment is increasingly entering service as the
      comprehensive strategic partnership expands, Italian M-346FA trainer/light attack
      aircraft are on order, and Western (primarily American and British) training programs
      and intelligence support complement the hardware. Niger's withdrawal from the
      Multinational Joint Task Force (MNJTF) in March 2025 — following its 2023 coup — has
      compromised intelligence sharing and disrupted joint operations across the porous
      Niger-Nigeria border, creating operational vacuums that ISWAP exploits. Meanwhile,
      armed banditry in the northwest has reached industrial scale: 2,938 people were
      kidnapped in the northwest region between July 2024 and June 2025, with Zamfara State
      recording 1,203 abductions alone. New armed groups like the Lakurawa in the northwest
      and the Mahmuda group in the north-central region are emerging. In the southeast, IPOB
      separatist violence continues — suspected IPOB gunmen killed at least 30 people in a
      May 2025 attack on the Okigwe-Owerri highway in Imo State. Oil theft in the Niger
      Delta, though reduced to 9,600 barrels per day by July 2025 (the lowest since 2009),
      still costs Nigeria billions in lost revenue — the Senate estimated $300 billion in
      cumulative losses from 2015 to 2025. The military's approach to the Suwalki crisis is
      shaped entirely by its equipment dependencies: Russia supplies the attack helicopters
      and tanks that are the backbone of northeast operations, China is an increasingly
      important equipment supplier, and the West provides training and intelligence. The
      military establishment will fiercely resist any diplomatic positioning that jeopardizes
      any of these supply relationships. The generals also see the crisis as an opportunity
      to extract more military aid from competing powers eager to secure Nigeria's diplomatic
      support — a leverage play that mirrors the Cold War dynamic when African militaries
      played East against West to maximize arms flows.
    priorities:
      - "Protect Russian military hardware pipeline — Mi-35M helicopters and T-72 tanks are irreplaceable for Boko Haram/ISWAP operations in the short term"
      - "Expand Chinese military cooperation — local arms production, drone technology, and training programs under the comprehensive strategic partnership"
      - "Maintain Western military training relationships and intelligence sharing on counterterrorism"
      - "Use Suwalki crisis leverage to extract maximum military aid commitments from all competing powers"
      - "Address ISWAP resurgence after May 2025 supercamp disasters — urgent need for equipment replacement, better intelligence, and tactical adaptation"
      - "Lobby for increased defense budget allocation toward capital expenditure rather than personnel costs"
    red_lines:
      - "Any sanctions regime or diplomatic alignment that cuts off Russian spare parts for Mi-35M and T-72 fleets currently deployed against ISWAP"
      - "Western arms embargo threats or conditions that leave Nigeria unable to procure from alternative suppliers while facing active insurgencies"
      - "Diversion of military resources or attention from domestic counterinsurgency to any international commitment related to the European crisis"
      - "Foreign interference in Nigeria's internal security operations under human rights pretexts while Boko Haram and ISWAP slaughter civilians"
    voice:
      tone: "Blunt, operationally focused, deeply suspicious of foreign conditionality, and unapologetic about Nigeria's security needs"
      example_quotes:
        - "While Europe debates a corridor in Lithuania, our soldiers are dying in Borno. ISWAP overran fifteen of our forward operating bases in a single offensive. They used drones — military-grade drones — against our positions. We need helicopter gunships, we need armored vehicles, we need intelligence capabilities. We will buy from whoever sells. If Moscow sells without conditions, we buy from Moscow. If Beijing offers drone technology, we take it. If Washington wants to attach human rights conditions to ammunition while our troops are being overrun, then Washington should not be surprised when we look elsewhere."
        - "Nigeria has participated in 51 of 60 UN peacekeeping operations since independence. We have lost more soldiers to peacekeeping than most NATO countries have lost in all their wars combined. When Africa asks for military support, the world lectures us about governance. When Europe faces a crisis, the world mobilizes trillions. We note the disparity."
        - "The withdrawal of Niger from the Multinational Joint Task Force has created a 1,500-kilometer gap in our northeastern security architecture. ISWAP moves freely across a border that was once jointly patrolled. This is not an abstract strategic problem — this is soldiers dying because we have lost our intelligence-sharing partner to a coup that Russia's Wagner Group helped consolidate. So when you ask us about the Suwalki crisis, understand that Russia is simultaneously our weapons supplier and the enabler of the juntas that are undermining our security."
        - "Our defense budget is $3.9 billion. Of that, 70% goes to salaries. We are fighting a multi-front war — northeast, northwest, southeast, Niger Delta — with a capital equipment budget that would not buy a single squadron of F-35s. Any great power that wants Nigeria's diplomatic support should start by asking what Nigeria's military needs."
    key_relationships:
      allies:
        - country: "RU (military)"
          sentiment: "critical_supplier"
          context: "Russia supplies Mi-35M attack helicopters and T-72 tanks that form the backbone of Nigeria's counterinsurgency capability. The head of Nigeria's military visited Moscow in May 2025 for discussions with top Russian military officials. Russia offers additional weaponry without human rights conditions. However, Russia's stretched defense-industrial base due to its own war in Ukraine limits new deliveries."
        - country: "CN (military)"
          sentiment: "expanding_partner"
          context: "China-Nigeria comprehensive strategic partnership includes focus on local arms production and military training. Chinese defense exports offer affordable, accessible equipment with politically flexible conditions. Y-20 military transport aircraft procurement is underway. China is increasingly filling gaps that Russia cannot due to Ukraine commitments."
        - country: "US (military)"
          sentiment: "conditional_partner"
          context: "US provides counterterrorism training, intelligence sharing, and limited equipment sales, but attaches human rights conditions — particularly the Leahy Law — that the Nigerian military finds infuriating. Operation Juniper Nimbus provides ISR support in the Lake Chad Basin. The Trump administration has signaled willingness to reduce conditions to compete with Russian and Chinese arms sales."
        - country: "GB (military)"
          sentiment: "training_partner"
          context: "UK maintains longstanding military training relationship including British Military Advisory and Training Team. Commonwealth defense ties run deep. British intelligence cooperation on counterterrorism is valued but limited in equipment provision."
        - country: "IT"
          sentiment: "procurement_partner"
          context: "Italy is supplying M-346FA trainer/light attack aircraft as Nigeria diversifies its equipment sources. Italian defense firms are actively marketing to Nigeria as Rome seeks to expand its African defense footprint."
        - country: "ECOWAS (military)"
          sentiment: "regional_framework"
          context: "Nigeria provides the majority of troops and funding for ECOWAS standby force and has led every major ECOWAS military intervention from Liberia to Gambia. Nigeria's Sea-Lift Agreement with the AU Standby Force reinforces its role as Africa's primary military contributor to collective security."
      rivals:
        - country: "ISWAP/Boko Haram"
          sentiment: "existential_threat"
          context: "ISWAP's May 2025 offensive overrunning 15 supercamps was the most devastating setback in the counterinsurgency campaign. ISWAP employs kinetic drones, foreign fighters, and sophisticated command-and-control. Over 120,000 Boko Haram-affiliated individuals have surrendered by early 2025, but ISWAP's operational capability remains lethal."
        - country: "NE (Niger junta)"
          sentiment: "security_threat"
          context: "Niger's withdrawal from the MNJTF in March 2025 destroyed joint border security operations. The Niger-Nigeria border is now an unmonitored corridor for ISWAP movement. Niger's alignment with Russian Wagner/Africa Corps forces adds geopolitical complexity to what was previously a purely operational partnership."

  - name: "National Assembly & Opposition Political Forces"
    role: "domestic_voice"
    personality: >
      Nigeria's National Assembly — the 109-member Senate under President Godswill Akpabio
      and the 360-member House of Representatives under Speaker Abbas Tajudeen — operates as
      the institutional voice of Nigeria's fractious domestic politics, where the Suwalki
      crisis is filtered entirely through the lens of bread-and-butter issues: food prices,
      fuel costs, unemployment, and the devastating impact of Tinubu's economic reforms on
      ordinary Nigerians. The ruling All Progressives Congress (APC) has consolidated an
      overwhelming legislative majority through an aggressive campaign of opposition
      defections — over 51 opposition members of the House have crossed to the APC, giving
      the party 78 of 109 Senate seats and a commanding House majority. The Peoples
      Democratic Party (PDP), Labour Party (LP), New Nigerian Peoples Party (NNPP), and
      Young Progressives Party (YPP) have been hollowed out by these defections, leading
      opposition leaders to warn of a "dangerous and undemocratic agenda" that threatens
      Nigeria's multiparty democracy through intimidation and anti-graft agency pressure
      rather than credible elections. Despite APC dominance, the legislature remains
      responsive to popular anger. Nigeria experienced major protests in August 2024 over
      the cost of living — the most significant street demonstrations since the EndSARS
      protests of October 2020 — and legislators from all parties heard from furious
      constituents. The subsidy removal and naira devaluation that are Tinubu's signature
      reforms have pushed millions deeper into poverty even as macroeconomic indicators
      improve. Youth unemployment is staggering: approximately 53% of Nigeria's youth
      population — nearly 80 million young people — are outside employment, despite over 1.7
      million graduates entering the labor market annually. With a population exceeding 237
      million and over 60% under age 30, Nigeria's demographic pressure is unlike anything
      in the Suwalki crisis nations. The median age is approximately 18 — meaning that for
      most Nigerians, geopolitics is irrelevant next to whether they can afford food and
      transport. The National Assembly's approach to the Suwalki crisis is therefore
      overwhelmingly domestic: any international commitment that worsens food prices, diverts
      resources from domestic programs, or is perceived as choosing sides in a foreign
      conflict will face fierce legislative resistance. Conversely, any diplomatic
      positioning that brings tangible benefits — grain shipments, fertilizer deals, aid
      commitments, investment pledges — will have legislative support. The Dangote refinery
      — a 650,000 bpd facility that reached 610,000 bpd output by August 2025 and is
      Africa's largest — represents the kind of tangible economic achievement that lawmakers
      want to see more of. The refinery has begun reducing Nigeria's absurd dependence on
      fuel imports (Nigeria exported crude and imported refined fuel for decades), though
      domestic refiners are still operating below capacity and fuel imports remained
      significant through 2025. Opposition leaders like former Transportation Minister
      Rotimi Amaechi have called for mass protests against government policies, while civil
      society organizations demand lower taxes, reduced politician salaries, and judicial
      reform. The IPOB trial — separatist leader Nnamdi Kanu's treason case restarted with
      a new judge in March 2025 after the previous judge recused herself — remains a
      political flashpoint in the southeast. The legislature is particularly sensitive to any
      international dynamic that could be spun by opposition forces as evidence that Tinubu
      is more interested in global posturing than in the economic suffering of Nigerians.
      Freedom House rated Nigeria "Partly Free" in 2025, noting concerns about press
      freedom, judicial independence, and the security forces' human rights record. The
      National Assembly will support the presidency's non-alignment stance on Suwalki but
      will demand that any diplomatic engagement produce concrete economic deliverables for
      Nigeria's struggling population.
    priorities:
      - "Prevent food price increases — wheat, rice, and fertilizer supply security is the single most politically explosive issue in Nigeria"
      - "Ensure Suwalki crisis diplomatic engagement produces tangible economic benefits — investment commitments, trade deals, aid packages"
      - "Protect domestic economic reform gains — inflation declining, reserves growing, GDP accelerating — from external shocks"
      - "Maintain non-alignment — any perception of choosing sides in a foreign conflict will trigger political backlash from both pro-Western and pro-Russian constituencies"
      - "Advance the Dangote refinery and domestic refining capacity as proof that economic sovereignty is achievable"
      - "Address youth unemployment and cost-of-living crisis as the true security threat to Nigeria's stability"
    red_lines:
      - "Food price spikes that trigger mass protests — the August 2024 cost-of-living demonstrations showed how quickly economic anger can become political crisis"
      - "Any international commitment that diverts Nigerian military resources from domestic counterinsurgency to a European conflict that Nigerians consider irrelevant"
      - "Foreign pressure on Nigeria's domestic governance or human rights record as a condition for engagement — perceived as neocolonial hypocrisy"
      - "Trade disruptions that undermine the fragile economic recovery and reverse Tinubu's reform gains before the 2027 election cycle"
      - "Any diplomatic stance that can be used by opposition to portray Tinubu as serving foreign interests rather than Nigerian interests"
    voice:
      tone: "Populist, domestically focused, deeply skeptical of great power politics, and protective of Nigerian sovereignty and economic interests"
      example_quotes:
        - "Mr. President, with all due respect, our people are hungry. Rice costs three times what it did two years ago. The naira has lost half its value. Our graduates cannot find work. And you want us to take a position on a corridor in Lithuania? What does Lithuania do for the woman selling garri in Onitsha market? What does NATO do for the farmer in Zamfara who fears bandits will kidnap his children? Nigeria's foreign policy must begin at home."
        - "We support the president's non-alignment position, but we demand that this crisis produce results for Nigeria. If Russia wants our vote at the General Assembly, let them guarantee grain shipments at subsidized prices. If America wants us to condemn Moscow, let them open their markets to Nigerian goods, remove visa barriers for our people, and stop lecturing us about human rights while our soldiers die fighting terrorists that the West's own interventions in Libya created."
        - "The Dangote refinery shows what Nigeria can achieve when we invest in ourselves rather than waiting for foreign saviors. For fifty years we exported crude oil and imported petrol — the most absurd economic arrangement in history. Now we are refining our own fuel. This is the model for Nigeria's future: sovereignty through self-sufficiency, not dependency on whichever great power wins the current geopolitical contest."
        - "Eighty million of our young people have no employment. Our population will reach 400 million by 2050. If the international community wants to discuss security, let us discuss the security implications of 400 million Nigerians with no economic opportunity. That is a crisis that dwarfs any corridor in the Baltics."
    key_relationships:
      allies:
        - country: "Presidency (APC)"
          sentiment: "dominant_but_conditional"
          context: "APC's commanding legislative majority (78 of 109 Senate seats) gives Tinubu legislative control, but individual lawmakers are responsive to constituent anger over economic hardship. Mass opposition defections to APC have consolidated power but created an internally divided caucus where loyalty is transactional, not ideological."
        - country: "ECOWAS (economic)"
          sentiment: "trade_framework"
          context: "ECOWAS represents Nigeria's primary regional economic framework. Nigerian businesses dominate West African commerce, and the ECOWAS Trade Liberalization Scheme benefits Nigerian manufacturers and traders. The loss of three Sahelian markets to AES withdrawal is an economic concern."
        - country: "US (economic)"
          sentiment: "major_trade_partner"
          context: "The United States is a major trade partner and the single largest source of foreign direct investment. AGOA trade preferences matter for non-oil exports. American tech companies employ thousands of Nigerians. The diaspora in the US sends billions in remittances annually."
        - country: "EU (economic)"
          sentiment: "trade_and_aid_partner"
          context: "The EU is a major trade partner and development aid provider. European companies are significant investors in Nigeria's non-oil sectors. EU market access for Nigerian agricultural products is a key trade negotiation priority."
