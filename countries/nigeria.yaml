          context: "Ghana is Nigeria's closest ECOWAS partner and key ally in managing the post-AES regional architecture. Both countries share democratic governance values and coordinate on West African security. Nigerian businesses dominate Ghana's commercial sector."
        - country: "ZA"
          sentiment: "continental_rival_partner"
          context: "South Africa and Nigeria compete for continental leadership within the AU but cooperate on UNSC reform demands. South Africa's BRICS membership gives it leverage Nigeria lacks, creating both partnership opportunities and competitive friction."
