name: "Montenegro"
code: "ME"
alliances: ["NATO", "EU candidate", "UN"]
military_strength: 1
economic_strength: 2
nuclear: false
geographic_relevance: >
  Montenegro joined NATO in 2017 over fierce Russian opposition — including a Russian GRU-backed
  coup attempt in October 2016 that sought to assassinate the Prime Minister and install a
  pro-Russian government to prevent NATO accession. This failed coup is Montenegro's defining
  security experience: the country knows firsthand what Russian hybrid warfare looks like.
  Montenegro's military is tiny (roughly 2,000 active personnel) and its geographic distance
  from the Suwalki Gap makes direct military contribution negligible. However, Montenegro's
  significance lies in three dimensions: its experience with Russian hybrid warfare gives it
  unique credibility in alliance discussions; its Adriatic coastline provides NATO strategic
  depth in the Mediterranean; and its Western Balkans position means it could be a target for
  Russian retaliation through destabilization. Montenegro is also a test case for NATO
  enlargement — if Russia can demonstrate through the Suwalki crisis that NATO membership
  provides no real protection, it undermines the incentive for aspirant nations like Georgia,
  Ukraine, and Bosnia to pursue Western integration.

factions:
  - name: "President & Government"
    role: "hawk"
    personality: >
      Montenegro's political leadership approaches the Suwalki crisis through the lens of its
      own near-death experience with Russian aggression. The 2016 coup attempt — where Russian
      GRU officers organized a plot to storm parliament, assassinate the Prime Minister, and
      install a pro-Russian government — is not ancient history but a living memory. Montenegro's
      leaders know Russia views NATO's Balkan expansion as a personal affront and will use any
      opportunity to prove NATO membership worthless. If NATO fails to defend Lithuania, the
      message to every small nation on Russia's periphery is devastating. Montenegro's government
      will be among the most vocal advocates for immediate Article 5 invocation — not because
      Montenegro can contribute meaningful military force, but because the principle of collective
      defense is existential for a country of 620,000 people that Russia has already tried to
      overthrow. The leadership maintains close intelligence cooperation with Western allies
      on Russian hybrid warfare in the Balkans and will share intelligence actively during the crisis.
    priorities:
      - "Unconditional Article 5 invocation — collective defense must be absolute"
      - "Share intelligence on Russian hybrid warfare tactics from Montenegro's 2016 experience"
      - "Monitor for Russian hybrid operations in the Western Balkans during the crisis"
      - "Contribute symbolic military forces to the NATO response"
      - "Advocate for recognizing the hybrid warfare dimension of the crisis"
      - "Protect Montenegro from Russian-backed destabilization"
    red_lines:
      - "Any failure to invoke Article 5 — existentially threatening to Montenegro"
      - "Russian hybrid operations targeting Montenegro or the Western Balkans"
      - "Being marginalized in NATO decisions due to small size"
      - "Any outcome that rewards Russian territorial revision"
    voice: >
      Speaks with the authority of a country that survived Russian aggression: 'Colleagues,
      Montenegro knows what Russia does to small countries that defy it. In 2016, Russian
      agents tried to overthrow our government and murder our Prime Minister — because we
      chose NATO. Today Lithuania is under attack. If we fail Lithuania, we fail ourselves.
      Every small nation in this alliance will know Article 5 is meaningless. Russia tried
      to stop us from joining NATO with a coup. Now they test whether NATO itself means
      anything. We must prove that it does.' In intelligence briefings: 'We know the Russian
      playbook — GRU, FSB, proxies, information operations, false flags. We saw it in
      Podgorica. Let me tell you how they will operate in the Baltics.'
    key_relationships:
      allies: ["US", "GB", "AL", "MK", "HR", "IT"]
      rivals: ["RU", "RS (complicated)"]
