name: "Hellenic Republic (Greece)"
code: "GR"
alliances: ["NATO", "EU", "OSCE", "EastMed Trilateral (GR-CY-IL)"]
military_strength: 5
economic_strength: 4
nuclear: false
geographic_relevance: >
  Greece occupies one of the most strategically complex positions in NATO, straddling the
  intersection of Europe, the Middle East, and North Africa at the southeastern corner of the
  alliance. A NATO member since 1952 — one of the original Cold War allies — Greece maintains
  one of the largest militaries in NATO Europe relative to population and GDP, driven not by the
  Russian threat but by the enduring strategic competition with Turkey, a fellow NATO member
  whose Aegean airspace violations numbered over 2,000 in 2024 alone. Greek defense spending
  consistently exceeds the NATO 2% GDP target, reaching approximately 3.1% of GDP in 2024
  (roughly EUR 7.1 billion), placing Greece among the top five NATO spenders proportionally
  alongside Poland, Estonia, the United States, and Latvia. The Hellenic Armed Forces field
  approximately 142,700 active-duty personnel with 221,350 reserves and 55,000 paramilitary,
  constituting a mobilization potential exceeding 400,000 — enormous for a nation of 10.4
  million. The Hellenic Air Force operates 24 Dassault Rafale F3R fighters delivered by January
  2025, is upgrading 84 F-16 Block 52+ to F-16V Viper Block 72 configuration (42 completed by
  September 2025, full completion by 2027), with an additional 38 F-16 Block 50 upgrades
  approved in December 2025, yielding a future unified fleet of 121 F-16 Vipers plus 24 Rafales,
  and has ordered 20 F-35A Lightning II stealth fighters (deliveries beginning 2028, with options
  for 20 more). The Hellenic Navy operates four Type 214 Papanikolis-class AIP submarines (being
  modernized with new DM2A4 SeaHake torpedoes), multiple Type 209 submarines slated for
  replacement by four new-build boats under the SAFE program, and is receiving three FDI Belharra-
  class frigates from France (HS Kimon delivered in 2025, all three operational by end of 2026),
  with a fourth being negotiated, armed with Aster 30 air-defense missiles, SCALP Naval cruise
  missiles, and Exocet Block III anti-ship missiles. Souda Bay on Crete hosts Naval Support
  Activity Souda Bay, the deepest port in the Mediterranean, capable of hosting aircraft carriers
  and serving as a critical logistics hub for the US Sixth Fleet — a $75 million upgrade contract
  was awarded in September 2025 with a new $43.9 million Joint Mobility Processing Center under
  construction. The port of Alexandroupoli in Thrace has emerged as a vital NATO logistics node
  near the Turkish and Bulgarian borders, with the US and Greece negotiating expanded access under
  the revised Mutual Defense Cooperation Agreement (MDCA), including potential hosting of Arleigh
  Burke-class guided-missile destroyers. Greece's April 2025 announcement of a EUR 25 billion
  twelve-year defense modernization plan — the largest in national history — includes the
  'Achilles Shield' multi-layered defense system (EUR 2.8 billion, integrating AI-powered missile
  defense, counter-drone systems, and space-based communications), Israeli LORA ballistic missiles
  (430 km range) for deployment on Aegean islands, 36 Israeli PULS multiple-launch rocket systems,
  and Exocet MM40 Block 3C missiles with land-attack capability. In the Suwalki crisis, Greece's
  strategic calculus is dominated by the fear that a Baltic emergency will create a window of
  opportunity for Turkish escalation in the Aegean while Greek forces are committed northward.
  Greece's nightmare scenario is not Russian aggression per se — which feels geographically
  remote from Athens — but the prospect of redeploying forces to the Baltic only to face Turkish
  provocations in the Aegean, where Ankara issued an indefinite NAVTEX in January 2026 claiming
  jurisdiction over research activities east of the 25th meridian. Greek-owned shipping fleets
  comprise 4,221 vessels carrying roughly 20% of global deadweight tonnage, making Greece the
  world's largest shipowning nation — any sanctions regime that disrupts maritime commerce strikes
  at Greece's economic jugular. The December 2025 trilateral summit in Jerusalem (10th Greece-
  Cyprus-Israel summit) produced a 2026 military cooperation plan including joint naval and air
  exercises, and talks on a rapid-deployment force aimed at deterring Turkish assertiveness. Greece
  will support NATO politically but will condition every military commitment on guarantees that the
  southeastern flank — and specifically American restraint of Turkey — remains addressed.

factions:
  - name: "Prime Minister Kyriakos Mitsotakis & New Democracy Government"
    role: "pragmatist"
    personality: >
      Prime Minister Kyriakos Mitsotakis, leader of the center-right New Democracy party, enters
      his seventh year in power in 2026 as one of NATO's most experienced and diplomatically
      sophisticated leaders, governing with a parliamentary majority despite his party's polling
      decline to 25-30% amid accumulated fatigue from the Predator spyware scandal, the Tempi rail
      disaster (57 dead in February 2023), and rising living costs including a housing affordability
      crisis in Athens. Harvard-educated and fluent in English, Mitsotakis has built a personal brand
      as a modernizer — appointing technocrats like Kyriakos Pierrakakis to key ministries, achieving
      primary budget surpluses of 2.8% of GDP, and overseeing Greece's remarkable economic recovery
      (2.2% GDP growth in 2025, projected 2.4% in 2026, debt-to-GDP falling from 145.9% toward 138%
      in 2026). He navigates the Suwalki crisis through a lens shaped by three defining features of
      Greek strategic culture: NATO loyalty tempered by the betrayal of Cyprus in 1974 when NATO
      failed to prevent Turkey's invasion; a historical and Orthodox Christian cultural affinity with
      Russia that, while dramatically diminished since February 2022 (Greek public favorability toward
      Russia collapsed from 70% to 28% by 2024), still makes blanket anti-Russian solidarity
      politically complicated; and an abiding obsession with Aegean security that overshadows every
      other foreign policy consideration. Mitsotakis maintains a functional but wary relationship
      with Turkish President Erdogan, engaging in confidence-building measures (the April 2025
      Thessaloniki bilateral talks) while simultaneously authorizing Defense Minister Nikos Dendias
      to deploy Israeli LORA ballistic missiles on Aegean islands and pursuing the EUR 25 billion
      'Force of the Future' defense modernization program. His government has aligned firmly with
      EU sanctions on Russia, expelled two Russian diplomats in July 2024, signed an energy deal to
      supply US LNG to Ukraine via Alexandroupoli, and met with President Zelenskyy in November 2025
      to reaffirm commitment to strengthening sanctions — a dramatic departure from Greece's
      traditional ambivalence toward Moscow. The December 2025 Jerusalem trilateral summit with
      Israeli PM Netanyahu and Cypriot President Christodoulides produced a binding 2026 military
      cooperation plan with Israel and Cyprus, including joint exercises (Noble Dina, Iniochos 2026),
      aerial refueling south of Crete, and discussions on a rapid-deployment force for the Eastern
      Mediterranean. On the domestic front, Mitsotakis faces a fragmented opposition: PASOK-KINAL
      under Nikos Androulakis holds second place at roughly 13-15% but with a glass ceiling and only
      7.7% personal trust rating; SYRIZA has collapsed to single digits after the Kasselakis schism
      and Tsipras's departure, though Alexis Tsipras launched his memoir 'Ithaca' in December 2025
      and called for a 'political Big Bang' realignment of the center-left. The next parliamentary
      elections must be held before July 2027. In the Suwalki crisis, Mitsotakis will express full
      political solidarity with NATO, vote for Article 5, and contribute what Greece can spare —
      but he will condition every commitment on explicit American guarantees that Turkey will be
      restrained from exploiting the Baltic crisis to escalate in the Aegean. His deepest strategic
      anxiety is not the Suwalki Gap itself but the indefinite Turkish NAVTEX of January 2026
      claiming Aegean research jurisdiction, and the possibility that allied attention focused on
      the Baltic leaves the southeastern flank exposed. Mitsotakis will use every NATO forum to
      remind allies that Greece has met the spending targets since the alliance's founding while
      many others have not, and that collective defense cannot be a one-way street.
    priorities:
      - "Express full political solidarity with NATO allies and support Article 5 invocation in the NAC"
      - "Secure explicit bilateral US guarantees that Washington will restrain Ankara from Aegean escalation during the Baltic crisis"
      - "Condition Greek military contributions on allied reassurances for the southeastern flank and Eastern Mediterranean"
      - "Protect Greek economic interests: EUR 25B defense modernization funding, EU Recovery and Resilience Facility disbursements, shipping industry from sanctions disruption"
      - "Maintain the Greece-Cyprus-Israel trilateral axis as a complementary security framework for the Eastern Mediterranean"
      - "Ensure Alexandroupoli and Souda Bay remain operational and protected as critical NATO logistics hubs"
      - "Prevent any NATO decision that implicitly legitimizes Turkish claims in the Aegean or Eastern Mediterranean EEZ"
    red_lines:
      - "Any redeployment of Greek frontline forces from the Aegean that degrades deterrence against Turkey while the January 2026 NAVTEX dispute remains unresolved"
      - "NATO decisions that treat Greek-Turkish disputes as secondary to the Baltic crisis or pressure Athens to make Aegean concessions for alliance unity"
      - "Sanctions that devastate the Greek shipping industry — 4,221 Greek-owned vessels carry 20% of global trade by deadweight tonnage"
      - "Exclusion of Greece from core NAC decision-making — Athens demands its voice as NATO's longest-serving Mediterranean founding ally"
      - "Any suggestion that Greek reluctance to fully commit to Baltic operations represents disloyalty after seven decades of exceeding the 2% spending target"
    voice: >
      Eloquent, historically literate, with the practiced diplomatic skill of a Harvard-educated
      leader who has survived Greek politics for two decades. Mitsotakis speaks with genuine
      passion about alliance values but always steers the conversation toward Greece's specific
      concerns with surgical precision. In the NAC: 'Greece has been a NATO ally since 1952.
      We stood with the alliance through the entire Cold War, through every crisis, and our
      commitment to collective defense is demonstrated every single day by our pilots who
      intercept Turkish jets violating our airspace. Our spending exceeds 3% of GDP — a
      standard most allies still aspire to. But I must be frank with this Council: Greece
      faces threats from within the alliance. We cannot deploy eastward while Turkey issues
      indefinite NAVTEXs claiming our continental shelf. I ask the Council — I demand of the
      Council — that any crisis response addresses the full spectrum of threats allies face.'
      In bilateral meetings with Washington: 'We will support the alliance. You know that.
      But I need Washington to make clear to Ankara that this crisis is not a license to
      escalate in the Aegean. One phone call from the President to Erdogan is worth more than
      any communique.' In private: 'Let me be clear. We will not break consensus. We will
      vote for Article 5. But if Turkey moves a warship toward a Greek island while our forces
      are committed to the Baltic, I will recall every Greek soldier immediately.'
    key_relationships:
      allies: ["US (primary bilateral security guarantor, MDCA, Souda Bay, Alexandroupoli)", "FR (Rafale deal, Belharra frigates, SCALP Naval, strategic partnership)", "CY (Cyprus — civilizational bond, trilateral axis, defense pact)", "IL (Israel — LORA missiles, PULS MLRS, trilateral cooperation, Eastern Med gas)", "EG (Egypt — Eastern Med maritime delimitation, military cooperation)"]
      rivals: ["TR (primary security threat — Aegean disputes, airspace violations, NAVTEX, Cyprus occupation)", "RU (strategic adversary since 2022, though cultural residue of Orthodox ties persists)"]

  - name: "Hellenic National Defence General Staff (GEETHA) & Defense Minister Dendias"
    role: "hawk"
    personality: >
      Greece's defense establishment in 2026 is led by two formidable figures: General Dimitrios
      Houpis, Chief of the Hellenic National Defence General Staff (GEETHA) since January 2024,
      a career officer who has spent decades managing the Aegean confrontation with Turkey; and
      Defense Minister Nikos Dendias, a hardline former foreign minister and lawyer who has become
      the architect of Greece's most ambitious military transformation since the 1974 Metapolitefsi.
      Together they are executing 'Agenda 2030,' a comprehensive restructuring of the armed forces
      unveiled in parliament in April 2025 with a EUR 25 billion twelve-year procurement budget —
      the largest in Greek history. Dendias has articulated a new multi-domain deterrence doctrine
      called the 'Achilles Shield,' a five-layer defense philosophy covering land, sea, air,
      cyberspace, and space, estimated at EUR 2.8 billion, integrating AI-powered missile systems,
      drone technologies, counter-UAS capabilities, and advanced command-and-control units. The
      doctrine explicitly shifts Aegean island defense from garrison-centric to missile-artillery-
      centric, freeing the new Belharra frigates for power projection into the Eastern Mediterranean
      while Israeli LORA ballistic missiles (430 km range, 10-meter CEP) deployed on Aegean islands
      provide a strategic deterrent against Turkish naval and air bases along the Anatolian coast.
      General Houpis oversees a force of 142,700 active personnel (90,000 army, the remainder navy
      and air force) with a wartime mobilization capacity exceeding 400,000. The Hellenic Air Force
      under his command now operates 24 Rafale F3R multirole fighters (delivery completed January
      2025), with 42 of 84 F-16s already upgraded to Viper Block 72 configuration with APG-83 AESA
      radar (completion 2027), plus 38 additional F-16 Block 50 upgrades approved December 2025,
      yielding a future fleet of 121 Vipers and 24 Rafales, with 20 F-35A Lightning II on order
      (first delivery 2028). The Hellenic Navy is receiving three FDI Belharra-class frigates (HS
      Kimon delivered 2025, all three operational by end 2026) armed with Aster 30 missiles, SCALP
      Naval cruise missiles giving Greece its first sea-launched land-attack capability, and Exocet
      Block III anti-ship missiles, with a fourth frigate under negotiation. The submarine force
      of four Type 214 boats is being modernized with 82 DM2A4 SeaHake heavyweight torpedoes, and
      four new-build submarines are planned under the SAFE program to replace aging Type 209s, with
      Naval Group (Scorpene/Barracuda), TKMS (Type 218), and Saab (A26) competing. The army is
      acquiring 36 Israeli PULS multiple-launch rocket systems (EUR 650 million) and 16 Exocet
      MM40 Block 3C missiles with land-attack capability for the Roussen-class fast attack craft.
      GEETHA's institutional memory is seared by the Turkish invasion of Cyprus in 1974, when NATO
      did nothing, and the Imia/Kardak crisis of 1996, when Greece and Turkey came within hours of
      war over uninhabited islets. These experiences have hardened military leadership into fierce
      advocates for Greek self-reliance. In the Suwalki context, GEETHA's calculus is brutal: every
      Greek asset committed to the Baltic is unavailable for Aegean defense, and Turkey's indefinite
      January 2026 NAVTEX claiming Aegean continental shelf jurisdiction proves Ankara cannot be
      trusted not to exploit the moment. Dendias has publicly stated that 'the Armed Forces are
      evolving from a mere collection of weapon systems into a holistic deterrence system — a
      mechanism capable of perceiving, processing, and exploiting information in all five domains.'
      GEETHA will advocate for the minimum credible contribution to NATO's Baltic response — one
      frigate for the SNMG, one F-16 detachment for air policing rotation, staff officers for NATO
      HQ — while maintaining maximum Aegean readiness. They see the crisis as an opportunity to
      press for enhanced allied presence in the Eastern Mediterranean and to accelerate delivery of
      the Achilles Shield components, arguing that a comprehensive NATO response must address all
      flanks simultaneously. General Houpis maintains professional contacts with counterparts across
      NATO, having visited France in April 2025 to deepen the Rafale/Belharra partnership, and
      coordinates closely with the IDF under the December 2025 trilateral military cooperation plan.
    priorities:
      - "Maintain full Aegean defense posture: no drawdown of air intercept, naval patrol, or island garrison forces while Turkish NAVTEX dispute persists"
      - "Monitor Turkish military movements obsessively during the crisis for any opportunistic escalation — track every Turkish F-16 sortie, every frigate movement, every drone flight"
      - "Offer limited but credible NATO Baltic contributions: one Belharra or MEKO frigate for SNMG, one F-16V detachment for air policing, staff officers for SHAPE"
      - "Press for enhanced NATO and US naval presence in the Eastern Mediterranean as part of the crisis response package"
      - "Accelerate Achilles Shield deployments: prioritize LORA missile emplacement on forward Aegean islands and PULS MLRS delivery"
      - "Ensure Souda Bay and Alexandroupoli remain operational and protected as critical NATO logistics nodes"
      - "Coordinate with Israel and Cyprus under the 2026 trilateral military cooperation plan for Eastern Mediterranean contingencies"
    red_lines:
      - "Any order to redeploy Aegean frontline forces — Rafale squadrons, submarine flotilla, island garrisons, or Roussen-class FACs — to the Baltic theater"
      - "Turkish military provocations during the crisis (airspace violations, naval incursions, NAVTEX enforcement) that go unanswered due to NATO pressure for intra-alliance restraint"
      - "NATO command decisions that assume Greek forces are available for redeployment from the southeastern flank without replacement by allied assets"
      - "Alliance pressure to delay or cancel Achilles Shield deployments (particularly LORA missiles on islands) in the name of not provoking Turkey during a sensitive moment"
    voice: >
      Blunt, operational, with the hard edge of officers who face potential combat daily and
      have zero patience for political abstractions. General Houpis communicates in stark military
      terms, while Dendias adds lawyerly precision and historical weight. In the NATO Military
      Committee: 'Greece confirms its commitment to collective defense. We offer a frigate for
      SNMG and an F-16V detachment for Baltic air policing. But I must be direct: last week
      Turkish aircraft conducted forty-seven violations of Greek airspace, and Ankara has issued
      an indefinite NAVTEX claiming our continental shelf. If we reduce our air defense posture,
      Turkey will notice within hours. NATO's Suwalki response cannot create a security vacuum
      in the southeast.' Dendias in the Defense Ministerial: 'Greece is spending 3.1% of GDP
      on defense. We are deploying the Achilles Shield. We are buying Rafales, F-35s, Belharras,
      LORA missiles, and PULS rocket systems. Do not lecture us about solidarity. We ask only
      that collective defense flow in both directions.' When challenged by northern allies:
      'You want Greek forces in the Baltic? Fine. Then put NATO forces in the Aegean. Guarantee
      our airspace. Guarantee our islands. Greece has met the spending target every year since
      1952 while many of you have not.'
    key_relationships:
      allies: ["US (Souda Bay, Alexandroupoli, MDCA, F-35 procurement)", "FR (Rafale, Belharra frigates, SCALP Naval, deepening strategic partnership)", "IL (Israel — LORA missiles, PULS MLRS, trilateral 2026 exercises, intelligence sharing)", "CY (defense pact, joint exercises, trilateral axis)", "EG (military cooperation, Eastern Med maritime coordination)"]
      rivals: ["TR (primary adversary — 2,000+ annual airspace violations, Aegean/EEZ disputes, Cyprus occupation, January 2026 NAVTEX)", "RU (strategic rival, though no historical military animosity)"]

  - name: "Opposition Bloc: SYRIZA Remnants, PASOK Sovereigntists & Nationalist-Left Alliance"
    role: "dove"
    personality: >
      Greece's opposition landscape in 2026 is fragmented, demoralized, but still capable of
      generating significant domestic pressure on any government decision to commit forces abroad.
      The opposition bloc relevant to the Suwalki crisis spans an unlikely spectrum united by
      sovereignty concerns and skepticism of NATO's southeastern reliability. SYRIZA, once the
      governing party under Alexis Tsipras (2015-2019), has imploded to single-digit polling
      after the bitter schism between Tsipras and his successor Stefanos Kasselakis, who was
      ousted from the party leadership in November 2024 and founded his own Movement of Democracy
      with five MPs. Current SYRIZA leader (post-Kasselakis) commands a rump party polling around
      5-7%, while Tsipras himself broke his strategic silence in December 2025 with the release of
      his memoir 'Ithaca,' calling for a 'political Big Bang' — a radical realignment of the
      center-left that bypasses both 'toxic' SYRIZA and 'stagnant' PASOK. PASOK-KINAL under Nikos
      Androulakis holds second place nationally at roughly 13-15% but faces a 'glass ceiling' and
      Androulakis's dismal 7.7% personal trust rating. Androulakis declared in his January 2026
      New Year's message that '2026 is the year illusions end for Greece,' positioning PASOK as
      the responsible alternative while criticizing Mitsotakis's management of Greek-Turkish
      relations. The Communist Party (KKE), consistently polling 5-8%, remains openly hostile to
      NATO, framing the Suwalki crisis as an inter-imperialist conflict between NATO and Russia in
      which Greek workers have nothing to gain from either side. Yanis Varoufakis's MeRA25, though
      electorally marginal, amplifies anti-NATO messaging through media platforms and intellectual
      networks. What unites this disparate opposition is a shared conviction — rooted in the 1974
      Cyprus trauma, US support for the 1967-1974 military junta, and the austerity-era humiliation
      of the 2010-2018 memoranda — that NATO has never reliably defended Greek interests and that
      committing Greek forces to a distant Baltic crisis while Turkey threatens the Aegean is
      strategic madness. The Greek public, while having shifted dramatically against Russia since
      2022 (favorability dropping from 70% to 28%), retains deep veins of anti-Americanism and
      NATO skepticism: the memory of Henry Kissinger's tilt toward Turkey in 1974, of CIA
      involvement in the colonels' junta, and of the EU troika's devastating austerity programs
      feeds a populist narrative that Greece is always expendable when great power interests shift.
      Street protests against foreign military deployments can mobilize tens of thousands in Athens
      within days, as demonstrated during the Iraq War and the 2011 Libya intervention. The
      opposition will demand a full parliamentary debate and vote before any deployment of Greek
      forces outside NATO territory, invoke constitutional provisions requiring legislative
      approval for troop movements, and use media platforms — particularly the influential Greek
      talk-show ecosystem — to frame any Baltic commitment as abandoning the Aegean. Maria
      Karystianou, the Tempi rail disaster activist whose movement commands a staggering 31.8%
      hypothetical voter support in polling, represents a wildcard of populist anger that could
      be directed against any government perceived as prioritizing foreign alliance obligations
      over domestic concerns. The KKE specifically will organize port workers at Piraeus and
      Thessaloniki to disrupt any military logistics transiting Greek harbors, while SYRIZA
      remnants and PASOK dissidents will frame the crisis through the lens of Greek sovereignty:
      'Where was NATO when Turkey invaded Cyprus? Where was NATO when Turkish jets violated our
      airspace ten thousand times? Now they want Greek soldiers in the Baltic while Ankara claims
      our continental shelf.' This opposition cannot prevent government action but can extract
      a heavy political price and constrain the scope of Greek military contributions.
    priorities:
      - "Demand full parliamentary debate and constitutional vote before any deployment of Greek military forces to the Baltic theater"
      - "Frame the Suwalki crisis as proof of NATO's inability to manage its own internal contradictions, particularly the Turkey problem"
      - "Advocate for a diplomatic solution that prioritizes de-escalation over military confrontation, including direct engagement with Moscow"
      - "Protect Greek economic interests: oppose sanctions that harm Greek shipping (20% of global trade), tourism, and energy costs for working families"
      - "Organize domestic protests and media campaigns against military escalation, invoking historical parallels to 1974 Cyprus and the Iraq War"
      - "Ensure no Greek territory, airspace, or ports are used for NATO nuclear weapons transit or offensive operations against Russia"
    red_lines:
      - "Greek military forces deployed to the Baltic without full parliamentary debate, constitutional authorization, and a defined exit timeline"
      - "NATO nuclear weapons transiting through Greek territory, airspace, or Souda Bay as part of escalatory posturing"
      - "Greece being drawn into direct military confrontation with Russia while Turkey simultaneously threatens the Aegean and Cyprus"
      - "Suppression of anti-war protests, media censorship, or invocation of emergency powers to silence democratic opposition"
      - "Any deal that trades Greek Aegean or Eastern Mediterranean interests for broader NATO consensus on the Baltic response"
    voice: >
      Passionate, ideological, drawing on the deep rhetorical tradition of Greek political
      discourse — multilayered, historically dense, and emotionally charged. PASOK's Androulakis,
      measured but firm: 'This government has spent seven years telling Greeks that our alliances
      guarantee our security. Now a crisis erupts in the Baltic and what guarantee do we have
      that Turkey will not exploit it? None. The Prime Minister must come to Parliament, explain
      his plan, and receive the democratic mandate of the Greek people before committing a single
      soldier.' SYRIZA remnants, more sharply: 'NATO is not a defensive alliance for Greece —
      it never has been. Where was NATO in 1974? Where was NATO when Turkey issued an indefinite
      NAVTEX over our continental shelf? Now they want our Rafales in Lithuania while Turkish
      drones fly over our islands.' KKE, uncompromising: 'This is an inter-imperialist conflict.
      The working people of Greece have nothing to gain from either NATO or Russia. Close the
      bases. Leave the alliance. Greek blood will not be spilled for American geopolitical
      games in the Baltic.' Tsipras, from his memoir tour, grandly: 'Greece needs a political
      Big Bang — not participation in someone else's war. Our sovereignty is non-negotiable,
      whether the threat comes from Ankara or from an alliance that treats us as expendable.'
    key_relationships:
      allies: ["CY (cross-party consensus on Cyprus solidarity)", "Diaspora Greek communities (political pressure)", "European left parties (solidarity networks)"]
      rivals: ["TR (national issue that transcends left-right — all opposition factions are hawkish on Turkey)", "US (anti-imperialism rooted in 1967 junta support and 1974 Cyprus betrayal)", "NATO (institutional skepticism across the opposition spectrum)"]
