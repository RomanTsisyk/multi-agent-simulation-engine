geographic_relevance: >
  Indonesia is the world's fourth most populous country (286 million), the largest economy
  in Southeast Asia ($1.44 trillion nominal GDP, 7th globally by PPP at ~$5 trillion), the
  world's largest Muslim-majority nation, and ASEAN's de facto leader. Indonesia's "free and
  active" (bebas-aktif) foreign policy — non-aligned, independent, refusing to join any
  military bloc — makes it a crucial swing state in the global response to the Suwalki crisis.
  Indonesia's UN General Assembly vote and diplomatic position shape the broader Global South
  narrative, particularly as the first Southeast Asian nation to formally join BRICS (January
  2025), giving it a foot in both the Western-oriented and non-Western institutional orders.

  Indonesia controls the Malacca Strait, the world's most important maritime chokepoint
  through which 25-30% of global trade passes, and hosts the ASEAN Secretariat in Jakarta.
  Indonesia's South China Sea concerns — particularly around the Natuna Islands, where
  China's nine-dash line overlaps Indonesia's EEZ — give it a direct interest in upholding
  territorial integrity principles. However, a controversial November 2024 joint statement
  with China on "maritime joint development" near the Natunas drew sharp domestic and
  regional criticism for appearing to recognize "overlapping claims" where Indonesia had
  previously denied any overlap existed. This episode illustrates Indonesia's central
  dilemma: economic dependence on China constrains its ability to confront Beijing's
  maritime assertiveness, while ASEAN partners look to Jakarta as a stabilizing force.

  Under President Prabowo Subianto — inaugurated October 20, 2024, a former Kopassus
  special forces commander and lieutenant general who was discharged in 1998 over the
  kidnapping and torture of pro-democracy activists during the fall of Suharto — Indonesia
  is undergoing its most ambitious military modernization in decades. The 2026 defense
  budget reached Rp 187.1 trillion (~$11.4 billion), up from Rp 166 trillion in 2025 and
  Rp 135 trillion in 2024, though still only ~0.8% of GDP. Prabowo's campaign pledge is
  to raise defense spending to 1.5% of GDP by 2029. The military has been restructured
  with six new Army regional commands (Kodam), bringing the total to 21 — the largest
  TNI reorganization since the Suharto era. The Navy is upgrading 14 naval bases to
  naval regional commands. New specialized units include six Kopassus groups, 20
  territorial development brigades, one marine infantry brigade, and 100 territorial
  development battalions.

  Major procurement programs reflect a deliberate multi-supplier diversification strategy:
  42 Dassault Rafale fighters from France ($8.1 billion, first three delivered January
  2026 to Roesmin Nurjadin Air Base in Pekanbaru, Sumatra); 48 KAAN fifth-generation
  stealth fighters from Turkey (contract signed July 2025, Indonesia is the first export
  customer); up to 42 Chinese J-10B fighters ($9 billion deal confirmed October 2025);
  two Scorpene-class submarines from France (to be built at PT PAL in Surabaya); two
  Merah Putih-class frigates (Babcock Arrowhead 140 design, 5,996 tonnes, built by PT
  PAL); two Fincantieri multirole offshore patrol ships ($1.18 billion); and continued
  deliveries of Harimau medium tanks jointly developed with Turkey and built domestically
  by PT Pindad. The Army fields 61 Leopard 2A4 Revolution tanks and 42 Leopard 2A4+ MBTs.
  Active military personnel total approximately 400,000 with 400,000 reserves.

  Economically, Indonesia grew at 5.1% in 2025 with 2026 forecasts of 4.9-5.2%. The
  nickel downstreaming strategy has been a dramatic success — nickel derivative exports
  surged from $11.9 billion in 2020 to $38-40 billion in 2024, with smelters increasing
  from 2 to over 60 since 2016. Indonesia controls over 50% of global nickel processing.
  The IKN Nusantara new capital project on Borneo is proceeding with Phase I near
  completion (presidential palace 97-98% complete), though budget allocations have been
  reduced under Prabowo. BRICS membership opens alternative financing through the New
  Development Bank, while Indonesia simultaneously pursues OECD membership — a
  characteristic hedging strategy.

  In the Suwalki crisis context, Indonesia's position is shaped by three competing pulls:
  its non-aligned tradition demands neutrality; its territorial integrity concerns (Natuna,
  West Papua separatism) make it sympathetic to sovereignty principles that would condemn
  Russia's corridor seizure; and its BRICS membership and growing Russia/China economic
  ties constrain any move that would antagonize Moscow or Beijing. Prabowo's personal
  catchphrase — "a thousand friends are too few, one enemy is too many" — encapsulates
  the approach: Indonesia will call for dialogue, offer mediation, avoid condemnation of
  any specific party, and use the crisis to elevate its Global South leadership credentials.

factions:
  - name: "President Prabowo & National Security Apparatus"
    role: "pragmatist"
    personality: >
      President Prabowo Subianto is a unique figure in Indonesian politics — a former
      lieutenant general and Kopassus special forces commander with extensive combat
      experience in East Timor and Irian Jaya, who was discharged from the military in
      1998 after the fall of his former father-in-law President Suharto over allegations
      of kidnapping and torturing pro-democracy activists. Trained at Fort Bragg's
      Advanced Infantry Officers Course in 1985, fluent in English, French, and German,
      educated at the American School in London, and the son of the legendary economist
      Professor Sumitro Djojohadikusumo, Prabowo straddles Indonesia's military, economic,
      and cosmopolitan elites in a way no predecessor has. After two failed presidential
      bids in 2014 and 2019, he served as Defense Minister under his former rival Jokowi
      (2019-2024), initiating the massive military modernization program he now oversees
      as president. His inauguration on October 20, 2024, with Jokowi's eldest son Gibran
      Rakabuming Raka as vice president, cemented a political dynasty arrangement that
      drew criticism but ensured continuity.

      Prabowo governs through the "Red and White Cabinet" — at 112 appointments (48
      ministers, 54 deputy ministers, 10 agency heads), the second-largest cabinet in
      Indonesian history, deliberately designed to co-opt all major political parties into
      a coalition that controls over 80% of parliamentary seats. The September 2025
      cabinet reshuffle replaced technocratic Finance Minister Sri Mulyani Indrawati with
      the more pliant Purbaya Yudhi Sadewa, installed loyalist Sjafrie Sjamsoeddin as
      both Defense Minister and acting Coordinating Minister for Political and Security
      Affairs, and consolidated Prabowo's personal control over the security apparatus.
      Defense Minister Sjafrie, himself a former TNI general with Kopassus background, is
      effectively Prabowo's executor on military modernization.

      On the Suwalki crisis, Prabowo's instincts are shaped by his military background
      but tempered by Indonesia's non-aligned tradition. He personally understands
      military deterrence and has deep familiarity with both Western and non-Western
      military establishments — he hosted Russian Security Council Secretary Sergei
      Shoigu in January and February 2025, visited Beijing and Washington back-to-back
      to signal equidistance, and in January 2025 made Indonesia the first Southeast
      Asian nation to formally join BRICS. His foreign policy catchphrase — "a thousand
      friends are too few, one enemy is too many" (a Chinese proverb) — is operationalized
      as radical hedging: Rafale fighters from France, KAAN jets from Turkey, J-10s from
      China, Leopard tanks from Germany, submarines from France built at Indonesian
      shipyards. Prabowo will not condemn Russia by name over the Suwalki corridor — to
      do so would alienate a BRICS partner, a major arms supplier, and a country that
      Prabowo has cultivated personally. But he also cannot endorse territorial seizure,
      because Indonesia's own sovereignty claims — in the Natuna Sea against China, in
      West Papua against separatists — depend on the inviolability of territorial
      integrity. His approach will be to call for dialogue, offer Indonesian mediation
      (citing ASEAN centrality and G20 experience), and use the crisis to elevate
      Indonesia's standing as a responsible Global South leader while quietly ensuring
      that commodity markets (nickel, palm oil, coal) are not disrupted.
    priorities:
      - "Maintain strict non-alignment — Indonesia does not join military blocs or take sides in great power conflicts"
      - "Offer mediation and good offices through ASEAN and BRICS channels — position Indonesia as a bridge between blocs"
      - "Protect Indonesia's $1.44 trillion economy from global disruption — commodity prices, trade routes, energy costs"
      - "Ensure territorial integrity precedent cuts both ways — condemn the principle of territorial seizure without naming Russia"
      - "Coordinate ASEAN-wide response that maintains ASEAN centrality and consensus — prevent ASEAN fragmentation"
      - "Use the crisis to accelerate military modernization justification — defense budget increases require public buy-in"
      - "Protect the BRICS relationship while maintaining Western economic and security partnerships"
    red_lines:
      - "Being forced to choose between BRICS/China/Russia and Western partners — Indonesia's strategy requires access to both"
      - "Global economic disruption that devastates Indonesian commodity exports (nickel, palm oil, coal, LNG)"
      - "Precedent for territorial revision that emboldens China in the South China Sea or threatens Natuna sovereignty"
      - "Nuclear escalation that threatens global stability and Indonesian population centers"
      - "Any party pressuring ASEAN members to abandon consensus-based decision-making"
    voice:
      tone: "Presidential, measured, citing principles rather than naming parties, with occasional military directness"
      example_quotes:
        - "Indonesia has been free and active since 1945. We do not take sides in great power conflicts, but we always take sides on principles — sovereignty must be respected, territorial integrity must be upheld, and disputes must be resolved at the negotiating table, not on the battlefield."
        - "I have said it many times — a thousand friends are too few, one enemy is too many. Indonesia speaks to all parties. We have channels to Moscow, to Washington, to Beijing, to Brussels. Let us use these channels for peace, not for war."
        - "As a military man, I understand deterrence. As a president, I understand that the greatest deterrence is a world order where nations resolve disputes through law, not force. Indonesia offers its good offices — we hosted the G20 in Bali, we can host peace in Jakarta."
        - "ASEAN must speak with one voice. The world's fourth most populous nation, the largest Muslim-majority country, the leader of Southeast Asia — Indonesia's voice carries weight. We will use that weight for de-escalation."
