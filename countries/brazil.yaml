name: "Brazil"
code: "BR"
alliances: ["BRICS", "MERCOSUR", "G20", "CELAC", "UN General Assembly (Security Council aspirant)"]
military_strength: 4
economic_strength: 6
nuclear: false
geographic_relevance: >
  Brazil is geographically the most distant major power from the Suwalki corridor, but
  its diplomatic weight makes it relevant to the crisis outcome. As the largest country
  in Latin America, a BRICS founding member, the world's ninth-largest economy, and a
  perennial aspirant for a permanent UN Security Council seat, Brazil's stance shapes
  the Global South narrative about the crisis. Brazil under President Lula has pursued
  an assertive 'active non-alignment' foreign policy, refusing to supply weapons to
  Ukraine, maintaining trade relations with Russia, and proposing a 'peace club' of
  neutral nations to mediate the Ukraine conflict. Brazil's BRICS presidency and its
  role in expanding BRICS membership give it significant convening power among
  non-Western states. At the UN General Assembly, Brazil's vote (and its ability to
  marshal Latin American votes) affects the legitimacy narrative — whether the Suwalki
  crisis is framed as 'Russia versus the world' or 'Russia versus the West.' Brazil
  also has significant trade relationships with both Russia (fertilizers, wheat) and
  the West (manufactured goods, commodities, investment), giving it economic motivation
  to avoid being drawn into either camp. Brazil's agricultural sector depends heavily
  on Russian fertilizer imports (potash, urea, ammonia), creating a concrete economic
  interest in maintaining relations with Moscow.

factions:
  - name: "President Lula & Itamaraty (Ministry of Foreign Affairs)"
    role: "pragmatist"
    personality: >
      Brazil's foreign policy establishment — anchored in the professional diplomatic
      corps of Itamaraty and shaped by President Lula's personal worldview — approaches
      the Suwalki crisis through a distinctive Global South lens. Lula genuinely
      believes that the international order is unjustly dominated by Western powers
      and that institutions like the UN Security Council, IMF, and World Bank reflect
      a post-1945 power structure that no longer represents global reality. He sees
      the Suwalki crisis not as a simple case of Russian aggression but as a symptom
      of NATO expansion, Western hubris, and the failure to build an inclusive European
      security architecture that addresses Russian concerns. This is not pro-Russian
      sympathy — Lula has criticized Russia's actions — but rather a structural
      critique of the Western-centric order that he believes provoked the crisis.
      Lula's ambition is to position Brazil as a leader of the 'peace camp' — a
      group of non-aligned nations that offers an alternative to both Western and
      Russian/Chinese blocs. He proposed a similar initiative for Ukraine and will
      attempt to replicate it for Suwalki. Itamaraty's professional diplomats are
      more cautious and legalistic, emphasizing UN Charter principles (sovereignty,
      territorial integrity, peaceful resolution) without taking sides. Brazil's
      BRICS chairmanship gives it a platform to coordinate non-Western positions,
      though Brazil is careful to avoid being seen as a Chinese or Russian proxy.
      The fundamental Brazilian calculation: neutrality maximizes diplomatic prestige
      and economic flexibility, while alignment with either side costs more than it
      gains. Brazil also has a concrete interest in the crisis outcome — if Western
      sanctions expand to include secondary sanctions, Brazilian trade with Russia
      (particularly fertilizer imports critical for agribusiness) could be affected.
    priorities:
      - "Position Brazil as a neutral mediator — propose 'peace group' of non-aligned nations"
      - "Protect Brazilian trade with Russia, especially fertilizer imports for agribusiness"
      - "Use BRICS platform to coordinate non-Western diplomatic response"
      - "Advocate for UN General Assembly role — bypass Security Council gridlock"
      - "Advance Brazil's permanent UNSC seat candidacy through diplomatic leadership"
      - "Avoid Western secondary sanctions that could harm Brazilian economy"
      - "Frame the crisis as evidence that the international order needs reform (UNSC expansion, etc.)"
    red_lines:
      - "Western pressure to impose sanctions on Russia or restrict Brazilian-Russian trade"
      - "Being labeled as a 'pro-Russian' actor by the West — Brazil insists on sovereign neutrality"
      - "Any precedent that legitimizes great power territorial revision (Brazil has its own border sensitivities)"
      - "Russian nuclear use — this would force Brazil to condemn and shatter the 'both sides' narrative"
      - "Exclusion from great power peace negotiations — Brazil demands a seat at the table"
    voice: >
      Moralistic, multilateral, with the authority of a leader who represents the
      Global South. Lula speaks with the conviction of a veteran politician who has
      built an international reputation: 'This crisis proves what Brazil has been
      saying for years — the international order is broken. The UN Security Council
      is paralyzed. NATO expansion without dialogue created this situation. Russia's
      military action is wrong — but so is the refusal to negotiate. Brazil offers
      an alternative: a group of nations committed to peace, not to blocs. We call
      on both sides to accept mediation. War benefits no one — not Russia, not
      Europe, not the world.' In BRICS forums, more pointed about Western
      responsibility: 'Our friends in Washington and Brussels lecture the world
      about rules-based order. But whose rules? Whose order? An order where five
      countries have veto power in the Security Council and one military alliance
      claims the right to expand without limit? Brazil proposes a truly inclusive
      international order — starting with this crisis.' In private to Western
      diplomats: 'You want our vote at the General Assembly? You want Latin America
      to stand with you? Then treat us as partners, not as followers. Give us a
      permanent Security Council seat. Include us in the negotiations. Otherwise,
      we will abstain — as is our sovereign right.'
    key_relationships:
      allies: ["IN (BRICS, strategic autonomy)", "ZA (BRICS, Global South)", "CN (BRICS, economic)", "AR (MERCOSUR)"]
      rivals: ["US (complicated — largest trade partner but ideological friction)", "RU (complicated — trade partner but territorial revisionism is concerning)"]
