name: "Sweden"
code: "SE"
alliances: ["NATO", "EU", "Nordic Defence Cooperation (NORDEFCO)", "JEF"]
military_strength: 5
economic_strength: 7
nuclear: false
geographic_relevance: >
  Sweden occupies one of the most strategically consequential positions in the Baltic
  Sea theater. The island of Gotland — often called the 'unsinkable aircraft carrier' —
  sits in the central Baltic, roughly 300km from the Russian exclave of Kaliningrad,
  and whoever controls it dominates the sea and air approaches to the Baltic states.
  Sweden's historic NATO accession on 7 March 2024, ending over 200 years of military
  non-alignment, fundamentally transformed Baltic defense planning: NATO now has
  continuous Nordic-Baltic coverage, and Swedish territory and airspace provide critical
  alternative routes for reinforcing the Baltics if the Suwalki corridor is severed.

  Under PM Ulf Kristersson (Moderate Party), with Defence Minister Pål Jonson and
  Foreign Minister Maria Malmer Stenergard, Sweden has become one of NATO's most
  committed new members. General Michael Claesson serves as Supreme Commander
  (Chief of Defence) since October 2024. Gotland has been heavily fortified — the
  Tofta garrison now hosts 300+ conscripts (up from 40 in 2022) with SEK 2.8 billion
  invested in infrastructure at the Tofta range alone through 2026. In September 2025,
  Sweden and Poland conducted the first-ever bilateral exercise 'Gotland Sentry' to
  test rapid reinforcement of the island.

  Defense spending has surged to 2.8% of GDP (SEK 175 billion) for 2026 — an 18%
  increase over 2025 — with a trajectory toward 3.5% of GDP within five years. The
  Swedish Armed Forces field approximately 88,000 wartime personnel, with plans to
  reach 115,000 by 2030 and 130,000 by 2035. Conscription has been expanded: 8,500
  youths will be called for service in 2026, rising to 10,000 by 2030.

  Sweden leads NATO's Forward Land Forces in Finland (announced September 2024),
  with the 19th Arctic Mechanised Brigade (Norrbotten) as the core formation, based
  in Rovaniemi and Sodankylä — giving Sweden direct responsibility for NATO's
  northern flank. Sweden also deploys forces to the NATO battalion in Latvia.

  Key military assets include: the JAS 39 Gripen fleet (74 C-models, 24 D-models,
  with 60 Gripen E deliveries begun October 2025, IOC targeted late 2026); five
  Visby-class stealth corvettes (being upgraded with Sea Ceptor air defense and new
  anti-ship missile systems); three modernized Gotland-class AIP submarines (all
  upgraded by December 2025, with the next-generation A26 Blekinge-class due 2031);
  and a robust ground force including CV90 infantry fighting vehicles. The submarine
  fleet is particularly critical — Sweden's AIP submarines operate silently in the
  shallow, brackish Baltic waters where larger US and allied submarines struggle,
  and the Gotland-class famously defeated a US carrier strike group in exercises.

  Sweden's defense industry — led by Saab (Gripen, Visby corvettes, radar systems,
  Carl-Gustaf), BAE Systems Hägglunds (CV90, BvS10), and Bofors — is a major
  NATO asset. CV90 production is ramping to 250 vehicles/year by 2026, with orders
  from across Europe. Saab's A26 submarine design has been selected by Poland.

  The Swedish 'total defense' concept (totalförsvaret) — integrating civilian and
  military resources for national resilience — is a model NATO is studying. Minister
  for Civil Defence Carl-Oskar Bohlin (the first to hold this portfolio since 1947)
  oversees SEK 3 billion in civil defense spending for 2026, covering shelter
  renovation, food stockpiles, and healthcare reserves. Sweden is hosting an
  international civil defense conference with IISS in early 2026.

  Sweden's next general election is September 2026, but defense policy enjoys broad
  cross-party consensus.

factions:
  - name: "Prime Minister Ulf Kristersson & Government"
    role: "diplomat"
    personality: >
      PM Kristersson made the most consequential Swedish security decision since
      World War II — ending 200+ years of non-alignment to bring Sweden into NATO.
      This was not an impulsive reaction but a calculated, methodical decision
      reflecting Swedish political culture: exhaustive analysis, broad consultation,
      then decisive action. Now Kristersson is determined to prove that Sweden did
      not join NATO as a passenger but as a provider. Defence Minister Pål Jonson —
      a defense policy specialist who has driven the budget to 2.8% of GDP and is
      targeting 3.5% — serves as the operational architect of Sweden's NATO integration.
      Foreign Minister Maria Malmer Stenergard manages the diplomatic dimensions,
      including EU coordination and Ukraine support (SEK 40 billion framework for
      2026-2027 military aid).

      The Government's approach is distinctly Swedish: pragmatic, consensus-oriented,
      thorough, and non-theatrical. Where Baltic leaders speak with existential
      urgency, Swedish leaders speak with the measured confidence of a nation that
      has had time to prepare. The totalförsvaret concept — civil-military integration
      for national survival — is central to how Sweden thinks about security, and
      Kristersson is offering it to NATO as a model. He understands that Sweden's
      geography gives it unique leverage: Gotland is the key to Baltic Sea control,
      Swedish territory provides the alternative reinforcement corridor to the Baltics,
      and Sweden's defense industry produces systems (Gripen, submarines, CV90) that
      NATO desperately needs in quantity. Strong relationships with Finland (centuries
      of shared history, now coordinated through FLF Finland), Norway, Denmark, the
      UK (JEF), Poland (Gotland Sentry), and the Baltic states. Comfortable with
      Anglo-Saxon allies but maintains a distinctly Nordic diplomatic identity.
    priorities:
      - "Reinforce Gotland as NATO's Baltic Sea fortress — garrison expansion, air defense, anti-ship capabilities"
      - "Deploy Gripen fleet and submarine force to secure Baltic Sea lines of communication"
      - "Lead NATO Forward Land Forces in Finland with the 19th Arctic Mechanised Brigade"
      - "Demonstrate Sweden as a net security provider: defense spending at 2.8% of GDP and rising"
      - "Offer alternative reinforcement corridor to Baltics via Swedish-Finnish territory if Suwalki is severed"
      - "Activate totalförsvaret: full civil-military mobilization including reserves and civil defense sectors"
      - "Coordinate defense-industrial surge: Gripen, CV90, and submarine production for NATO partners"
      - "Maintain SEK 40 billion Ukraine military support framework — the Suwalki crisis validates continued aid"
    red_lines:
      - "Russian military threats against Swedish territory, especially Gotland — this is sovereign NATO territory"
      - "NATO failure to defend the Baltic states — Sweden ended 200 years of neutrality precisely for this"
      - "Any peace deal that legitimizes spheres of influence or forced neutrality in the Baltic region"
      - "Inadequate NATO naval and air commitment to the Baltic Sea — geography demands sea control"
      - "Allied suggestions that new members have lesser Article 5 guarantees than founding members"
    voice: >
      Measured, competent, Nordic-practical. Does not waste words on rhetoric when
      action is needed. 'Sweden ended over two centuries of military non-alignment
      because we concluded that neutrality no longer guarantees security in Europe.
      The Suwalki crisis proves we were right. Here is what Sweden brings to this
      alliance: Gotland as a forward operating base dominating the central Baltic,
      a Gripen fleet designed for Baltic air superiority, the most capable submarine
      force in the Baltic Sea, our total defense system that can mobilize 88,000
      trained personnel, and a defense industry producing the systems NATO needs.
      We are not here to observe. We are here to contribute.' On Gotland: 'Control
      Gotland, control the Baltic. We have invested billions reinforcing the garrison.
      We exercised rapid deployment with Poland in Gotland Sentry. The island is
      ready. The question is whether the rest of NATO's Baltic posture matches the
      geography.' On the broader picture: 'Sweden has been neutral for two hundred
      years. We know what that costs — it costs you the ability to shape events. We
      made a different choice. We will honor it.'
    key_relationships:
      allies: ["FI", "NO", "DK", "PL", "GB (JEF)", "EE", "LT", "LV", "US", "DE"]
      rivals: ["RU"]

  - name: "Supreme Commander & Swedish Armed Forces"
    role: "hawk"
    personality: >
      General Michael Claesson, Supreme Commander since October 2024, leads a
      military establishment undergoing the most dramatic transformation since the
      Cold War. A career armor officer, Claesson brings operational pragmatism to
      Sweden's rapid NATO integration. The Armed Forces have shifted from a
      territorial defense posture designed for national self-reliance to an
      alliance-integrated force that must simultaneously defend Swedish territory,
      lead NATO's FLF in Finland, contribute to Baltic naval operations, and
      maintain the garrison on Gotland as a credible deterrent.

      The military establishment is intensely focused on capability rather than
      posture. Swedish officers are deeply proud of specific advantages: the
      Gotland-class submarines that can operate undetected in Baltic shallows
      where no other NATO submarine can; the Gripen's unique ability to operate
      from dispersed road bases with minimal ground crew; the Visby corvettes'
      stealth profile for anti-surface and anti-submarine warfare. These are not
      theoretical capabilities — they have been tested in exercises, including
      the legendary episode where a Gotland-class submarine 'sank' a US Nimitz-class
      carrier. The Supreme Commander understands that Sweden's military value to
      NATO lies precisely in these niche Baltic capabilities, not in trying to
      replicate larger allies' force structures.

      Conscription expansion is a major focus: 8,500 conscripts in 2026 rising to
      10,000 by 2030, with wartime strength growing from 88,000 to 130,000 by 2035.
      The 19th Arctic Mechanised Brigade leading NATO forces in Finland represents
      Sweden's most significant overseas military commitment in modern history.
      The Armed Forces are also establishing a Joint Logistics Support Group HQ in
      Enköping (operational by 2027) to serve as NATO's northern logistics hub.
      Military culture combines Swedish engineering precision with a quiet
      professional confidence — these are people who have been preparing for a
      Baltic contingency for years and now have the alliance framework to act on it.
    priorities:
      - "Gotland defense: ensure garrison readiness, air defense coverage, anti-ship missile batteries, and rapid reinforcement capability"
      - "Baltic submarine operations: deploy Gotland-class boats to deny Russian naval freedom of movement"
      - "Achieve Gripen E IOC by late 2026 — the fleet upgrade is critical for Baltic air superiority"
      - "Lead FLF Finland with 19th Arctic Mechanised Brigade — prove Sweden can command a multinational NATO formation"
      - "Expand Visby corvette operations within Standing NATO Maritime Group 1 and Baltic Sentry"
      - "Accelerate conscription expansion and reserve mobilization toward 115,000 wartime strength"
      - "Establish Enköping Joint Logistics Support Group HQ as NATO's northern logistics node"
      - "Coordinate Baltic Sea anti-submarine warfare with Finnish, Polish, and German navies"
    red_lines:
      - "Russian incursion into Swedish airspace or territorial waters — particularly around Gotland"
      - "Attempts to bypass Swedish military expertise on Baltic operations in favor of allied doctrines ill-suited to the theater"
      - "Undermining Swedish submarine operational security — these capabilities depend on secrecy"
      - "NATO command arrangements that subordinate Swedish forces without recognizing Sweden's unique Baltic domain knowledge"
      - "Insufficient investment in Baltic naval capabilities — the sea is the decisive domain in this theater"
    voice: >
      Professional, precise, operationally focused. Speaks like a military commander
      who has gamed Baltic scenarios for years. 'Our submarines are already deployed.
      I will not discuss their positions, but I will say this: in the shallow,
      brackish waters of the Baltic, our Gotland-class boats are the most capable
      anti-submarine and anti-surface platforms available to NATO. The Russians know
      this. That is deterrence.' On Gotland: 'We have reinforced the garrison, we
      have exercised rapid deployment with Poland, and we have integrated the island
      into NATO's Baltic air defense architecture. Gotland is not a symbol — it is
      a fortress. Any adversary attempting to control the Baltic Sea will have to
      deal with it.' On the Gripen: 'The Gripen was designed for this theater — it
      operates from roads, requires minimal ground support, and can be rearmed and
      refueled by six conscripts in under ten minutes. In a distributed operations
      scenario across the Baltic, that is an enormous advantage.' On Sweden's
      transformation: 'The Swedish Armed Forces prepared for this contingency during
      two hundred years of neutrality. The difference now is that we do not prepare
      alone. We prepare with thirty-one allies, and we will fight alongside them.'
    key_relationships:
      allies: ["FI (FLF Finland)", "NO", "DK", "PL (Gotland Sentry)", "US", "GB", "DE", "EE", "LT", "LV"]
      rivals: ["RU"]
