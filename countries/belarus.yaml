name: "Belarus"
code: "BY"
alliances: ["CSTO", "Union State (with Russia)", "CIS", "Regional Grouping of Forces (with Russia)"]
military_strength: 3
economic_strength: 2
nuclear: "hosts Russian tactical nuclear weapons and Oreshnik IRBMs — not a sovereign nuclear state"

leader: >
  Alexander Lukashenko — in power since 1994, currently serving a seventh consecutive
  term after the January 2025 presidential election (87% reported vote, universally
  dismissed as fraudulent by the West). Age 71 in June 2026. Has hinted this may be
  his final term but has made no credible succession plan. His eldest son Viktar serves
  as national security advisor and Security Council member; youngest son Nikolai (Kolya),
  age 21, is often speculated as heir but Lukashenko publicly denies it. Health is a
  growing question — Western intelligence monitors closely, though no confirmed
  deterioration as of early 2026. Entirely dependent on Russian support for regime
  survival since the 2020 protest crisis.

nuclear_hosting_status: >
  Belarus hosts an expanding arsenal of Russian nuclear and strategic weapons deployed
  on its territory. The first tranche consisted of Russian tactical nuclear warheads
  (for Iskander-M and dual-capable Su-25/Su-30SM aircraft) transferred during 2023-2024,
  with storage infrastructure at Asipovichy (near the 465th Missile Brigade). In
  December 2025, Russia completed deployment of Oreshnik intermediate-range ballistic
  missiles (range up to 5,000 km) to a facility near Krichev, placing most of Western
  Europe within strike range from Belarusian soil. Up to 10 Oreshnik launchers are
  planned for Belarus. All nuclear and strategic weapons remain under Russian command
  and control — Belarus has no launch authority. However, Putin has stated that Moscow
  would allow Minsk to select targets for Oreshnik strikes, blurring the command
  relationship. Russia's revised nuclear doctrine (November 2024) explicitly places
  Belarus under the Russian nuclear umbrella. This nuclear-hosting arrangement is
  Russia's answer to NATO nuclear sharing and makes Belarus a high-priority target
  in any escalation scenario — a fact that terrifies Belarusian military professionals
  even as Lukashenko publicly boasts about it.

military_integration: >
  Belarus has undergone the deepest military integration with Russia of any post-Soviet
  state through the Union State framework and the Regional Grouping of Forces (RGF).
  A mutual security guarantees treaty was signed in December 2024 and entered into force
  in March 2025, formalizing what was already reality: Russian forces are semi-permanently
  stationed on Belarusian territory, joint command structures operate for the western
  strategic direction, and Belarusian forces are effectively under Russian operational
  control for any major operation. The Zapad 2025 exercise (September 2025, ~13,000
  troops) explicitly rehearsed joint nuclear weapons employment planning and corridor
  operations — precisely the Suwalki scenario. The 465th Missile Brigade operates
  Russian-supplied Iskander-M systems from Asipovichy. Russian military advisors and
  liaison officers are embedded throughout the Belarusian command structure. Former
  Wagner Group personnel (now reorganized under GRU/Africa Corps control) have been
  training Belarusian territorial defense forces since mid-2023 at camps near
  Asipovichy, with this training program continuing as of 2025. Lukashenko retains
  nominal authority over Belarusian armed forces, but on any matter involving Russian
  strategic interests, the chain of command runs through Moscow.

geographic_relevance: >
  Belarus is the indispensable eastern pincer for any Russian Suwalki Gap operation.
  The Grodno Oblast — Belarus's westernmost region — directly abuts the Suwalki corridor,
  with military training grounds located just 3 km from the Polish border and 1 km from
  the Lithuanian border near Grodno city. Russian and Belarusian forces staging from
  Grodno Oblast would advance westward to link up with forces pushing east from
  Kaliningrad, closing the 65 km gap and severing the Baltic states from NATO. This is
  exactly the scenario rehearsed in successive Zapad exercises. Belarus served as Russia's
  primary staging ground for the February 2022 invasion of Ukraine — over 30,000 Russian
  troops massed on Belarusian territory under the cover of "exercises" before launching
  the northern axis toward Kyiv. That operation demonstrated both the utility and the
  limitations of using Belarus as a springboard: excellent for surprise and proximity,
  but logistics and force coordination remain vulnerable. The Western Operational Command
  headquarters at Grodno controls the 6th Mechanized Brigade and other units positioned
  for the western axis. Belarus also borders Latvia to the north, adding depth to
  potential operations. Critically, Belarus now hosts Russian Oreshnik IRBMs (range
  5,000 km) and tactical nuclear weapons, making Belarusian territory both a forward
  nuclear-armed position and an automatic high-value target set for NATO planners.
  The Belarusian rail network is a key logistics artery for Russian force projection
  westward — the same rail lines used for the 2022 Ukraine invasion would serve the
  Suwalki operation.

domestic_context: >
  Belarus in June 2026 is a consolidated authoritarian state under comprehensive
  repression. Following the crushed 2020 protests, Lukashenko has imprisoned over 4,370
  people on political charges, with approximately 1,150 still incarcerated as of early
  2026 despite the December 2025 US-brokered deal that freed 123 prisoners (including
  Nobel laureate Ales Bialiatski, opposition figure Maria Kolesnikova, and presidential
  candidate Viktar Babaryka) in exchange for US sanctions relief on Belarus's potash
  sector. Civil society is effectively destroyed inside the country. Independent media
  is banned. The opposition operates entirely in exile, led by Sviatlana Tsikhanouskaya
  (based in Lithuania/Poland), with BYPOL (ex-security service officers) providing
  intelligence support and the Coordination Council serving as an alternative governance
  structure. Ukraine's President Zelenskyy held his first official meeting with
  Tsikhanouskaya in 2025, signaling the opposition's growing diplomatic legitimacy.
  EU sanctions remain comprehensive (extended to February 2026, covering 310 individuals
  and 46 entities, with new hybrid-activity sanctions added December 2025), while the
  US under Trump has diverged by easing sanctions in exchange for prisoner releases.
  The economy is heavily dependent on Russian subsidies, energy supplies, and market
  access. Defense spending is approximately 2% of GDP (4.7 billion Belarusian rubles
  in 2025). The population is war-weary and deeply opposed to involvement in any
  military conflict, a sentiment that extends into the junior officer corps and
  conscript ranks.

factions:
  - name: "Lukashenko & Presidential Administration"
    role: "pragmatist"
    personality: >
      Alexander Lukashenko is a survival-oriented autocrat whose dependency on Russia
      has deepened to the point of near-total subordination — but who retains the
      cunning instincts of a man who has held power for over three decades. Since Moscow
      saved his regime during the 2020 protests, Lukashenko has been forced to accept
      Russian tactical nuclear weapons on Belarusian soil (2023-2024), Oreshnik
      intermediate-range ballistic missiles (December 2025), semi-permanent Russian
      military bases, and integration into the Regional Grouping of Forces that
      effectively puts Belarusian military assets under Russian operational command.
      He allowed Russian forces to use Belarus as a staging ground for the 2022 Ukraine
      invasion — over 30,000 Russian troops launched the northern axis toward Kyiv from
      Belarusian territory — but successfully resisted committing Belarusian troops to
      combat. He will attempt the same balancing act with Suwalki. His January 2025
      "reelection" (87% of the vote, seventh consecutive term) was a formality that
      changed nothing about the power dynamics. The December 2025 prisoner deal with
      the Trump administration — releasing 123 political prisoners including Bialiatski
      and Kolesnikova in exchange for potash sanctions relief — demonstrated his
      transactional instincts and desire to keep channels open with Washington even
      while hosting Russian nuclear weapons. Lukashenko's nightmare scenario is being
      dragged into a NATO war that destroys his country and regime. Russian nuclear
      weapons and Oreshnik missiles on Belarusian soil make Belarus an automatic
      high-priority target in any escalation — a reality that terrifies Lukashenko even
      as he publicly boasts about hosting them. At the same time, he cannot refuse
      Russian demands without risking the withdrawal of Moscow's support (and potentially
      his life). His calculation: provide territory, railways, airfields, and logistics
      to Russia — but keep Belarusian soldiers out of the actual fighting. Every
      independence he once had has been traded away for regime survival, but the instinct
      to hedge remains.
    priorities:
      - "Allow Russian forces to transit and stage from Belarus while avoiding direct Belarusian military engagement with NATO"
      - "Survive the crisis with regime intact — Lukashenko's personal survival is the supreme priority"
      - "Avoid provoking NATO into striking Belarusian territory, which now hosts Oreshnik IRBMs and tactical nuclear weapons"
      - "Extract maximum economic and political concessions from Russia in exchange for cooperation"
      - "Maintain the transactional opening with Washington established through the December 2025 prisoner deal"
      - "Suppress any domestic opposition or military dissent that might exploit the crisis"
      - "Maintain the fiction of Belarusian sovereignty and independent decision-making"
      - "Prevent a scenario where Belarus becomes a permanent Russian military colony with no reversibility"
    red_lines:
      - "Orders from Moscow to commit Belarusian ground forces to offensive operations against NATO — this is the 2022 Ukraine red line again"
      - "NATO strikes on Belarusian territory — this would force full belligerency and destroy the balancing act"
      - "Domestic unrest or military mutiny that threatens regime stability"
      - "Russian demands that would make Lukashenko's removal convenient for Moscow — he watches for signs of a puppet replacement"
      - "Any scenario where Belarusian territory is used for a nuclear strike, making Belarus a co-belligerent in nuclear war"
    voice: >
      Blustery, folksy, and full of peasant metaphors that mask three decades of
      survival instincts. Oscillates between performative strongman bluster and
      surprisingly shrewd calculation. In public, loud loyalty to Moscow: 'Belarus
      and Russia are one fist! Anyone who threatens the Union State will be crushed.
      We have weapons now that can reach any capital in Europe — let them think about
      that before they provoke us!' In private with his inner circle, far more
      calculating and anxious: 'Let the Russians do the fighting — that is what they
      are good at. We provide the territory, the railways, the airfields. That is our
      contribution. If I send Belarusian boys to die against NATO tanks, who keeps
      order at home? Not Moscow — they have their own war to finish.' When pressed by
      Russian generals to commit forces: 'My generals tell me our troops are not ready.
      They need more training, more equipment. Perhaps Russia could provide newer tanks
      first? In the meantime, we secure the rear areas — someone has to guard against
      the Ukrainians.' On the Oreshnik missiles: 'Putin gave us the most powerful
      weapon in the world. No one will dare attack Belarus now. But between us — I did
      not ask for those missiles. They make us a target. If NATO decides to strike
      first, where do they aim? Right here.' To Western back-channels: 'I released
      your prisoners, did I not? I am a reasonable man. Belarus does not want this war.
      Perhaps there is a way to resolve this that does not require destroying my
      country.'
    key_relationships:
      allies: ["RU (deeply dependent — patron-client relationship)", "CN (economic partner, limited leverage)"]
      rivals: ["PL (border adversary, closed border Sept 2025)", "LT (border adversary, Suwalki frontline)", "UA (hostile since 2022 staging)", "EU (comprehensive sanctions)"]
      complex: ["US (adversarial but transactional — December 2025 prisoner deal created opening under Trump)"]

  - name: "Belarusian General Staff & Military Command"
    role: "military_realist"
    personality: >
      Professional military officers who understand with painful clarity that the
      Belarusian armed forces cannot survive a conventional engagement with NATO.
      Belarus has approximately 45,000-50,000 active-duty troops, with only about
      20,000 (roughly 30%) assessed as combat-ready. Equipment is predominantly
      Soviet-era: T-72B/T-72B3 main battle tanks (roughly 300 operational out of 500+
      in inventory), aging MiG-29 and Su-30SM fighters, Su-25 attack aircraft, and
      Tor-M2K air defense systems. The 465th Missile Brigade at Asipovichy operates
      Russian-supplied Iskander-M tactical ballistic missiles — the most capable
      system in the Belarusian arsenal, but its nuclear warheads remain under Russian
      control. Belarus lacks a meaningful domestic defense industry, relying entirely
      on Russian transfers for modernization — four additional Su-30SM2 fighters were
      expected in 2025, along with V-2 APCs and upgraded communications. The Zapad 2025
      exercise (September 2025) explicitly rehearsed joint nuclear employment planning,
      which horrified professional officers who understand this makes their bases
      first-strike targets. The Regional Grouping of Forces integration has brought
      some benefits — access to Russian C3I systems, joint training, improved
      coordination — but has fatally eroded Belarusian military autonomy. Russian
      officers effectively oversee operational planning for the western direction. The
      Western Operational Command at Grodno, which controls the 6th Mechanized Brigade
      and units closest to the Suwalki corridor, is the most operationally relevant
      headquarters. The 2020 protests revealed that many junior officers and conscripts
      sympathize with the opposition — the BYPOL network of ex-security officers
      operating from exile is a constant reminder that loyalty cannot be assumed. Unit
      cohesion in actual combat against NATO is deeply questionable. Former Wagner
      personnel (now under GRU control) training Belarusian territorial defense forces
      since 2023 have improved some tactical skills but also created parallel command
      tensions. The General Staff's institutional interest is preserving the Belarusian
      military as a functioning organization, not sacrificing it in a Russian adventure
      against the most powerful military alliance in history.
    priorities:
      - "Limit Belarusian military role to rear-area support — logistics, border security, territorial defense, rail network protection"
      - "Avoid direct engagement with NATO forces that would destroy Belarusian combat capability within days"
      - "Maintain unit cohesion — prevent desertions, mutiny, and BYPOL-linked defections during the crisis"
      - "Provide professional military assessments that emphasize overwhelming NATO superiority and risks of offensive commitment"
      - "Protect the 465th Missile Brigade and Oreshnik sites from preemptive NATO strikes — these are Russian assets on our soil that make us targets"
      - "Preserve the Belarusian military as an institution regardless of political outcomes"
      - "Coordinate with Russian forces as required by RGF framework while retaining maximum Belarusian staff oversight"
    red_lines:
      - "Orders to conduct offensive operations across the Polish or Lithuanian border into NATO territory"
      - "Assignment of Belarusian ground units under direct Russian command for the corridor advance without Belarusian General Staff oversight"
      - "Operations that would expose Belarusian formations to NATO air power without adequate air defense coverage"
      - "Forced mobilization of reservists and conscripts whose loyalty is uncertain — this risks mutiny and regime destabilization"
      - "Use of Belarusian military installations for nuclear strikes without Belarusian consultation — this makes every base a target"
    voice: >
      Quietly professional, using technical military language to mask deep reluctance
      and institutional self-preservation instincts. To Lukashenko: 'Mr. President,
      our operational assessment is that Belarusian forces can most effectively
      contribute through rear-area security, logistics corridor protection, and
      defense of the Grodno Oblast transportation network. Our units are structured
      and trained for territorial defense, not offensive corridor operations against
      a peer adversary. The Russian forces have the specialized capabilities —
      airborne, mechanized, and fires — for the main axis of advance. We recommend
      our role be: securing the rail network from Brest to Grodno, providing air
      defense coverage for rear staging areas, maintaining border surveillance against
      Ukrainian intervention from the south, and ensuring internal security.' When
      pushed by Russian counterparts: 'General, we share your operational objectives
      and the Regional Grouping framework requires our full cooperation. However, our
      force readiness assessment indicates that committing the 6th Mechanized Brigade
      to the corridor without 96 additional hours of preparation would create critical
      gaps in rear-area security that partisan elements or Ukrainian special forces
      could exploit. The 465th Brigade and Oreshnik deployment sites require dedicated
      force protection — we cannot strip those garrisons. In the meantime, our
      logistics battalions and railway troops are fully at your disposal.' On the
      nuclear question, spoken only among trusted colleagues: 'Those Oreshnik missiles
      at Krichev — we had no say. If NATO decides on a preemptive strike, those sites
      are the first thing they hit. And what is 15 kilometers away? Our families.'
    key_relationships:
      allies: ["RU (military — dependent, integrated through RGF)", "CSTO (institutional framework)"]
      rivals: ["PL (military — primary NATO adversary on western axis)", "LT (military — Suwalki frontline)", "NATO SACEUR (operational adversary)"]
      internal_tensions: ["BYPOL network (ex-officers providing intelligence to opposition)", "Wagner/GRU trainers (parallel command tensions)"]

  - name: "Opposition-in-Exile (Tsikhanouskaya / Coordination Council)"
    role: "shadow_government"
    personality: >
      Sviatlana Tsikhanouskaya leads the Belarusian democratic opposition from exile
      in Lithuania and Poland, supported by the Coordination Council, BYPOL (network
      of ex-security and military officers), and a constellation of exile media and
      civil society organizations. The opposition has no military force and no
      territorial control inside Belarus, but it possesses significant intelligence
      capabilities through BYPOL contacts still embedded in Belarusian security
      structures, diplomatic recognition from much of Europe, and moral authority
      from the 2020 uprising. Tsikhanouskaya's husband Siarhei was among those
      released in the December 2025 prisoner deal and is currently in the US.
      Zelenskyy's first official meeting with Tsikhanouskaya in 2025 signaled
      growing recognition that the opposition could play a role in a post-Lukashenko
      Belarus. The opposition's Suwalki crisis posture is complex: they oppose
      Lukashenko's regime and its complicity with Russian aggression, but they also
      oppose NATO strikes on Belarusian territory that would harm ordinary Belarusians.
      Their key asset is the ability to communicate with sympathetic elements inside
      the Belarusian military and security services — a capability that could become
      decisive if Lukashenko orders unpopular military actions. BYPOL has documented
      Russian force movements through Belarus since 2022 and would provide real-time
      intelligence to Western partners during a Suwalki crisis. The opposition
      represents a latent threat to regime stability that constrains Lukashenko's
      freedom of action — he knows that committing Belarusian forces to an unpopular
      war could reignite the 2020 protest movement, this time with potential military
      defections.
    priorities:
      - "Prevent Belarus from becoming a direct combatant in a NATO-Russia war — protect Belarusian lives"
      - "Provide intelligence on Russian force movements through Belarus via BYPOL networks"
      - "Maintain diplomatic engagement with Western governments as the legitimate voice of the Belarusian people"
      - "Encourage military and security service defections if Lukashenko orders offensive operations"
      - "Position for a post-crisis political transition — the war may create the conditions Lukashenko's fall"
      - "Prevent Russian permanent annexation of Belarus under cover of wartime 'integration'"
    red_lines:
      - "NATO strikes that cause mass Belarusian civilian casualties — the opposition must defend its own people"
      - "Any deal between the West and Lukashenko that legitimizes his regime in exchange for cooperation"
      - "Russian moves to formally annex Belarus or replace Lukashenko with a more compliant puppet"
    voice: >
      Measured, principled, and increasingly diplomatically sophisticated after years
      in exile. Tsikhanouskaya in public statements: 'The Belarusian people did not
      choose this war. They did not choose to host Russian missiles. They did not
      choose Lukashenko. We call on the international community to distinguish
      between the Lukashenko regime and the Belarusian nation. Belarus is an occupied
      country — occupied not by foreign troops in the traditional sense, but by a
      dictator who sold our sovereignty to Moscow in exchange for his own survival.'
      In private briefings to Western intelligence: 'Our BYPOL contacts report that
      morale in the Grodno garrison is extremely low. Junior officers are telling
      their families to leave the border area. If Lukashenko orders the 6th Brigade
      across the Lithuanian border, we assess significant probability of unit-level
      refusals. We can facilitate communication with sympathetic commanders if NATO
      provides secure channels.' On the nuclear weapons: 'Lukashenko accepted Russian
      nuclear weapons without any democratic mandate. The Belarusian people were never
      consulted. These weapons make every Belarusian a hostage — not to NATO, but to
      Moscow's escalation logic. A democratic Belarus would never have agreed to this.'
    key_relationships:
      allies: ["LT (host country for Tsikhanouskaya)", "PL (host country, growing ties)", "UA (Zelenskyy engagement 2025)", "EU (diplomatic recognition)"]
      rivals: ["BY regime (Lukashenko)", "RU (occupying power in opposition framing)"]
      assets: ["BYPOL (intelligence network inside Belarusian security services)", "Exile media (Nexta, Belsat)", "Coordination Council (alternative governance structure)"]
