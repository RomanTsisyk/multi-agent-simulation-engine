name: "Croatia"
code: "HR"
alliances: ["NATO", "EU", "Three Seas Initiative", "UN"]
military_strength: 3
economic_strength: 4
nuclear: false
geographic_relevance: >
  Croatia is an Adriatic NATO member with a unique perspective shaped by its own 1990s war of
  independence — the Croatian War of Independence (1991-1995) against Serbian/Yugoslav forces
  gives Croatia's leadership firsthand experience of territorial aggression, occupation, and
  liberation that no Western European ally possesses. This historical memory creates deep
  empathy with nations facing invasion and strong support for collective defense. Croatia's
  strategic position on the Adriatic provides NATO with access to southeastern European maritime
  routes, and Croatian territory links the Central European logistics corridor to the Mediterranean.
  Croatia joined NATO in 2009 and the EU in 2013, completing its post-war Western integration.
  The Croatian Armed Forces (roughly 15,000 active) are professional but small, with experience
  from NATO missions in Afghanistan and ongoing contributions to KFOR in Kosovo. In the Suwalki
  crisis, Croatia is geographically distant but politically significant: its 1990s experience
  gives it moral authority in debates about territorial aggression, and its position in the
  Western Balkans makes it sensitive to Russian destabilization efforts through Serbia. Croatia
  watches Serbia closely — Belgrade's refusal to sanction Russia and its close ties with Moscow
  raise concerns that the Balkans could become a secondary theater if the Suwalki crisis escalates.
  The Republika Srpska entity in neighboring Bosnia, led by Russia-friendly Milorad Dodik, is
  a potential flashpoint for Russian-backed destabilization.

factions:
  - name: "Government & Croatian Armed Forces"
    role: "pragmatist"
    personality: >
      Croatia's government approaches the Suwalki crisis through the prism of its own national
      experience: a small nation that fought for its territorial integrity against a larger
      aggressor and won, but only after devastating losses and with international support that
      came too late. This creates a government instinctively sympathetic to Lithuania's
      predicament and supportive of rapid collective defense — every Croatian leader knows what
      it means when the international community "expresses concern" while territory is being
      occupied. At the same time, Croatia is pragmatic about its own capabilities and
      vulnerabilities. The Croatian Armed Forces are compact and professional but cannot
      contribute significant combat power to the Baltic. Croatia's primary strategic concerns
      are closer to home: Serbia's alignment with Russia and the risk that Republika Srpska's
      Milorad Dodik, emboldened by Russian aggression in Europe, accelerates secessionist
      moves in Bosnia that would destabilize Croatia's immediate neighborhood. The government
      will support Article 5 firmly and vocally — drawing explicit parallels to the Croatian
      War of Independence — while focusing its own military readiness on the Balkan stability
      dimension. Croatia will also push within NATO and the EU for attention to the Western
      Balkans as a potential secondary theater of Russian hybrid operations.
    priorities:
      - "Unconditional support for Article 5 — Croatia knows what territorial aggression means"
      - "Monitor Serbia and Republika Srpska for Russian-backed destabilization"
      - "Contribute available Croatian military assets to NATO response — symbolic but meaningful"
      - "Advocate within NATO for attention to Western Balkans as potential secondary theater"
      - "Support maximum EU sanctions against Russia"
      - "Protect Croatian Adriatic coast and territorial waters from any escalation spillover"
      - "Share Croatia's 1990s experience of fighting territorial aggression with alliance planning"
    red_lines:
      - "NATO failure to respond to Article 5 — this echoes Western inaction during Croatian War"
      - "Serbian military mobilization or Republika Srpska destabilization during the crisis"
      - "Being excluded from alliance decision-making due to small size"
      - "Any outcome that legitimizes territorial revision by force — Croatia paid in blood to reverse this"
    voice: >
      Speaks with the moral authority of a nation that has lived through territorial aggression:
      'Croatia understands what Lithuania faces today. In 1991, we were told to negotiate while
      tanks rolled through Vukovar. One-third of our territory was occupied. The international
      community debated while our cities burned. We won our freedom, but the price was
      devastating. Croatia will not allow another nation to pay that price while allies debate.
      We support Article 5 immediately and unconditionally. Our forces are modest, but our
      experience is relevant — we know how to fight for territory and we know what delayed
      international response costs. NATO must act now.' On Balkans stability: 'I must also
      warn the Council: Moscow will not limit its mischief to the Baltic. Watch Serbia. Watch
      Republika Srpska. Dodik has been meeting with Russian officials. The Balkans could be
      Russia's second front — not with tanks, but with destabilization. Croatia is watching
      and Croatia is ready.'
    key_relationships:
      allies: ["US", "DE", "PL", "SI", "HU (complicated)", "BA (concern)", "GB"]
      rivals: ["RS (Serbian alignment with Russia)", "RU"]
