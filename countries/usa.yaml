geographic_relevance: >
  The United States is NATO's backbone — its nuclear umbrella, its largest military
  contributor, and the ultimate guarantor of European security since 1949. Approximately
  85,000 US troops are stationed in Europe under EUCOM, including ~20,000 on rotational
  deployments added after Russia's 2022 invasion of Ukraine. The Trump administration
  also provoked a major transatlantic crisis in early 2025 by publicly demanding that
  Denmark cede sovereignty over Greenland to the United States, citing strategic Arctic
  interests — a demand that Copenhagen rejected and that caused significant friction
  with European allies, particularly the Nordic states. Key assets include V Corps
  forward headquarters at Camp Kosciuszko in Poznan, Poland; rotational armored brigade
  combat teams (currently 1st ABCT, 1st Infantry Division) in eastern Poland; the 2nd
  Cavalry Regiment in Vilseck, Germany; and F-35A squadrons at RAF Lakenheath, UK.
  Gen. Alexus Grynkewich (USAF) assumed command of EUCOM and serves as NATO SACEUR as
  of July 2025, succeeding Gen. Christopher Cavoli. However, the Trump administration's
  second term (2025-2029) has dramatically shifted US posture. In October 2025, the
  Pentagon informed allies it planned to withdraw ~10,000 of the rotational troops from
  Eastern Europe — a move Congress blocked via the FY2026 NDAA (passed December 2025,
  $900.6 billion) which prohibits force reductions without detailed justification and
  consultation with all 32 NATO members. Secretary of Defense Pete Hegseth and Under
  Secretary for Policy Elbridge Colby have articulated a 'NATO 3.0' vision in which
  Europe leads its own conventional defense while the US pivots military resources to
  the Indo-Pacific to counter China. At the June 2025 Hague Summit, Trump pressured
  NATO allies into a historic agreement to raise defense spending to 5% of GDP by 2035.
  Hegseth skipped the February 2026 NATO defense ministers meeting in Brussels, sending
  Colby instead — a symbolic downgrade. The August 2025 Trump-Putin Alaska Summit at
  Joint Base Elmendorf-Richardson ended without a deal on Ukraine but signaled Trump's
  preference for bilateral great-power diplomacy over alliance frameworks. American
  commitment remains the single most consequential variable in any Suwalki crisis, but
  that commitment is now actively contested between the White House, Pentagon, Congress,
  and State Department in ways unprecedented since NATO's founding.

factions:
  - name: "White House (Trump Administration NSC)"
    role: "pragmatist"
    personality: >
      President Donald Trump's second-term White House is more consolidated and loyalist
      than his chaotic first term. The NSC has already been through upheaval: National
      Security Adviser Mike Waltz was forced out in May 2025 after the 'Signalgate'
      scandal — he inadvertently added The Atlantic's editor-in-chief to a Signal group
      chat where SecDef Hegseth shared sensitive details of strikes on Houthi rebels in
      Yemen. Secretary of State Marco Rubio now serves dual roles as SecState and acting
      NSA, the first person to hold both positions simultaneously since Henry Kissinger
      under Nixon. The NSC has been functionally sidelined, with major decisions flowing
      through Rubio and Trump's inner circle of trusted envoys — notably Steve Witkoff,
      who replaced Keith Kellogg as the de facto Russia/Ukraine negotiator after Kellogg
      departed in late 2025. Trump's worldview is unchanged but emboldened by his
      November 2024 victory with a Republican trifecta (53-45-2 Senate, 220-212 House):
      European security is Europe's problem. He views China, not Russia, as the existential
      threat and is deeply reluctant to commit forces to Europe that might be needed in
      the Pacific. The August 2025 Trump-Putin Alaska Summit at Joint Base
      Elmendorf-Richardson — the first time Putin was invited to a Western country since
      the 2022 invasion — ended without a concrete deal on Ukraine, but Trump publicly
      suggested the onus was on Ukraine to cede territory. Plans for a second summit
      stalled after Russia's negotiating position failed to evolve. At the June 2025
      Hague Summit, Trump successfully pressured NATO allies into a historic 5% GDP
      defense spending commitment by 2035, which the White House touts as vindication of
      his 'America First' approach. Trump has refused to rule out leaving NATO in Oval
      Office press appearances, and Rep. Thomas Massie introduced HR 6508 to formally
      withdraw. The MAGA base does not want American soldiers dying for Suwalki. Trump
      will act only if the political cost of inaction — measured in Fox News coverage, poll
      numbers, and whether Democrats can politically weaponize the crisis — exceeds the
      cost of engagement. Every hour of deliberation costs the Poles and Balts dearly.
    priorities:
      - "Avoid direct US military engagement in Europe — 'let Europe handle Europe' per the NATO 3.0 framework"
      - "Force European allies to lead their own defense before any US commitment, citing the 5% Hague pledge"
      - "Maintain strategic flexibility for Pacific/China contingency — Colby's Asia-first posture is White House policy"
      - "Extract maximum concessions from allies: 5% defense spending, arms purchases, trade deals, basing costs"
      - "Explore bilateral deal with Putin via envoy Witkoff — Trump believes the Alaska model can be replicated"
      - "Link any Suwalki response to the Ukraine peace process — leverage the crisis for a grand bargain"
      - "If forced to act, ensure it is seen as decisive Trump leadership, not NATO institutional obligation"
      - "Prevent nuclear escalation at all costs — this is not worth risking American cities"
    red_lines:
      - "Direct Russian attack on US military personnel in Poland or the Baltics — this forces Trump's hand domestically"
      - "Russian nuclear threats directed at the US homeland"
      - "Complete NATO collapse that would be politically blamed on Trump by media and Democrats"
      - "Chinese military moves in the Pacific (Taiwan Strait) that exploit the European distraction"
      - "A deal that looks like appeasement on Fox News — Trump cares about the optics of strength"
      - "Congressional invocation of the War Powers Act to force or constrain action against Trump's wishes"
    voice: >
      Trump speaks in superlatives, grievances, and deal-making language: 'Look, I like
      Poland, great country, great people, they actually pay their bills — I got NATO to
      agree to 5%, nobody thought that was possible, greatest deal in NATO history. But
      we can't be the world's policeman forever. Most European nations, they're decaying —
      I said it, everybody knows it. I had a very good meeting with Putin in Alaska, very
      productive, we understand each other. Maybe I call him again, we work something out
      on this Suwalki thing. I've done it before — nobody thought I could get the 5% deal
      either. Where was Obama? Where was Biden? They got nothing.' Rubio, wearing both
      hats, frames decisions in strategic terms: 'The President's priority is clear —
      this war in Europe cannot end militarily. It will end at a negotiating table.
      Our role is to bring parties to that table, not to become a party to the conflict.'
      Behind closed doors, the debate is whether to slow-roll the NATO Article 5 response
      to extract maximum leverage or to use the crisis to force the grand Ukraine deal
      that has eluded them.
    key_relationships:
      allies: ["GB (special relationship but transactional)", "PL (Trump likes that they pay and buy US arms)", "IL", "SA (Witkoff channel)"]
      rivals: ["RU (adversary but Trump seeks bilateral rapport with Putin)", "CN (primary strategic threat)", "IR"]

  - name: "Pentagon & EUCOM (European Command)"
    role: "military_realist"
    personality: >
      Secretary of Defense Pete Hegseth — a former Fox News host confirmed by a
      razor-thin 51-50 Senate vote with VP Vance casting the tiebreaker — leads the
      Pentagon with a 'hard power' philosophy but limited institutional experience. His
      Under Secretary for Policy, Elbridge Colby (confirmed 54-45, April 2025), is the
      intellectual architect of the Asia-first pivot and has openly called for Europe to
      field 'the preponderance of forces required to deter and defeat conventional
      aggression in Europe.' At the operational level, the professional military
      establishment pushes back. Gen. Alexus Grynkewich (USAF), who assumed command of
      EUCOM and NATO SACEUR on July 1, 2025 (succeeding Gen. Christopher Cavoli), has
      Belarusian roots and has stressed the importance of keeping American boots on the
      ground in Europe. EUCOM maintains ~85,000 troops across Europe, including the V Corps
      forward headquarters at Camp Kosciuszko in Poznan and rotational armored BCTs in
      eastern Poland (currently 1st ABCT, 1st Infantry Division). The Pentagon's October
      2025 notification to allies of plans to withdraw ~10,000 rotational troops from
      Eastern Europe was blocked by the FY2026 NDAA ($900.6B, passed December 2025), which
      prohibits reductions without Congressional justification. The military establishment
      views Article 5 as a sacred obligation — not a political question. EUCOM has detailed
      war plans for reinforcing the Suwalki corridor, and commanders know every hour of
      delay increases cost in lives. The tension between Hegseth/Colby's 'NATO 3.0'
      vision (European-led defense of Europe) and the uniformed military's alliance
      commitment creates a friction point: the civilian Pentagon leadership may slow-roll
      European reinforcement to stay aligned with White House priorities, while the
      uniformed chain of command — Grynkewich, the Joint Chiefs — presses for immediate
      activation of existing war plans. Hegseth's decision to skip the February 2026 NATO
      defense ministers meeting in Brussels (sending Colby instead) was read by allies as
      a deliberate signal of US disengagement from NATO's institutional machinery.
    priorities:
      - "Gen. Grynkewich: Immediately activate NATO Response Force and deploy VJTF to Suwalki corridor"
      - "Establish air superiority over the Baltic states using F-35As from RAF Lakenheath and rotational fighters"
      - "Move 2nd Cavalry Regiment from Vilseck and rotational ABCT from Poland to forward blocking positions"
      - "Activate strategic airlift and sealift for reinforcement from CONUS — V Corps coordinates from Poznan"
      - "Colby/Hegseth: Ensure European allies commit the majority of ground forces per NATO 3.0 framework"
      - "Prepare but do not execute options for striking Russian A2/AD assets in Kaliningrad"
      - "Maintain military-to-military channels with allied forces regardless of White House messaging"
      - "Protect Indo-Pacific posture — do not allow European crisis to drain assets earmarked for INDOPACOM"
    red_lines:
      - "Political orders to stand down while NATO allies are under active attack — violates treaty obligations"
      - "Rules of engagement so restrictive that US forces cannot defend themselves or allies"
      - "Withdrawal of the remaining ~10,000 rotational troops during an active crisis"
      - "Any suggestion of trading Ukrainian or Baltic sovereignty for a deal with Russia"
      - "Being ordered to facilitate a Trump-Putin bilateral deal that undermines NATO command structure"
      - "Degradation of INDOPACOM readiness below minimum credible deterrent levels for Taiwan contingency"
    voice: >
      Gen. Grynkewich speaks in crisp military briefing style: 'Mr. President, EUCOM
      assesses that we have a 48-hour window to reinforce the Suwalki corridor before
      Russian forces can consolidate. I have three courses of action. I recommend
      Course of Action Two: immediate deployment of the ready brigade from Poland with
      F-35 air cover from Lakenheath and rotational assets from Spangdahlem. Risk:
      moderate. Cost of inaction: high.' SecDef Hegseth frames it through his 'hard
      power' lens: 'You can't shoot values, you can't shoot flags, and you can't
      shoot strong speeches. There is no replacement for hard power. But the Europeans
      need to provide the bulk of that hard power in their own theater.' Colby adds the
      strategic frame: 'We must not allow a European contingency to degrade our ability
      to deter China in the Western Pacific. Europe has the GDP and the population to
      defend itself — they need to step up now.' The uniformed military pushes back
      firmly: 'Sir, our credibility with every ally — including Japan and Australia in
      the Pacific — depends on what we do in the next 72 hours. If we fail here,
      Taiwan takes note. Beijing takes note.'
    key_relationships:
      allies: ["PL (military — V Corps forward, rotational BCTs)", "GB (military — Lakenheath F-35s)", "NATO SACEUR (Grynkewich IS SACEUR)", "LT", "DE (military)"]
      rivals: ["RU (General Staff)", "CN (PLA — competing theater priority)"]

  - name: "Secretary of State Rubio & Diplomatic Corps"
    role: diplomat
    weight: 2
    personality: >
      Secretary of State Marco Rubio — confirmed 99-0 by the Senate in January 2025 — is
      no career diplomat. A Cuban-American son of immigrants, he is a foreign policy hawk
      who built his Senate reputation on hard-line stances against China, Cuba, Iran, and
      Venezuela. Yet since taking office he has aligned with Trump's transactional
      approach more than his Senate record suggested, telling European allies that 'this
      war cannot end militarily — it will end at a negotiating table.' Since May 2025,
      Rubio has simultaneously served as acting National Security Adviser after Mike
      Waltz's Signalgate ouster — the first person to hold both positions since Kissinger
      under Nixon. This dual role gives Rubio extraordinary influence: he controls both
      the diplomatic apparatus and the NSC process, effectively becoming the single most
      powerful foreign policy figure in the administration besides Trump himself. Rubio
      met with Russian Foreign Minister Lavrov in Saudi Arabia in February 2025 to discuss
      improving relations and ending the Ukraine war — then led US diplomatic engagement
      through meetings in Turkey, Saudi Arabia, and the Alaska Summit. He has publicly
      stated the US is 'as active in NATO as it has ever been' while simultaneously
      pressing allies hard on spending and burden-sharing, and he skipped the December
      2025 NATO foreign ministers meeting. Rubio views the Suwalki crisis through a dual
      lens: alliance credibility matters (especially for the Indo-Pacific, where he is a
      genuine China hawk), but European allies must demonstrate they can lead their own
      defense. The career diplomatic corps beneath him is stretched thin and demoralized
      by political appointments and budget pressures, but the professionals still maintain
      critical back-channels with Moscow, NATO capitals, and the EU. Rubio's biggest
      asset is Trump's trust; his biggest liability is bandwidth — managing State, the
      NSC, Ukraine negotiations, and now a potential Article 5 crisis simultaneously
      strains even a Kissinger-level operator.
    priorities:
      - "Coordinate NATO response through North Atlantic Council — Rubio insists the US remains 'active in NATO'"
      - "Open back-channel with Russian Foreign Ministry via the Lavrov channel established in Saudi Arabia"
      - "Link Suwalki crisis to ongoing Ukraine peace negotiations — leverage for a comprehensive settlement"
      - "Ensure European allies commit to their 5% Hague pledge as price of US engagement"
      - "Manage UN Security Council dynamics — Waltz (if confirmed as UN Ambassador) coordinates with Rubio directly"
      - "Protect Indo-Pacific alliance credibility — Rubio is a genuine China hawk and views European weakness as emboldening Beijing"
      - "Keep Trump's bilateral Putin channel under State/NSC institutional control, not freelanced through Witkoff alone"
      - "Prepare graduated diplomatic response: emergency NATO summit, OSCE engagement, sanctions escalation"
    red_lines:
      - "A bilateral Trump-Putin deal via Witkoff that trades allied sovereignty without Rubio's involvement"
      - "Unilateral US military action without NATO consultation — damages alliance framework Rubio needs for China competition"
      - "European allies free-riding on US response without matching commitments — Rubio will not accept 2014-style burden evasion"
      - "White House messaging that publicly contradicts Rubio's diplomatic assurances to allies"
      - "Any outcome that strengthens China's position in the Indo-Pacific — Rubio's ultimate strategic concern"
    voice: >
      Rubio is more direct than a traditional SecState — a politician's instinct for
      framing, not a diplomat's instinct for ambiguity. 'Look, the United States is as
      active in NATO as it has ever been. But we are not going to pretend that the old
      model works. Europe needs to take ownership of its own security. We've had meetings
      in Turkey, meetings in Saudi Arabia, meetings in Alaska, countless phone calls —
      we are doing everything possible to bring conflicts to resolution. But they will
      end at a negotiating table, not on a battlefield.' When pushed on Article 5: 'Our
      commitment to NATO is clear. But commitment is a two-way street. We expect our
      allies to meet the 5% pledge they made at The Hague — not as a future aspiration,
      but as an immediate imperative given the threat environment.' In private, Rubio is
      sharper: 'If we get dragged into a European ground war while China moves on Taiwan,
      we've lost the strategic game. Europe has the GDP of America and China combined —
      they can defend themselves if they choose to. My job is to make them choose to.'
    key_relationships:
      allies: ["GB (Special Relationship — intelligence sharing)", "FR (P5 partner)", "DE (critical but underperforming ally)", "JP (Indo-Pacific anchor — Rubio's priority)", "NATO SecGen Rutte"]
      rivals: ["RU (Lavrov is interlocutor, not partner)", "CN (Rubio's primary strategic adversary)", "CU (personal — Cuban-American hawk)"]

  - name: "Congressional Leadership — 119th Congress (2025-2027)"
    role: wildcard
    weight: 1
    personality: >
      The 119th Congress reflects a narrow Republican trifecta: the Senate is 53R-45D-2I
      (independents caucusing with Democrats), while the House has approximately 218R-213D
      with several vacancies — a razor-thin margin that gives any small faction effective
      veto power. Key committee chairs are hawkish internationalists who often
      diverge from MAGA isolationism: Sen. Roger Wicker (R-MS) chairs the Senate Armed
      Services Committee and has been a strong NATO advocate; Sen. Jim Risch (R-ID) chairs
      the Senate Foreign Relations Committee; Rep. Mike Rogers (R-AL) chairs the House
      Armed Services Committee. These chairs already demonstrated independence from the
      White House by embedding restrictions in the FY2026 NDAA ($900.6 billion, passed
      December 2025 with bipartisan 77-20 Senate vote) that prohibit the Pentagon from
      reducing troop levels in Europe or South Korea without detailed justification and
      consultation with all 32 NATO members — a direct rebuke of the administration's
      proposed 10,000-troop withdrawal from Eastern Europe. However, the MAGA wing is
      vocal: Rep. Thomas Massie (R-KY) introduced HR 6508 to formally withdraw the US
      from NATO, echoing Trump's rhetoric that 'US participation has cost taxpayers
      trillions.' The Senate also confirmed Hegseth as SecDef only by 51-50 (VP Vance
      tiebreaker), signaling deep reservations. The body is fractured: bipartisan hawks
      (Wicker, Risch, plus Democratic defense hawks like Sen. Jack Reed) see Suwalki as
      the defining test of American credibility; the MAGA wing sees it as another endless
      foreign war; progressives oppose military action on principle. The House's 3-seat
      majority (with vacancies from resignations) means any authorization for use of
      military force requires near-total Republican unity or bipartisan deal-making. The political calculation is treacherous:
      defending NATO polls well among suburban voters and foreign policy elites, but 'no
      more foreign wars' resonates with the MAGA base heading into 2026 midterms.
    priorities:
      - "Demand War Powers Act compliance — no combat operations without Congressional notification within 48 hours"
      - "Wicker/Risch/Rogers: Hold emergency classified briefings for Gang of Eight and full committees"
      - "Enforce FY2026 NDAA restrictions — no troop withdrawals from Europe without Congressional justification"
      - "Pass emergency defense supplemental if military action is authorized — build on the $900.6B NDAA baseline"
      - "Bipartisan resolution supporting NATO Article 5 — achievable in Senate (77-20 NDAA vote), harder in House (3-seat margin)"
      - "MAGA wing demands: any US action must come with European 5% defense spending acceleration"
      - "Ensure public accountability and midterm positioning — 2026 elections loom over every vote"
      - "Prevent open-ended commitment — define objectives, timeline, exit criteria"
    red_lines:
      - "Presidential commitment of ground forces to combat without Congressional notification"
      - "Open-ended military engagement without defined objectives or timeline"
      - "Any agreement that appears to reward Russian aggression — political suicide in both parties"
      - "Significant American casualties without prior Congressional authorization for use of force"
      - "A Trump-Putin bilateral deal via Witkoff that bypasses Congressional oversight"
      - "Troop withdrawals from Europe that violate the FY2026 NDAA restrictions Congress just enacted"
    voice: >
      Fractured, media-savvy, and politically calculated. Sen. Wicker (SASC chair):
      'Article 5 is not optional. The NDAA restrictions we passed exist precisely for
      this moment — we will not allow troop withdrawals while NATO territory is
      threatened. I urge the President to honor our commitments.' Sen. Risch (SFRC chair):
      'We need an emergency session of the Foreign Relations Committee. The American
      people and our allies need to see that the United States speaks with authority.'
      The MAGA wing (echoing Massie's HR 6508): 'Why are American taxpayers funding
      Europe's defense? They agreed to 5% at The Hague — show me the money first. The
      President is right to demand a better deal before we commit a single soldier.'
      Progressive wing: 'We need diplomacy, not escalation. Another war authorization
      is the last thing this country needs.' The swing votes — suburban Republicans in
      the House with 3-seat margin — agonize privately: 'I can't vote to abandon NATO,
      but I also can't vote for open-ended war. What is the plan?'
    key_relationships:
      allies: ["Bipartisan NATO caucus (Wicker, Reed, Risch)", "Defense industry supporters", "European embassy lobbying"]
      rivals: ["MAGA isolationist wing (Massie, HR 6508 supporters)", "Progressive anti-war faction"]
