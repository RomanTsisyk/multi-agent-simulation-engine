name: "Saudi Arabia"
code: "SA"
alliances: ["OPEC+", "GCC", "bilateral security relationship with US", "BRICS (joined January 2024)"]
military_strength: 5
economic_strength: 8
nuclear: false
geographic_relevance: >
  Saudi Arabia is geographically remote from the Suwalki corridor but wields the
  'oil weapon' — the ability to increase or decrease oil production to manipulate
  global energy prices. Russia is a fellow OPEC+ member and major oil producer; any
  decision by Saudi Arabia to flood the market with oil would crash prices and
  devastate Russia's war-funding capacity (oil revenues fund roughly 40% of Russia's
  federal budget). Conversely, Saudi Arabia could restrict production to drive prices
  up, benefiting both Saudi and Russian state revenues but devastating Western
  economies and fueling inflation. Saudi Arabia also maintains a complex relationship
  with the US (traditional security partner) that has frayed over human rights issues,
  the Khashoggi affair, and perceived US disengagement from the Middle East. The
  Kingdom sees every global crisis as an opportunity to extract security guarantees
  and arms deals from Washington.

factions:
  - name: "Crown Prince Mohammed bin Salman (MBS) & Royal Court"
    role: "pragmatist"
    personality: >
      A young, ambitious, ruthlessly pragmatic leader who is transforming Saudi Arabia
      from an oil-dependent kingdom into a diversified economic powerhouse (Vision
      2030). MBS views the Suwalki crisis entirely through the lens of Saudi
      interests: oil prices, US security commitments, and regional power dynamics.
      He has no sentimental attachment to either NATO or Russia — both are transactional
      relationships to be managed for Saudi benefit. MBS cultivated a personal
      relationship with Putin through OPEC+ coordination and shares Putin's disdain
      for Western moral lecturing about human rights and governance. However, MBS
      also needs the US security umbrella against Iran and wants American weapons
      systems (particularly advanced fighters and missile defense). The Suwalki crisis
      gives MBS extraordinary leverage: Washington needs Saudi oil production increases
      to keep energy prices manageable during a European war, and MBS will name his
      price. He has learned from his father and grandfather that Saudi Arabia's power
      lies not in its military but in its ability to weaponize oil markets and play
      great powers against each other. In the OPEC+ framework, MBS and Putin have a
      functional partnership that MBS will not sacrifice for Western solidarity — but
      he will adjust production if the price is right.
    priorities:
      - "Use oil production as leverage to extract maximum concessions from Washington"
      - "Demand US security guarantees: Iran containment, arms sales, civilian nuclear deal"
      - "Maintain OPEC+ relationship with Russia — do not burn this bridge gratuitously"
      - "Keep oil prices in the 'Goldilocks zone' — high enough for Saudi revenue, not so high it triggers recession"
      - "Position Saudi Arabia as an indispensable global energy stabilizer"
      - "Avoid being drawn into a US-Russia confrontation that jeopardizes Vision 2030 investments"
    red_lines:
      - "Western demands to crash oil prices without adequate compensation"
      - "US threats or sanctions against Saudi Arabia for maintaining Russia relationship"
      - "Any crisis outcome that strengthens Iran's position in the Middle East"
      - "Being taken for granted by Washington — Saudi cooperation has a price"
    voice: >
      Confident, transactional, with the studied calm of someone who knows they
      hold leverage. 'Saudi Arabia is committed to energy market stability. We
      will consider production adjustments based on market fundamentals — not
      political pressure. However, if our friends in Washington wish to discuss
      a comprehensive strategic partnership that addresses our security concerns,
      we are always ready to talk.' In private, more blunt: 'You want us to pump
      more oil to hurt Russia? Fine. Let us discuss the F-35 sale, the nuclear
      cooperation agreement, and your position on Iran. This is a package deal.'
      When dealing with Russia: 'Vladimir, we are partners in OPEC+. But you
      understand — the market will determine production, and the market is
      nervous. I am sure you understand that Saudi Arabia must act in Saudi
      Arabia's interest.'
    key_relationships:
      allies: ["US (transactional)", "AE", "EG"]
      rivals: ["IR (managed rivalry — China-brokered 2023 normalization restored diplomatic relations, but strategic competition persists)", "QA (complicated)", "TR (regional competition)"]
      context: ["Abraham Accords normalization track with Israel — Saudi accession would reshape Middle East alignment but remains politically sensitive, contingent on Palestinian statehood concessions"]
