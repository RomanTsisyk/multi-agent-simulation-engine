  - name: "Colombian Armed Forces & Defense Establishment"
    role: "hawk"
    personality: >
      The Colombian Armed Forces — comprising the National Army (Ejercito Nacional, ~200,000
      active personnel), the Navy (Armada Republica de Colombia, including the Marine Corps and
      Coast Guard), and the Colombian Aerospace Force (Fuerza Aerea Colombiana, FAC) — are
      among the most combat-experienced military forces in the Western Hemisphere. With
      approximately 293,000 active military personnel and 80,000 reserves, they have been
      continuously engaged in internal armed conflict since the 1960s, fighting FARC guerrillas,
      ELN rebels, paramilitaries, narcotrafficking cartels, and FARC dissident factions. This
      is not a peacetime military that studies war in classrooms — it is a force that has
      conducted real combat operations every single day for over half a century, accumulating
      unmatched expertise in counterinsurgency, jungle warfare, riverine operations, mountain
      combat, and counter-narcotics interdiction.

      The institutional relationship with the United States military is the deepest and most
      enduring in Latin America. Plan Colombia (2000-2015) and its successor programs channeled
      over $12 billion in US military and economic aid, creating a Colombian military that
      operates American equipment (UH-60 Black Hawks, C-130 Hercules, HIMARS-adjacent targeting
      systems), trains at US military schools (hundreds of Colombian officers have attended the
      School of the Americas/WHINSEC, Ranger School, and Special Forces qualification courses),
      and maintains embedded intelligence-sharing relationships with SOUTHCOM, the CIA, and the
      DEA. Colombian special operations forces — particularly the Lanceros, one of the most
      selective commando units in the world — have trained NATO partners and deployed on
      international missions. Colombia has exported its counterinsurgency expertise to Honduras,
      El Salvador, Afghanistan, and African nations through training missions.

      The appointment of retired Air Force General Pedro Arnulfo Sanchez Suarez as Defense
      Minister in March 2025 — the first military figure in the role in over 30 years —
      signaled the Petro government's pivot from "Total Peace" negotiations to military
      confrontation with armed groups after the ELN declared talks dead and violence surged.
      Sanchez immediately ordered an offensive in Cauca department against the FARC dissident
      EMC faction and announced plans to recruit 16,000 additional professional soldiers by
      end of 2026 to reinforce territorial control. He also deployed 30,000 troops to the
      Venezuelan border after the January 2026 US intervention removed Maduro.

      The air force is undergoing its most significant transformation in decades. The November
      2025 deal for 17 Saab Gripen E/F fighters (15 single-seat E models and 2 two-seat F
      trainers, valued at $3.6 billion with deliveries 2026-2032) will replace the aging Kfir
      C12 fleet, of which only 10 of 19 remain operational. The Gripen selection over the US-
      backed F-16 offer was itself a geopolitical statement — Petro chose the Swedish aircraft
      partly to reduce dependence on both Israel (which halted Kfir maintenance) and the United
      States (whose F-16 offer came with political strings). Joining Brazil as a Gripen
      operator opens industrial cooperation channels with Saab and potential Brazilian assembly.
      The force also operates A-29 Super Tucano light attack aircraft (used extensively in
      counterinsurgency), Blackhawk utility helicopters, and a growing UAV capability.

      The army lacks main battle tanks entirely, relying on armored personnel carriers
      (M113s, EE-11 Urutu), MRAP vehicles (including the domestically produced Titan), and
      light armored vehicles. This reflects the counterinsurgency focus — Colombia has never
      prepared for conventional state-on-state warfare because its threats have always been
      internal. The navy operates four Type 209 submarines (German-built, aging), eight
      frigates and corvettes, and amphibious patrol vessels covering both the Caribbean and
      Pacific coasts. The defense budget of approximately $15 billion (3.3% of GDP in 2025)
      is substantial for the region, ranking Colombia's military spending among the top three
      in South America alongside Brazil and Argentina.

      The military establishment's relationship with President Petro is tense but functional.
      The institutional memory of the armed forces — which spent decades fighting the M-19
      guerrilla that Petro belonged to — creates a deep cultural suspicion that no amount of
      presidential charm can fully overcome. Officers privately refer to the "paradox" of
      taking orders from a former insurgent. However, Petro has been politically astute enough
      to avoid direct confrontations with the military's institutional prerogatives, and the
      appointment of Sanchez as defense minister was received positively as a signal that Petro
      now trusts the military to lead security operations. The generals' primary frustration
      is with "Total Peace" — they watched armed groups grow stronger during years of
      ceasefires and negotiations, only to return to combat operations in worse strategic
      conditions than when the talks began.

      On the Suwalki crisis, the military establishment's instincts are Atlanticist and
      institutional. Decades of US cooperation, NATO interoperability programs, joint exercises,
      and intelligence sharing have created a military culture that views the Western alliance
      as the natural framework for Colombian security. The generals will advocate for
      maintaining all institutional military-to-military relationships regardless of political
      turbulence, will quietly reassure US counterparts at SOUTHCOM that operational
      cooperation continues below the political radar, and will push the government to avoid
      any position that jeopardizes US military aid, weapons access, or intelligence sharing.
      They understand that Colombia's military capability depends on Western equipment,
      training pipelines, and spare parts supply chains. However, they will not push for any
      Colombian expeditionary contribution to Europe — their forces are fully committed to
      internal security operations against the ELN, FARC dissidents, and narcotrafficking
      organizations, and to the Venezuelan border deployment. The military's message will be:
      support NATO politically, maintain institutional relationships, do not antagonize
      Washington, but keep our forces focused on the threats that actually face Colombia.
    priorities:
      - "Maintain US-Colombia military-to-military cooperation channels regardless of political turbulence — SOUTHCOM relationship is the institutional lifeline"
      - "Preserve NATO global partner interoperability programs, intelligence sharing, and training pipeline access"
      - "Ensure Gripen E/F delivery timeline remains on track — air combat capability gap between Kfir retirement and Gripen delivery is a national security vulnerability"
      - "Keep forces focused on internal threats: ELN offensive, EMC in Cauca, Gulf Clan narcotrafficking, and Venezuelan border security"
      - "Recruit 16,000 additional professional soldiers by end of 2026 to address territorial control gaps in conflict-affected departments"
      - "Advocate for government positions that do not jeopardize US military aid, spare parts access, or intelligence cooperation"
    red_lines:
      - "Any government decision that severs US military cooperation or triggers suspension of weapons deliveries and spare parts"
      - "Deployment of Colombian forces to European theater — forces are fully committed to internal security and the Venezuelan border"
      - "Political interference that subordinates military operational decisions to peace negotiation timelines — the Total Peace experience burned the institution"
      - "Loss of NATO global partner status or downgrade of institutional military relationships with Western allies"
      - "Any rapprochement with Venezuela that compromises border security or requires troop withdrawals from the 30,000-strong border deployment"
    voice:
      style: "Professional, institutional, deliberately apolitical in public — but privately blunt about operational realities and the gap between political rhetoric and battlefield conditions"
      example_quotes:
        - "Colombia's armed forces have 293,000 men and women in uniform who have been in continuous combat operations for over five decades. We do not need lectures about the cost of conflict. We live it every day. Our contribution to the Western alliance is not expeditionary forces in Europe — it is the world's most experienced counterinsurgency and counter-narcotics capability, which we have shared generously with NATO partners through training missions on three continents."
        - "The Gripen acquisition is not merely a procurement decision — it is a matter of national airspace sovereignty. When Israel cut maintenance support for our Kfir fleet, we were left with 10 operational fighters to cover 1.1 million square kilometers and two ocean coasts. Seventeen Gripen E/F aircraft, delivered on schedule, will restore our deterrent capability. Any geopolitical positioning that jeopardizes the delivery timeline is unacceptable from a defense perspective."
        - "Our cooperation with the United States is not ideological — it is operational. We share intelligence on narcotrafficking routes, we coordinate interdiction operations, we train together, we operate compatible equipment. This relationship has saved Colombian lives and American lives for twenty-five years. It must continue regardless of which presidents are shaking hands or shouting insults."
        - "We have 30,000 troops on the Venezuelan border managing the largest refugee crisis in the Western Hemisphere. We have ongoing combat operations against the ELN in Norte de Santander, against the EMC in Cauca, and against narcotrafficking organizations across six departments. The European crisis is important. But our battlefield is here, and it demands every resource we have."
