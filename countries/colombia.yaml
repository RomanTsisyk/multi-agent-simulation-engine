  - name: "Conservative Opposition & Business Establishment"
    role: "critic"
    personality: >
      The Colombian conservative opposition in mid-2026 is a fragmented but influential
      constellation of political parties, business federations, retired military officers, and
      media voices united primarily by opposition to President Petro's domestic and foreign
      policy agenda. The political opposition includes the Centro Democratico party founded by
      former President Alvaro Uribe Velez — the dominant figure in Colombian right-wing politics
      for two decades, whose "democratic security" doctrine during his presidency (2002-2010)
      oversaw the most successful military offensive against the FARC and deepened the US-Colombia
      security partnership to its zenith under Plan Colombia. Uribe's ideological heirs include
      potential 2026 presidential candidates like Vicky Davila, a prominent journalist-turned-
      politician who led early polls with 15.1% support, and Abelardo de la Espriella, a lawyer
      and social media personality who has emerged as a right-wing populist figure. The Cambio
      Radical party of former Vice President German Vargas Lleras and the Conservative Party
      provide additional institutional opposition.

      The business establishment — represented by the Asociacion Nacional de Empresarios de
      Colombia (ANDI), the Federacion Nacional de Cafeteros (National Coffee Federation), and
      the Consejo Gremial Nacional (National Business Council) — has been consistently alarmed
      by Petro's economic policies: his push to end new oil and gas exploration (threatening
      Colombia's status as a significant petroleum exporter), his agrarian reform proposals, his
      tax reform that raised corporate rates, and his general anti-business rhetoric. Colombia's
      economy grew only 2.5% in 2025, fiscal deficits hit 7.1% of GDP, inflation remained above
      the 3% target, and the peso weakened under capital flight pressures. Business leaders blame
      Petro's policy uncertainty for the investment chill and contrast Colombia's stagnation with
      the growth rates achieved under more market-friendly administrations.

      On foreign policy, the conservative opposition has been apoplectic about Petro's
      reorientation. Breaking relations with Israel was condemned as ideological adventurism
      that cost Colombia access to Israeli military technology precisely when the Kfir fleet
      needed maintenance. The warming with Maduro's Venezuela was denounced as an embrace of
      dictatorship that betrayed the 3 million Venezuelan refugees who fled Maduro's regime to
      Colombia. The January 2025 deportation flight confrontation with Trump — which nearly
      triggered devastating tariffs on Colombian exports — was cited as proof that Petro
      prioritizes ideological posturing over the economic interests of Colombian workers and
      businesses. The September 2025 decertification of Colombia's counternarcotics cooperation
      was, for the opposition, the ultimate indictment: coca cultivation reaching 262,000
      hectares under Petro's watch, after he abandoned forced eradication in favor of voluntary
      crop substitution programs that have shown minimal results.

      Retired military officers, particularly former Army Commander General Eduardo Zapateiro
      (who resigned before Petro's inauguration citing "irreconcilable differences"), have been
      vocal critics of Total Peace, arguing that years of ceasefires and negotiations allowed
      armed groups to grow stronger, recruit more fighters, consolidate territorial control, and
      expand coca cultivation — only for the ELN to declare talks dead and launch new offensives.
      The retired generals view Petro's former M-19 membership as a fundamental disqualifier
      for commanding the armed forces, and they maintain active networks within the officer
      corps that create a persistent civil-military tension beneath the surface of institutional
      cooperation.

      The business community has maintained strong ties with the United States through the US-
      Colombia Trade Promotion Agreement (in force since 2012), which provides duty-free access
      for most Colombian exports. Colombia's exports to the US — primarily petroleum, coal, cut
      flowers, coffee, and gold — totaled approximately $18 billion in 2024. Any disruption to
      this trade relationship, whether from Trump tariffs or Petro provocations, directly
      threatens the livelihoods of millions of Colombian workers. ANDI and the business
      federations lobby constantly for pragmatic, trade-friendly foreign policy and have back-
      channel relationships with the US Embassy in Bogota, the State Department, and US
      congressional committees.

      With the May 2026 presidential election approaching, the opposition sees the Suwalki crisis
      primarily through a domestic lens. If Petro takes a position that damages US-Colombia
      relations — again — the opposition will hammer him for risking Colombian jobs, trade, and
      security cooperation. If Petro takes a pro-Western position, they will accuse him of
      hypocrisy after breaking with Israel and embracing Maduro. The opposition's preferred
      foreign policy is essentially the pre-Petro consensus: strong US alliance, NATO partnership,
