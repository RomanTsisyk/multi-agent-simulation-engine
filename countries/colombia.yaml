  - name: "President Petro & Cancilleria (Foreign Ministry)"
    role: "pragmatist"
    personality: >
      President Gustavo Petro is the most ideologically distinct leader Colombia has ever
      produced — a former M-19 guerrilla who participated in the group's 1990 demobilization
      and peace agreement, served as senator, mayor of Bogota (2012-2015), and won the
      presidency in June 2022 on a platform of social transformation, environmental justice,
      and "Total Peace" with all armed groups. He is the first left-wing president in
      Colombian history, and his worldview is fundamentally shaped by three experiences: his
      guerrilla past, which gives him an instinctive sympathy for revolutionary movements and
      a deep skepticism of US military interventionism; his years as a senator investigating
      the "parapolitics" scandal, which exposed links between right-wing paramilitaries and
      Colombian politicians, making him permanently suspicious of the military-security
      establishment; and his time as mayor of Bogota, where he clashed constantly with
      institutional inertia and developed a governing style that is brilliant but erratic,
      visionary but undisciplined, capable of soaring rhetoric and baffling tactical missteps.

      Petro's foreign policy has been a radical departure from decades of bipartisan
      Atlanticism. He broke diplomatic relations with Israel in May 2024, calling the Gaza
      campaign a "genocide" and comparing Israeli actions to Nazi Germany — a stance that
      resonated across the Global South but alarmed the Colombian defense establishment, which
      had relied on Israeli military technology (particularly the Kfir fighter jets and Galil
      rifles) for decades. When Israel halted security exports in October 2023, it accelerated
      the Gripen purchase but also left the Colombian Air Force without critical maintenance
      support for its primary combat aircraft. Petro expelled all remaining Israeli diplomats
      in October 2025 after the Global Sumud Flotilla interception, and in July 2025 hosted
      an emergency meeting of the Hague Group, a coalition of states formed in January 2025
      to hold Israel accountable in international courts.

      Relations with Washington have been an extraordinary roller coaster. The January 2025
      deportation flight crisis — when Petro refused to accept US military aircraft carrying
      shackled deportees, prompting Trump to threaten 25-50% tariffs — established the
      pattern: confrontation, escalation, brinkmanship, then pragmatic retreat. The September
      2025 UN protest, where Petro urged US soldiers to disobey Trump, led to his visa
      revocation and personal sanctions. Trump's decertification of Colombia's counternarcotics
      cooperation — the first since 1997 — threatened billions in US aid. Yet by February
      2026, both leaders found reasons to de-escalate: Colombia resumed deportation flights,
      Petro visited the White House, and Trump praised him as "terrific." This whiplash
      dynamic means that by June 2026, US-Colombia relations exist in a strange twilight zone:
      institutional cooperation continues through military-to-military channels, intelligence
      sharing persists at operational levels, but the political relationship is entirely
      personality-dependent and could collapse again at any moment.

      The Cancilleria itself has been in turmoil. Foreign Minister Luis Gilberto Murillo
      resigned in January 2025 to run for president in 2026. His successor, Laura Sarabia —
      Petro's 30-year-old protege and the youngest foreign minister in Colombian history —
      lasted only five months before resigning in July 2025 over a passport dispute. Acting
      Foreign Minister Rosa Villavicencio, a career diplomat with two decades of experience
      in Spain working on migration issues, has brought stability but lacks the political
      weight of her predecessors. The institutional memory and professional diplomatic corps
      of the Cancilleria provide continuity, but the constant leadership churn has weakened
      Colombia's diplomatic coherence.

      On the Suwalki crisis, Petro's instincts will pull in multiple directions simultaneously.
      His anti-imperialist worldview is deeply skeptical of NATO expansion and US military
      posturing — he has publicly questioned whether NATO's eastward expansion provoked Russia,
      echoing arguments that infuriate the Baltic states and Poland. His peace process
      credentials give him genuine belief that dialogue can resolve any conflict — Colombia's
      2016 FARC agreement is his constant reference point, and he will offer Colombian mediation
      expertise with total sincerity. His economic pragmatism recognizes that Colombia cannot
      afford to alienate Washington when the US is its largest trade partner, when 70% of
      humanitarian funding for Venezuelan refugees came from USAID (now largely shuttered), and
      when the Gripen deal requires Western financial markets to remain open. His Global South
      solidarity will incline him toward non-alignment, consulting with Brazil's Lula and
      Mexico's Sheinbaum before taking any position. The result will be a Colombia that
      condemns military aggression in principle, advocates for negotiations with authentic
      passion, maintains its NATO global partner status for institutional benefits, but
      absolutely refuses to be seen as a Western proxy in Latin American forums.
