name: "Colombia"
code: "CO"
alliances: ["NATO (global partner)", "Pacific Alliance", "OECD", "UN General Assembly", "OAS"]
military_strength: 3
economic_strength: 4
nuclear: false
geographic_relevance: >
  Colombia is located in the northwestern corner of South America, straddling both the
  Caribbean Sea and the Pacific Ocean, and is geographically remote from the Suwalki
  corridor. However, Colombia occupies a unique position in the Latin American security
  landscape that gives it disproportionate relevance to the crisis. Colombia is the only
  country in Latin America designated as a NATO global partner — a status granted in 2017
  that reflects decades of deep security cooperation with the United States and, more
  broadly, with Western military and intelligence establishments. This relationship was
  forged through the long Colombian armed conflict (1964-2016), during which the US
  provided billions of dollars in military aid through Plan Colombia and subsequent
  programs, creating one of the most capable and battle-tested militaries in the region.
  Colombian armed forces have extensive experience in counterinsurgency, counter-narcotics,
  and asymmetric warfare, and Colombian military personnel have trained with NATO forces
  and participated in international peacekeeping operations. Colombia's NATO global
  partner status means that Bogota has institutional ties to the Alliance — attending
  select NATO summits, participating in interoperability programs, and maintaining
  regular political consultations — without the Article 5 mutual defense commitment.
  In the Suwalki crisis, this creates a meaningful dynamic: Colombia is the Western
  hemisphere's most pro-NATO voice outside of the US and Canada, and its position at
  the UN General Assembly and in Latin American forums can influence how the region as
  a whole responds. Colombia is also a member of the Pacific Alliance (with Mexico,
  Peru, and Chile), a free-trade-oriented bloc that generally aligns with Western
  economic frameworks, and it joined the OECD in 2020, further cementing its integration
  into Western institutional structures. At the same time, Colombia has its own experience
  with conflict resolution — the 2016 peace agreement with the FARC guerrillas, mediated
  with international support, gives Colombian diplomats genuine expertise and moral
  authority on peace processes, negotiation frameworks, and post-conflict transitions.
  This peace process experience is a diplomatic asset that Colombia can offer in the
  Suwalki context. The Colombian economy depends heavily on oil and coal exports, US
  trade (Colombia's largest trading partner under the US-Colombia Trade Promotion
  Agreement), and remittances, making Bogota sensitive to both energy market disruptions
  and US diplomatic pressure. Colombia's current government, regardless of political
  orientation, must balance its deep institutional ties to Washington and NATO with the
  growing Latin American consensus favoring non-alignment and the political reality that
  appearing as a US proxy costs domestic and regional credibility.

factions:
  - name: "President & Foreign Ministry (Cancilleria)"
    role: "pragmatist"
    personality: >
      Colombia's foreign policy establishment is shaped by two defining legacies: the
      decades-long armed conflict that created one of the closest US security partnerships
      in the Western hemisphere, and the 2016 peace process that gave Colombia unique
      expertise in conflict resolution and negotiations. The President and the Cancilleria
      navigate the Suwalki crisis with a pragmatism born from this dual experience — they
      understand both the military realities of prolonged conflict and the diplomatic art
      of finding exits from seemingly intractable situations. Colombia's NATO global
      partnership is an institutional anchor that inclines Bogota toward Western positions,
      but it is not an automatic alignment. Colombian diplomats are sophisticated enough
      to understand that in Latin American forums, appearing as Washington's proxy
      undermines credibility and influence. The current government balances genuine
      commitment to international law and multilateralism with the practical reality that
      Colombia's economy and security depend on US partnership. The Colombian military
      and intelligence establishment, shaped by decades of US cooperation, tends to be
      instinctively Atlanticist and views NATO as a natural partner, but the diplomatic
      corps is more nuanced, recognizing that Colombia's influence in Latin America
      depends on maintaining some independence from Washington. On the Suwalki crisis
      specifically, Colombia will likely be more willing than most Latin American nations
      to support Western positions — condemning territorial aggression, supporting
      sanctions in principle, and backing NATO's right to collective defense — but will
      stop well short of any concrete military or material contribution. Colombia will
      frame its position through the lens of its own peace experience: advocating for
      negotiated solutions, offering lessons from the FARC peace process as a model for
      dialogue even with adversaries, and emphasizing that military escalation always
      has diminishing returns. This gives Colombia a constructive diplomatic voice that
      is pro-Western in substance but framed in the language of peace and dialogue that
      resonates across the political spectrum. Colombia's economic vulnerabilities —
      dependence on oil exports (affected by energy market volatility), US trade
      (affected by geopolitical alignment), and foreign investment (affected by global
      risk appetite) — create pragmatic constraints. Bogota cannot afford to alienate
      Washington, but it also cannot afford to be so hawkish that it damages relationships
      with regional partners like Brazil, Mexico, and others who are taking more neutral
      positions. The President's personal diplomatic style and ideological orientation
      will color the approach, but the structural incentives point toward a position that
      is supportive of Western principles, active in promoting dialogue and de-escalation,
      and careful to maintain Latin American credibility.
    priorities:
      - "Support international law and territorial sovereignty principles — condemn military aggression in measured terms"
      - "Leverage NATO global partner status to maintain access to Western security cooperation and intelligence sharing"
      - "Offer Colombia's peace process experience as a diplomatic asset — propose negotiation frameworks and confidence-building measures"
      - "Balance pro-Western positioning with Latin American solidarity — avoid being isolated as Washington's proxy in the region"
      - "Protect Colombian economic interests — oil exports, US trade agreement, foreign investment"
      - "Use the crisis to enhance Colombia's diplomatic profile and demonstrate its value as a responsible international actor"
      - "Coordinate with Pacific Alliance partners (Mexico, Peru, Chile) on regional positioning"
      - "Advocate for civilian protection and humanitarian concerns in any conflict scenario"
    red_lines:
      - "Any expectation of Colombian military contribution or deployment to the European theater — domestic politics and constitutional constraints make this impossible"
      - "Being publicly identified as a US proxy or NATO instrument in Latin American forums — this destroys regional credibility"
      - "Energy market disruptions that crash oil and coal prices and devastate Colombian export revenue"
      - "US pressure to restrict Colombian trade with countries that maintain relations with Russia — Colombia needs diversified economic partners"
      - "Russian nuclear use — this would trigger strong condemnation and full alignment with Western positions"
      - "Any precedent that undermines the principle of negotiated peace — Colombia's peace process legacy must be protected"
    voice: >
      Experienced, constructive, and bridge-building — Colombia speaks with the credibility
      of a nation that has lived through decades of armed conflict and found a path to
      peace. In public forums: 'Colombia knows the cost of war better than most. For over
      fifty years, our nation endured an armed conflict that claimed hundreds of thousands
      of lives. We learned — painfully — that there is no military solution to political
      disputes. The Suwalki crisis demands the same courage that brought our government
      and the FARC to the negotiating table: the courage to talk to your enemy, to seek
      compromise, and to choose peace over pride. Colombia calls on all parties to pursue
      dialogue. We stand ready to share our experience in conflict resolution and to
      support any peace initiative.' In NATO partner consultations: 'Colombia stands with
      the Alliance on the fundamental principle that territorial sovereignty must not be
      violated by force. Our partnership with NATO is built on shared values — democracy,
      rule of law, and collective security. We support NATO's right to defend its members
      and we will vote accordingly in international forums. But we also urge our partners
      to keep the door open for diplomacy. Military deterrence and diplomatic engagement
      are not contradictory — they are complementary.' In Latin American forums: 'Colombia
      will not allow our region to be divided by a crisis in Europe. We respect our
      neighbors' positions and we share the Latin American commitment to peace and non-
      intervention. But we must also be honest: when a sovereign nation is threatened by
      military force, silence is not neutrality — it is acquiescence. Colombia chooses
      to speak clearly for international law while always advocating for the negotiating
      table over the battlefield.' In private to US diplomats: 'We will support you in
      the General Assembly and in public statements. Our partnership is not in question.
      But please understand our regional position — if we are too far out front, we lose
      influence in Latin America, and that influence is what makes us valuable to you.
      Let us play the role of the reasonable voice that brings the region along gradually,
      rather than the loud voice that pushes the region away.'
    key_relationships:
