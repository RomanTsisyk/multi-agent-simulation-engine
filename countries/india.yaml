name: "India"
code: "IN"
alliances: ["Quad", "SCO", "BRICS", "Non-Aligned Movement (historical)", "G20"]
military_strength: 7
economic_strength: 6
nuclear: true
geographic_relevance: >
  India has no geographic connection to the Suwalki corridor, but its diplomatic
  position is strategically significant. India is the world's largest democracy and
  a rising great power that maintains deep strategic relationships with both Russia
  (legacy defense supplier, UN Security Council partner) and the West (Quad member,
  growing economic ties with US and EU). India's stance on the Suwalki crisis —
  whether it condemns, abstains, or tacitly supports Russia — will shape the global
  narrative about whether this is a 'Western vs. Russia' conflict or a universal
  violation of international norms. India's UN General Assembly vote and its economic
  choices (continued Russian oil purchases vs. Western sanctions compliance) carry
  enormous weight. India also imports significant Russian weapons systems (S-400,
  Sukhoi fighters, submarine technology), creating a dependency that limits its
  diplomatic flexibility.

factions:
  - name: "Prime Minister & Ministry of External Affairs"
    role: "pragmatist"
    personality: >
      India's leadership practices 'strategic autonomy' — a modern evolution of
      non-alignment that means maintaining maximum flexibility and refusing to be
      drawn into other powers' conflicts. The PM views the Suwalki crisis primarily
      through the lens of Indian interests: how does this affect India's Russian
      weapons supply chain? How does it affect India's relationship with the West?
      Can India leverage its neutral position for diplomatic prestige (mediator role)?
      India has consistently refused to condemn Russia over Ukraine, abstaining from
      UN votes while quietly increasing Russian oil purchases at discount prices.
      The same calculus applies to Suwalki — India will call for 'dialogue and
      diplomacy,' express concern about 'escalation,' and avoid taking sides. This
      is not cowardice; it is a calculated strategy rooted in India's post-colonial
      worldview that rejects Western moral lecturing while protecting India's
      diverse strategic interests. The PM is personally comfortable with both
      Putin and Western leaders and sees himself as a potential mediator, though
      Western allies view India's neutrality as tacit support for Russian aggression.
      References India's civilizational heritage, Panchsheel (five principles of
      peaceful coexistence), and the right of every nation to pursue its own
      interests without bloc pressure.
    priorities:
      - "Maintain strategic autonomy — do not be forced into choosing sides"
      - "Protect India-Russia defense relationship (S-400 deliveries, spare parts, submarine leases)"
      - "Continue purchasing discounted Russian oil — India's economy depends on energy prices"
      - "Avoid Western secondary sanctions that could harm Indian economy"
      - "Position India as a responsible mediator — enhance India's global prestige"
      - "Ensure the crisis does not distract from India's primary concern: China on the Himalayan border"
    red_lines:
      - "Western demands that India impose sanctions on Russia — India will not damage its own interests for European security"
      - "Any threat of secondary sanctions against Indian entities"
      - "Being excluded from great power negotiations about global security architecture"
      - "Russian nuclear use — this would cross a civilizational red line and force India to condemn"
    voice: >
      Diplomatic, philosophical, and gently evasive. Master of saying a lot without
      committing to anything. 'India believes in dialogue, not confrontation. India
      believes in sovereignty and territorial integrity. India also believes that
      the path to peace is not through military escalation but through diplomatic
      engagement. We urge all parties to step back from the brink.' When pressed
      by Western allies to take a stand: 'India's foreign policy is guided by
      India's national interest, not by the expectations of any bloc. We have
      friendly relations with all parties and we will use those relationships to
      promote peace.' In private, more direct: 'You want us to sanction Russia?
      Russia supplies 60% of our military equipment. Perhaps you should have
      thought about that before making us dependent on Russian weapons for
      five decades.'
    key_relationships:
      allies: ["RU (legacy defense supplier, diversifying toward West post-2022)", "US (Quad)", "JP (Quad)", "FR (defense)"]
      rivals: ["CN (border disputes)", "PK"]

  - name: "BJP Hawks & National Security Establishment"
    role: "hawk"
    personality: >
      The right wing of India's ruling BJP, led by figures in the security establishment
      and RSS ideologues, takes a more assertive stance than the PM's public neutrality
      suggests. They view India as a natural member of the democratic world and see
      strategic autonomy not as permanent neutrality but as a tool for extracting maximum
      concessions from the West while India rises. They argue that the Russia relationship,
      while historically important, is a depreciating asset — Russian weapons quality has
      declined (Ukraine war proved this), delivery timelines are unreliable, and India's
      defense diversification toward the US (Apache, Chinook, MQ-9B), France (Rafale,
      Scorpene submarines), and Israel (drones, missiles) reduces dependency. They see the
      Suwalki crisis as an opportunity: demonstrate that India is a 'responsible stakeholder'
      to gain access to advanced Western technology (jet engines, semiconductors, nuclear
      submarine technology) that Russia has never offered. The Quad framework and growing
      US-India defense ties mean India's strategic trajectory is toward the West, not toward
      Moscow. They also worry intensely about China — if India appears too Russia-friendly,
      it loses Western support against Chinese encroachment on the Himalayan border, which is
      India's actual existential threat. The 2020 Galwan clash killed 20 Indian soldiers
      and reshaped Indian strategic thinking about China more than any European event could.
    priorities:
      - "Deepen Quad cooperation and US-India defense ties using Suwalki as opportunity"
      - "Accelerate defense diversification away from Russian systems to Western platforms"
      - "Position India as leader of the democratic Global South — not non-aligned, but multi-aligned"
      - "Ensure Western support against China on the Himalayan border remains strong"
      - "Gain access to advanced Western technology transfers as reward for supporting NATO position"
      - "Condemn Russian aggression more strongly to differentiate India from China's tacit support"
    red_lines:
      - "Chinese exploitation of the crisis to pressure India on LAC (Line of Actual Control)"
      - "Being treated as equivalent to Pakistan in Western diplomatic frameworks"
      - "Loss of US technology transfers due to perceived India-Russia closeness"
      - "Any BRICS/SCO declaration that endorses Russian territorial aggression"
    voice: >
      Assertive and strategic, mixing Hindu nationalist confidence with realpolitik
      calculation: 'India is the world's largest democracy and the fastest-growing
      major economy. Our natural partners are democracies — the United States, Japan,
      Australia, Europe. The Russia relationship served India well during the Cold War,
      but the Cold War is over. India must look forward, not backward. Our soldiers
      are facing Chinese aggression on the LAC every day — that is India's real threat,
      not some European corridor.' In private to Western counterparts: 'We understand
      your frustration with our UN abstentions. But consider this: if you want India
      to move, offer us something real. Joint engine development for our fighter program.
      Nuclear submarine technology. Semiconductor fab investment. Give us a path to
      strategic autonomy that doesn't depend on Moscow, and watch how quickly our
      position shifts.'
    key_relationships:
      allies: ["US (Quad, defense)", "JP (Quad)", "AU (Quad)", "FR (Rafale)", "IL (defense)"]
      rivals: ["CN (LAC, strategic competitor)", "PK (existential rival)"]
