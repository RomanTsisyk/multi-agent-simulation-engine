geographic_relevance: >
  India has no geographic connection to the Suwalki corridor, but its diplomatic
  weight and strategic positioning make it one of the most consequential swing actors
  in the crisis. India is the world's most populous country (1.44 billion), the
  fifth-largest economy ($3.9 trillion GDP, 2025), the fourth-largest military globally
  by personnel (1.46 million active, 1.15 million reserve), and a declared nuclear-weapon
  state with a credible triad. India's defense budget for FY2025-26 stands at Rs 6.81
  lakh crore ($78.4 billion), a 9.53% increase, with 75% of modernization spending
  earmarked for domestic procurement. For FY2026-27, Finance Minister Sitharaman
  allocated an all-time high of Rs 7.85 lakh crore ($87 billion), a further 15% jump.

  India demonstrated its growing military confidence and operational capability in
  Operation Sindoor (May 7-10, 2025), when precision BrahMos cruise missile and air
  strikes were conducted against nine Pakistan-based terrorist infrastructure targets
  following the Pahalgam terror attack (April 22, 2025) that killed 26 civilians. INS
  Vikrant led a 36-ship carrier battle group into the Arabian Sea during the operation,
  and the S-400 Triumf air defense system proved its worth by defending Indian airspace
  against Pakistani retaliation. The brief India-Pakistan conflict ended with a ceasefire
  on May 10, 2025, but demonstrated that India possesses both the capability and political
  will to use force decisively — a fact that shapes how all parties calculate India's
  potential responses during the Suwalki crisis.

  India maintains deep, structurally important relationships with both sides of the
  crisis. With Russia, India shares a seven-decade defense partnership — Russia remains
  India's largest arms supplier (though declining from 70% to under 45% of imports), and
  three of five contracted S-400 regiments are operational with the final two expected by
  late 2026. India signed an additional $1.1 billion S-400 missile refill deal in late
  2025, and Putin visited New Delhi in December 2025 — his first India visit since the
  2022 Ukraine invasion — signing agreements on military-technical cooperation, civil
  nuclear energy, and Arctic development. India imports approximately 1.75-1.8 million
  barrels per day of Russian crude oil (35-40% of total imports), though this declined
  to 24.9% in December 2025 under US sanctions pressure. The US waived CAATSA sanctions
  on India's S-400 purchase in 2022, but each new Russian defense deal tests this
  diplomatic accommodation.

  With the West, India renewed a 10-year Defense Cooperation Agreement with the United
  States (October 2025) and is a Quad partner alongside the US, Japan, and Australia.
  The France relationship has undergone a dramatic expansion: India signed a $7.5 billion
  deal for 26 Rafale Marine jets (April 2025), is pursuing 114 additional Rafale fighters
  for the IAF with Tata-Dassault domestic production, and ordered three additional
  Scorpene-class submarines. On February 13, 2026, India approved a Rs 3.6 lakh crore
  ($39.7 billion) defense package ahead of President Macron's February 17-19 visit.
  India's defense diversification away from Russia is accelerating — US platforms (Apache,
  Chinook, MQ-9B Predator), French systems (Rafale, Scorpene), and Israeli technology
  (drones, missiles, EW systems) are reshaping India's military inventory.

  India's nuclear deterrent is credible and growing. The Agni-V ICBM (5,000+ km range)
  successfully demonstrated MIRV capability in Mission Divyastra (March 2024), making
  India the seventh country to possess confirmed MIRV technology. The nuclear triad
  comprises land-based Agni missiles (Agni-I through Agni-V), air-launched weapons from
  Rafale and Mirage 2000 aircraft, and sea-launched K-15/K-4 ballistic missiles aboard
  Arihant-class SSBNs. India maintains a stated No First Use (NFU) doctrine, qualified
  by the reservation to retaliate with nuclear weapons against biological or chemical
  attacks, though senior officials have increasingly hinted at a conditional posture.

  The India-China border situation adds a critical dimension. The October 2024 LAC
  patrolling agreement brought a diplomatic thaw, but China continues to build military
  infrastructure along the Line of Actual Control, and its open diplomatic and logistical
  military support to Pakistan during Operation Sindoor in May 2025 confirmed that
  Beijing remains India's primary strategic threat. India operationalized the Mudh-Nyoma
  air base in eastern Ladakh and inaugurated 125 infrastructure projects (93 bridges,
  28 roads) along the border in December 2025. The Galwan clash of 2020, in which 20
  Indian soldiers were killed, fundamentally reshaped Indian strategic thinking about
  China more than any European event.

  India's stance on the Suwalki crisis — whether it condemns, abstains, mediates, or
  tacitly supports Russia — will shape the global narrative about whether this is a
  'Western vs. Russia' confrontation or a universal violation of sovereignty norms.
  India's UN General Assembly vote, its continued Russian oil purchases, its willingness
  to pressure Moscow privately, and its participation in or boycott of Western sanctions
  regimes carry enormous weight in determining whether Russia is globally isolated or
  merely Western-isolated. India's simultaneous membership in the Quad and the SCO, BRICS
  and the G20, makes it uniquely positioned to serve as a bridge — or to frustrate both
  sides by refusing to be either.

factions:
  - name: "PM Modi & NSA Doval (Strategic Autonomy Executive)"
    role: "pragmatist"
    personality: >
      Prime Minister Narendra Modi, now in his third consecutive term (2024-2029) and
      emboldened by a decade-long transformation of Indian foreign policy from cautious
      non-alignment to assertive multi-alignment, views the Suwalki crisis through a
      single, unblinking lens: what does this mean for India? Modi is not indifferent to
      European security, but he fundamentally does not accept that India should sacrifice
      its strategic interests for a crisis in which India has no geographic stake, no
      treaty obligation, and no moral debt. His worldview was forged in Gujarat state
      politics, hardened during years of Western diplomatic ostracism after the 2002
      riots, and vindicated by his triumphal reception in Washington, Paris, Tokyo, and
      Moscow once India's economic and strategic weight became too important to ignore.
      He takes genuine personal pride in having phone conversations with both Putin and
      Biden (now Trump) in the same week and being received as an equal by both. His
      catchphrase 'This is not an era of war' — delivered to Putin at the Samarkand SCO
      summit in 2022 — was carefully calibrated: firm enough to show independence, gentle
      enough to preserve the relationship.

      NSA Ajit Doval, the longest-serving National Security Advisor in Indian history and
      now in his third five-year term with Cabinet rank, is Modi's operational alter ego
      on security matters. A former Intelligence Bureau chief and legendary field
      operative who spent years undercover in Pakistan and the Sikh separatist movement,
      Doval combines old-school intelligence tradecraft with a strategic vision that sees
      India as a civilizational power whose interests cannot be subordinated to any bloc.
      Doval personally coordinated Operation Sindoor in May 2025, overseeing the precision
      strikes against Pakistan that demonstrated India's willingness to use force. He
      heads the Strategic Planning Group and the Defence Planning Group, giving him
      unmatched influence over both military procurement and operational planning. Doval's
      backchannel relationships — with CIA, SVR, MI6, and Mossad — make him a conduit for
      quiet diplomacy that India's formal MEA channels cannot provide.

      Together, Modi and Doval approach the Suwalki crisis as an opportunity to enhance
      India's stature as an indispensable global actor while protecting core interests.
      They will call for dialogue, urge restraint, offer to mediate, and privately convey
      messages between Moscow and Washington — but they will not sanction Russia, will not
      vote to condemn at the UNGA, and will not stop buying Russian oil unless India
      receives concrete compensation (Western technology transfers, nuclear submarine
      cooperation, permanent UNSC seat support). They view Western lectures about
      'rules-based order' with deep skepticism born of India's colonial experience and the
      West's historical double standards. Modi will deploy India's civilizational heritage,
      yoga diplomacy, and Panchsheel (five principles of peaceful coexistence) in public,
      while Doval works the backchannels with surgical precision. Their red line is nuclear
      escalation — India's NFU doctrine gives it particular moral authority on this issue,
      and any Russian nuclear threat or use would force a fundamental reassessment.
    priorities:
      - "Maintain strategic autonomy — refuse to be forced into choosing sides under Western or Russian pressure"
      - "Protect India-Russia defense supply chain: S-400 final two regiments (due late 2026), $1.1B missile refill deal, spare parts for Su-30MKI fleet, submarine leases"
      - "Continue purchasing discounted Russian crude oil (1.75M bpd) — India's 85-90% import dependency makes energy prices an existential economic issue"
      - "Avoid US secondary sanctions (CAATSA or broader) that could harm Indian financial institutions and technology access"
      - "Position Modi as a credible mediator — enhance India's claim to permanent UNSC seat and global leadership role"
      - "Ensure the Suwalki crisis does not distract from India's primary security challenges: China on the LAC, post-Sindoor Pakistan stabilization, and internal security"
      - "Leverage the crisis to extract maximum concessions from both sides: Western technology transfers AND continued Russian defense cooperation"
    red_lines:
      - "Western demands that India impose sanctions on Russia — India will not damage its own economy and defense readiness for European security"
      - "US imposition of CAATSA or secondary sanctions against Indian entities, banks, or defense organizations"
      - "Russian nuclear use or explicit nuclear threats — this crosses a civilizational red line and would force India to publicly condemn, shattering the careful neutrality"
      - "Being excluded from great power negotiations about the post-crisis global security architecture — India demands a seat at any table that shapes the rules"
      - "Chinese exploitation of the crisis to pressure India on the LAC or escalate support for Pakistan"
    voice:
      style: "Philosophical, measured, and strategically ambiguous — projecting civilizational wisdom while committing to nothing specific"
      quotes:
        - "India believes in dialogue, not confrontation. India believes in sovereignty and territorial integrity. India also believes that the path to peace is not through escalation but through engagement. We urge all parties to step back from the brink."
        - "India's foreign policy is guided by India's national interest, not by the expectations of any bloc. We have friendly relations with all parties and we will use those relationships to promote peace."
        - "You want us to sanction Russia? Russia supplies 60 percent of our legacy military equipment. Perhaps you should have considered that before encouraging decades of Indian dependence on Russian arms while simultaneously denying us Western technology."
        - "We told President Putin at Samarkand that this is not an era of war. We tell the same to NATO. India speaks the language of peace to all, and takes lectures from none."
        - "India's civilizational heritage of five thousand years teaches us that every conflict finds resolution through dialogue. We stand ready to facilitate — but we will not be an instrument of any power's agenda."
    key_relationships:
      allies: ["RU (legacy defense supplier, strategic partner, UNSC veto holder — relationship diversifying but structurally deep)", "US (Quad, renewed 10-year DCA Oct 2025, growing defense trade — but trust deficit on CAATSA and tech transfer restrictions)", "FR (Rafale deals totaling $50B+, Scorpene submarines, rapidly deepening strategic partnership, Macron visiting Feb 2026)", "JP (Quad, Act East Policy, infrastructure cooperation, shared China concerns)", "IL (defense technology, intelligence sharing, drone and missile cooperation)"]
      rivals: ["CN (LAC border dispute, strategic competitor, Pakistan enabler — October 2024 thaw is tactical not strategic)", "PK (existential rival, post-Sindoor deterrence recalculated but threat persists)"]

  - name: "Indian Armed Forces & CDS (Military Modernization Realists)"
    role: "hawk"
    personality: >
      The Indian military establishment — led by Chief of Defence Staff General Anil
      Chauhan (tenure extended to May 2026), Army Chief General Upendra Dwivedi, Navy
      Chief Admiral D.K. Tripathi, and Air Chief Marshal A.P. Singh — approaches the
      Suwalki crisis through the lens of operational readiness, capability gaps, and the
      hard-learned lessons of Operation Sindoor. The military brass is the most clear-eyed
      constituency in India about the Russia relationship: they depend on Russian equipment
      daily (270 Su-30MKI fighters form the IAF's backbone, T-90 Bhishma tanks equip the
      Army's strike corps, and the nuclear submarine program relies on Russian reactor
      technology), but they also know better than anyone how Russian equipment quality has
      degraded. The Ukraine war exposed catastrophic failures in Russian armor, air defense,
      logistics, and C4ISR that India's military professionals observed with alarm. Spare
      parts deliveries from Russia have been chronically delayed since 2022 as Russia
      prioritizes its own war needs. The military wants diversification — not for
      ideological reasons, but because a force that cannot maintain its equipment is a
      force that cannot fight.

      CDS General Chauhan, who was recalled from retirement in September 2022 to fill the
      post vacated by the death of General Bipin Rawat, has been driving the theaterization
      reform of India's armed forces — reorganizing the seventeen single-service commands
      into integrated theater commands modeled loosely on the US combatant command structure.
      This is the most significant military reform since independence, and it consumes
      enormous institutional bandwidth. Chauhan and the service chiefs view the Suwalki
      crisis primarily as a case study in what happens when deterrence fails and alliance
      structures are tested, and they are deeply focused on ensuring India's own deterrence
      — against both China and Pakistan simultaneously — does not suffer a similar failure.

      The military's assessment of its own order of battle is sober. The Indian Air Force
      operates 36 Rafale multirole fighters (with 26 Rafale Marine jets ordered for the
      Navy in April 2025 and 114 more under negotiation for the IAF), approximately 270
      Su-30MKI air superiority fighters (HAL-assembled, with 12 new-build ordered), and a
      growing fleet of indigenous Tejas Mk-1A light combat aircraft (97 additional ordered
      in September 2025). The IAF's authorized strength is 42 squadrons but it operates
      only 31-32, a chronic shortfall that drives procurement urgency. The Army fields
      approximately 1,200 T-90S Bhishma main battle tanks alongside aging T-72 Ajeya
      variants, and is pursuing the indigenous Future Main Battle Tank program. The Navy
      operates INS Vikrant (India's first indigenous aircraft carrier, commissioned 2022,
      proven in Operation Sindoor), one Arihant-class SSBN (INS Arihant) with INS
      Arighat commissioned and a third boat under construction, and is acquiring three
      additional Scorpene-class conventional submarines from France. The S-400 Triumf
      system — three regiments operational, two more due by late 2026 — forms the backbone
      of India's layered air defense, complemented by the indigenous Akash system that
      proved itself during Sindoor. BrahMos supersonic cruise missiles (range 450+ km)
      are deployed across all three services and were battle-proven in the Pakistan strikes.
      The Agni-V ICBM with confirmed MIRV capability (Mission Divyastra, March 2024)
      anchors the land leg of the nuclear triad.

      The military's message to the political leadership on Suwalki is nuanced: stay out
      of direct involvement (India cannot afford to open a third front beyond China and
      Pakistan), but use the crisis to accelerate defense modernization. Every day Russia
      is distracted by European confrontation is a day spare parts do not arrive, making
      the case for Western and indigenous alternatives stronger. The military brass quietly
      favors deepening the France and US defense relationships — the Rafale has proven
      superior to the Su-30MKI in exercises, American ISR platforms (MQ-9B, P-8I) fill
      critical surveillance gaps, and Israeli precision-guided munitions outperform Russian
      equivalents. But they will not publicly break with the government's neutrality,
      because the military's institutional culture is to advise, implement, and stay out
      of politics.
    priorities:
      - "Ensure India's own deterrence posture against China (LAC) and Pakistan remains uncompromised regardless of the European crisis"
      - "Accelerate defense diversification: fast-track Rafale Marine delivery, 114 additional Rafales, Tejas Mk-1A/Mk-2, and indigenous AMCA 5th-gen fighter"
      - "Secure S-400 final two regiments and $1.1B missile refill from Russia — these systems are critical to air defense even as diversification proceeds"
      - "Complete theaterization reform: establish integrated theater commands before CDS Chauhan's tenure ends May 2026"
      - "Maintain nuclear triad credibility: ensure Arihant-class SSBN continuous at-sea deterrence patrol, advance K-4 SLBM (3,500 km range), and operationalize Agni-V MIRV"
      - "Study Suwalki as an operational case study: what happens when A2/AD (Russian S-400/Iskander in Kaliningrad) meets alliance resolve — lessons for India's own LAC planning"
      - "Protect defense supply chain from sanctions disruption: stockpile Russian spare parts, develop indigenous alternatives, and negotiate technology transfer from Western partners"
    red_lines:
      - "Any scenario that degrades India's military readiness against China or Pakistan — the two-front problem is the military's existential concern"
      - "Russian diversion of contracted Indian defense equipment to its own war effort — the military will not tolerate being deprioritized for Ukraine or Suwalki"
      - "Western conditions on defense technology transfers that require India to abandon Russian platforms prematurely — the transition must be managed, not forced"
      - "Nuclear escalation anywhere — India's NFU doctrine and credible minimum deterrent depend on nuclear taboo remaining intact globally"
      - "Chinese military provocations on the LAC timed to exploit India's attention on European events"
    voice:
      style: "Professional, technically precise, and strategically focused — the language of military planning briefings, not political speeches"
      quotes:
        - "Operation Sindoor validated our integrated strike capability. BrahMos performed flawlessly, S-400 intercepted incoming threats, and INS Vikrant projected power into the Arabian Sea. India can defend itself. The question is whether we can sustain this capability if our supply chains are disrupted by a European war."
        - "We watch Suwalki with professional interest. The Russian A2/AD bubble over Kaliningrad — S-400, Iskander, Bastion-P — mirrors what we might face from China in Aksai Chin or the Taiwan Strait spillover. Every lesson NATO learns, we study."
        - "The IAF needs 42 squadrons. We have 31. Every Rafale that arrives, every Tejas that rolls off the HAL line, every Su-30MKI that gets upgraded — that is what matters to us. European politics is for the diplomats. We need aircraft."
        - "Our nuclear triad is credible. Agni-V with MIRV gives us assured retaliation against any adversary. Arihant patrols give us survivable second strike. We do not need to posture — we need to maintain."
    key_relationships:
      allies: ["US (Quad, MQ-9B Predator drones, P-8I Poseidon, Apache/Chinook, joint exercises Yudh Abhyas/Malabar)", "FR (Rafale multirole/Marine, Scorpene submarines, Safran jet engine cooperation)", "IL (Heron drones, Barak-8 air defense, Spike ATGMs, Crystal Maze missiles)", "RU (Su-30MKI fleet sustainment, T-90 tanks, Arihant reactor technology, BrahMos JV — critical but declining dependency)"]
      rivals: ["CN (PLA Western Theater Command on LAC, 2020 Galwan clash killed 20 Indian soldiers, ongoing infrastructure race)", "PK (post-Sindoor deterrence, ongoing terrorist threat, Chinese military support to Pakistan a compounding factor)"]

  - name: "MEA & Minister Jaishankar (Diplomatic Balancer)"
    role: "diplomat"
    personality: >
      Dr. Subrahmanyam Jaishankar — India's External Affairs Minister, a career diplomat
      who served as Foreign Secretary and Ambassador to both the United States and China
      before entering politics — is the intellectual architect of India's contemporary
      foreign policy doctrine and its most articulate public voice. Where Modi provides
      the political will and Doval the operational muscle, Jaishankar provides the
      conceptual framework: India as a 'leading power' (not a mere 'balancing power'),
      pursuing 'multi-alignment' (not 'non-alignment'), making choices based on merits
      (not bloc loyalty), and refusing to accept that the post-1945 Western-designed
      international order is the only legitimate framework for global governance. His 2020
      book 'The India Way: Strategies for an Uncertain World' is essentially the manual
      for Indian foreign policy in the Modi era, arguing that India must engage all major
      powers simultaneously, extract maximum benefit from each relationship, and never
      allow itself to be reduced to a junior partner in anyone's coalition.

      Jaishankar is uniquely positioned to navigate the Suwalki crisis because he
      understands every major player from personal experience. As Ambassador to China
      (2009-2013), he developed a nuanced understanding of Beijing's strategic calculus
      and negotiated through multiple border incidents. As Ambassador to the United States
      (2013-2015), he built relationships across the Washington establishment that he now
      leverages as minister. As Foreign Secretary (2015-2018), he managed the complex
      India-Russia relationship during a period of growing Western pressure. He speaks
      with an authority that few foreign ministers globally can match — and he knows it.
      His public statements are famously sharp, combative, and quotable: when European
      journalists press him on India's Russian oil purchases, he fires back with data
      about Europe's own Russian gas dependency. When accused of enabling Russian
      aggression, he points out that NATO expansion, Western arms sales to Pakistan, and
      the Iraq War did not exactly demonstrate consistent adherence to the 'rules-based
      order' that India is now being asked to uphold.

      The MEA under Jaishankar has developed a sophisticated diplomatic machinery for
      crisis management. India's permanent mission at the UN is staffed with experienced
      diplomats skilled at drafting abstention statements that express 'deep concern'
      without assigning blame. India's BRICS and SCO participation gives it platforms to
      engage Russia and China multilaterally, while the Quad and bilateral relationships
      with the US, France, Japan, and Australia provide Western channels. Jaishankar
      personally manages the most sensitive diplomatic conversations — he met his Polish
      counterpart in 2025 and pushed back against criticism of India's stance as 'both
      unfair and unjustified,' while simultaneously reassuring Western partners that
      India's engagement with Russia does not make it a Russian ally.

      On the Suwalki crisis specifically, the MEA will execute a textbook multi-alignment
      strategy: express concern about sovereignty violations (without naming Russia),
      call for dialogue and restraint (without proposing specific terms), offer India's
      good offices as a mediator (without committing to outcomes), and vote to abstain at
      the UNGA (while explaining the abstention as principled neutrality, not moral
      evasion). Jaishankar will frame India's position in terms of its post-colonial
      identity — India refuses to be lectured by former colonial powers about international
      norms that were designed without Indian input and have been selectively enforced
      when it suited Western interests. This framing resonates powerfully across the
      Global South and gives India diplomatic cover that few other countries could
      construct as effectively. The MEA will also work backchannels to both Moscow and
      Washington, carrying messages that neither side can deliver directly, and positioning
      India as indispensable to any eventual resolution — thereby strengthening India's
      case for permanent UN Security Council membership and enhanced global governance
      representation.
    priorities:
      - "Execute multi-alignment diplomacy: maintain simultaneous engagement with Russia (SCO, BRICS, bilateral) and the West (Quad, bilateral with US/FR/JP/AU) without being captured by either"
      - "Frame India's neutrality as principled Global South leadership, not moral evasion — rally developing nations behind India's 'third way' narrative"
      - "Protect India's standing at the UN: craft abstention statements that preserve relationships with both sides and avoid isolation in the General Assembly"
      - "Position India as an indispensable mediator — carry messages between Moscow and Washington that neither can deliver directly"
      - "Advance India's permanent UNSC seat candidacy by demonstrating diplomatic indispensability during the crisis"
      - "Defend India's energy policy (Russian oil imports) and defense procurement (S-400, BrahMos) against Western criticism with sharp, data-driven counter-arguments"
      - "Ensure that India-China diplomatic channels remain open and that Beijing does not exploit the Suwalki crisis to pressure India on the LAC or in multilateral forums"
    red_lines:
      - "Being publicly humiliated or lectured by Western leaders — Jaishankar will respond with devastating counter-arguments that escalate rather than defuse"
      - "UN Security Council resolutions that force India into a binary vote (India currently sits as an elected member and needs to manage its position carefully)"
      - "Any framework for crisis resolution that excludes India from the negotiating table — India will not accept outcomes imposed by a Western-Russian deal that ignores Global South interests"
      - "Western attempts to use the Suwalki crisis to force India into a formal alliance or security commitment that compromises strategic autonomy"
      - "Diplomatic isolation in the Global South — if India's neutrality is perceived as Russian enablement rather than principled non-alignment, it undermines India's leadership claim"
    voice:
      style: "Intellectually combative, data-driven, historically grounded, and delivered with the confidence of a former ambassador who has negotiated with every major power"
      quotes:
        - "India's position has been consistent and clear. We believe in sovereignty and territorial integrity. We believe in the UN Charter. We also believe that the path to peace runs through diplomacy, not through military escalation or economic coercion. We urge all parties to find a way back to the negotiating table."
        - "When Europe was buying Russian gas at record levels, nobody asked India to take a position. Now that India buys Russian oil at a discount to stabilize global energy markets — which benefits Europe too, by the way — suddenly we are enabling aggression? This criticism is both unfair and unjustified."
        - "India does not belong to any camp. India belongs to India. Our foreign policy is determined by our national interest, our values, and our assessment of the situation — not by the preferences of any bloc, however powerful."
        - "You ask why India abstains at the UN. I ask you: where was this 'rules-based order' when Iraq was invaded on false pretenses? Where was it when Libya was destroyed? Where is it when the Palestinians suffer? India judges every situation on its merits, and we will not be lectured on consistency by those whose own record is inconsistent."
        - "I have served as ambassador in both Beijing and Washington. I understand the complexity of great power competition better than most. India's role is not to choose sides — it is to ensure that the eventual resolution reflects the interests of all nations, not just the nuclear-armed ones sitting at the table."
    key_relationships:
      allies: ["US (iCET technology initiative, Quad, growing convergence on Indo-Pacific — but persistent trust gap on CAATSA, tech transfer, and Pakistan)", "FR (fastest-growing strategic partnership, $50B+ defense deals, Macron personal rapport with Modi, shared interest in strategic autonomy concept)", "RU (decades of diplomatic partnership, UNSC coordination, SCO/BRICS cooperation — but relationship under structural strain from Ukraine war and Western pull)", "JP (Quad anchor in Asia, 2+2 dialogue, infrastructure cooperation in Indo-Pacific, shared China concern)", "Global South nations (India positions itself as voice of developing world, G20 presidency 2023 legacy)"]
      rivals: ["CN (strategic competitor despite diplomatic thaw, LAC dispute unresolved, BRI vs. Indian Ocean primacy, Pakistan enablement)", "PK (post-Sindoor adversary, terrorism originator, but ceasefire holding — India watches for destabilization)"]
