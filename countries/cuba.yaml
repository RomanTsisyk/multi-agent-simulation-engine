geographic_relevance: >
  Cuba sits 90 miles from the Florida coast, giving it outsized strategic significance relative
  to its modest military and economic capabilities. During the Cold War, Cuba was the Soviet
  Union's most important Western Hemisphere ally, and the 1962 Cuban Missile Crisis remains the
  closest the world has come to nuclear war. In 2024-2026, Cuba has once again become a
  convergence point for Russian and Chinese intelligence operations targeting the United States.

  RUSSIAN INTELLIGENCE AND MILITARY PRESENCE: The March 2025 Russia-Cuba Comprehensive Military
  Cooperation Agreement — ratified by Moscow in October 2025 — provides the legal framework for
  expanded Russian military activities including intelligence sharing, naval visits, and arms
  transfers. Russian warships visited Havana twice in 2024 (June and July), including a
  nuclear-powered submarine, explicitly demonstrating Moscow's ability to project power into the
  Caribbean. Russian electronic intelligence gathering from Cuban territory can monitor US military
  communications, SOUTHCOM operations, and submarine traffic through the Florida Straits and Gulf
  of Mexico. The agreement also includes Russian provision of 1.64 million tons of petroleum
  annually — a lifeline for Cuba's energy-starved economy and the primary mechanism by which
  Moscow purchases Havana's strategic cooperation.

  CHINESE SIGINT INFRASTRUCTURE: The Center for Strategic and International Studies (CSIS) has
  identified four Chinese signals intelligence facilities on Cuban soil — Bejucal, Wajay, and
  Calabazar near Havana, plus El Salao near Santiago de Cuba approximately 100 kilometers from
  the US naval base at Guantanamo Bay. The Bejucal facility sits in hills that housed Soviet
  nuclear weapons during the 1962 crisis. Satellite imagery from April 2025 shows active
  construction of a large Circular Disposed Antenna Array (CDAA) at Bejucal capable of
  intercepting signals from 3,000 to 8,000 nautical miles — covering all US East Coast military
  installations, STRATCOM communications, and Atlantic Fleet movements. China has provided
  approximately $7.8 billion in development financing to Cuba since 2000 and is now Cuba's
  top trading partner, giving Beijing significant leverage. In September 2025, Xi Jinping and
  Diaz-Canel signed eleven cooperation documents in Beijing deepening the partnership.

  CUBAN FIGHTERS IN UKRAINE: An estimated 5,000 to 20,000 Cubans have been recruited to fight
  for Russia in Ukraine since 2022 — the largest foreign mercenary contingent in the Russian
  army. Ukraine closed its Havana embassy in October 2025 over this "fighter pipeline." Many
  were recruited through fraud, promised construction work but delivered to the frontlines. This
  represents a direct Cuban contribution to Russia's war effort and creates mutual dependency
  between Havana and Moscow.

  SUWALKI CRISIS RELEVANCE: In the Suwalki crisis, Cuba's value to Russia operates on multiple
  levels. First, as an intelligence platform — Russian and Chinese SIGINT facilities on Cuba
  monitor US military communications and force movements, providing early warning of American
  deployments toward Europe. Second, as a political signaling tool — Russia can announce
  enhanced military cooperation with Cuba, naval deployments to the Caribbean, or even weapons
  transfers as pressure signals to Washington, forcing SOUTHCOM to maintain readiness and
  diverting attention from European operations. Third, as diplomatic support — Cuba votes
  reliably with Russia at the UN General Assembly and mobilizes ALBA-TCP and Non-Aligned Movement
  solidarity. Fourth, the mere possibility of Russian military escalation in the Caribbean
  exploits the historical trauma of the 1962 Missile Crisis, generating disproportionate media
  coverage and political anxiety in Washington. However, Cuba's leadership is acutely aware that
  becoming a pawn in great power confrontation nearly destroyed the island in 1962. The regime's
  survival instinct will temper its willingness to cross thresholds that invite US military action.

