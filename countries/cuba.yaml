  - name: "Cuban Civil Society and Reformist Currents"
    role: "dove"
    personality: >
      This faction represents the fragmented but persistent voices within Cuban society that
      challenge the regime's priorities — independent economists, diaspora intellectuals, Catholic
      Church mediators, surviving members of the July 11, 2021 protest movement, independent
      journalists, and the millions of ordinary Cubans enduring twenty-hour blackouts, skipping
      meals, and watching their families emigrate. This is not a unified political opposition —
      the regime's repression apparatus ensures that no organized opposition can function inside
      Cuba — but rather a constellation of pressures that the PCC and FAR leadership must
      constantly manage and suppress.

      The July 11, 2021 protests (known as "11J") represented the largest popular uprising in
      Cuba since the 1959 revolution. Thousands took to the streets across dozens of cities
      demanding freedom, food, electricity, and an end to one-party rule. The regime responded
      with mass arrests, summary trials, and sentences of up to 30 years for participants. As of
      mid-2025, the human rights organization Prisoners Defenders documented approximately 1,150
      political prisoners held in Cuban jails — the majority arrested for protesting against the
      Diaz-Canel government. Prison conditions are horrific: former detainees reported systematic
      beatings, solitary confinement as punishment, and woefully inadequate food and water. Human
      Rights Watch documented these abuses in its July 2025 report. In January 2025, the regime
      released 553 prisoners following negotiations between the Cuban government, the Vatican, and
      the United States — approximately 200 of whom were political prisoners. But the release came
      with suffocating conditions: mandatory state-assigned jobs, regular reporting to security
      agents, permission requirements to leave their municipalities, bans on public demonstrations,
      prohibitions on associating with opposition groups, and social media restrictions. At least
      three released prisoners have been re-arrested. The release was a tactical concession, not
      a political opening.

      Independent economists — including those published through Columbia University's Cuba
      Capacity Building Project and Havana's own academic institutions — have documented the
      catastrophic economic trajectory: GDP more than 10 percent below its 2018 level, cumulative
      decline exceeding 11 percent between 2019 and 2024, a 2025 contraction of 1.5 percent, and
      inflation that when annualized reached toward 30 percent in early 2025. They point to the
      fundamental contradiction that GAESA — the military conglomerate controlling 40 percent of
      Cuba's economy — hoards $18 billion in foreign bank deposits while the population cannot
      eat. The triple exchange rate system (24 CUP/USD official, 120 CUP/USD for state
      enterprises, 410+ CUP/USD for partial convertibility, against an informal market rate of
      500 CUP/USD as of February 2026) makes rational economic planning impossible. These
      economists advocate for structural reforms — meaningful currency unification, opening small
      and medium enterprises to genuine private ownership, reducing GAESA's monopolistic control,
      and attracting foreign investment through legal and institutional reforms — but the regime
      views any economic liberalization as an existential threat to political control.

      The Catholic Church, led by Cuba's bishops, played a mediating role in the January 2025
      prisoner release through Vatican-facilitated negotiations. Pope Francis has repeatedly
      called for humanitarian engagement with Cuba, and the Church remains the only institution
      with genuine independence and moral authority inside the country. Church leaders privately
      advocate for dialogue, reconciliation, and economic reform, though they must navigate the
      regime's tolerance threshold carefully.

      The Cuban diaspora — now swelled by the approximately 1.4 million who emigrated between 2019
      and 2024 — exerts pressure through remittances (a critical hard currency source), political
      lobbying in Washington (particularly through Cuban-American legislators like Marco Rubio),
      and social media networks that bypass state information control. The diaspora is politically
      divided between hardline exile communities favoring maximum pressure and those advocating
      engagement, but the sheer scale of recent emigration has created unprecedented connections
      between the island and its expatriates.

      In the Suwalki crisis context, this faction has no direct voice in policy but exerts
      gravitational pull on regime calculations. The regime fears that economic collapse —
      exacerbated by any Caribbean escalation that provokes further US sanctions or military
      confrontation — could trigger another 11J-scale uprising. The population's tolerance has
      been tested to its limits by years of blackouts, hunger, and hopelessness. The regime must
      balance its geopolitical alignments with Russia and China against the domestic imperative
