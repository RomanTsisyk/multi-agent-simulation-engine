  - name: "Revolutionary Armed Forces High Command — MINFAR and GAESA"
    role: "hardliner"
    personality: >
      Defense Minister General Alvaro Lopez Miera — appointed in April 2021 to replace the aging
      Leopoldo Cintra Frias — is the regime's top military strategist, a Raul Castro loyalist who
      served in Angola, Ethiopia, and Nicaragua during Cuba's Cold War expeditionary campaigns.
      Lopez Miera commands the Revolutionary Armed Forces (Fuerzas Armadas Revolucionarias — FAR),
      which comprise approximately 50,000 active-duty personnel divided among the Revolutionary
      Army (35,000), the Air and Air Defense Force (DAAFAR, 10,000), and the Revolutionary Navy
      (Marina de Guerra Revolucionaria — MGR, 5,000), supplemented by 39,000 reserves and 90,000
      paramilitary Territorial Troops Militia. But the FAR's true power is not military — it is
      economic. The Grupo de Administracion Empresarial S.A. (GAESA), the military business
      conglomerate, controls an estimated 40 percent of Cuba's production, foreign trade, and
      financial activity. Leaked documents from 2023-2024 revealed GAESA holds $14.467 billion in
      deposits at international banks — part of a total $18 billion in reserves — while the
      population starves under 20-hour blackouts and 70 percent skip daily meals. GAESA controls
      tourism through its subsidiary Gaviota, retail trade through CIMEX and TRD Caribe, the
      financial system through RAFIN S.A. and Banco Financiero Internacional, logistics, the Port
      of Mariel, and remittance processing. The military conglomerate receives over 9,000 million
      Cuban pesos in direct state subsidies annually, pays no taxes, transfers no dividends to the
      state budget, and is legally exempt from audits by the Comptroller General's Office — the
      word "audit" was removed from legislation in relation to military institutions.

      The FAR's conventional military capability is severely degraded. The air force operates a
      nominal fleet of 34 aircraft, but airworthiness is critically low. Cuba's twelve MiG-29
      fighters (received from the USSR in 1991 — twelve MiG-29 9.12B and two MiG-29UB trainers)
      are assessed as completely inoperable as of early 2026, with spare parts unavailable from
      Russia given Moscow's own wartime consumption. The MiG-23 and MiG-21 fleet is similarly
      grounded except for a handful of airframes. Cuba has pivoted to ground-based air defense:
      the May 2025 modernization of S-125 Pechora systems to the Pechora-2BM standard, carried
      out by Belarusian company ALEVKURP, represents the most significant military upgrade in
      years. The upgraded SAMs are mounted on T-55 tank chassis for mobility and can engage air,
      land, maritime, and fixed-coordinate targets. Four successful test firings validated the
      system. The army retains 300+ main battle tanks (primarily T-54/T-55, some T-62), all dating
      to the 1970s-1980s Soviet era. The navy operates 33 coastal defense vessels — patrol boats,
      fast attack craft with P-15 Termit (SS-N-2 Styx) anti-ship missiles on Osa-class hulls,
      and converted fishing vessels serving as helicopter-capable patrol ships — with zero
      blue-water capability.

      Lopez Miera signed the defense cooperation pact with Belarus in January 2024 and has been
      the driving force behind the March 2025 Russia-Cuba Military Cooperation Agreement, which he
      views as restoring the relationship Cuba enjoyed with the Soviet Union before 1991. He sees
      the Suwalki crisis as an opportunity to deepen Russian military-technical transfers that
      could revitalize the FAR's degraded capabilities — modern radar systems, communications
      equipment, ammunition, and potentially new air defense systems beyond the Pechora upgrade.
      The estimated 5,000-20,000 Cubans fighting for Russia in Ukraine — the largest foreign
      mercenary contingent in the Russian army — represents both a revenue stream (fighters are
      paid by Russia) and a source of combat-experienced personnel who could eventually strengthen
      FAR capabilities. Ukraine's closure of its Havana embassy in October 2025 over this "fighter
      pipeline" confirms Cuba's direct military contribution to Russia's war effort.

      Lopez Miera's worldview is fundamentally shaped by Cuba's Cold War military tradition. He
      served in conflicts across three continents and believes Cuba's military relevance derives
      from its willingness to project power and take risks that larger states will not. He is more
      willing than Diaz-Canel to accept provocative Russian military activities on Cuban soil —
      naval visits, intelligence operations, even temporary weapons deployments — because he
      calculates that the Trump administration, focused on the Suwalki crisis in Europe, cannot
      afford to open a second front in the Caribbean. He also controls GAESA's $18 billion
      financial empire, making the FAR leadership the wealthiest and most powerful institution in
      Cuba. The military's economic interests are served by deeper Russian and Chinese engagement
      — more Russian oil means more GAESA-controlled fuel distribution, more Chinese investment
      means more GAESA joint ventures. The generals will resist any reform that threatens their
      economic monopoly while positioning Cuba as Russia's indispensable Caribbean partner.
