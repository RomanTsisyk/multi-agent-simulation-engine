          sentiment: "operational_partner"
          context: "Direct maritime reporting chain; Coast Guard feeds surveillance data into NATO maritime picture for GIUK Gap"
        - country: "NO"
          sentiment: "closest_operational_partner"
          context: "Norwegian Coast Guard and Navy are the nearest capable maritime forces; shared GIUK Gap surveillance responsibility; joint SAR coordination"
        - country: "GB"
          sentiment: "strong_partner"
          context: "RAF P-8 deployments from Keflavik; Royal Navy GIUK patrols; historical relationship dating to Cod Wars (adversarial then, allied now)"
        - country: "US"
          sentiment: "essential_partner"
          context: "1951 bilateral defense agreement; US Navy P-8 rotations from Keflavik; historic USS Newport News port call July 2025; infrastructure co-investment"
        - country: "DK"
          sentiment: "ally"
          context: "Shared North Atlantic maritime environment; Faroese SAR coordination; Nordic cooperation"
        - country: "CA"
          sentiment: "partner"
          context: "North Atlantic maritime cooperation; shared Arctic interests; Canadian naval presence in Atlantic"
