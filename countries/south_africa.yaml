government: >
  Government of National Unity (GNU) formed 14 June 2024 after ANC won 40.18% in the
  May 2024 elections — losing its parliamentary majority for the first time since 1994.
  Ten-party coalition led by the ANC with the Democratic Alliance (DA, 21.81%), Inkatha
  Freedom Party (IFP), Patriotic Alliance (PA), Freedom Front Plus (FF+), Good, Pan
  Africanist Congress (PAC), United Democratic Movement (UDM), Rise Mzansi, and Al Jama-ah.
  Ramaphosa inaugurated for second term 19 June 2024. Cabinet of 32 ministers: ANC holds
  20 posts, DA holds 6, remainder allocated to smaller parties. DA leader Steenhuisen
  serves as Minister of Agriculture. Cabinet reshuffle 3 December 2024 swapped four
  portfolios. The GNU faces persistent tension between the ANC's non-aligned, anti-
  imperialist foreign policy and the DA's pro-Western, pro-Ukraine orientation. In February
  2026 Steenhuisen announced he would step down as DA leader to focus on his ministerial
  portfolio, leaving the DA's GNU future uncertain. The opposition includes Jacob Zuma's
  uMkhonto weSizwe (MK) party (14.58% in 2024, third largest) and Julius Malema's Economic
  Freedom Fighters (EFF, 9.52%). Local government elections expected in 2026 will test the
  GNU's durability.

defense_budget: >
  R57.1 billion (~$3.2 billion) for 2025/26, against an estimated baseline requirement of
  R98.3 billion (~$5.5 billion). Defense spending has declined to approximately 0.7% of GDP,
  well below the average core inflation rate of 4.65% over the past 15 years, meaning the
  budget has shrunk in real terms for over a decade. The SANDF is severely underfunded:
  Deputy Minister Holomisa publicly stated in January 2025 that "we cannot guarantee we are
  ready" due to chronic defunding. The navy's frigate and submarine refit programme requires
  R4.2 billion but only R1.4 billion has been allocated. An additional R5 billion was
  allocated for the DRC peacekeeping deployment (SAMIDRC), now being withdrawn. South Africa's
  defense industry — once world-class through Denel and Armscor — is in severe distress;
  Denel received a government bailout in March 2023 but remains unable to reliably pay staff
  or support SANDF operations.

