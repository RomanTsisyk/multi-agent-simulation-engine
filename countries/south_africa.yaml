      - "South Africa voting against or abstaining on UN resolutions condemning a clear violation of Lithuanian sovereignty — this would be indefensible under international law"
      - "Further deterioration of the US-South Africa relationship that threatens AGOA, automotive sector exports, or foreign direct investment"
