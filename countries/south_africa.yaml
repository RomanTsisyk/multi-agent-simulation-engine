        - "We have called for GNU parties to meet and smooth out foreign policy differences. The ANC cannot monopolize South Africa's international relations when the consequences — 30% tariffs, a G20 boycott, AGOA uncertainty — fall on all South Africans, including the workers and businesses in DA-governed provinces."
        - "Look at India, Malaysia, Vietnam — they trade with both sides of the world without making enemies of either. That is genuine non-alignment. South Africa should learn from them, not from Cuba and Venezuela."
