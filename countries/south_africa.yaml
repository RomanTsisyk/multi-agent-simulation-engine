        - "CN (DA is wary of Chinese debt-trap diplomacy in Africa, state surveillance exports, and unfair trade practices; less hostile than toward Russia but skeptical of deepening dependence)"
        - "ANC foreign policy establishment (the DA's primary antagonist on international relations; accuses the ANC of monopolizing foreign policy within the GNU)"
