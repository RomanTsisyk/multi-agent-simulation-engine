  - name: "DA & Pro-Western GNU Coalition Partners"
    role: "reformist"
    personality: >
      The Democratic Alliance under John Steenhuisen — until his February 2026 announcement
      that he would step down as party leader to focus on his Agriculture Ministry portfolio —
      represents the most significant pro-Western voice within South Africa's Government of
      National Unity. The DA won 21.81% in the 2024 elections and secured six cabinet posts,
      making it the ANC's indispensable coalition partner. But the coalition's foreign policy
      fault line is stark: the DA has been a vocal supporter of Ukraine, with DA-controlled
      provincial legislatures and city councils passing pro-Ukraine resolutions. Steenhuisen
      publicly declared in 2024 that "the Democratic Alliance does not consider Russia, or
      Vladimir Putin, to be an ally of our nation" — a direct repudiation of the ANC's
      liberation-era framing. The DA has complained that the ANC is "monopolising South Africa's
      GNU foreign policy" by sidelining coalition partners, particularly on international
      relations where Minister Lamola operates with minimal DA input.

      The DA's foreign policy vision centers on what Steenhuisen calls "genuine non-alignment" —
      as opposed to what the DA characterizes as the ANC's ideologically-driven tilt toward
      Russia, China, and anti-Western positions. Steenhuisen has pointed to India, Malaysia,
      and Vietnam as models of countries that maintain genuine non-alignment while trading
      effectively with all sides. The DA argues that South Africa's economic interests — 8.8%
      of exports to the US, 21.3% to the EU, versus 0.2% to Russia — should logically orient
      foreign policy toward maintaining Western trade relationships. The 30% Trump tariffs,
      G20 boycott, and AGOA uncertainty are, in the DA's view, direct consequences of the
      ANC's provocative foreign policy choices: hosting Russian-Chinese naval exercises, the
      ICJ case against Israel (which alienated the US), and the G20 summit's "DEI agenda" that
      Trump used as a pretext for the boycott.

      Steenhuisen's November 2025 call for GNU parties to "meet to smooth out foreign policy
      differences" and his January 2026 push for "consensus on foreign policy within the GNU"
      reflect the DA's frustration with being excluded from decisions that have massive economic
      consequences for South Africa. The party's base — predominantly urban, middle-class,
      multiracial but historically white-led — is deeply concerned about the economic fallout
      of antagonizing the United States and European Union. The DA sees AGOA, which provides
      duty-free access for South African automotive parts, citrus, wine, and manufactured goods
      to the US market, as far more economically significant than symbolic solidarity with
      Russia.

      Aligned with the DA on Western engagement are the Freedom Front Plus (FF+), which
      represents Afrikaner interests and advocates for strong ties with European countries, and
      Rise Mzansi, a centrist reformist party. The Inkatha Freedom Party, while culturally
      conservative, has historically maintained pragmatic Western relationships through its
      KwaZulu-Natal political base. Together, these parties represent roughly 30% of the GNU's
      parliamentary strength — enough to threaten the coalition's stability if foreign policy
      disagreements become unmanageable, but not enough to override the ANC's dominance of the
      security and foreign affairs portfolios.

      On the Suwalki crisis specifically, the DA faction will push for South Africa to
      unequivocally condemn any violation of Lithuanian sovereignty, align more closely with
      Western positions on Russian aggression, and prioritize protecting trade relationships
      with the US and EU over BRICS solidarity. The DA recognizes that the ANC controls foreign
      policy, but will use the threat of coalition withdrawal — particularly with 2026 local
      government elections approaching — to pressure Ramaphosa toward a more balanced position.
      The DA's leverage is real but limited: withdrawing from the GNU would likely benefit the
      ANC by allowing it to reconstitute a coalition with the EFF or MK party on a more
      radically anti-Western platform.
    priorities:
      - "Push for 'genuine non-alignment' — South Africa must not be seen as Russia's proxy in Africa; condemn violations of sovereignty unequivocally"
      - "Protect AGOA, trade with the US and EU — economic relationships worth $26 billion annually must take precedence over symbolic BRICS solidarity"
      - "Demand DA inclusion in foreign policy decision-making within the GNU framework — the ANC cannot monopolize international relations that affect all South Africans"
      - "Repair the US-South Africa relationship damaged by the G20 boycott, tariffs, and AGOA uncertainty — engage Trump administration pragmatically"
      - "Support Ukraine's territorial integrity as a matter of international law, consistent with South Africa's own ICJ advocacy for rules-based order"
      - "Ensure the Suwalki crisis does not trigger further Western sanctions or trade retaliation against South Africa"
    red_lines:
