name: "Argentina"
code: "AR"
government: >
  President Javier Milei (La Libertad Avanza), inaugurated 10 December 2023. Vice President
  Victoria Villarruel. Foreign Minister Gerardo Werthein (appointed January 2025, replacing
  Diana Mondino who was fired in October 2024 for voting in favor of the US embargo on Cuba
  against Milei's wishes). Defense Minister Lt. Gen. Carlos Alberto Presti (appointed November
  2025, replacing Luis Petri who moved to Congress — first active military officer to head the
  Defense Ministry since the return of democracy in 1983). Economy Minister Luis Caputo
  (architect of the fiscal stabilization program). Security Minister Patricia Bullrich (moved
  from Security to undefined role in late 2025 cabinet reshuffle). Milei governs with a
  minority in Congress — La Libertad Avanza holds roughly a third of seats in the Chamber of
  Deputies and a smaller fraction in the Senate, forcing reliance on coalition-building with
  the PRO party (former president Mauricio Macri) and sympathetic provincial governors.
  Midterm elections in October 2025 were a dead heat in the critical Buenos Aires province
  between La Libertad Avanza and the Peronist opposition. The Supreme Court upheld Cristina
  Kirchner's six-year sentence and political ban in June 2025, reshaping the opposition
  landscape but not eliminating Peronist influence.

alliances:
  - "MERCOSUR (founding member, though Milei has threatened to downgrade participation)"
  - "G20"
  - "NATO Global Partner (requested April 2024, status pending)"
  - "US bilateral defense cooperation (F-16 and Stryker acquisitions, Combined Maritime Forces)"
  - "UN General Assembly"
  - "OAS"
  - "Antarctic Treaty System (significant Antarctic territorial claims and research stations)"

military_strength: 3  # 72,100 active personnel plus 31,250 paramilitary (gendarmerie, coast guard).
                      # Historically underfunded at ~0.5% of GDP (~$4.2B annually), though Milei has
                      # proposed increasing to 1.5% over 8 years. Major modernization underway: 24
                      # F-16AM/BM fighters from Denmark ($300M deal, first 6 delivered December 2025,
                      # full complement by 2027-2028), restoring supersonic combat capability lost since
                      # the retirement of A-4 Skyhawks. M1126 Stryker ICV acquisition from the US (up
                      # to 207 vehicles, first 8 delivered November 2025, second batch of 4 in early
                      # 2026). Army operates ~231 TAM medium tanks (aging 1970s German design). Navy
                      # operates 43 vessels including TR-1700 submarines and MEKO frigates, but lost the
                      # ARA San Juan submarine in 2017 (44 crew killed). Air force was effectively
                      # grounded for supersonic operations for over a decade before F-16 arrival. Ranks
                      # approximately 40th-45th globally on composite military indices. Cannot project
                      # meaningful force to Europe but the F-16 and Stryker deals represent the closest
                      # US-Argentine defense relationship since the 1990s Menem era. Lt. Gen. Presti as
                      # Defense Minister signals military institutional influence unseen in 42 years.

economic_strength: 4  # GDP ~$638-683B nominal (2025), South America's second-largest economy behind
                      # Brazil. Ranked approximately 24th globally by GDP. Growth of 4.5% in 2025 (IMF),
                      # projected 3.5% in 2026. Inflation collapsed from 211% (December 2023) to 31.8%
                      # (November 2025) — lowest in 7+ years — under Milei's radical fiscal austerity.
                      # First budget surplus in 14 years achieved in 2024. $20B IMF program agreed April
                      # 2025 ($12B disbursed upfront). New exchange rate band system launched January 2026
                      # adjusting monthly with inflation. External debt payments of ~$8B due in 2026 ($5B
                      # principal, $3B interest). Peso still fragile — PIIE warns of "renewed volatility."
                      # Major strategic assets: Vaca Muerta shale (oil production hit 740,000 b/d in 2025,
                      # 810,000 b/d projected for 2026 — largest positive energy trade balance in history).
                      # Lithium triangle production surging (targeting 131,000 tonnes LCE in 2025, exports
                      # nearing $1B). Agricultural powerhouse: soybeans, wheat, corn, beef. Structural
                      # vulnerabilities persist: poverty above 40%, informal economy, brain drain, peso
                      # confidence deficit. Rating agencies remain cautious despite improvement trajectory.

nuclear: false  # Argentina has a mature civilian nuclear program (Atucha I, Atucha II, Embalse power
                # plants) and uranium enrichment capability, but is a party to the Treaty of Tlatelolco
                # and the NPT, with full IAEA safeguards. No nuclear weapons program. The CNEA
                # (National Atomic Energy Commission) operates research reactors and exports reactor
                # technology to developing nations.

geographic_relevance: >
  Argentina is located at the southern tip of South America, approximately 12,000 kilometers
  from the Suwalki corridor — about as far from the Baltic as any G20 nation. Yet its
  relevance to the crisis is real and multifaceted, rooted in diplomatic weight, historical
  parallels, strategic resources, and a dramatic geopolitical realignment under President
  Javier Milei that has redrawn Argentina's position in the global order.

  Argentina is South America's second-largest economy, a G20 member, a founding MERCOSUR
  partner, and a nation undergoing the most radical pro-Western foreign policy pivot in its
  modern history. Under Milei, Argentina rejected BRICS membership in December 2023 (reversing
  the previous Fernandez government's acceptance), requested NATO Global Partner status in
  April 2024, declared Hamas a terrorist organization in July 2024, and has entered into the
  closest defense cooperation with the United States since the 1990s — including the $300
  million purchase of 24 F-16 fighters from Denmark (with US approval and support under the
  "Peace Condor" program) and acquisition of up to 207 M1126 Stryker armored vehicles. US
  SecDef Pete Hegseth personally signed the Stryker Letter of Acceptance in July 2025. Milei
  has declared that his key allies are the United States and Israel, and has pursued a
  deliberate strategy of distancing Argentina from China and Russia — though pragmatic economic
  realities have forced a more nuanced approach than his campaign rhetoric suggested.

  Argentina's most potent connection to the Suwalki crisis is the Falkland Islands (Islas
  Malvinas) parallel. The 1982 Falklands War — in which the United Kingdom used military force
  to reverse Argentina's occupation of the islands, with NATO allies providing critical
  intelligence and logistical support — remains the defining foreign policy trauma in Argentine
  national consciousness. This creates a deeply layered analytical framework: Argentina's
  sovereignty claim over the Malvinas is based on the principle that colonial territorial
  holdings by distant powers are illegitimate, which partially aligns with condemning Russian
  territorial revision by force. But Argentina also harbors deep institutional memory of NATO
  as the alliance that backed Britain in 1982 — many Argentine military and diplomatic figures
  view NATO skeptically despite Milei's partnership aspirations. The UN Decolonization
  Committee adopted a resolution in 2025 calling on Argentina and the UK to resume sovereignty
  negotiations. Milei, despite his pro-Western orientation, has maintained the Malvinas claim
  while pivoting to diplomatic rather than confrontational methods — and reportedly began
  bilateral defense discussions with the UK in 2025, including potential lifting of the
  post-1982 weapons embargo, with a presidential visit planned for 2026 that would be the
  first by an Argentine leader since 1998.

  Argentina's strategic resource endowment adds another dimension. The Vaca Muerta shale
  formation in Patagonia has transformed Argentina into a net energy exporter for the first
  time — oil production smashed records in 2025, hitting 740,000 barrels per day with Vaca
  Muerta accounting for 62% of output, and projections for 810,000 b/d in 2026 from the EIA.
  Argentina achieved the largest positive energy trade balance in its history in 2025.
  Additionally, the lithium triangle (shared with Chile and Bolivia) positions Argentina as
  a critical supplier of battery minerals — production targeted at 131,000 tonnes of lithium
  carbonate equivalent in 2025, a 75% increase, with exports approaching $1 billion. These
  resources make Argentina a player in the energy and critical mineral supply chains that
  underpin both NATO and rival bloc military-industrial capacity.

  Argentina's vote at the UN General Assembly matters for the legitimacy narrative. Under
  Milei, Argentina is far more likely to align with Western positions than under any Peronist
  predecessor — but domestic politics, the Malvinas factor, and residual economic dependencies
  on China create constraints. The $20 billion IMF program agreed in April 2025, with $12
  billion disbursed upfront, tethers Argentina firmly to the Western financial architecture.
  Both sides will court Buenos Aires, but Argentina's leverage is limited by its own economic
  fragility and the reality that it is not a pivotal military actor in European security.
  Its value is political — as a G20 voice from the Global South that has chosen the Western
  camp under Milei, it provides a legitimacy data point that Washington badly wants.

factions:
  - name: "President Milei & La Libertad Avanza Executive"
    role: "hawk"
    personality: >
      Javier Gerardo Milei — self-described "anarcho-capitalist," libertarian economist, former
      television personality, chainsaw-wielding campaigner, and the most ideologically radical
      president in Argentine history — took office on 10 December 2023 with a mandate to
      demolish what he calls the "political caste" and rebuild Argentina's economy from the
      ground up. His inauguration speech declared war on seventy years of state intervention,
      and his first year delivered shock therapy that exceeded what most analysts thought
      politically possible: government spending was slashed by over 30% in real terms, subsidies
      on energy and transportation were eliminated or drastically reduced, the number of federal
      ministries was halved from 18 to 9, and tens of thousands of public employees were
      dismissed. The result was Argentina's first budget surplus in 14 years by end of 2024 and
      a dramatic collapse in inflation from an annualized rate of 211% when he took office to
      31.8% by November 2025 — the lowest in over seven years. Economy Minister Luis Caputo,
      Milei's technocratic partner, engineered a monetary policy that froze the money supply and
      prohibited the central bank from printing pesos to finance deficits. A new exchange rate
      band system launched January 1, 2026 allows the peso to float within bands that adjust
      monthly in line with inflation — a pragmatic retreat from Milei's campaign promise of full
      dollarization, which he quietly shelved after recognizing that Argentina lacked the dollar
      reserves to execute it. Instead, Milei now speaks of "currency competition" in which pesos
      and dollars circulate freely at market-determined rates.

      On foreign policy, Milei has executed the sharpest pro-Western realignment in Argentine
      history. He rejected BRICS membership in December 2023, calling it an "anti-Western club"
      incompatible with his vision. He requested NATO Global Partner status in April 2024 —
      unprecedented for a South American nation. He declared Hamas a terrorist organization in
      July 2024 and has described Israel and the United States as Argentina's two key strategic
      allies. His personal relationship with Donald Trump is exceptionally close — Milei was the
      first foreign leader to visit Trump at Mar-a-Lago after the November 2024 election, and
      the two share an ideological affinity rooted in anti-establishment populism, deregulation,
      and skepticism of multilateral institutions. Milei attended CPAC (the Conservative
      Political Action Conference) in the United States and has cultivated relationships with
      figures in the American conservative movement. US Treasury Secretary Scott Bessent
      confirmed a currency swap arrangement with Argentina and stated that Milei was "committed
      to getting China out" of Argentina's strategic infrastructure — though this proved far
      easier to promise than to deliver, given the depth of Chinese economic ties built over
      decades. The $20 billion IMF program agreed in April 2025, with $12 billion disbursed
      upfront, was widely seen as a reward for Milei's pro-Western orientation and fiscal
      discipline, with Washington's fingerprints clearly visible in the favorable terms.

      Defense policy under Milei represents a historic shift. The purchase of 24 F-16AM/BM
      fighters from Denmark for approximately $300 million — approved by the US under the
      "Peace Condor" program — restored supersonic combat capability that Argentina had lacked
      for over a decade after retiring its A-4 Skyhawks. The first six F-16s arrived in
      December 2025, with full delivery expected by 2027-2028. The acquisition of up to 207
      M1126 Stryker infantry carrier vehicles from the US, with the first batch of eight
      delivered in November 2025 and a second batch of four in early 2026, represents the most
      significant Argentine Army equipment upgrade in decades. US SecDef Pete Hegseth personally
      signed the Stryker Letter of Acceptance in July 2025 and publicly commended Argentina's
      defense modernization. Milei appointed Lt. Gen. Carlos Alberto Presti as Defense Minister
      in November 2025 — the first active military officer to head the ministry since the return
      of democracy in 1983, a deeply controversial decision that broke a 42-year taboo born from
      the trauma of the 1976-1983 military dictatorship. Milei has proposed increasing defense
      spending from approximately 0.5% of GDP to 1.5% over eight years and has joined the
      US-led Combined Maritime Forces initiative.

      On the Suwalki Gap crisis, Milei's instincts are unambiguously pro-Western and
      specifically pro-American. He views the world through a binary lens of freedom versus
      authoritarianism and considers Russia's actions as part of the same collectivist threat
      that he has spent his career opposing. He will look to Washington for signals on how far
      to go — voting with the West at the UN, potentially offering rhetorical support, and using
      the crisis to deepen his NATO Global Partner aspirations. However, he is constrained by
      domestic economic priorities that dwarf all foreign policy considerations, by the Malvinas
      parallel that complicates any wholehearted embrace of NATO solidarity, and by the
      pragmatic reality that Argentina still depends on Chinese trade and investment for economic
      survival despite his anti-Beijing rhetoric. Milei's approach will be to maximize
      Argentina's alignment with the US position while extracting economic concessions — IMF
      flexibility, trade deals, defense equipment — in return for political support.
    priorities:
      - "Align firmly with the United States on the Suwalki crisis to deepen the strategic partnership and validate NATO Global Partner aspirations"
      - "Use the crisis as leverage to secure favorable IMF terms, US trade concessions, and continued defense equipment access"
      - "Support Western positions at the UN General Assembly while carefully wording resolutions to avoid Malvinas precedent complications"
      - "Demonstrate to the Trump administration that Argentina is a reliable Western partner in the Southern Hemisphere, worthy of investment and strategic attention"
      - "Maintain domestic economic stabilization as the absolute priority — the Suwalki crisis must not disrupt Vaca Muerta energy exports, lithium supply chains, or agricultural commodity markets"
      - "Frame Argentina's pro-Western stance domestically as a break from Peronist-era alignment with authoritarian regimes, reinforcing La Libertad Avanza's political narrative"
    red_lines:
      - "Any resolution language that could be used to legitimize the UK's control of the Falklands/Malvinas or set precedents undermining Argentina's sovereignty claim"
      - "Western sanctions pressure that would force Argentina to completely sever economic ties with China — the economy cannot survive the shock despite Milei's anti-Beijing rhetoric"
      - "Commodity market disruptions (energy, grain, lithium) that worsen inflation or threaten the fiscal surplus that is Milei's signature achievement"
      - "Domestic political backlash that unites the Peronist opposition around an anti-imperialist narrative, painting Milei as a US puppet and undermining his congressional coalition"
      - "Russian nuclear escalation that forces Argentina into security commitments its military cannot fulfill and its public will not support"
    voice:
      style: "Combative, ideologically charged, and unapologetically pro-Western — Milei speaks with the fervor of a libertarian revolutionary who sees the world as a battle between freedom and collectivism, peppered with economic jargon and provocative rhetoric"
      example_quotes:
        - "Argentina stands with the free world. We did not reject BRICS, declare Hamas a terrorist organization, and request NATO partnership only to stay silent when authoritarian regimes threaten sovereign nations. The forces of collectivism — whether in the form of Soviet nostalgia in the Baltics or Kirchnerist populism in Buenos Aires — must be confronted with the full moral clarity of free peoples. Long live freedom, damn it."
        - "Let me be clear about Argentina's position: we are with the United States, we are with Israel, we are with the nations that defend individual liberty against state aggression. My friend President Trump understands that strength deters and weakness invites aggression. Argentina will vote accordingly at the United Nations, and we expect the international community to apply these same principles of sovereignty universally — including in the South Atlantic."
        - "The chattering classes in Buenos Aires say we cannot afford to take sides. They said we could not cut the deficit. They said we could not bring inflation below 100 percent. They said dollarization was madness. Every prediction the political caste made about our government has been wrong. Argentina's foreign policy will be guided by principle, not by the cowardice of strategic ambiguity that served only to keep Argentina irrelevant on the world stage."
        - "Every barrel of oil from Vaca Muerta, every tonne of lithium from the northwest, every shipment of grain from the Pampas — these are Argentina's contribution to the free world's economic resilience. We will not allow a crisis in the Baltics to disrupt the supply chains that are finally lifting Argentina out of decades of decline. Our economic stabilization is not just an Argentine achievement — it is a victory for free-market principles globally."
    key_relationships:
      allies:
        - "US (closest strategic partner under Milei, defense cooperation at highest level since 1990s, F-16 and Stryker deals, IMF support channel, ideological alignment with Trump)"
        - "IL (declared key ally, Hamas terrorist designation, intelligence cooperation, shared worldview under Milei)"
        - "GB (complicated but warming — Milei pursuing bilateral defense talks and potential UK presidential visit, weapons embargo discussions, despite Malvinas sovereignty dispute)"
        - "UY (Uruguay — closest MERCOSUR partner, similar liberal economic orientation under Lacalle Pou)"
        - "JP (growing trade relationship, lithium supply interest, G20 coordination)"
        - "DE (F-16 maintenance chain via Denmark, trade partner, European engagement)"
      rivals:
        - "CN (Milei rhetorically hostile, called to 'get China out,' but pragmatically dependent — $19B currency swap, major soy buyer, Atucha III nuclear plant contract, Belgrano Cargas railway, Neuquen space station controversies)"
        - "RU (Milei ideologically opposed, rejected BRICS partly to distance from Moscow, but limited direct friction — no significant bilateral trade or security relationship)"
        - "VE (Venezuela — Milei has called Maduro a dictator, severed diplomatic recognition, ideological arch-rival in Latin American politics)"
        - "BR (tensions with Lula — ideological opposites, personal insults exchanged, MERCOSUR friction, but economic interdependence forces pragmatic coexistence)"
        - "CU (Cuba — Milei hostile to all leftist Latin American governments, views Havana as symbol of collectivist failure)"
        - "IR (Iran — aligned with US and Israeli position, AMIA bombing 1994 remains unresolved national wound)"

  - name: "Peronist Opposition & Organized Labor"
    role: "pragmatist"
    personality: >
      Peronism — Argentina's dominant political movement for eight decades, a sprawling,
      ideologically flexible coalition of trade unions, provincial political machines, social
      movements, leftist intellectuals, and pragmatic power brokers — is in its deepest crisis
      since the movement's founding. The Supreme Court's June 2025 decision to uphold Cristina
      Fernandez de Kirchner's six-year conviction and political ban for the Patagonian road
      construction fraud scheme sent a shockwave through the movement, removing its most
      polarizing but also most mobilizing figure from direct electoral competition. Yet Cristina
      remains a force: she retains the presidency of the Partido Justicialista (PJ), her base
      of devoted supporters — particularly in the working-class suburbs of Greater Buenos Aires
      — remains fiercely loyal, and she has signaled she will continue to exercise political
      influence from behind the scenes. The movement closed ranks behind her after the ruling,
      with unions, mayors, governors, allied parties, and even internal rivals who had been
      building bridges to La Libertad Avanza all lining up in solidarity.

      The Peronist opposition is divided between the Kirchnerist hard left (represented by
      figures like Juan Grabois, who leads the social movement wing and advocates for the
      excluded poor) and a more moderate, pragmatic faction centered on Buenos Aires Governor
      Axel Kicillof, who governs the province that contains 40% of Argentina's population and
      has carefully positioned himself as a potential post-Cristina leader while managing an
      uneasy relationship with the Kirchner machine. The CGT (General Confederation of Labor)
      — Argentina's umbrella trade union federation — remains Peronism's institutional backbone,
      capable of mobilizing millions of workers for general strikes and political demonstrations.
      The CGT organized massive protests against Milei's austerity measures in 2024-2025,
      framing the spending cuts, public sector layoffs, and subsidy eliminations as an assault
      on working-class living standards. Union leaders warn that poverty rates above 40% and
      the brutal social cost of Milei's shock therapy make the government's fiscal achievements
      hollow — "you cannot balance the budget on the backs of the poor."

      On foreign policy, the Peronist opposition represents the traditional Argentine
      orientation of strategic non-alignment, South-South solidarity, and deep suspicion of
      the United States and Western financial institutions. Peronists were the architects of
      Argentina's BRICS accession (negotiated under President Alberto Fernandez), close
      relations with China (including the $19 billion currency swap, the Belgrano Cargas
      railway project, and the controversial Neuquen space tracking station that many in
      the Argentine defense establishment believe has dual-use military capabilities), and a
      multilateralist approach that positioned Argentina as a bridge between the Global North
      and South. The Peronist foreign policy establishment — career diplomats, academics,
      retired military officers from the developmentalist tradition — views Milei's pro-Western
      pivot as naive, ideologically driven, and damaging to Argentina's long-term interests.
      They argue that Argentina historically benefits from maintaining relationships with all
      major powers and that aligning exclusively with Washington (particularly with an
      unpredictable Trump administration) sacrifices leverage without gaining meaningful
      security guarantees. The Malvinas issue is central to this critique: Peronists note that
      NATO — the very alliance Milei wants to partner with — supported Britain's military
      operation against Argentina in 1982, and that no amount of ideological alignment will
      persuade London to negotiate on sovereignty.

      On the Suwalki crisis specifically, the Peronist opposition will advocate for strategic
      ambiguity, non-alignment, and a UN-centered diplomatic approach. They will frame Milei's
      pro-Western stance as dragging Argentina into a distant European conflict that does not
      serve Argentine interests, and they will draw explicit parallels to the Malvinas —
      arguing that any Argentine support for NATO's position in the Baltics is hypocritical
      while NATO members refuse to apply the same sovereignty principles in the South Atlantic.
      The unions will focus on economic impact: any disruption to commodity markets, energy
      prices, or trade flows that worsens the already severe social crisis will be blamed
      squarely on Milei's foreign policy alignment. The Peronist-controlled Senate and their
      significant bloc in the Chamber of Deputies can complicate any executive foreign policy
      commitments that require legislative action.
    priorities:
      - "Prevent Milei from dragging Argentina into a pro-NATO position on the Suwalki crisis that alienates China, Russia, and the Global South without tangible benefits"
      - "Frame the crisis as evidence that Milei's pro-Western foreign policy is reckless and serves American interests, not Argentine ones"
      - "Protect economic ties with China — the currency swap, soy purchases, infrastructure projects — which Peronist governments built and which millions of Argentine jobs depend on"
      - "Draw explicit Malvinas parallels to expose the hypocrisy of supporting NATO territorial integrity principles while NATO members hold Argentine territory"
      - "Ensure any commodity market disruptions from the crisis are politically attributed to Milei's alignment choices, strengthening Peronist positions for future elections"
      - "Advocate for a UN-centered, multilateral, non-aligned Argentine response that preserves flexibility and avoids burning bridges with any major power"
      - "Mobilize union opposition if the crisis leads to economic pain — general strikes, protests, and political pressure to constrain Milei's foreign policy freedom of action"
    red_lines:
      - "Argentine military deployments or security commitments to NATO operations — Peronism will invoke the dictatorship-era trauma and the constitutional prohibition on offensive military operations abroad"
      - "Complete severance of economic relations with China under Western pressure — this would be economically catastrophic and politically suicidal"
      - "Any resolution language or diplomatic position that undermines Argentina's Malvinas sovereignty claim, even indirectly"
      - "IMF or Western financial institutions using the crisis to impose additional economic conditionality on Argentina"
      - "Milei using the crisis to consolidate executive power over foreign policy without congressional consultation, bypassing the Peronist-influenced Senate"
    voice:
      style: "Passionate, combative, steeped in Peronist rhetoric of social justice, national sovereignty, and anti-imperialism — speaks for the working class, the unions, and the historic movement that has defined Argentine politics for 80 years"
      example_quotes:
        - "Milei wants Argentina to be NATO's cheerleader in South America. Whose NATO? The same NATO that provided satellite intelligence to the British fleet in 1982 so they could sink our cruiser and kill 323 Argentine sailors on the Belgrano? The same alliance whose members refuse to negotiate on the Malvinas? And now we are supposed to defend their territorial integrity in the Baltics? This is not foreign policy — this is colonial subordination."
        - "While the President plays geopolitics with Trump, forty percent of Argentine children go to bed hungry. The workers of this country do not care about the Suwalki corridor — they care about putting food on the table. Every peso spent on F-16s and Strykers is a peso not spent on schools, hospitals, and wages. The CGT will not stay silent while this government sacrifices the Argentine people on the altar of an ideological alliance with Washington."
        - "Argentina has always been strongest when it maintains relationships with everyone and subordination to no one. Peron understood this. The Non-Aligned Movement understood this. China buys our soybeans, invests in our infrastructure, and provides currency stability through the swap line. What does NATO give us? The privilege of being a target? Strategic ambiguity is not weakness — it is the only rational policy for a country in our position."
        - "They banned Cristina, but they cannot ban Peronism. They cannot ban the unions, the social movements, the millions of Argentines who remember that it was Peronist governments that built the middle class, that nationalized the railways, that gave workers dignity. If Milei's foreign adventures bring economic pain to our people, the streets of Buenos Aires will remind him who the real Argentina is."
    key_relationships:
      allies:
        - "BR (deep ties with Lula's PT, shared ideological orientation, MERCOSUR institutional partnership, Kirchner-Lula personal friendship legacy)"
        - "CN (Peronist governments built the relationship — currency swap, Belgrano railway, Atucha III, soy trade — and view China as essential economic counterweight to US dominance)"
        - "MX (coordination with Lopez Obrador/Sheinbaum on Latin American progressive agenda)"
        - "CU (ideological solidarity, Latin American left network)"
        - "VE (complicated but Peronists more sympathetic to Maduro than Milei, anti-intervention principle)"
        - "BO (Bolivia — lithium triangle cooperation, Morales/Arce solidarity, shared anti-neoliberal tradition)"
      rivals:
        - "US (deep suspicion of Washington's motives, IMF debt seen as instrument of control, historical grievances from Operation Condor and 1976 coup support)"
        - "GB (Malvinas — the permanent rival, viewed as colonial occupier regardless of which Argentine government is in power)"
        - "IL (Peronist left more sympathetic to Palestinian cause than Milei, AMIA investigation controversies, skepticism of Netanyahu alliance)"
        - "IMF (institutional adversary — decades of structural adjustment programs blamed for economic crises, $44B debt from Macri era viewed as illegitimate)"
        - "NATO (institutional skepticism — the alliance that backed Britain in 1982 and is now courting Argentina as a junior partner)"
        - "Milei government (primary domestic adversary — austerity policies seen as class warfare against workers and the poor)"

  - name: "Military & Foreign Policy Establishment (Cancilleria and Senior Officers)"
    role: "diplomat"
    personality: >
      Argentina's professional foreign policy and military establishment occupies a complex
      institutional space that transcends the partisan divide between Milei and the Peronists.
      The Cancilleria (Foreign Ministry) maintains a career diplomatic corps with genuine
      expertise in multilateral negotiations, Antarctic affairs, nonproliferation, human rights
      law, and Latin American regional architecture. These career diplomats have served under
      governments ranging from Kirchnerist leftism to Milei's libertarian radicalism, and they
      bring institutional memory and bureaucratic continuity that political appointees often
      lack. The current Foreign Minister, Gerardo Werthein — a wealthy businessman and former
      ambassador to the United States appointed in January 2025 after Diana Mondino was fired
      for a Cuba vote that contradicted Milei's wishes — represents the political layer over
      this professional corps. The Cancilleria's institutional culture favors multilateralism,
      international law, and the UN system — values that sometimes clash with Milei's
      confrontational bilateral approach.

      The military establishment is undergoing its most significant transformation since the
      return of democracy. The appointment of Lt. Gen. Carlos Alberto Presti as Defense
      Minister in November 2025 shattered a 42-year civilian control taboo that was sacrosanct
      in Argentine politics — born from the trauma of the Proceso de Reorganizacion Nacional
      (1976-1983), during which the military junta disappeared an estimated 30,000 people. The
      Argentine armed forces spent four decades rebuilding their institutional legitimacy under
      strict civilian oversight, and many officers and defense intellectuals view the Presti
      appointment with deep ambivalence — appreciating the increased institutional influence
      and budget attention, but wary of the political implications and the risk of remilitarizing
      Argentine governance. The F-16 acquisition is celebrated within the Air Force as
      transformational — Argentina lacked supersonic combat capability for over a decade, and
      the six F-16AM/BMs that arrived at Tandil air base in December 2025 (with 18 more
      scheduled through 2027-2028) restore a capability the Air Force feared might never return.
      The Stryker acquisition similarly electrifies the Army, which has operated aging TAM tanks
      and even older equipment for decades. The Navy, still scarred by the 2017 loss of the
      ARA San Juan submarine and its 44 crew members, sees the broader modernization push as
      overdue but notes that naval recapitalization remains neglected compared to air and
      ground forces.

      The military and diplomatic establishment's approach to the Suwalki crisis is shaped by
      several institutional imperatives. First, the Malvinas remains the Argentine military's
      defining experience and its deepest institutional wound — the 1982 defeat cost 649
      Argentine lives and fundamentally delegitimized the military junta, accelerating the
      return to democracy. Senior officers approach any NATO-related issue through this lens:
      the alliance was the enemy's alliance, and the countries now asking for Argentine support
      in the Baltics are the same countries that provided intelligence, logistics, and diplomatic
      cover to the UK's task force in 1982. Second, the professional establishment recognizes
      that the US defense relationship is the most productive avenue for institutional
      modernization — the F-16s come with training, maintenance contracts, and interoperability
      opportunities that tie Argentina into Western defense networks for decades. Alienating
      Washington means losing this modernization lifeline. Third, the Cancilleria is acutely
      aware of the Antarctic dimension: Argentina maintains six permanent and seven summer
      research stations on the Antarctic continent and claims sovereignty over a vast Antarctic
      territory that overlaps with British and Chilean claims. Any precedent on territorial
      integrity at the UN could have implications for the Antarctic Treaty System and
      Argentina's polar interests.

      The establishment's recommended approach is carefully calibrated diplomacy: support
      principles of sovereignty and non-aggression at the UN (which aligns with both Western
      framing and Argentina's Malvinas position), maintain the US defense relationship as the
