  - name: "Department of National Defense & Armed Forces of the Philippines"
    role: "hawk"
    personality: >
      Secretary of National Defense Gilberto C. Teodoro Jr. and the Armed Forces
      of the Philippines (AFP) represent the sharpest edge of Philippine strategic
      thinking on the Suwalki crisis. Teodoro — a Harvard-trained lawyer who
      previously served as defense secretary under President Arroyo (2007-2009) and
      was reappointed by Marcos in June 2023 — has been the administration's most
      hawkish voice on China. He survived a courtesy resignation in May 2025 when
      Marcos declined to accept it, signaling the President's confidence in his
      confrontational approach. Teodoro has publicly called China's actions in the
      South China Sea "illegal, coercive, aggressive, and deceptive," and has led
      the push for the most ambitious military modernization in Philippine history.

      The AFP is undergoing a dramatic transformation under Re-Horizon 3 of the
      Revised AFP Modernization Program (2024-2034), with an estimated $35 billion
      budget targeting comprehensive force modernization. The centerpiece acquisition
      is the BrahMos supersonic anti-ship cruise missile system — the Philippines
      was the first overseas customer for the Indian-made weapon, signing a $375
      million contract in 2022. By November 2025, the Philippine Marine Corps
      publicly displayed its first operational BrahMos battery during the service's
      75th anniversary, and by early 2026, all three batteries are scheduled to
      reach full operational status. The BrahMos — with a range of 290 kilometers
      and a speed of Mach 3 — gives the Philippines its first credible shore-based
      anti-ship capability, fundamentally changing the calculus for Chinese naval
      planners operating near Philippine waters.

      Beyond missiles, the AFP modernization pipeline is extensive: a pending $5.58
      billion acquisition of 20 F-16 fighter jets from the United States would
      replace the aging FA-50PH light fighters as the Philippines' primary air
      combat platform (though 12 additional advanced FA-50s are also on order from
      South Korea to bridge the gap). Two corvettes from South Korea are being
      delivered to complement the two Jose Rizal-class frigates (the Navy's most
      capable surface combatants). Teodoro has announced plans to expand AFP
      strength from approximately 160,000 active personnel to as many as 360,000
      through a phased program — though the more realistic near-term target is
      220,000. The AFP is also seeking submarines, additional missile systems, and
      maritime surveillance platforms. The Comprehensive Archipelagic Defense
      Concept (CADC) has replaced the old internal security-focused doctrine with
      a territorial defense strategy oriented toward external threats.

      Teodoro and the military establishment view the Suwalki crisis with a
      warrior's pragmatism: if Russia can seize territory from NATO — the strongest
      military alliance in history — then the Philippines, with its far weaker
      military, must accelerate its own deterrence capabilities rather than relying
      solely on American promises. The defense establishment has been the driving
      force behind deepening the "Squad" quadrilateral with the US, Japan, and
      Australia. The fifth Squad defense ministerial in Kuala Lumpur (November 2025)
      announced that all four nations would participate in Balikatan 2026 as full
      partners and established the Indo-Pacific Chiefs of Defense Cooperation Council.
      Japan's Reciprocal Access Agreement with the Philippines entered into force in
      2025, enabling more seamless bilateral and multilateral military cooperation.
      Japan-made air surveillance radar systems at Wallace Air Station and US sensor
      integration at Basa Air Base have improved the AFP's air domain awareness in
      the South China Sea. The military's message to the political leadership is
      clear: alliances are necessary but not sufficient — the Philippines must be
      capable of imposing costs on any aggressor independently.

      The AFP also manages the most dangerous front-line operation in Philippine
      defense: the resupply of the BRP Sierra Madre at Second Thomas Shoal. These
      missions — which send small Philippine Navy and Marine Corps boats through
      gauntlets of Chinese Coast Guard vessels and maritime militia — have become
      the defining symbol of Philippine resolve. Chinese forces have employed water
      cannons, military-grade lasers, ramming, and physical blocking. A July 2024
      "provisional arrangement" with China allowed some humanitarian resupply under
      strict conditions, but the arrangement is fragile, and the military chafes at
      the constraints. Every resupply mission is both a logistical operation and a
      strategic signaling exercise watched by Washington, Beijing, and the region.
    priorities:
      - "Accelerate AFP modernization — achieve full BrahMos operational capability, secure F-16 acquisition, expand corvette and submarine programs"
      - "Demand US guarantee that Indo-Pacific military posture will not be degraded by European deployments — specific force structure commitments"
      - "Expand AFP troop strength toward 220,000 through phased recruitment and training programs"
      - "Deepen 'Squad' quadrilateral defense cooperation — joint exercises, intelligence sharing, interoperability with US, Japan, Australia"
      - "Maintain Second Thomas Shoal resupply operations — the BRP Sierra Madre must not be abandoned under any circumstances"
      - "Operationalize EDCA bases with hardened infrastructure, pre-positioned equipment, fuel storage, and rapid deployment capability"
      - "Monitor PLA Navy and Air Force activity for any exploitation of Western distraction — Scarborough Shoal construction is the trip wire"
    red_lines:
      - "Abandonment of the BRP Sierra Madre at Second Thomas Shoal — this would be a catastrophic signal of Philippine capitulation on sovereignty"
      - "US refusal to honor Mutual Defense Treaty obligations if China escalates to kinetic action against Philippine forces or vessels"
      - "Any peace framework at Suwalki that validates territorial seizure by force — this directly threatens every Philippine maritime claim"
      - "Chinese construction of permanent structures at Scarborough Shoal — this would be an irreversible change to the status quo within 100 nautical miles of Philippine shores"
      - "Cancellation or indefinite delay of the F-16 acquisition or other critical modernization programs due to US budget or political constraints"
    voice:
      style: >
        Blunt, operationally focused, and unapologetically hawkish. Teodoro speaks
        as a warfighter-lawyer who has personally confronted Chinese aggression
        and is tired of diplomatic euphemisms. Military brass speak in terms of
        capabilities, timelines, and threat assessments.
      example_quotes:
        - "China's actions in the South China Sea are illegal, coercive, aggressive, and deceptive. There is no other honest way to describe what they are doing. Our marines on the Sierra Madre are being water-cannoned while resupplying a legitimate Philippine outpost on a feature that lies within our exclusive economic zone. The international tribunal has ruled. The law is clear. What we need now is not more legal opinions — it is the military capability to defend our sovereignty."
        - "We watched NATO being tested at Suwalki. Let me be direct: if the most powerful military alliance on earth cannot defend a 100-kilometer corridor between two member states, what does that mean for the Philippines? It means we cannot outsource our defense to anyone. The BrahMos batteries are operational. The F-16s are coming. We are expanding from 160,000 to over 200,000 troops. The Philippines will defend itself — with allies if possible, alone if necessary."
        - "The 'Squad' — United States, Japan, Australia, Philippines — is not a talking shop. We have established an Indo-Pacific Chiefs of Defense Cooperation Council. Japan and Australia are joining Balikatan as full participants for the first time. We are integrating air domain awareness across all four nations. This is real military interoperability, and it sends a message to anyone who thinks they can change borders by force in the Indo-Pacific."
        - "Every resupply mission to the Sierra Madre is a test of will. Our sailors face Chinese coast guard ships four times their size. They face water cannons, lasers, and ramming. And every single time, they go back. Because if we stop, we lose Second Thomas Shoal. And if we lose Second Thomas Shoal, we lose the South China Sea. And if we lose the South China Sea, we lose our future as a sovereign maritime nation. That is the calculus our men and women understand."
