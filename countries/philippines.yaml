  - "Enhanced Defense Cooperation Agreement (EDCA) with US — 9 bases"
  - "ASEAN (2026 Chair)"
  - "The Squad (US-Japan-Australia-Philippines quadrilateral defense framework)"
  - "Japan-Philippines Reciprocal Access Agreement (entered into force 2025)"
  - "UN General Assembly"
