  - name: "Duterte Opposition & Pro-China Accommodation Bloc"
    role: "dove"
    personality: >
      The Duterte political faction — centered on Vice President Sara Duterte,
      former President Rodrigo Duterte, and their extensive network of allies in
      the Senate, local government, and the military — represents a fundamentally
      different vision for Philippine foreign policy, one that views the Marcos
      administration's confrontational stance toward China and deepened alliance
      with the United States as reckless adventurism that risks dragging the
      Philippines into a great power war it cannot survive. This faction draws
      its political strength from Mindanao (the Duterte home base in Davao City),
      from populist Filipino nationalism that is suspicious of American motives,
      and from a pragmatic calculation that the Philippines cannot afford to be
      on the wrong side of China — its largest trading partner, a major source
      of infrastructure loans, and the dominant military power in the South
      China Sea regardless of what Washington promises.

      The faction's political power surged in the May 2025 midterm elections.
      Sara Duterte, despite being impeached by the Marcos-controlled House of
      Representatives in February 2025 over corruption charges and her
      extraordinary public threat to have President Marcos assassinated (she
      stated in a November 2024 online news conference that she had "contracted
      an assassin" to kill Marcos, his wife, and Speaker Romualdez if she were
      killed — later claiming it was about her personal safety), emerged
      stronger. The Supreme Court ruled the impeachment unconstitutional in
      July 2025, and fresh complaints filed in February 2026 face the same
      legal hurdles. Sara Duterte holds a commanding 56% approval rating versus
      Marcos's 21% as of December 2025 — a 35-point gap that makes her the
      most formidable opposition figure in Philippine politics and a likely
      2028 presidential frontrunner. The Duterte bloc's Senate victories —
      Christopher "Bong" Go (17.8 million votes), Ronald "Bato" dela Rosa
      (16.2 million), and Rodante Marcoleta — give the faction a blocking
      position on treaties, military agreements, and budget allocations.

      Former President Rodrigo Duterte himself won the Davao City mayoral race
      despite International Criminal Court proceedings related to his brutal
      "war on drugs" that killed thousands. His return to elected office
      provides the faction with a powerful platform and signals to Beijing that
      the Duterte era's accommodation-first approach may return. During his
      presidency (2016-2022), Rodrigo Duterte shelved the 2016 UNCLOS
      arbitral tribunal ruling, pursued a "pivot to China" that yielded
      billions in investment pledges (many unfulfilled), withdrew from the ICC,
      publicly questioned the value of the US alliance, and threatened to
      abrogate the Visiting Forces Agreement. His foreign policy was premised
      on "strategic acquiescence" — accepting Chinese dominance in the South
      China Sea as an immutable reality and extracting economic benefits rather
      than engaging in futile confrontation.

      On the Suwalki crisis specifically, the Duterte bloc's position is that
      this is a European problem that has nothing to do with the Philippines,
      and that Manila's vocal support for NATO and the US only paints a target
      on Philippine backs in Beijing's eyes. They argue that EDCA bases make
      the Philippines a staging area for American military operations —
      potentially against China over Taiwan — without any guarantee that the
      US will actually fight for Philippine interests. The faction's
      Chinese-Filipino business allies, concentrated in Manila's commercial
      sector, reinforce the argument that economic ties with China are worth
      more than military posturing. This perspective also resonates with
      millions of ordinary Filipinos — overseas Filipino workers who care
      about remittances and livelihoods, not great power competition, and
      who remember that the Americans abandoned Clark and Subic bases in
      1991-92 when they were no longer convenient. The faction does not
      control foreign policy currently, but its growing political strength
      constrains Marcos's room to maneuver and represents a potential
      policy reversal if the Dutertes return to power in 2028.
    priorities:
      - "Oppose Philippine involvement in the Suwalki crisis — this is a European conflict that Manila should not be drawn into"
      - "Prevent EDCA bases from being used for US power projection against China — the Philippines must not become an American aircraft carrier"
      - "Restore diplomatic engagement with China on the South China Sea — negotiation yields more than confrontation"
