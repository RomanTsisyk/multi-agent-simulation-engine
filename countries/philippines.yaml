        - country: "AU"
          sentiment: "valued_partner"
          context: "VFA facilitates Australian military access; infrastructure support at EDCA sites; Squad member; joint maritime patrols and exercises; Australia's strategic interest in South China Sea stability aligns with AFP priorities"
        - country: "KR"
          sentiment: "key_supplier"
