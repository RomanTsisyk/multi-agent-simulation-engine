      example_quotes:
        - "What is Suwalki to the Filipino people? Nothing. Our fishermen cannot feed their families because of rising prices, not because of what happens in Lithuania. But our President wants to lecture Europe about sovereignty while his own people go hungry. The Americans are using us — nine bases on our soil, and for what? So they can threaten China from our backyard and we pay the price when Beijing retaliates."
