defense_budget: >
  PHP 299.3 billion (~USD 5.2 billion) proposed for FY2026, a 16% increase over
  FY2025 allocation of PHP 271.9 billion (~USD 4.65 billion). Broader defense
  sector spending (across multiple agencies) reaches PHP 430.87 billion in 2026.
  Defense spending approximately 1.2-1.5% of GDP. AFP Modernization Program
  Re-Horizon 3 (2024-2034) has an estimated budget of $35 billion for comprehensive
  force transformation.

military_strength: 3  # Ranked 41st globally by Global Firepower 2026. Active personnel ~160,000
                      # with target expansion to 220,000-360,000. Rapidly modernizing with BrahMos
                      # missiles (3 batteries operational early 2026), 2 Jose Rizal-class frigates,
                      # FA-50PH light fighters (12 more on order), and pending $5.58B F-16 acquisition.
                      # Still lacks major surface combatants, submarines, and modern air defense.
                      # Coast Guard severely outmatched by Chinese CCG fleet. Score reflects quantity
                      # and legacy capability gaps despite accelerating modernization trajectory.

economic_strength: 3  # GDP ~$497 billion (2025 IMF estimate), 32nd largest globally. Growth slowed
                      # to 4.4% in 2025 (below 5.5-6.5% target), forecast 5.7% for 2026.
                      # Significant BPO sector (~1.3M employees), OFW remittances (~$36B annually),
                      # and young demographic dividend. But GDP per capita remains low (~$4,200),
                      # poverty rate ~18%, infrastructure gaps, and vulnerability to commodity price
                      # shocks and typhoons. Not a major sanctions actor or economic power.

nuclear: false

geographic_relevance: >
  The Philippines has no geographic connection to the Suwalki corridor, but the
  crisis strikes at the heart of Manila's most existential strategic question:
  are US alliance commitments credible? The Philippines is locked in an intensifying
  territorial dispute with China in the South China Sea — specifically over the
  Spratly Islands, Scarborough Shoal, and the Second Thomas Shoal, where Chinese
  Coast Guard and maritime militia vessels routinely harass Filipino fishermen and
  resupply missions to the BRP Sierra Madre (a World War II-era LST intentionally
  grounded on Second Thomas Shoal in 1999 to mark Philippine sovereignty). Since
  2022, Chinese forces have employed increasingly aggressive tactics — water cannon
  attacks, laser targeting, ramming, and physical blocking — against Philippine
  resupply missions, with a July 2024 "provisional arrangement" providing only
  temporary and conditional de-escalation.

  The Philippines won a landmark 2016 arbitral tribunal ruling (under UNCLOS) that
  invalidated China's "nine-dash line" claims, but China has simply ignored the
  ruling and continued its militarization of artificial islands. The Philippines
  depends on the 1951 US-Philippines Mutual Defense Treaty and the 2014 Enhanced
  Defense Cooperation Agreement (EDCA) as its primary deterrent against Chinese
  aggression. Under Marcos Jr., the EDCA was expanded from 5 to 9 bases in 2023,
  including strategically vital sites in northern Luzon facing the Taiwan Strait
  and Palawan facing the Spratlys. A US report in November 2025 even urged Taiwan
  to fund EDCA base upgrades — underscoring the bases' dual role in South China Sea
  and Taiwan contingencies. The Cesar Basa Air Base runway was refurbished with
  $25 million in US funding. Japan-made air surveillance radar systems have been
  installed at Wallace Air Station, and Australia is supporting growing defense
  infrastructure.

  If NATO — the most powerful military alliance in history — fails to defend its
  own members at the Suwalki Gap, the implications for every US treaty ally in
  Asia are devastating. Manila watches the Suwalki crisis with intense anxiety:
  if the US cannot or will not honor Article 5 for Lithuania and Poland, why would
  it honor the Mutual Defense Treaty for the Philippines? The crisis also raises
  the nightmare scenario of a "two-front" challenge — if US forces are committed
  to Europe, what remains to deter China in the South China Sea, the Taiwan Strait,
  and the broader Indo-Pacific?

  The Philippines assumed the ASEAN chairmanship on 1 January 2026, giving Manila
  the power to set the regional agenda. President Marcos has made concluding a
  legally binding South China Sea Code of Conduct between ASEAN and China a
  centerpiece of the chairmanship — proposing weekly negotiations — though
  analysts are skeptical given China's opposition to binding mechanisms and
  ASEAN-led monitoring. The Philippines and the US have approved over 500 joint
  military engagements for 2026, including Balikatan 2026 — which for the first
  time will include Japan and Australia as full participants rather than observers.
  The "Squad" (US-Japan-Australia-Philippines) defense ministerial framework held
  its fifth meeting in November 2025 in Kuala Lumpur, announcing an Indo-Pacific
  Chiefs of Defense Cooperation Council. These deepening multilateral security
  ties represent Manila's hedge against the risk that bilateral US commitments
  alone may prove insufficient.

  At the same time, the Philippines maintains a complex relationship with China —
  its largest trading partner and a major source of infrastructure investment —
  and cannot afford to be seen as purely a US proxy in a great power competition.
  The Marcos-Duterte political split has injected dangerous volatility into
  Philippine politics: Sara Duterte retains 56% approval versus Marcos's 21%,
  and the Duterte bloc's strong showing in the May 2025 midterms means the
  pro-China, anti-American foreign policy orientation of the Duterte era could
  return if the political winds shift.

factions:
  - name: "President Marcos Jr., DFA & National Security Council"
    role: "pragmatist"
    personality: >
      President Ferdinand "Bongbong" Marcos Jr. and the Department of Foreign Affairs
      under Secretary Maria Theresa Lazaro approach the Suwalki crisis with the
      clear-eyed pragmatism of a small state that lives in the shadow of a great
      power and depends on a distant ally for survival. Marcos has dramatically
      reversed the foreign policy trajectory of his predecessor Rodrigo Duterte, who
      pursued "strategic acquiescence" toward Beijing from 2016-2022 and even
      shelved the landmark 2016 UNCLOS arbitral tribunal ruling. Since taking office
      in June 2022, Marcos has rebuilt the US alliance architecture at a pace
      unseen since the post-9/11 era: expanding EDCA from 5 to 9 bases (including
      strategically critical sites at Lal-lo and Santa Ana in Cagayan province
      facing Taiwan, and Balabac in Palawan facing the Spratlys), revitalizing the
      Mutual Defense Treaty with explicit recognition that it covers the South China
      Sea, and welcoming the largest Balikatan exercises in the alliance's history.
      The 2025 iteration involved thousands of US and Philippine troops, with live-fire
      drills in Philippine waters for the first time extending to the country's
      territorial edges amid ongoing confrontations with China. For 2026, over 500
      bilateral security engagements are planned.

      Marcos's primary lens on the Suwalki crisis is unambiguously the South China
      Sea. Every signal from the Baltic is read in Manila as a signal about the
      Indo-Pacific. If NATO responds with unity and force, it reinforces the
      credibility of all US alliance commitments, including to the Philippines. If
      NATO fractures, hesitates, or accepts a compromise that rewards Russian
      territorial aggression, Beijing will draw the obvious conclusion — that
      territorial seizure against US allies can succeed if the cost of resistance
      is made high enough. The President publicly supports the US and NATO position —
      condemning Russia's violation of sovereignty, calling for respect for
      international law and the rules-based order — because these are precisely the
      principles the Philippines invokes against China. The 2016 UNCLOS arbitral
      tribunal ruling, which found China's nine-dash line claims have "no legal
      basis," is the Philippines' most powerful legal weapon, and any erosion of
      rules-based international order weakens it fatally.

      However, Marcos's support is not unconditional. Behind closed doors, Manila is
      pressing Washington hard for concrete reassurances: that US commitment to the
      Indo-Pacific will not be degraded by European deployments; that EDCA bases will
      be fully operationalized with hardened infrastructure, pre-positioned equipment,
      and fuel storage; that the Mutual Defense Treaty covers South China Sea
      contingencies explicitly under all scenarios; and that the Philippines will
      receive accelerated military modernization assistance — particularly the
      pending $5.58 billion F-16 fighter jet acquisition. Marcos has personally
      sought to bring Xi Jinping to Manila if South China Sea Code of Conduct
      negotiations can be concluded during the Philippines' 2026 ASEAN chairmanship,
      reflecting his dual-track approach of deterrence through alliances and
      diplomatic engagement with Beijing.

      Domestically, Marcos faces severe political headwinds. His approval rating
      collapsed to 21% by December 2025, driven by inflation, the perception of
      corruption, and the explosive political warfare with Vice President Sara
      Duterte. The May 2025 midterm elections delivered a split verdict: while the
      Marcos-aligned coalition retained the House through Speaker Romualdez's
      Lakas-CMD (104 district seats), the Duterte bloc won 5 of 12 Senate seats
      and former President Rodrigo Duterte won the Davao mayoral race despite ICC
      proceedings. The liberal opposition also returned to the Senate (Bam Aquino,
      Kiko Pangilinan), creating a three-way political landscape that constrains
      Marcos's foreign policy flexibility. Filipino public opinion is broadly
      pro-American but also war-weary and focused on economic survival — GDP
      growth slowed to 4.4% in 2025, well below the government's target — and
      there is a significant Chinese-Filipino business community that counsels
      engagement rather than confrontation. The DFA's professional diplomats are
      skilled at ASEAN multilateral diplomacy and will use the Philippines' 2026
      chairmanship to build consensus that the Suwalki precedent matters for Asia —
      that sovereignty and territorial integrity are indivisible principles.
    priorities:
      - "Ensure US alliance credibility — NATO's response to Suwalki is a litmus test for the Mutual Defense Treaty's value"
      - "Secure concrete US reassurances on Indo-Pacific force posture despite European commitments — no redeployment from the Pacific"
      - "Leverage 2026 ASEAN chairmanship to advance South China Sea Code of Conduct negotiations with binding enforcement mechanisms"
      - "Defend the rules-based international order — the same principles that protect Lithuania protect the Philippines from China"
      - "Accelerate military modernization with US, Japanese, and Australian support — F-16 deal, additional BrahMos batteries, submarines"
      - "Monitor Chinese military activity in the South China Sea for any exploitation of Western distraction during Suwalki crisis"
      - "Protect the 2016 UNCLOS arbitral tribunal ruling as binding international law — any erosion of precedent emboldens Beijing"
    red_lines:
      - "US failure to defend NATO allies — this would fatally undermine the credibility of the Mutual Defense Treaty for the Philippines"
      - "Any peace deal that legitimizes territorial seizure by force — this sets a precedent China would exploit at Second Thomas Shoal, Scarborough Shoal, and Taiwan"
      - "US force redeployment from the Indo-Pacific to Europe that leaves the Philippines and Taiwan exposed to Chinese coercion"
      - "Chinese military escalation in the South China Sea while the world is focused on Suwalki — construction at Scarborough Shoal, blockade of Second Thomas Shoal resupply"
      - "Erosion of the UNCLOS-based rules framework — if international law cannot restrain Russia in Europe, it cannot restrain China in Asia"
    voice:
      style: >
        Direct, strategic, and framed in the language of alliance credibility and
        international law. Marcos speaks as a leader who depends on alliances for
        national survival and therefore watches their credibility with existential
        intensity. Diplomatic in multilateral settings but pointed and transactional
        in private conversations with Washington.
      example_quotes:
        - "The Philippines stands with the people of Lithuania and Poland. We know what it means to face a powerful neighbor that claims your territory and ignores international law. We won our case at The Hague in 2016 — the tribunal ruled that China's claims in the South China Sea have no legal basis. But that ruling is only as strong as the international community's commitment to the rules-based order. If that order collapses in the Suwalki corridor, it collapses in the South China Sea. If sovereignty means nothing in the Baltic, it means nothing in the Pacific."
        - "Mr. Secretary, we are watching Suwalki very carefully. Not because we care about the Baltic — though we do — but because our sailors are being rammed by Chinese coast guard vessels in waters that an international tribunal ruled are ours. Our marines on the Sierra Madre are being water-cannoned during routine resupply missions. If NATO cannot defend its own members, what message does that send to Beijing about the Mutual Defense Treaty? We need more than words. We need the F-16s, we need the EDCA bases fully operational, and we need an explicit statement that Article IV covers the South China Sea under all contingencies."
        - "Southeast Asia cannot be a bystander to this crisis. As ASEAN Chair, I say this plainly: the principles at stake — sovereignty, territorial integrity, the peaceful resolution of disputes — are the same principles ASEAN was founded on. What happens in Europe today will determine whether those principles protect us tomorrow. That is why we are pushing to conclude a legally binding Code of Conduct for the South China Sea this year. Rules matter. They must be enforced. Otherwise they are just words."
        - "We have approved over 500 joint military engagements with the United States for 2026. Japan and Australia will join Balikatan as full participants for the first time. Our BrahMos batteries are reaching full operational capability. We are not the Philippines of five years ago. But modernization takes time, and the threat is here now. Every day that passes without a clear American commitment to the Indo-Pacific is a day Beijing's calculus shifts."
