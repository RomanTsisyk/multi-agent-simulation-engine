name: "Philippines"
code: "PH"
government: >
  President Ferdinand "Bongbong" Marcos Jr. (Partido Federal ng Pilipinas), inaugurated
  June 2022. Vice President Sara Duterte (Lakas-CMD) — impeached by House of Representatives
  in February 2025 (215 votes) over corruption and assassination threat charges, but
  Supreme Court ruled the impeachment unconstitutional in July 2025; fresh impeachment
  complaints filed February 2026. Secretary of National Defense Gilberto C. Teodoro Jr.
  (retained after courtesy resignation was declined May 2025). Foreign Secretary Maria
  Theresa Lazaro. Speaker of the House Martin Romualdez (Marcos cousin, Lakas-CMD).
  After May 2025 midterms, Marcos coalition holds House majority (Lakas-CMD won 104
  district seats) but Senate is split — Duterte bloc won 5 of 12 contested seats
  (Bong Go, Bato dela Rosa, Marcoleta among victors), liberal opposition returned
  (Bam Aquino, Kiko Pangilinan). Marcos approval rating collapsed to 21% by December
  2025; Sara Duterte holds 56% approval, creating a volatile power dynamic heading
  into 2028 presidential race. Former President Rodrigo Duterte won Davao City
  mayoral race despite ICC detention proceedings. Philippines assumed ASEAN
  chairmanship on 1 January 2026.

alliances:
