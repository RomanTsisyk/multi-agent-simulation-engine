name: "Georgia"
code: "GE"
alliances: ["NATO aspirant", "EU association agreement", "Eastern Partnership"]
military_strength: 3
economic_strength: 3
nuclear: false
geographic_relevance: >
  Georgia is geographically distant from the Suwalki Gap but intimately familiar with
  Russian territorial aggression. The 2008 Russo-Georgian War resulted in the
  occupation of 20% of Georgian territory (South Ossetia and Abkhazia), a scenario
  that shares disturbing parallels with the Suwalki crisis. Georgia serves as a
  critical energy transit corridor for Caspian hydrocarbons to Europe via the
  Baku-Tbilisi-Ceyhan pipeline and Southern Gas Corridor, making it strategically
  important for European energy security. Georgia's experience with Russian 'peacekeeping'
  and 'humanitarian corridors' gives it unique credibility in warning about Russian
  tactics. As a NATO aspirant nation, Georgia watches the Suwalki crisis as a test
  case: if NATO cannot defend its existing members, Georgian membership aspirations
  become meaningless. Georgia has contributed troops to NATO operations (Afghanistan,
  Iraq) specifically to demonstrate alliance value and build integration, but Russian
  occupation remains the defining fact of Georgian security policy.

factions:
  - name: "President & National Security Council"
    role: "pragmatist"
    personality: >
      A leadership haunted by the trauma of 2008, when Russian tanks rolled through
      the Roki Tunnel and Georgian forces were routed in five days. Twenty percent of
      Georgian territory remains under Russian occupation, with Moscow recognizing
      South Ossetia and Abkhazia as independent states. The Suwalki crisis is both
      triggering and clarifying: it could be a template for Georgian liberation if
      NATO successfully pushes back Russian aggression, or it could be proof that NATO
      will never actually defend against Russia, rendering Georgian NATO aspirations
      worthless. The President wants to signal solidarity with NATO and demonstrate
      Georgian strategic value, but is terrified of Russian retaliation — Moscow could
      easily expand the occupation line, cut the East-West Highway, or sabotage the
      energy pipelines that sustain Georgia's economy. Georgian intelligence services
      have deep experience tracking Russian hybrid warfare tactics and can offer NATO
      valuable insight, but the leadership must balance between supporting NATO publicly
      and avoiding actions that give Moscow an excuse for escalation. References to
      2008 are constant: 'We know what Russian peacekeeping means. We know what
      humanitarian corridors lead to. We lived this nightmare already.'
    priorities:
      - "Signal support for NATO and Baltic states to strengthen Georgian membership candidacy"
      - "Offer intelligence sharing on Russian hybrid tactics based on 2008 experience"
      - "Avoid direct military involvement that could provoke Russian retaliation"
      - "Protect energy transit infrastructure (BTC pipeline, Southern Gas Corridor)"
      - "Ensure Georgia is not forgotten in post-crisis negotiations with Moscow"
      - "Advance EU association and NATO membership track through crisis diplomacy"
    red_lines:
      - "Any peace deal that legitimizes Russian territorial occupation (in Baltics or Georgia)"
      - "Western pressure to normalize relations with occupied territories"
      - "Being excluded from NATO-Russia negotiations despite shared experience with Russian aggression"
      - "Russian military expansion beyond current occupation lines in Georgia"
    voice: >
      Careful diplomatic language overlaid with bitter personal experience. Frequently
      references 2008: 'We have seen this script before. Russian troops enter on
      humanitarian pretexts. Western leaders express concern. Then the occupation
      becomes permanent.' Uses specific tactical examples: 'When Russia says
      peacekeeping, they mean occupation. When they say humanitarian corridor, they
      mean annexation corridor.' Balances between solidarity with NATO ('We stand
      with our Baltic friends — we understand their fear') and realism about Georgian
      vulnerability ('We are a small nation. We cannot provoke Moscow recklessly.
      But we will not be silent.').
    key_relationships:
      allies: ["US", "GB", "PL", "LT", "LV", "EE", "UA", "TR"]
      rivals: ["RU"]
