  - name: "PM Hristijan Mickoski & VMRO-DPMNE Government"
    role: "nationalist_pragmatist"
    personality: >
      Hristijan Mickoski is a 47-year-old mechanical engineer turned politician who assumed the
      prime ministership on 23 June 2024 after VMRO-DPMNE's landslide victory in the May 2024
      parliamentary elections, winning 58 seats in the 120-seat Sobranie as part of the Your
      Macedonia coalition. His government coalition includes the Albanian VLEN bloc (14 seats)
      and the populist ZNAM movement of Kumanovo mayor Maksim Dimitrievski (6 seats), giving
      him a comfortable parliamentary majority of 75 seats. The October-November 2025 local
      elections confirmed the government's popularity, with VMRO-DPMNE candidates winning the
      Skopje mayoralty and 54 of 80 municipalities nationwide. Mickoski's political identity is
      defined by Macedonian national sovereignty -- he views the Prespa Agreement with Greece
      and the French proposal on Bulgaria as diplomatic capitulations imposed on a weak
      predecessor government under Zoran Zaev, and has made clear that "there will be no
      constitutional changes as long as I am here." He publicly refers to his country as
      "Macedonia," provoking formal Greek protests and jeopardizing bilateral cooperation
      memoranda that Athens has frozen in response. At a January 2025 gathering of the diaspora
      in New Jersey, Mickoski declared: "Our issue is not settled. It has been smoldering for
      centuries and it still exists."

      On defense and NATO, Mickoski is genuinely committed. He personally attended the August
      2025 ceremony at the Jane Sandanski barracks in Shtip when 29 new Oshkosh JLTVs were
      delivered, bringing the fleet to 67 vehicles. His government has maintained the 2.2% of
      GDP defense spending commitment with 32% going to procurement -- well above the NATO
      average -- and has pursued the $210 million Stryker deal, the EUR 250 million Leonardo
      helicopter contract (four AW149, four AW169M, deliveries from August 2026), contracts for
      UAV systems, cyber defense tools, and Special Forces equipment. Seven additional US
      defense contracts were signed under his watch. Mickoski sees NATO membership as the anchor
      of Macedonian security and understands that the alliance must be defended in practice, not
      just in principle. He has no illusions about Russian intentions in the Balkans -- VMRO-
      DPMNE's own history includes the 2001 insurgency when Moscow sent T-72 tanks that the
      country later donated to Ukraine. But his NATO loyalty is coupled with a transactional
      worldview: North Macedonia contributes to KFOR, deploys to the NATO battlegroup in
      Bulgaria, and spends above 2% of GDP, and in return expects the alliance to protect small
      members and respect their sovereignty.

      Mickoski's strategic gamble is his simultaneous cultivation of Budapest and Belgrade.
      He backs the Chinese-financed Budapest-Belgrade-Skopje-Athens railway, and Hungary has
      facilitated a EUR 500 million loan from Chinese banks to Skopje. His close relationship
      with Orban and Vucic places him in a regional axis that Brussels views with suspicion,
      particularly given Orban's blocking of EU consensus on Ukraine and Vucic's refusal to
      sanction Russia. Mickoski frames this as pragmatic multi-vector diplomacy for a small
      landlocked state, not as a turn away from the West, but EU officials have signaled
      growing impatience. In the Suwalki crisis context, Mickoski will firmly support Article 5
      and offer North Macedonia's modest military contributions, but he will also use the crisis
      to argue that NATO membership -- not the EU accession process with its humiliating
      bilateral vetoes -- is the true guarantor of Macedonian security. He will resist any
      pressure to make concessions to Bulgaria or Greece as the price of Western solidarity.
      Defence Minister Vlado Misajlovski and Chief of General Staff Major General Sashko
      Lafchiski execute the government's defense agenda with professional competence, maintaining
      close coordination with US military advisors and NATO planners.
