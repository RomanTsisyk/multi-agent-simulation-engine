geographic_relevance: >
  North Macedonia is a landlocked Balkan state of 1.8 million people bordered by Greece to the
  south, Bulgaria to the east, Serbia and Kosovo to the north, and Albania to the west. It
  joined NATO on 27 March 2020 as the 30th member state, following the landmark 2018 Prespa
  Agreement with Greece that resolved a 27-year name dispute by changing the country's
  constitutional name from the Republic of Macedonia to the Republic of North Macedonia. This
  diplomatic achievement was a defining example of rules-based conflict resolution and opened
  the door to both NATO membership and EU candidacy. North Macedonia's geographic distance from
  the Suwalki corridor -- approximately 1,500 km to the south -- means it has no direct
  military role in the crisis, but its political and symbolic significance is substantial.

  North Macedonia represents the success story of NATO's open-door policy: a small multi-ethnic
  state that made extraordinary compromises -- changing its own name, its constitution, and its
  national identity documents -- to join the Western security architecture. If NATO fails to
  defend the Suwalki corridor, the entire logic of that sacrifice is called into question. The
  Prespa Agreement's credibility, the attractiveness of Euro-Atlantic integration for other
  Western Balkan aspirants, and the principle that small nations can secure themselves through
  institutions rather than power politics all depend on NATO being seen to work.

  The Army of North Macedonia is one of NATO's smallest, with approximately 8,000 active
  personnel organized around the 1st Mechanised Infantry Brigade, a Ranger Battalion, a Special
  Operations Regiment, and an Air Force Brigade operating transport and utility helicopters (the
  country has no fixed-wing combat aircraft, having donated its four Su-25 attack jets and all
  31 T-72A tanks to Ukraine in 2022-2023). The army is undergoing a significant modernization
  program: 67 Oshkosh JLTV vehicles have been delivered (38 in 2022-2023, 29 more in August
  2025), with 54 Stryker armored fighting vehicles on order from the United States under a
  $210 million FMS deal. Eight Leonardo helicopters -- four AW149 medium-twin and four AW169M
  light-twin -- are under a EUR 250 million contract, the largest defense purchase in North
  Macedonia's history, with deliveries beginning August 2026 through end of 2028. Additional US
  contracts cover Special Forces equipment, UAV systems, cyber defense tools, light infantry
  weapons, and Joint Fire Control Kits. The army also fields legacy platforms including BMP-2
  IFVs, BTR-70 and BTR-80 APCs, M-113 carriers, and Turkish BORAN 105mm towed howitzers
  delivered in 2025. North Macedonia contributes troops to NATO's KFOR mission in Kosovo and
  to the NATO Enhanced Forward Presence battlegroup in Bulgaria under Italian framework command.

  The defense budget for 2025 stands at approximately $388 million, representing roughly 2.2%
  of GDP -- surpassing many older NATO members -- with 32% allocated to new equipment
  procurement, a dramatic increase from historical spending levels. GDP is approximately $17
  billion (nominal, 2025), making North Macedonia one of the smallest economies in NATO. The
  economy faces chronic challenges: 11.7% unemployment (Q1 2025), significant emigration of
  young professionals, dependence on remittances and foreign direct investment, and limited
  industrial capacity. The country is governed by a VMRO-DPMNE-led coalition under PM Hristijan
  Mickoski (since June 2024) with the Albanian VLEN coalition and the populist ZNAM party,
  controlling 75 of 120 Assembly seats. President Gordana Siljanovska-Davkova (VMRO-DPMNE-
  backed, inaugurated May 2024) is the country's first female president and a constitutional
  law professor. Both the president and prime minister are from the nationalist-conservative
  camp, creating policy alignment but also tensions with Western partners over identity issues.

  The critical diplomatic complication is that the VMRO-DPMNE government has adopted a combative
  posture toward the Prespa Agreement. Both Siljanovska-Davkova and Mickoski have publicly
  referred to the country simply as "Macedonia," provoking Greek protests and jeopardizing
  bilateral relations. Mickoski has categorically refused to amend the constitution to
  recognize the Bulgarian minority -- a precondition set by Bulgaria for unblocking EU accession
  negotiations. As of mid-2026, North Macedonia's EU path is effectively frozen, with no clear
  resolution in sight. Simultaneously, Mickoski has cultivated close relationships with
  Hungary's Viktor Orban and Serbia's Aleksandar Vucic, backing the Chinese-financed Budapest-
  Belgrade-Skopje-Athens railway corridor -- a BRI project that competes with the EU-backed
  Corridor VIII. Hungary has facilitated a EUR 500 million loan to North Macedonia from Chinese
  banks, deepening Beijing's economic footprint. These geopolitical choices have raised concerns
  in Brussels about North Macedonia's strategic orientation under VMRO-DPMNE governance. North
  Macedonia borders Serbia, which maintains close ties with Russia and has refused to join
  Western sanctions, making the country vulnerable to Russian hybrid influence operations aimed
  at destabilizing the Western Balkans as retaliation for NATO solidarity in the Suwalki crisis.

