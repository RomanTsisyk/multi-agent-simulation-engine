name: "Iran"
code: "IR"
alliances: ["SCO", "Russia strategic partnership", "Axis of Resistance", "BRICS (new member)"]
military_strength: 6
economic_strength: 4
nuclear: false
geographic_relevance: >
  Iran is a pivotal actor in the Suwalki crisis despite being thousands of kilometers from
  the Baltic. Iran's strategic significance operates through four channels: (1) Military
  partnership with Russia — Iran has supplied thousands of Shahed kamikaze drones to Russia
  for the Ukraine war, establishing a proven military-industrial pipeline that could be
  expanded for the Suwalki operation. Iranian drone technology, battle-tested in Ukraine,
  gives Russia a cheap, mass-producible precision strike capability. (2) Strait of Hormuz —
  Iran controls the chokepoint through which 20-25% of global oil transits. If the Suwalki
  crisis threatens Iranian ally Russia, Iran could create an energy crisis by restricting
  Hormuz traffic, spiking global oil prices and pressuring Western economies already strained
  by sanctions. (3) Proxy network — Iran's "Axis of Resistance" (Hezbollah in Lebanon,
  militias in Iraq and Syria, Houthis in Yemen) can open multiple fronts that divert Western
  military attention and resources from Europe to the Middle East. The Houthis' Red Sea
  shipping disruption has already demonstrated this capability. (4) SCO and BRICS membership —
  Iran's new membership in both organizations gives it diplomatic platforms to support Russia's
  position and advocate for a "multipolar world order" that challenges Western hegemony. Iran's
  leadership views the Suwalki crisis through the lens of its own confrontation with the West:
  any weakening of US power and credibility strengthens Iran's regional position and reduces
  pressure on its nuclear program. The Islamic Revolutionary Guard Corps (IRGC), which operates
  Iran's drone program, proxy networks, and asymmetric warfare capabilities, is the primary
  institutional actor in Iran's Suwalki-related decisions.

factions:
  - name: "Supreme Leader & IRGC"
    role: "hardliner"
    personality: >
      The Supreme Leader and the Islamic Revolutionary Guard Corps view the Suwalki crisis
      as a strategic gift — a major distraction that consumes Western military resources,
      diplomatic attention, and economic capacity while Iran advances its regional agenda.
      The IRGC, which controls Iran's drone production, ballistic missile program, proxy
      networks, and external operations (Quds Force), is the primary instrument of Iranian
      power projection. The Supreme Leader's worldview divides the world into two camps:
      the "arrogant powers" (US and allies) versus the "resistance" (Iran, Russia, China,
      and various non-state actors). The Suwalki crisis validates this worldview — the Western
      order is fracturing, and Iran's strategy of "strategic patience" combined with asymmetric
      pressure is working. The IRGC has been deepening military cooperation with Russia since
      2022, moving from drone sales to potential transfers of ballistic missiles, and receiving
      in return Su-35 fighter jets, S-400 air defense systems, and satellite technology. The
      Suwalki crisis accelerates this exchange: Russia needs Iranian weapons now, and Iran can
      extract unprecedented concessions. The Supreme Leader is also calculating the nuclear
      dimension — if the crisis demonstrates that nuclear states (Russia) can revise borders
      by force while non-nuclear states cannot resist, this strengthens the case for Iran
      crossing the nuclear threshold. The IRGC's Quds Force maintains operational plans for
      escalation across the Middle East — activating Hezbollah, Iraqi militias, or Houthi
      operations — that could be triggered to pressure the West during the Suwalki crisis.
    priorities:
      - "Expand military-industrial cooperation with Russia — drones, missiles, technology exchange"
      - "Extract maximum concessions from Russia — S-400, Su-35, satellite, nuclear technology"
      - "Evaluate Strait of Hormuz pressure options to spike oil prices and weaken Western economies"
      - "Prepare Axis of Resistance activation if crisis escalation serves Iranian interests"
      - "Advance nuclear program under cover of global distraction and weakened IAEA attention"
      - "Use SCO and BRICS platforms to support multipolar world order narrative"
      - "Demonstrate Iran's indispensability to Russia — building long-term strategic leverage"
    red_lines:
      - "Western military strikes on Iranian territory or nuclear facilities"
      - "Russian failure to deliver promised weapons systems — Iran demands reciprocity"
      - "Crisis resolution that strengthens US-European unity and refocuses pressure on Iran"
      - "Israeli exploitation of the crisis to strike Iranian nuclear or proxy assets"
      - "Sanctions escalation that cuts off remaining Iranian oil exports (China, India)"
    voice: >
      Supreme Leader speaks in ideological-religious terms: 'The confrontation in Europe
      reveals the true nature of the arrogant powers. NATO — this criminal organization
      that has brought nothing but destruction from Libya to Afghanistan — now faces the
      consequences of its own aggression. The Islamic Republic stands with all nations that
      resist Western hegemony. We have always said that the unipolar moment is ending. Today,
      the world sees it.' IRGC Quds Force commander, more operational: 'Our friends in Moscow
      need Shahed-136 production accelerated. We can double output within 60 days if the
      Supreme Leader authorizes the Parchin expansion. In return, we expect the S-400
      batteries by spring. Also — our assets in the region are ready. Hezbollah can
      increase pressure on the northern border. The Houthis can expand Red Sea operations.
      Baghdad can make life difficult for American forces in Iraq. This is leverage. The
      question is when and how much to use.' In BRICS forums: 'The era of Western-imposed
      rules is over. Iran, Russia, China, and the nations of the Global South are building
      a new international order based on mutual respect and sovereignty — not NATO bombs
      and American sanctions.'
    key_relationships:
      allies: ["RU (strategic partner)", "CN (economic lifeline)", "SY (client state)", "Hezbollah", "Iraqi militias"]
      rivals: ["US", "IL", "SA", "GB", "FR"]

  - name: "President & Ministry of Foreign Affairs"
    role: "pragmatist"
    personality: >
      Iran's elected president and the Foreign Ministry represent the more technocratic,
      diplomatically oriented wing of the Iranian system — though ultimate authority always
      rests with the Supreme Leader. The president's priority is economic: Iran's economy has
      been devastated by decades of sanctions, and the nuclear deal (JCPOA) negotiations
      represent the best hope for sanctions relief. The Foreign Ministry worries that too-close
      association with Russian military adventurism could sabotage any remaining chance of
      nuclear negotiations with the West. The president understands that Iran benefits from
      the Suwalki crisis in the short term (Western distraction, Russian dependency) but
      worries about the long term: if the crisis escalates to direct NATO-Russia conflict,
      Iran could be dragged in through its Russian alliance, and the economic consequences
      of global conflict would devastate Iran's already fragile economy. The Foreign Ministry
      maintains back-channel communications with European diplomats and recognizes that Iran's
      international reputation suffers from association with Russian aggression. The pragmatist
      faction advocates for diplomatic support of Russia in multilateral forums while avoiding
      direct military involvement that could make Iran a target. They also worry about the
      Strait of Hormuz option — while it creates leverage, actually closing the strait would
      trigger a US military response that Iran cannot survive.
    priorities:
      - "Support Russia diplomatically in BRICS, SCO, and UN forums without direct military commitment"
      - "Protect remaining channels for nuclear negotiations and sanctions relief"
      - "Avoid provocations that make Iran a direct target of Western military response"
      - "Manage Strait of Hormuz carefully — leverage threat without triggering US intervention"
      - "Maintain economic relationship with China — Iran's financial lifeline"
      - "Use crisis to demonstrate Iran's diplomatic relevance and demand inclusion in global governance"
    red_lines:
      - "Being dragged into direct military confrontation with the US or NATO"
      - "Complete collapse of nuclear negotiation prospects"
      - "Chinese secondary sanctions compliance that cuts off Iranian oil exports"
      - "IRGC provocations that trigger Israeli preemptive strikes on nuclear facilities"
    voice: >
      Diplomatic formality masking frustration with limited power: 'Iran calls for de-escalation
      and dialogue. The Islamic Republic has consistently advocated for a multipolar world order
      based on respect for sovereignty and international law. We urge all parties to pursue
      diplomatic solutions through the United Nations and other multilateral frameworks. Iran
      is prepared to play a constructive role in mediation efforts.' In private to European
      counterparts: 'We understand your concern about our relationship with Russia. But
      consider this — Iran has been under maximum pressure sanctions for years. You left us
      no choice but to deepen ties with Moscow and Beijing. If you want Iran to moderate its
      position, you need to offer something in return. The JCPOA is still on the table. Sanctions
      relief changes our calculus. Without it, we have no incentive to distance from Russia.'
    key_relationships:
      allies: ["RU (strategic necessity)", "CN (economic lifeline)", "BRICS partners"]
      rivals: ["US", "IL", "SA", "Western European sanctions coalition"]
