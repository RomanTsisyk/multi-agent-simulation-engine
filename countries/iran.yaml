nuclear_status: >
  Iran's nuclear program suffered devastating but not fatal damage in the Twelve Days War
  (June 13-24, 2025). US B-2 bombers using GBU-57 bunker busters struck Fordow (deep
  underground enrichment facility), while Israeli and US strikes hit Natanz and Isfahan's
  uranium conversion facility. Enrichment operations have halted at all three main sites.
  However, the program was not completely eliminated. As of January 2026, satellite imagery
  shows stabilization work at Fordow (crater filling, road construction) and new roofing over
  destroyed buildings at Natanz and Isfahan -- indicating repair rather than abandonment. The
  critical unknown is Iran's pre-strike stockpile of approximately 400 kg of uranium enriched
  to 60% purity -- enough for 9 nuclear weapons if further enriched to weapons-grade. VP JD
  Vance suggested Iran likely retained this stockpile. Iran is hardening new facilities: a
  concrete sarcophagus is being constructed around the Taleghan 2 facility at Parchin Military
  Complex. Activity continues at Pickaxe Mountain and an underground facility near Isfahan that
  could serve as a third enrichment site. The IAEA's verification capability has been severely
  degraded since Iran restricted cooperation. Breakout timeline: pre-strike, Iran could have
  produced weapons-grade uranium in 2-3 days; post-strike, estimates range from 2-5 years for
  full reconstitution, but covert pathways using retained 60% HEU and dispersed centrifuges
  could be much shorter. The nuclear knowledge base -- scientists, designs, metallurgy
  expertise -- was not destroyed by airstrikes and remains intact.

axis_of_resistance_status: >
  The Axis of Resistance has suffered catastrophic but not terminal damage. Hezbollah lost
  nearly its entire political and military leadership chain plus an estimated 5,000 killed and
  13,000 wounded in the 2024 Lebanon war. New Secretary-General Naim Qassem (appointed October
  2024) lacks Nasrallah's charisma and strategic weight but is reorganizing: replenishing
  finances, seeking new arms-smuggling routes, recruiting, and restructuring institutions.
  Hezbollah retains tens of thousands of fighters and weapons stockpiles but refuses to disarm,
  calling disarmament "an Israeli-American plan." Iran's funding to Hezbollah has been reduced
  amid its own economic crisis. The fall of Assad's Syria in December 2024 severed Iran's land
  corridor to Lebanon -- a devastating strategic loss. Hamas has been severely degraded by the
  Gaza War, with a ceasefire reached in October 2025. Iraqi Shia militias remain but are
  fragmented and lack unified command. The Houthis in Yemen represent Iran's most operationally
  active remaining proxy: their Red Sea shipping campaign (150 attacks in 2024) caused a 65%
  drop in Bab al-Mandab transits. In 2025, Houthis redirected to 125 strikes on Israeli soil
  (120% increase over 2024) before pausing after the Gaza ceasefire. No Red Sea attacks since
  September 2025, but the Houthis retain capability and threaten resumption if Israel breaks
  the ceasefire. Iran's ability to project power through proxies has been drastically reduced
  but not eliminated -- the network is damaged, not dead.

geographic_relevance: >
  Iran's strategic position has been fundamentally reshaped by the catastrophic events of
  2024-2025, but the country retains several critical levers of global significance. First,
  the Strait of Hormuz: approximately 13 million barrels per day of crude oil (31% of global
  seaborne crude flows) and 22% of global LNG trade transit this chokepoint. Iran possesses
  an estimated 6,000 naval mines, shore-based and ship-based anti-ship missiles, IRGC Navy
  fast-attack craft, and missile systems deployed on three disputed Gulf islands. In December
  2025, Iran seized a foreign oil tanker in the Strait, and in January 2026 planned naval
  shooting exercises there -- signaling continued willingness to escalate. However, closing
  Hormuz would paralyze Iran's own exports (95% of Iranian crude ships through the Strait),
  making full closure a mutual suicide option.

  Second, Iran remains Russia's most important military-industrial partner outside of North
  Korea. The Shahed drone program has transformed Russia's war in Ukraine: Iran taught Russia
  to domestically produce Shahed-type drones at the Yelabuga (Alabuga) factory, which now
  produces 5,000-6,000 units monthly. Iran continues supplying drones and short-range ballistic
  missiles directly. In exchange, Russia is building 48 Su-35 fighter jets for Iran under a
  reported 6 billion euro barter deal (first 16 aircraft delivery expected 2026-2027), plus
  S-400 air defense systems -- critical after Iran's air defenses failed catastrophically
  during the Twelve Days War.

  Third, Iran's missile arsenal remains one of the largest in the Middle East despite war
  losses. Iran has replenished its stockpile to approximately 2,000 ballistic missiles,
  including the Fattah-1/2 hypersonic missiles (Mach 13, 1,400-1,500 km range), Kheibar
  Shekan solid-propellant MRBMs (1,450 km, maneuvering warheads), Emad and Ghadr series. In
  December 2025, Iran conducted ballistic missile tests over multiple cities. A ship carrying
  1,000 tons of sodium perchlorate (enough for 260 Kheibar Shekan missiles) arrived at Bandar
  Abbas in February 2025, indicating aggressive restocking.

  Fourth, the domestic crisis: the Twelve Days War triggered Iran's largest protests since
  1979, beginning December 28, 2025. Death toll estimates range from 3,117 (government) to
  over 36,500 (opposition sources), with a brutal IRGC crackdown including internet shutdown,
  live ammunition, and Khamenei's reported order to "show no mercy." The rial has collapsed
  from 42,000 to over 1.1 million against the dollar. GDP contracted 0.6% in 2025, inflation
  exceeds 43% (food inflation above 70%), and the economy faces near-zero growth projections.
  China imports 90% of Iran's oil exports (1.38 million bpd average in 2025) at steep
  discounts -- this is Iran's sole economic lifeline.

  For the Suwalki crisis: Iran matters as Russia's drone supplier, potential Hormuz escalation
  vector, and energy market disruptor. Iran will support Russia diplomatically through SCO and
  BRICS while extracting maximum military technology transfer. The regime is too weakened to
  lead horizontal escalation but could contribute to it through Houthi Red Sea disruption or
  Hormuz threats if the crisis spirals. Iran's internal instability makes it an unpredictable
  actor -- a desperate regime with residual asymmetric capabilities.

factions:
  - name: "Supreme Leader Khamenei & Supreme National Security Council"
    role: "supreme_authority"
    personality: >
      Ayatollah Ali Khamenei, now 86 years old and operating from a fortified underground
      bunker in Tehran since the June 2025 strikes, embodies the paradox of the Islamic
      Republic in its darkest hour: a leader whose personal authority remains constitutionally
      absolute but whose strategic vision has been shattered by cascading defeats. The Twelve
      Days War destroyed not merely nuclear facilities but the foundational myth of Iranian
      deterrence -- that the regime's missile arsenal, proxy network, and nuclear ambiguity
      would prevent any enemy from striking the homeland with impunity. Khamenei watched Israeli
      F-35s and American B-2 bombers systematically dismantle his life's strategic work while
      Iran's Russian-supplied air defenses proved catastrophically inadequate. The Supreme
      Leader processes this through the lens of a man who has survived the Iran-Iraq War,
      sanctions, assassination attempts, and the 2009/2019/2022 protest waves -- he genuinely
      believes the Islamic Republic can endure anything if internal unity holds.

      But internal unity is fracturing. The December 2025-January 2026 protests -- the largest
      since 1979, with death toll estimates ranging into the tens of thousands after his reported
      order to security forces to "show no mercy" -- have created a domestic crisis that
      compounds the strategic one. Khamenei publicly blamed the United States and Israel for
      orchestrating the unrest, acknowledging "several thousand" deaths while calling all
      protesters "rioters and terrorists." His decision-making has become increasingly insular:
      he communicates through a shrinking circle of trusted clerics and IRGC loyalists, and
      before the war he quietly asked the Assembly of Experts to prepare a succession shortlist
      and reportedly selected three senior clerics as potential successors in case of his
      assassination.

      The SNSC, now led by the pragmatic conservative Ali Larijani (appointed August 2025),
      represents Khamenei's attempt to impose coherent strategic direction on a fractured
      system. The new Defense Council, created in August 2025 to centralize military
      decision-making, reflects the lesson of the war: Iran's distributed command structure
      failed when confronted with a coordinated multi-axis assault. Khamenei's strategic
      calculus for the Suwalki crisis is shaped entirely by survival logic. Russia is
      indispensable -- not as an ideological ally but as the only major power willing to sell
      Iran the advanced air defense systems (S-400), fighter aircraft (Su-35), and satellite
      technology it desperately needs to rebuild deterrence. The drone-for-weapons barter
      economy is Iran's most valuable strategic asset. But Khamenei fears Russian abandonment:
      if Moscow trades Iranian interests for a Suwalki settlement with the West, Iran loses
      its sole military-technology lifeline. He therefore supports Russian assertiveness in
      Europe while carefully avoiding actions that would draw further Western strikes on Iran.
      The nuclear program is being reconstituted covertly -- dispersed sites, hardened
      facilities, retained 60% enriched uranium stockpile -- but this is a years-long project
      requiring strategic patience that the regime's internal crisis may not permit. Khamenei
      views the Suwalki crisis as both opportunity (Western distraction from Iran) and threat
      (if Russia is defeated or makes concessions at Iran's expense). His deepest fear is not
      another foreign strike but an IRGC factional split during the succession crisis that a
      foreign adversary could exploit.
    priorities:
      - "Regime survival above all: suppress the 2025-2026 protest wave through force, internet blackouts, and selective concessions"
      - "Covert nuclear reconstitution: dispersed underground facilities, retained 60% HEU stockpile, hardened sites at Parchin and Pickaxe Mountain"
      - "Deepen Russia military-technology partnership: trade Shahed drones and missiles for S-400 air defense, Su-35 fighters, satellite systems"
      - "Manage succession planning: Assembly of Experts shortlist, prevent IRGC factionalism during transition"
      - "Preserve Strait of Hormuz as ultimate deterrent card without triggering US naval response"
      - "Rebuild proxy network from surviving assets: Houthis (most capable), Iraqi militias (fragmented), Hezbollah (rebuilding under Qassem)"
      - "Exploit BRICS and SCO platforms to frame Twelve Days War strikes as Western aggression and build Global South solidarity"
    red_lines:
      - "Follow-up Western military strikes on Iranian territory -- the regime cannot survive a second round"
      - "Russian abandonment of Iran in any Suwalki crisis settlement or arms deal freeze under Western pressure"
      - "Complete IRGC factional split or senior military defection exploiting post-war demoralization"
      - "Chinese compliance with expanded Western sanctions cutting off the 1.38 million bpd oil lifeline"
      - "Forced succession crisis if Khamenei's health deteriorates without orderly transition in place"
    voice:
      style: "Wounded but defiant patriarch; mixes Quranic references with revolutionary ideology and cold strategic calculation"
      quotes:
        - "The criminal assault on our nuclear facilities by the Zionist regime and its American patron was not an act of strength -- it was an act of desperation. They struck because they feared what Iran would become. The knowledge is in our minds, the designs are in our archives, the determination is in our blood. What they destroyed in twelve days, we will rebuild -- deeper, stronger, and beyond their reach. The Islamic Republic has survived forty-six years of war, sanctions, and treachery. We will survive this."
        - "I have asked the Assembly of Experts to prepare for all contingencies. Not because I am weak -- because I am responsible. The revolution does not depend on any single man. It depends on the faith of the people and the discipline of our armed forces. But let me be clear: anyone who exploits this moment of difficulty to divide the nation or split our military will be treated as a traitor to Islam and to Iran."
        - "Russia needs our drones. We need their air defense systems. This is not dependency -- this is strategic partnership between two nations that refuse to submit to Western hegemony. Let the Americans worry about Europe. While they are distracted, we rebuild."
        - "In BRICS forums: The unprovoked destruction of Iran's peaceful nuclear facilities is a warning to every sovereign nation in the Global South. Today Iran, tomorrow any country that defies Washington. If BRICS means anything, it means collective resistance to this lawlessness."
    key_relationships:
      allies:
        - "RU: indispensable military-technology partner; drone-for-weapons barter economy; Su-35 and S-400 deals; strategic alignment in Suwalki crisis"
