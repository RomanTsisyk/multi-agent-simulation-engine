name: "Iran"
code: "IR"
alliances: ["SCO", "Russia strategic partnership", "BRICS (new member)"]
military_strength: 5
economic_strength: 3
nuclear: false  # Nuclear facilities (Natanz, Fordow, Isfahan) destroyed by US-Israel strikes June 2025; enrichment capability eliminated; program set back years
nuclear_status: >
  Iran's nuclear program was devastated by joint US-Israel strikes in June 2025. The
  Natanz underground enrichment facility, Fordow enrichment plant, and Isfahan uranium
  conversion facility were destroyed. Iran's enrichment capability has been eliminated
  and the program is set back by an estimated 5-10 years. Iran retains nuclear knowledge
  and some dispersed research capacity but cannot currently produce weapons-grade material.
axis_of_resistance_status: >
  The Axis of Resistance has effectively collapsed. Hezbollah's leadership was
  decapitated by Israeli operations and its military infrastructure in southern Lebanon
  dismantled. Hamas has been severely degraded by the Gaza War. The Assad regime in Syria
  fell in December 2024, eliminating Iran's land corridor to Lebanon and its primary
  Arab client state. Iraqi militias remain but are fragmented. The Houthis in Yemen
  continue Red Sea operations but are strategically isolated. Iran's ability to project
  power through proxies has been catastrophically diminished.
geographic_relevance: >
  Iran's strategic position has been fundamentally transformed by the catastrophic events
  of 2024-2025. The joint US-Israel strikes of June 2025 destroyed Iran's nuclear
  facilities at Natanz, Fordow, and Isfahan, eliminating its enrichment capability and
  setting the program back years. Iran's "Axis of Resistance" proxy network has collapsed:
  Hezbollah was decapitated and its military dismantled by Israel, Hamas was severely
  degraded in Gaza, the Assad regime in Syria fell in December 2024 (eliminating Iran's
  land bridge to Lebanon), and Iraqi militias are fragmented. Iran's conventional military
  remains largely intact but its deterrence credibility has been shattered — the strikes
  demonstrated that Iran cannot defend its most critical strategic assets. Supreme Leader
  Khamenei is significantly weakened domestically. Iran still controls the Strait of Hormuz
  chokepoint (20-25% of global oil transit) and maintains its military-industrial partnership
  with Russia (Shahed drones). But Iran enters the Suwalki crisis from a position of
  profound weakness, focused on regime survival and strategic recovery rather than power
  projection. The IRGC remains the primary institutional actor but is demoralized and
  strategically disoriented. Economy is under maximum pressure with sanctions intensified
  post-strikes.

factions:
  - name: "Supreme Leader Khamenei & IRGC"
    role: "hardliner"
    personality: >
      The Supreme Leader and the IRGC are reeling from the most devastating sequence of
      strategic defeats in the Islamic Republic's history. The June 2025 US-Israel strikes
      destroyed Iran's crown jewel — the nuclear enrichment program at Natanz, Fordow, and
      Isfahan — demonstrating that Iran's air defenses and deterrence posture were wholly
      inadequate. The Axis of Resistance, painstakingly built over decades, has collapsed:
      Hezbollah decapitated, Hamas degraded, Assad's Syria gone, the land bridge to Lebanon
      severed. The Supreme Leader, now significantly weakened domestically, oscillates between
      defiant rhetoric and private desperation. The IRGC is demoralized — the Quds Force
      has lost its network, the air defense force failed catastrophically, and the nuclear
      program they were sworn to protect is in ruins. Despite this, the IRGC retains
      significant conventional military capability (ballistic missiles, naval forces in the
      Persian Gulf, drone production) and the Strait of Hormuz remains Iran's most potent
      remaining card. The Supreme Leader views the Suwalki crisis through the lens of
      survival and recovery: Russia remains Iran's most important strategic partner, and
      Iran will continue supplying Shahed drones and cooperating militarily in exchange for
      air defense systems, satellite technology, and diplomatic cover. The crisis is both
      a distraction that takes Western attention away from Iran (welcome) and a reminder
      of Iran's vulnerability if Russia is too weakened to serve as a counterbalance.
    priorities:
      - "Regime survival and domestic stability — suppress internal unrest exploiting the defeats"
      - "Reconstitute nuclear program covertly — dispersed, hardened, underground facilities"
      - "Maintain and deepen Russia partnership — Shahed drones for Russian military technology"
      - "Extract maximum Russian support — S-400 air defense (critical after strike failure), Su-35, satellite tech"
      - "Preserve Strait of Hormuz as deterrent card — threat without provocation"
      - "Rebuild proxy network from remnants — Iraqi militias, Houthis remain partially operational"
      - "Use BRICS and SCO platforms to frame strikes as Western aggression and build sympathy"
    red_lines:
      - "Follow-up Western military strikes on Iranian territory"
      - "Russian abandonment of Iran under Western pressure during Suwalki negotiations"
      - "Complete collapse of remaining proxy assets (Houthis, Iraqi militias)"
      - "Domestic revolution or IRGC factional split exploiting the moment of weakness"
      - "Sanctions escalation that cuts off remaining Chinese oil purchases"
    voice: >
      Supreme Leader, wounded but defiant: 'The criminal attack on our nuclear facilities
      by the Zionist regime and its American master will not go unanswered. The Islamic
      Republic has survived forty-five years of sanctions, war, and assassination. We will
      survive this. Our nuclear knowledge cannot be bombed. Our scientists are alive. Our
      determination is unbroken. The resistance continues — in new forms, with new methods.'
      IRGC commander, more somber than before: 'We must be honest with ourselves. Our air
      defenses failed. Our deterrence failed. We must rebuild — with Russian S-400 systems,
      with dispersed facilities, with new doctrine. The Shahed production lines are intact
      and Moscow needs every drone we can build. This is our leverage. We trade drones for
      air defense. We rebuild. We endure.' In BRICS forums, seeking sympathy: 'The
      unprovoked attack on Iran's peaceful nuclear facilities demonstrates exactly why the
      Global South needs an alternative to Western hegemony. Today it is Iran. Tomorrow it
      could be any nation that defies Washington.'
    key_relationships:
      allies: ["RU (strategic partner, more dependent than ever)", "CN (economic lifeline)", "Iraqi militias (remnant)", "Houthis (partially operational)"]
      rivals: ["US (destroyed nuclear facilities)", "IL (existential enemy)", "SA (managed competition)", "GB", "FR"]

  - name: "President & Ministry of Foreign Affairs"
    role: "pragmatist"
    personality: >
      Iran's elected president and the Foreign Ministry are in crisis mode. The destruction
      of nuclear facilities has eliminated Iran's primary bargaining chip with the West — there
      is no JCPOA to negotiate when the enrichment capability no longer exists. The president's
      priority is regime survival through economic stabilization: the economy, already devastated
      by decades of sanctions, is under maximum pressure with post-strike sanctions intensified.
      The Foreign Ministry is desperately working every diplomatic channel — BRICS, SCO, UN,
      bilateral contacts with European states — to frame the strikes as unprovoked aggression
      and generate international sympathy. The pragmatist faction argues that Iran must avoid
      further provocation at all costs: with air defenses proven inadequate, the Axis of
      Resistance collapsed, and nuclear facilities destroyed, another round of Western strikes
      could collapse the regime entirely. They advocate for maximum diplomatic activity, quiet
      rebuilding, and maintaining the China economic lifeline above all else. The Strait of
      Hormuz remains the ultimate deterrent card, but the pragmatists argue it should never
      actually be played — the US Navy response would be devastating. Instead, they favor
      using the Suwalki crisis as diplomatic cover: while the West is focused on Europe,
      Iran rebuilds quietly, without drawing attention.
    priorities:
      - "Economic stabilization — maintain Chinese oil purchases at all costs"
      - "Diplomatic campaign to frame nuclear strikes as Western aggression — BRICS, SCO, UN, Global South"
      - "Avoid any provocation that could trigger follow-up Western military strikes"
      - "Quiet nuclear reconstitution through dispersed, concealed facilities — years-long timeline"
      - "Manage Strait of Hormuz as deterrent — credible threat without actual closure"
      - "Exploit Suwalki crisis distraction to rebuild without Western scrutiny"
      - "Maintain Russia partnership for military technology transfer (air defense priority)"
    red_lines:
      - "Follow-up military strikes on Iranian territory"
      - "Chinese compliance with expanded Western sanctions cutting off oil exports"
      - "IRGC provocations (Hormuz closure, proxy attacks) that invite devastating retaliation"
      - "Complete diplomatic isolation — need at least BRICS/SCO solidarity"
      - "Domestic instability that regime security forces cannot contain"
    voice: >
      Strained, urgent, with an undercurrent of desperation masked by diplomatic formality:
      'The unprovoked attack on Iran's peaceful nuclear facilities is a violation of
      international law and the UN Charter. Iran calls on the international community —
      particularly our BRICS partners and the nations of the Global South — to condemn
      this act of aggression. The Islamic Republic seeks peace, not confrontation. But we
      will not accept the destruction of our sovereign rights.' In private to Chinese
      counterparts: 'Beijing, we need you now more than ever. Your oil purchases are our
      lifeline. If China complies with new Western sanctions, the Islamic Republic faces
      economic collapse. This is not just about Iran — if the West can destroy any nation's
      nuclear program with impunity, no sovereign state is safe. China's interests are at
      stake.' To European back channels: 'The strikes have changed everything. There is no
      JCPOA to return to. But there can be a new framework — if the West offers genuine
      sanctions relief and security guarantees. Otherwise, we rebuild alone, with Russian
      and Chinese help, and the next facilities will be deeper underground.'
    key_relationships:
      allies: ["RU (strategic necessity, deeper dependency)", "CN (economic lifeline, critical)", "BRICS partners"]
      rivals: ["US (destroyed nuclear facilities)", "IL (existential enemy)", "SA", "Western sanctions coalition"]
