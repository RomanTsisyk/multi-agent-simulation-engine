name: "Suwalki Gap Crisis 2026"
description: |
  Russia announces a 'humanitarian logistics corridor' from Belarus to Kaliningrad
  through Lithuanian territory. Satellite imagery confirms Russian military units
  in Kaliningrad moving to high readiness. Columns of military trucks with
  humanitarian markings are spotted near the Lithuanian border. Lithuanian border
  guards report increased Russian drone activity over the Suwalki Gap.

background: |
  Tensions have been building for months. The US under President Trump has been
  questioning NATO spending and hinting at reduced commitment to European defense.
  Russia has completed a major military exercise near Kaliningrad. Belarus has
  allowed Russian forces to stage near its western border. EU is divided on
  Russia policy. Poland has been investing heavily in military modernization.
  Finland recently joined NATO, extending the alliance's border with Russia.
  Ukraine conflict is in a frozen state with no resolution in sight.

initial_event: |
  FLASH REPORT - Day 1, 06:00 CET:

  Russian Ministry of Defense announces "humanitarian logistics operation" to supply
  Kaliningrad exclave via land corridor through Lithuania. Russia claims existing
  transit agreements are insufficient and demands a "temporary humanitarian corridor."

  Intelligence reports:
  - 3 Russian BTGs (Battalion Tactical Groups) in Kaliningrad moved to forward positions
  - Russian Navy Baltic Fleet conducting "exercises" near Lithuanian coast
  - Unusual cyber activity detected against Lithuanian government networks
  - Russian state media running stories about "discrimination against Russians in Baltics"
  - Belarus has moved troops to its border with Lithuania "for exercises"
  - Russian diplomatic note to Lithuania demands response within 48 hours

  NATO Enhanced Forward Presence battalions in Baltics are on heightened alert.
  US forces in Poland (Camp Kosciuszko) monitoring situation.

game_time_per_round: "12 hours"
total_rounds: 10

# Victory / early-end conditions -- checked each round by the engine
end_conditions:
  - id: "russian_corridor_hold"
    type: "territorial_control"
    description: "Russia holds the Suwalki corridor for 3+ consecutive days"
    winner: "RU"
    check_field: "corridor_control"
    check_value: "russian"
    threshold_rounds: 6
  - id: "nato_corridor_liberated"
    type: "territorial_control"
    description: "NATO forces recapture the full Suwalki corridor"
    winner: "NATO"
    check_field: "corridor_control"
    check_value: "nato"
  - id: "ceasefire_agreement"
    type: "diplomatic"
    description: "All major parties agree to a ceasefire and negotiations"
    winner: "diplomatic"
  - id: "nuclear_detonation"
    type: "catastrophic"
    description: "Any nuclear weapon is detonated (tactical or strategic)"
    winner: "none"
  - id: "nato_collapse"
    type: "political"
    description: "3+ NATO members refuse Article 5 commitment, alliance fractures"
    winner: "RU"

