<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WarGame Production Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   CSS VARIABLES & RESET
   ============================================================ */
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2332;
  --bg-card-hover: #1f2b3d;
  --border: #2d3748;
  --border-accent: #374151;
  --text-primary: #e5e7eb;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
  --accent-blue: #3b82f6;
  --accent-cyan: #06b6d4;
  --accent-red: #ef4444;
  --accent-orange: #f59e0b;
  --accent-green: #10b981;
  --accent-purple: #8b5cf6;
  --sidebar-width: 260px;
  --topbar-height: 56px;
  --radius: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow: hidden;
  height: 100vh;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.app {
  display: flex;
  height: 100vh;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--accent-cyan);
}

.sidebar-header .subtitle {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.sidebar-header .classified {
  display: inline-block;
  background: var(--accent-red);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 3px;
  letter-spacing: 1.5px;
  margin-top: 8px;
}

.sidebar-nav {
  flex: 1;
  padding: 12px 0;
  overflow-y: auto;
}

.nav-section {
  padding: 8px 20px 4px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s ease;
  border-left: 3px solid transparent;
}

.nav-item:hover {
  background: var(--bg-card);
  color: var(--text-primary);
}

.nav-item.active {
  background: rgba(59, 130, 246, 0.1);
  color: var(--accent-blue);
  border-left-color: var(--accent-blue);
}

.nav-item .icon {
  font-size: 16px;
  width: 20px;
  text-align: center;
}

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* TOP BAR */
.topbar {
  height: var(--topbar-height);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 24px;
  flex-shrink: 0;
}

.topbar-scenario {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.topbar-round {
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-card);
  padding: 4px 12px;
  border-radius: 4px;
}

.game-picker {
  display: flex;
  align-items: center;
  gap: 8px;
}

.game-picker label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.game-picker select {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  min-width: 200px;
  cursor: pointer;
}

.game-picker select:hover {
  border-color: var(--border-accent);
}

.topbar-nuclear {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
}

.nuclear-indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

.nuclear-green { background: var(--accent-green); }
.nuclear-yellow { background: var(--accent-orange); animation: pulse 1.5s infinite; }
.nuclear-red { background: var(--accent-red); animation: pulse 0.8s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 4px currentColor; }
  50% { opacity: 0.5; box-shadow: 0 0 12px currentColor; }
}

/* CONTENT AREA */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* ============================================================
   VIEWS (shown/hidden)
   ============================================================ */
.view { display: none; }
.view.active { display: block; }

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  transition: border-color 0.15s;
}

.card:hover { border-color: var(--border-accent); }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.card-subtitle {
  font-size: 11px;
  color: var(--text-muted);
}

/* ============================================================
   DASHBOARD GRID
   ============================================================ */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
}

.stat-change {
  font-size: 12px;
  font-weight: 500;
}

.stat-change.up { color: var(--accent-red); }
.stat-change.down { color: var(--accent-green); }

.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.chart-full {
  grid-column: 1 / -1;
}

.chart-container {
  position: relative;
  height: 260px;
}

/* ============================================================
   ESCALATION BAR
   ============================================================ */
.escalation-bar {
  display: flex;
  gap: 3px;
  margin-top: 8px;
}

.escalation-segment {
  flex: 1;
  height: 24px;
  border-radius: 3px;
  background: var(--border);
  transition: background 0.3s;
}

.escalation-segment.active-low { background: var(--accent-green); }
.escalation-segment.active-mid { background: var(--accent-orange); }
.escalation-segment.active-high { background: var(--accent-red); }

/* ============================================================
   TIMELINE
   ============================================================ */
.timeline {
  position: relative;
  padding-left: 24px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border);
}

.timeline-item {
  position: relative;
  padding: 12px 0;
}

.timeline-dot {
  position: absolute;
  left: -20px;
  top: 16px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent-blue);
  border: 2px solid var(--bg-card);
}

.timeline-dot.critical { background: var(--accent-red); }
.timeline-dot.warning { background: var(--accent-orange); }

.timeline-round {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-cyan);
  margin-bottom: 4px;
}

.timeline-text {
  font-size: 13px;
  color: var(--text-secondary);
}

/* ============================================================
   SCROLLBAR
   ============================================================ */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--border-accent);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  .sidebar { width: 200px; }
  .chart-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">
  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>WARGAME</h1>
      <div class="subtitle">AI Geopolitical Simulation</div>
      <div class="classified">CLASSIFIED</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Overview</div>
      <div class="nav-item active" data-view="dashboard">
        <span class="icon">&#9635;</span> Dashboard
      </div>
      <div class="nav-section">Games</div>
      <div class="nav-item" data-view="games" style="cursor: default; color: var(--text-muted); pointer-events: none;">
        <span class="icon">&#9654;</span> <span id="game-status">Loading...</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      Production Viewer v2.1<br>
    </div>
  </aside>

  <!-- ========== MAIN ========== -->
  <div class="main">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="game-picker">
        <label for="gameSelect">Game:</label>
        <select id="gameSelect">
          <option value="">Loading...</option>
        </select>
      </div>
      <span class="topbar-scenario" id="topbar-scenario">WarGame</span>
      <span class="topbar-round" id="topbar-round"></span>
      <div class="topbar-nuclear" id="topbar-nuclear">
        <span class="nuclear-indicator nuclear-green"></span>
        <span>NUCLEAR: PEACETIME</span>
      </div>
    </header>

    <!-- CONTENT -->
    <div class="content">
      <!-- ===== DASHBOARD VIEW ===== -->
      <div class="view active" id="view-dashboard">
        <div class="chart-row">
          <div class="card">
            <div class="card-header">
              <span class="card-title">Oil Price ($/barrel)</span>
            </div>
            <div class="chart-container"><canvas id="chart-oil"></canvas></div>
          </div>
          <div class="card">
            <div class="card-header">
              <span class="card-title">Nuclear Posture</span>
            </div>
            <div class="chart-container"><canvas id="chart-nuclear"></canvas></div>
          </div>
        </div>
        <div class="chart-row">
          <div class="card">
            <div class="card-header">
              <span class="card-title">War Support by Country (%)</span>
            </div>
            <div class="chart-container"><canvas id="chart-warSupport"></canvas></div>
          </div>
          <div class="card">
            <div class="card-header">
              <span class="card-title">Military Balance</span>
            </div>
            <div class="chart-container"><canvas id="chart-military"></canvas></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="production-app.js"></script>
</body>
</html>
