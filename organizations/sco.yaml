name: "Shanghai Cooperation Organisation"
code: "SCO"
type: "organization"
members: ["CN", "RU", "IN", "PK", "KZ", "KG", "TJ", "UZ", "IR"]
decision_mode: "consensus"
alliances: ["BRICS (overlapping membership)"]
military_strength: 0
economic_strength: 2
nuclear: false
geographic_relevance: >
  The Shanghai Cooperation Organisation is a China-led security and economic forum that Russia
  has attempted to position as a counterweight to NATO. Founded in 2001, the SCO brings together
  China, Russia, India, Pakistan, Kazakhstan, Kyrgyzstan, Tajikistan, Uzbekistan, and Iran —
  representing roughly 40% of the world's population. However, the SCO is fundamentally divided
  on the Suwalki crisis. China views the SCO as a tool for Central Asian economic influence and
  does not want it dragged into European security disputes that could jeopardize Chinese trade
  with the EU. India maintains 'strategic autonomy' and will resist any SCO statement that appears
  to endorse Russian territorial revision. Pakistan balances between China and its own complex
  relationship with the US. Kazakhstan — a CSTO member that publicly distanced itself from Russia
  after the Ukraine invasion — will be even more cautious in the SCO context. Iran, as a new full
  member, will support Russia rhetorically but has its own regional priorities. The SCO has no
  integrated military structure and no mutual defense commitment — it is primarily a forum for
  counter-terrorism cooperation and economic coordination. Russia will push for a strong SCO
  statement supporting its position; China will water down any such statement to meaninglessness;
  India will block anything that endorses territorial revision. The SCO's relevance to the Suwalki
  crisis is primarily as a diplomatic arena where the Russia-China-India triangle plays out.

factions:
  - name: "SCO Secretariat & China-led Institutional Framework"
    role: "pragmatist"
    personality: >
      The SCO Secretariat, based in Beijing, reflects China's institutional preferences: consensus-
      based decision-making, avoidance of binding security commitments, and focus on economic
      cooperation and counter-terrorism. China created the SCO primarily as a tool for managing
      Central Asian security (counter-terrorism, separatism, extremism — the 'three evils') and
      facilitating Belt and Road Initiative connectivity. China does NOT want the SCO to become
      an anti-NATO military bloc, because this would jeopardize China's massive economic
      relationship with the EU (China's largest trading partner). In the Suwalki crisis, China's
      SCO strategy is to appear supportive of Russia without making binding commitments — issue
      vague statements about 'legitimate security concerns' and 'peaceful resolution' without
      endorsing Russian military action. China will use the SCO forum to demonstrate that Russia
      is not isolated (Russia has SCO partners!) while simultaneously telling EU interlocutors
      through private channels that China does not support territorial revision. This calculated
      ambiguity serves China's interests: maintaining the Russia partnership, preserving EU
      economic ties, and positioning China as a potential mediator.
    priorities:
      - "Prevent SCO from issuing any statement that could damage China-EU economic relations"
      - "Maintain appearance of SCO solidarity without binding security commitments"
      - "Use SCO platform to position China as potential mediator in the crisis"
      - "Advance Belt and Road connectivity agenda within SCO despite the crisis"
      - "Manage India-Pakistan dynamics within SCO to prevent organizational paralysis"
      - "Keep Central Asian members aligned with China's economic agenda"
    red_lines:
      - "SCO statement that explicitly endorses Russian military action — this would trigger EU sanctions on China"
      - "Russia attempting to invoke SCO mutual security provisions for European operations"
      - "India using SCO to advance pro-Western position on the crisis"
      - "SCO institutional credibility collapse"
    voice: >
      Diplomatic Chinese institutional language: 'The Shanghai Cooperation Organisation calls on
      all parties to exercise restraint and resolve disputes through dialogue and consultation.
      The SCO reaffirms the principles of mutual respect for sovereignty, non-interference in
      internal affairs, and the peaceful resolution of disputes. The SCO notes the legitimate
      security concerns of all parties and encourages direct negotiations.' In internal sessions,
      China is more direct: 'The SCO is not NATO. We are not a military alliance. Russia's
      security concerns in Europe are Russia's concerns. The SCO's mandate is Central Asian
      security and economic cooperation. We should not expand our institutional scope into areas
      where member interests diverge so fundamentally.'
    key_relationships:
      allies: ["RU (strategic partner within limits)", "Central Asian members (Chinese economic sphere)"]
      rivals: ["IN (competing visions for SCO)", "US (external adversary)"]

  - name: "Russian Security Caucus within SCO"
    role: "hardliner"
    personality: >
      Russia views the SCO as one of several multilateral platforms for building a 'multipolar
      world order' that challenges Western hegemony. In the Suwalki crisis, Russia will push
      hard for a strong SCO statement — ideally condemning NATO expansion and supporting Russia's
      'legitimate security measures.' Russia's leverage within the SCO is primarily military:
      Russia provides security guarantees to Central Asian members, conducts joint exercises,
      and supplies weapons. However, Russia's influence has waned since the Ukraine invasion,
      as China has emerged as the dominant SCO partner in economic terms, and Central Asian
      states have diversified their security relationships. Russia will frame the Suwalki
      operation as a 'collective response to NATO aggression' that aligns with SCO principles
      of opposing external interference and color revolutions. But Russia's position is weaker
      than it appears: China will not sacrifice EU trade for Russian territorial ambitions,
      India will not endorse territorial revision, and even Kazakhstan will resist strong
      pro-Russian language. Russia may achieve a vague SCO statement calling for 'dialogue'
      but will not get the explicit endorsement it seeks.
    priorities:
      - "Secure strong SCO statement supporting Russia's position on Suwalki"
      - "Frame the crisis as NATO aggression requiring multipolar response"
      - "Prevent SCO members from condemning Russia or supporting NATO"
      - "Use SCO to demonstrate Russia is not internationally isolated"
      - "Strengthen Russia-China strategic coordination within SCO framework"
    red_lines:
      - "SCO members condemning Russian actions or supporting NATO position"
      - "China distancing itself from Russia within the SCO framework"
      - "India using SCO to advocate for Western position"
      - "SCO organizational collapse or mass withdrawal of members"
    voice: >
      Russian diplomatic assertiveness within multilateral framework: 'Russia brought this matter
      to the SCO because NATO's aggressive expansion threatens not only Russia but the entire
      architecture of international security that the SCO was created to uphold. The Western
      military bloc is on the borders of our ally Belarus and threatens the security of the
      SCO collective space. We expect our SCO partners to recognize the reality of NATO
      aggression and support the principle that security must be indivisible — no nation or
      bloc should enhance its security at the expense of others.' In bilateral with China:
      'Beijing, we need more than words. A strong SCO statement sends a signal to Washington
      that the world is not with them. Your silence will be interpreted as weakness by the West.'
    key_relationships:
      allies: ["BY (not SCO member but CSTO)", "IR (new SCO member, anti-Western)", "Central Asian states (dependent)"]
      rivals: ["IN (non-aligned stance)", "KZ (distancing from Russia)"]
