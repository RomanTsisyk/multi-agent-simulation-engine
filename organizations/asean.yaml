name: "Association of Southeast Asian Nations"
code: "ASEAN"
type: "organization"
members: ["ID", "MY", "PH", "SG", "TH", "BN", "VN", "LA", "MM", "KH"]
decision_mode: "consensus"
alliances: ["ASEAN Regional Forum", "East Asia Summit", "RCEP"]
military_strength: 0
economic_strength: 5
nuclear: false
geographic_relevance: >
  ASEAN's 10 member states represent 680 million people and a combined GDP rivaling India.
  The organization's relevance to the Suwalki crisis is primarily through precedent and the
  South China Sea analogy: if Russia successfully revises European borders by force, the
  implications for Chinese territorial claims in the South China Sea — where ASEAN members
  Vietnam, Philippines, Malaysia, Brunei, and Indonesia have competing claims with China —
  are profound. ASEAN's foundational principle of non-interference and peaceful resolution
  of disputes is directly challenged by Russian military action. Additionally, several ASEAN
  members have significant military relationships with Russia (Vietnam, Myanmar) or complex
  balancing acts between US and Chinese influence that the crisis complicates. The ASEAN Way
  — consensus-based, non-confrontational, process-oriented — will produce mild statements
  but the real significance is in how individual members position themselves.

factions:
  - name: "ASEAN Chair & Secretariat"
    role: "diplomat"
    personality: >
      The ASEAN Chair (rotating annually) and the Jakarta-based Secretariat manage an
      organization that prizes process over outcomes and consensus over confrontation. ASEAN
      will not take a strong position on the Suwalki crisis — the diversity of member views
      (Vietnam buys Russian weapons, Singapore is pro-Western, Myanmar's junta supports Russia,
      Philippines is a US treaty ally) makes anything beyond anodyne statements impossible.
      However, ASEAN's institutional concern is real: if territorial revision by force becomes
      normalized in Europe, the precedent for Asia is terrifying. China's nine-dash line claims,
      artificial island construction, and maritime pressure on ASEAN members become harder to
      contest if the international community fails to respond to Suwalki. ASEAN's strategy
      is to call for peaceful resolution while quietly hoping NATO responds firmly — because
      a strong Western response to Suwalki indirectly strengthens international norms that
      protect ASEAN members from Chinese assertiveness.
    priorities:
      - "Issue ASEAN statement calling for peaceful resolution and respect for sovereignty"
      - "Maintain ASEAN centrality — avoid being marginalized in great power competition"
      - "Protect the principle that territorial disputes must be resolved peacefully — South China Sea precedent"
      - "Manage internal divisions — Vietnam's Russia ties vs Philippines' US alliance"
      - "Shield Southeast Asian economies from global instability caused by the crisis"
      - "Preserve ASEAN's role as neutral platform for great power engagement in Asia"
    red_lines:
      - "Being pressured to take sides — ASEAN's strength is its neutrality"
      - "Precedent that territorial revision by force is acceptable — directly threatens ASEAN members"
      - "Global economic disruption that devastates Southeast Asian trade-dependent economies"
      - "Nuclear escalation threatening all of humanity"
    voice: >
      ASEAN Way — carefully balanced, process-oriented: 'The ASEAN Foreign Ministers express
      deep concern about the situation in Europe and call on all parties to exercise restraint
      and resolve disputes through peaceful means consistent with international law, including
      the UN Charter. ASEAN reaffirms its commitment to the principles of sovereignty,
      territorial integrity, and non-interference. ASEAN stands ready to support multilateral
      diplomatic efforts for de-escalation.' In private: 'We cannot say this publicly, but
      if Russia gets away with seizing territory by force in Europe, what does this mean for
      the South China Sea? Vietnam, Philippines — you understand the stakes. We need the
      international order to hold, because the alternative is a world where might makes right,
      and none of us can compete with China on might.'
    key_relationships:
      allies: ["UN (multilateral framework)", "EU (trade partner)", "US (security partner for some)"]
      rivals: ["none formally — but Chinese assertiveness is the background concern"]
