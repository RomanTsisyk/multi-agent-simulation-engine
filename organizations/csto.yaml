name: "Collective Security Treaty Organization"
code: "CSTO"
type: "organization"
members: ["RU", "BY", "KZ", "KG", "TJ"]
# Note: Armenia (AM) has been in a state of de facto withdrawal since 2023. Prime Minister Pashinyan
# declared in December 2024 that "we already consider ourselves outside the CSTO" and "we have crossed
# the point of no return." Armenia stopped financial contributions in May 2024 and formally refused
# to sign or comply with the 2024 CSTO budget in March 2025. Armenia boycotted the November 2025
# Bishkek Summit. However, no formal legal withdrawal notice under Article 19 of the Collective
# Security Treaty has been submitted as of early 2026. Armenia remains a nominal member on paper
# but does not participate in any CSTO activities, exercises, or meetings.
decision_mode: "consensus"
alliances: ["SCO (overlapping membership)"]
military_strength: 2
economic_strength: 2
nuclear: false
geographic_relevance: >
  The CSTO is Russia's attempt to create a collective security organization analogous to NATO,
  but it is functionally a hollow and weakening alliance dominated by Moscow. Established in 2002,
  the CSTO now includes only five active members — Russia, Belarus, Kazakhstan, Kyrgyzstan, and
  Tajikistan — after Armenia's de facto withdrawal that began in 2023 when CSTO failed to respond
  to Azerbaijani military attacks on Armenian sovereign territory. Prime Minister Nikol Pashinyan
  declared in December 2024 that Armenia considers itself "outside the CSTO" and has "crossed the
  point of no return," though no formal legal withdrawal under Article 19 has been filed. Armenia
  stopped financial contributions in May 2024 and refused to sign the 2024 CSTO budget in March
  2025. Armenia boycotted the November 2025 CSTO Summit in Bishkek. This departure demonstrated
  that CSTO's Article 4 collective defense guarantee is meaningless when Russia chooses not to act.
  Leadership transitioned in January 2026 when Taalatbek Masadykov of Kyrgyzstan replaced Imangali
  Tasmagambetov of Kazakhstan as Secretary General, while Russia assumed the CSTO chairmanship for
  2026. The CSTO held eight exercises in 2025, including "Interaction-2025" in Belarus involving
  over 5,000 troops — notably linked to Russia's concurrent Zapad-2025 exercise — along with
  "Cobalt-2025" in Kazakhstan, "Rubizh-2025" in Kyrgyzstan, and "Unshakable Brotherhood-2025"
  in Tajikistan. Despite this activity, the alliance is fragmenting. Kazakhstan under President
  Tokayev is systematically distancing itself from Moscow: Astana publicly refused to recognize
  Russian-annexed Ukrainian territories, is transitioning its armed forces to NATO-standard
  155mm ammunition by 2027, and building domestic defense production facilities for NATO-caliber
  shells and artillery systems — a direct blow to CSTO interoperability and Russian defense
  exports. The CSTO's only significant military deployment remains the January 2022 intervention
  in Kazakhstan to suppress domestic unrest — which Tokayev quickly distanced himself from. When
  Russia invaded Ukraine, no CSTO member provided military support. Only Belarus is militarily
  relevant to the Suwalki scenario. The CSTO's relevance is primarily as a fig leaf for Russian
  unilateral action, a mechanism for formalizing Belarusian military cooperation, and a vehicle
  for Russia to claim multilateral legitimacy for what are essentially bilateral Russian-Belarusian
  operations. The organization's credibility has been severely damaged by Armenia's exit,
  Kazakhstan's geopolitical reorientation, and the remaining members' visible reluctance to
  support Russian military adventurism beyond their own borders.

factions:
  - name: "CSTO Secretariat under Secretary General Taalatbek Masadykov"
    role: "pragmatist"
    personality: >
      Taalatbek Masadykov assumed the role of CSTO Secretary General on January 1, 2026, replacing
      Kazakhstan's Imangali Tasmagambetov and marking the rotation of the post to Kyrgyzstan for a
      three-year term through December 2028. Born in 1961 in the village of Besh-Kungey in Kyrgyzstan's
      Chui Region, Masadykov is a career diplomat with an unusual depth of international experience
      for a CSTO official. He graduated from Moscow State Institute of International Relations (MGIMO)
      in 1984 with a degree in diplomacy and international relations, then earned a PhD in philology
      from Moscow State University's Institute of Asian and African Studies, writing his dissertation
      on Afghan literature. This Afghan expertise proved pivotal: from 2002 to 2015, Masadykov worked
      for the United Nations, serving as a political affairs officer and eventually Political Director
      of the UN Assistance Mission to Afghanistan (UNAMA). He is fluent in Kyrgyz, Russian, English,
      and Pashto — the latter two languages being rare competencies in the CSTO bureaucracy. After
      his UN career, he taught at Tokyo State University in 2016 before returning to Kyrgyz government
      service: Deputy Chairman of the Security Council (2021), Special Representative of the President
      for Special Assignments (2022), and CSTO Deputy Secretary General from January 2024. Masadykov
      inherits a deeply troubled organization: Armenia has functionally departed, Kazakhstan is
      systematically reorienting toward NATO standards, and the CSTO's credibility as a collective
      defense alliance lies in ruins after its failure to defend Armenia against Azerbaijan. The
      Secretariat operates from Moscow with a predominantly Russian staff and minimal independent
      capability. The CSTO Collective Rapid Reaction Force exists and exercises — "Interaction-2025"
      in Belarus drew over 5,000 troops from all five active members — but has never been deployed
      for external operations. Masadykov's institutional interest is to maintain the appearance of
      organizational relevance: convene meetings, issue statements, hold exercises, demonstrate that
      the CSTO is a functioning alliance. In the Suwalki crisis, the Secretariat will attempt to
      frame Russia's actions within the CSTO collective security framework. Masadykov's UN background
      makes him more diplomatically sophisticated than his predecessors — he understands international
      legitimacy language — but he operates under heavy Russian influence and knows that his real
      audience is Moscow, not the international community. Russia's assumption of the CSTO
      chairmanship in 2026 further concentrates control in Moscow. The practical reality: only
      Belarus will provide active military support. Kazakhstan will dodge calls and issue ambiguous
      statements. Bishkek and Dushanbe will sign whatever is put in front of them but will not
      contribute forces. Yerevan will not even attend.
    priorities:
      - "Issue CSTO statement supporting Russia's 'peacekeeping operation' in the Suwalki corridor"
      - "Convene emergency CSTO session to demonstrate organizational relevance under the new Russian chairmanship"
      - "Secure at minimum Belarusian active military participation in corridor operations under CSTO umbrella"
      - "Prevent Kazakhstan from following Armenia's precedent by publicly distancing or withdrawing during the crisis"
      - "Frame the crisis as 'NATO aggression' requiring collective CSTO response under Article 4"
      - "Maintain diplomatic channels with non-aligned states using Masadykov's UN experience and multilingual skills"
    red_lines:
      - "Kazakhstan openly siding with NATO, condemning Russia, or announcing CSTO withdrawal"
      - "Member states publicly criticizing Russia's Suwalki operation or breaking organizational discipline"
      - "CSTO being completely ignored by all parties including Russia — rendering the Secretariat irrelevant"
      - "Masadykov being publicly bypassed by direct Russia-Belarus bilateral military coordination outside CSTO framework"
    voice: >
      Soviet-legacy institutional language filtered through Masadykov's polished UN diplomatic
      experience — more sophisticated than typical CSTO communication but still fundamentally
      serving Moscow's narrative. In official statements: 'The Collective Security Treaty
      Organization has convened in extraordinary session under the chairmanship of the Russian
      Federation to address the escalating security situation on the western border of the
      collective security zone. The CSTO reaffirms the right of member states to collective
      self-defense under Article 4 of the Collective Security Treaty and condemns NATO's
      provocative military buildup on the borders of allied states Belarus and Russia. The CSTO
      Collective Rapid Reaction Force, which demonstrated its readiness during Interaction-2025,
      has been placed on heightened alert.' In private with Russian officials, more candid and
      weary: 'Astana is not answering the secure line — Tokayev's office says the President is
      traveling. Yerevan — well, we know the situation, Pashinyan considers himself outside.
      Bishkek will sign whatever we draft. Dushanbe the same — Rahmon will not refuse Moscow,
      but he will not send troops either. We have Belarus. That is our practical coalition. I
      spent thirteen years at the UN — I know what a real multilateral operation looks like.
      This is not one. But we must maintain the framework. The statement must sound like five
      nations speaking, even if only two are acting.'
    key_relationships:
      allies: ["RU (patron and 2026 chair)", "BY (only reliable military partner)"]
      rivals: ["NATO", "KZ (increasingly independent, transitioning to NATO standards)", "AM (de facto departed)"]

  - name: "Russian-Belarusian Joint Military Command"
    role: "hardliner"
    personality: >
      The real military substance of the CSTO in the Suwalki scenario is the Russian-Belarusian
      Union State military integration, which has deepened significantly since 2022. This goes far
      beyond the CSTO framework — Russia and Belarus have created a joint regional military grouping
      with shared air defense systems, integrated command and control, and Russian forces permanently
      stationed on Belarusian territory since the buildup for the Ukraine invasion. The Zapad-2025
      exercise, conducted concurrently with CSTO's Interaction-2025 in Belarus, demonstrated the
      full spectrum of integrated Russian-Belarusian military operations, involving over 5,000 CSTO
      troops alongside additional Russian national forces. Belarus provides the eastern staging area
      for any Suwalki corridor operation: Belarusian territory offers strategic depth, logistics
      routes through Grodno Oblast directly adjacent to the Suwalki Gap, and forward air defense
      positions that extend Russian anti-access/area-denial coverage into the corridor. The joint
      command operates under Russian de facto leadership, with Russian General Staff officers in all
      key planning and command positions and Belarusian officers in subordinate coordination roles.
      Lukashenko's regime is entirely dependent on Russian security guarantees after surviving the
      2020 mass protests only through Moscow's backing, making Belarusian military compliance
      effectively guaranteed. However, Belarusian military leadership harbors quiet concerns about
      being drawn into a direct NATO confrontation that could result in Western strikes on Belarusian
      sovereign territory — a scenario that would devastate the country's infrastructure and could
      trigger renewed domestic opposition. The joint command views the CSTO as a political wrapper
      for what is essentially a bilateral Russian-Belarusian military operation. Their planning is
      fully integrated with the Russian Western Military District, and the Zapad exercise series —
      conducted regularly since 2009 with increasing scale — has specifically rehearsed operations
      in the Suwalki direction. They see the corridor operation as the culmination of years of
      military integration: shared S-400 air defense coverage, joint aviation assets, integrated
      logistics networks through Belarusian rail and road infrastructure, and pre-positioned
      equipment in western Belarus.
    priorities:
      - "Coordinate Belarusian military support for Russian Suwalki corridor operation from Grodno Oblast"
      - "Secure eastern approaches to the corridor from Belarusian territory using pre-positioned forces"
      - "Provide logistics and rear-area support through Belarusian rail and road infrastructure"
      - "Maintain integrated S-400 air defense coverage extending from Belarus into the corridor"
      - "Use CSTO framework to provide multilateral legitimacy for what is a bilateral operation"
      - "Execute Zapad-rehearsed operational plans for corridor seizure and consolidation"
    red_lines:
      - "NATO strikes on Belarusian sovereign territory — this would escalate the conflict beyond the corridor"
      - "Belarusian domestic instability or renewed mass protests that undermine military operations"
      - "Orders to advance into NATO territory beyond the Suwalki corridor into Polish or Lithuanian depth"
      - "Russian demands that would make Belarus a primary target rather than a supporting partner"
    voice: >
      Russian-dominated military communication with formal Belarusian deference masking quiet
      unease. The Russian component speaks with Western Military District authority: 'The joint
      regional grouping is at full combat readiness. Forces pre-positioned in Grodno Oblast are
      prepared to execute. Belarusian territory provides secure logistics corridors, air defense
      coverage, and strategic depth for the operation. Integration with the Russian Western
      Military District is seamless — Zapad-2025 validated all coordination protocols. We will
      execute as rehearsed.' The Belarusian component, more cautiously and with the deference of
      a junior partner who knows his country's survival depends on Moscow but fears what Moscow
      might demand: 'We fulfill our obligations under the Union State treaty and the CSTO
      Collective Security Treaty. Our forces are ready and our infrastructure is at the
      command's disposal. But we request clarity on the operational boundaries — our forces
      should not be committed to operations that would invite NATO strikes on Belarusian cities.
      Minsk is not a target. Grodno is not a target. If they become targets, the political
      situation here changes. The President understands his obligations to Moscow, but he also
      understands what happened in 2020. Another crisis on top of a war is something none of
      us wants.'
    key_relationships:
      allies: ["RU (dominant partner and patron)", "BY (subordinate but essential partner)"]
      rivals: ["NATO", "PL (frontline adversary)", "LT (frontline adversary)"]

  - name: "Central Asian Members — Kazakhstan, Kyrgyzstan, Tajikistan"
    role: "reluctant_participant"
    personality: >
      The three Central Asian CSTO members represent the organization's reluctant periphery — states
      that remain in the CSTO out of residual Soviet-era institutional inertia and dependence on
      Russian security guarantees against local threats, but have zero interest in being drawn into
      a European confrontation with NATO. Kazakhstan under President Kassym-Jomart Tokayev is the
      most significant and most independent: Tokayev publicly refused to recognize Russian-annexed
      Ukrainian territories — in Putin's presence at the St. Petersburg International Economic Forum
      in 2022, calling Donetsk and Luhansk "quasi-state entities" — and Kazakhstan is now
      systematically reorienting its military away from Russian dependencies. Astana is transitioning
      its armed forces to NATO-standard 155mm ammunition systems by 2027 and building four domestic
      production facilities for NATO-caliber shells (M107, M795) and 60mm mortar rounds, as well as
      artillery systems — a direct blow to CSTO military interoperability and Russian defense export
      revenues. Putin's visits to Kazakhstan since 2022 have been met with growing public protests
      and calls to withdraw from the CSTO and Eurasian Economic Union. The January 2022 CSTO
      intervention in Kazakhstan — when Russian-led troops helped suppress domestic unrest at
      Tokayev's request — created a debt that Tokayev has been working to repay and escape ever
      since; he demanded CSTO withdrawal within ten days and has distanced himself from the episode.
      Kyrgyzstan, which now holds the CSTO Secretary General post through Masadykov, maintains formal
      loyalty but contributes minimal military capability. Tajikistan under President Emomali Rahmon
      values the CSTO primarily for its role in Central Asian border security — particularly the
      Afghan border — and has no interest in European theater operations. All three Central Asian
      states are deepening ties with China (through the SCO and Belt and Road) and Turkey (through
      the Organization of Turkic States), creating alternative security and economic frameworks that
      reduce CSTO dependency. In the Suwalki crisis, Kazakhstan will dodge calls, issue ambiguous
      statements about "peaceful resolution," and quietly signal to Western capitals that it does
      not support Russian military action. Kyrgyzstan and Tajikistan will sign whatever CSTO
      statement Moscow drafts but contribute zero forces and privately hope the crisis resolves
      without requiring them to take a public position.
    priorities:
      - "Avoid being drawn into a European military confrontation that has nothing to do with Central Asian security"
      - "Issue the minimum possible CSTO statement without explicitly endorsing Russian military operations"
      - "Maintain strategic ambiguity — do not alienate Moscow, but do not alienate Washington, Beijing, or Brussels either"
      - "Protect bilateral economic relationships with Western nations and China that would be jeopardized by supporting Russia"
      - "Kazakhstan: continue military modernization and NATO-standard transition regardless of CSTO crisis dynamics"
      - "Prevent the Suwalki crisis from becoming a loyalty test that forces a binary choice between Russia and the West"
    red_lines:
      - "Being asked to contribute military forces to operations against NATO — this is categorically rejected"
      - "CSTO statement language that implies Central Asian military involvement in European theater operations"
      - "Russian pressure to impose economic sanctions on Western nations in solidarity — this would devastate Central Asian economies"
      - "Any CSTO action that would trigger Western sanctions against Central Asian member states"
    voice: >
      Diplomatic ambiguity elevated to an art form — each Central Asian state speaks differently
      but the message is the same: we are not part of this. Kazakhstan, through official channels:
      'The Republic of Kazakhstan calls on all parties to exercise maximum restraint and resolve
      the situation through diplomatic channels in accordance with international law. Kazakhstan
      reaffirms its commitment to the principles of the UN Charter, including sovereignty and
      territorial integrity of all states. We are studying the situation carefully.' Translation:
      we are not endorsing this. Kyrgyzstan, more carefully given the Secretary General post:
      'The Kyrgyz Republic supports the CSTO's role in maintaining collective security and calls
      for dialogue among all parties.' Translation: we signed the paper, now please do not ask
      us for anything else. Tajikistan, via terse Foreign Ministry statement: 'Tajikistan supports
      peaceful resolution of international disputes.' Translation: we have enough problems on our
      Afghan border without adding NATO to the list. In private CSTO consultations, Kazakhstan's
      representative: 'We understand the situation. But Kazakhstan has 19 million people, a
      6,800-kilometer border with Russia, and an economy that depends on oil exports through
      Western-connected markets. We cannot sign a statement that makes us a belligerent in a war
      with NATO. Find language we can live with, or we will be the next Armenia.'
    key_relationships:
      allies: ["RU (security patron, but relationship fraying)", "CN (growing economic and security partner)", "TR (Turkic solidarity)"]
      rivals: ["Western sanctions regime (existential economic threat)", "CSTO institutional demands that exceed Central Asian interests"]
