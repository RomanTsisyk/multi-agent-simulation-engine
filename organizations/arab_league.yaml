name: "League of Arab States"
code: "ARAB"
type: "organization"
members: ["SA", "AE", "EG", "IQ", "JO", "KW", "QA", "BH", "OM", "LB", "SY", "LY", "TN", "DZ", "MA", "MR", "SD", "SO", "DJ", "KM", "PS", "YE"]
