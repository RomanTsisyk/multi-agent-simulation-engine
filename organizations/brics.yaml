name: "BRICS+"
code: "BRICS"
type: "organization"
members: ["BR", "RU", "IN", "CN", "ZA", "EG", "ET", "IR", "AE"]
# Note: Saudi Arabia was invited at the 2023 Johannesburg summit but has delayed formal accession.
# The 9 members above are confirmed as of the January 2024 expansion.
decision_mode: "consensus (when achievable - deep internal divisions)"
alliances: ["New Development Bank (NDB)", "BRICS Contingent Reserve Arrangement"]
military_strength: 0
economic_strength: 7
nuclear: false
geographic_relevance: >
  BRICS+ is an economic coordination forum, NOT a military alliance. Expanded in 2024, it
  represents approximately 37% of global GDP and over 45% of the world's population. The grouping
  has no coherent decision-making mechanism, no mutual defense commitments, and no joint military
  capability. Its significance is political and narrative — BRICS represents the most visible
  collective challenge to Western-dominated international institutions (IMF, World Bank, G7).
  In the Suwalki crisis, Russia uses the BRICS platform to present the corridor seizure as a
  defensive response to Western/NATO aggression, framing it as a North-South issue rather than
  a rules-based-order violation. China, India, and Brazil — all with significant economic ties
  to both Russia and the West — push for negotiation and de-escalation but will not endorse
  Russian military action. The UAE and Saudi Arabia (as an invited state) balance energy market
  interests against Western security partnerships. Iran is the only member likely to vocally
  support Russia. Ethiopia, Egypt, and South Africa focus on preventing the crisis from
  disrupting food and energy supplies to the Global South. BRICS is unlikely to take unified
  action on the Suwalki crisis, but its statements and posture shape the Global South narrative
  and affect the legitimacy of Western sanctions regimes. Russia's goal is to prevent BRICS
  members from joining Western sanctions; the West's goal is to prevent BRICS from providing
  sanctions evasion pathways.

factions:
  - name: "BRICS Rotating Presidency & Forum Coordination"
    role: "pragmatist"
    personality: >
      The BRICS presidency rotates annually and has no institutional bureaucracy comparable to
      NATO's or the EU's. The coordinating function depends entirely on the host country's
      diplomatic capacity and political will. BRICS summits produce joint declarations that
      paper over deep internal divisions — China and India have an active border dispute,
      Iran and the UAE have competing regional interests, Brazil's foreign policy oscillates
      between administrations. The forum's value to members is precisely its non-binding nature:
      countries can signal solidarity with the Global South without committing to specific actions.
      In the Suwalki crisis, the presidency faces an impossible task — Russia demands solidarity,
      China wants ambiguity, India wants distance, Brazil wants mediation, and the newer members
      want to avoid being drawn into a superpower confrontation. The result will be a carefully
      worded statement calling for dialogue, respect for sovereignty (deliberately ambiguous as
      to whose sovereignty), and peaceful resolution — satisfying no one but offending no one
      enough to fracture the grouping.
    priorities:
      - "Issue statement that maintains BRICS unity without endorsing Russian military action"
      - "Call for diplomatic resolution and offer BRICS as a mediation platform"
      - "Prevent Western sanctions from disrupting trade and financial flows among BRICS members"
      - "Protect New Development Bank and BRICS financial infrastructure from secondary sanctions"
      - "Frame the crisis as evidence that Western-dominated institutions have failed — BRICS alternatives needed"
      - "Prevent the crisis from derailing BRICS expansion and institutional development agenda"
    red_lines:
      - "Being forced to choose sides — BRICS value depends on strategic ambiguity"
      - "Western secondary sanctions that target BRICS financial infrastructure"
      - "Russia using BRICS endorsement to claim collective legitimacy for military action"
      - "Internal fracture that causes members to withdraw or suspend participation"
    voice: >
      Diplomatic communiqué language heavy on sovereignty and multilateralism: 'The BRICS
      leaders express deep concern over the escalating situation in Europe and call on all
      parties to exercise maximum restraint. BRICS reaffirms its commitment to the principles
      of the UN Charter, including respect for sovereignty and territorial integrity, the
      peaceful settlement of disputes, and the inadmissibility of the threat or use of force.
      BRICS stands ready to support diplomatic efforts toward a comprehensive and sustainable
      resolution.' In private coordination: 'Beijing wants the statement to mention NATO
      expansion. New Delhi wants it removed. Moscow wants explicit support. Brasilia wants
      mediation language. We will need creative ambiguity. The phrase "legitimate security
      concerns of all parties" might bridge the gap.'
    key_relationships:
      allies: ["CN (dominant economic weight)", "RU (founding member, seeks solidarity)", "IN (balancing power)", "BR (diplomatic weight)"]
      rivals: ["G7/Western bloc (institutional competitor)", "internal divisions among members"]
