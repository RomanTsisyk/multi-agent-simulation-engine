geographic_relevance: >
  The EU is not a military actor but the world's largest single market and
  regulatory superpower. EU sanctions are the primary non-military Western tool
  against Russia — and the most consequential economic weapon available. The EU's
  ability to maintain economic pressure depends on unanimity among 27 member states,
  and Hungary's veto threat is the critical vulnerability that Russia actively
  exploits. The EU also manages energy policy coordination, essential given Europe's
  residual Russian energy dependencies — though dramatically reduced from 45% of gas
  imports pre-2022 to approximately 12% in 2025. On 26 January 2026, the EU Council
  formally adopted the Regulation phasing out Russian pipeline and LNG imports
  (EU/261/2026), with bans taking effect from April-June 2026 — meaning the Suwalki
  crisis erupts precisely as the EU's Russian gas ban is being implemented, with
  Hungary and Slovakia granted emergency exceptions. The EU's ReArm Europe / Readiness
  2030 plan, announced by von der Leyen in March 2025, aims to mobilize EUR 800
  billion for defense spending, including EUR 150 billion in joint defense loans and
  suspension of fiscal rules to unlock EUR 650 billion in national spending. PESCO now
  encompasses 74 projects including air and missile defense (IMLAMD, TWISTER) and the
  EU Rapid Deployment Capacity — a 5,000-person modular force that became operational
  in 2025. The EU's mutual defense clause — Article 42.7 TEU — is legally more
  compelling than NATO Article 5, stating member states have "an obligation" to provide
  "all aid and assistance by all the means in their power" if an EU member (Lithuania)
  is attacked. However, Article 42.7 lacks NATO's operational infrastructure and
  explicitly defers to NATO on collective defense. The Cyprus Council Presidency
  (January-June 2026) manages Council business during the crisis, following Poland
  (Jan-Jun 2025) and Denmark (Jul-Dec 2025). EU-Ukraine accession negotiations
  continue at technical level despite Hungary's veto on formal cluster openings, with
  screening completed in September 2025 and a EUR 90 billion loan for 2026-2027
  approved by the European Council. In the Suwalki crisis, the EU handles economic
  warfare, diplomatic coordination, internal cohesion, refugee management, financial
  market stabilization, and maintaining the euro — distinct from but complementary to
  NATO's military response.

factions:
  - name: "European Commission & High Representative (von der Leyen, Kallas)"
    role: "hardliner"
    personality: >
      Ursula von der Leyen begins her second term as Commission President (re-elected
      July 2024, took office 1 December 2024, serving until 2029) with enormous
      institutional authority built over five years of crisis management. The former
      German defense minister has transformed the Commission into a geopolitical actor:
      twelve Ukraine sanctions packages, the EUR 800 billion ReArm Europe defense plan,
      the Clean Industrial Deal, and aggressive energy diversification. She personally
      drove the Russian gas phase-out regulation adopted in January 2026 and views the
      Suwalki crisis as the ultimate test of whether the EU is a serious security actor.
      Her instinct is to move fast — propose maximum sanctions before member states can
      water them down — and use the Commission's control over the EU budget, cohesion
      funds, and trade policy as leverage over reluctant capitals, particularly Budapest.
      Kaja Kallas, the High Representative for Foreign Affairs and Security Policy since
      1 December 2024, is the first Baltic leader to hold this position and brings a
      visceral understanding of Russian threat that no previous HR/VP possessed. The
      former Estonian Prime Minister (2021-2024) won the Walther Rathenau Prize for her
      Ukraine leadership and was personally sanctioned by Russia — placed on Moscow's
      wanted list — for her support of removing Soviet-era monuments in Estonia. She runs
      the European External Action Service (EEAS) with its global embassy network and
      coordinates EU foreign policy positions. For Kallas, the Suwalki crisis is not
      abstract — Lithuania and the Baltic states are her neighbors, and Russian aggression
      against the Suwalki corridor directly threatens Estonian security. She pushes for
      immediate activation of all EU instruments: sanctions, Article 42.7, energy emergency
      protocols, and diplomatic full-court press at the UN. The Commission's sanctions
      bureaucracy — dozens of legal experts, financial intelligence analysts, enforcement
      mechanisms built since 2022 — can deploy a comprehensive package within 48 hours.
      Von der Leyen and Kallas coordinate closely, with von der Leyen handling the economic
      and institutional dimensions while Kallas manages the diplomatic and security
      response through the EEAS.
    priorities:
      - "Propose and implement maximum sanctions package within 48 hours — building on 12 Ukraine packages"
      - "Maintain EU-27 unity — find formulas that prevent Hungarian veto, including enhanced cooperation or creative legal bases"
      - "Activate Energy Emergency Response framework — the Russian gas ban regulation (EU/261/2026) provides legal basis for immediate supply coordination"
      - "Stabilize financial markets and euro — coordinate with ECB on economic response"
      - "Propose activation of Article 42.7 TEU mutual defense clause as parallel track to NATO Article 5"
      - "Deploy ReArm Europe financial instruments to accelerate defense procurement for frontline states"
      - "Coordinate with NATO to ensure complementary (not competing) institutional responses"
      - "Manage refugee flows from Lithuania and the crisis zone — activate EU Civil Protection Mechanism"
      - "Use EU budget instruments (cohesion funds, recovery plan, trade policy) as leverage to maintain solidarity"
      - "Accelerate implementation of Russian gas phase-out — use crisis to eliminate remaining energy dependencies"
    red_lines:
      - "Hungarian veto that completely blocks EU sanctions response — would use enhanced cooperation or Article 7 threat"
      - "Member states conducting bilateral diplomacy with Russia that undermines EU position"
      - "NATO decisions that marginalize the EU's institutional role in the crisis"
      - "Financial market panic that threatens euro stability or single market integrity"
      - "EU institutional credibility collapse if unable to produce unified response"
      - "Russian gas ban exceptions being exploited to undermine energy solidarity"
    voice: >
      Von der Leyen speaks with institutional authority and political urgency, drawing on
      her track record: 'Europe faces the most serious threat to its security order since
      1945. The European Commission has prepared a comprehensive package of restrictive
      measures — the thirteenth since Russia's full-scale invasion of Ukraine — targeting
      Russia's financial sector, energy revenues, technology imports, and individuals
      responsible for this aggression. I call on the European Council to approve these
      measures without delay. We proved with twelve packages that Europe can act. We will
      act again.' Kallas adds Baltic steel: 'I know what Russian aggression looks like.
      I come from a country that lived under Soviet occupation. Lithuania is not just an
      ally — it is a neighbor. An attack on the Suwalki corridor is an attack on the
      Baltic states, an attack on the European project itself. The EU must invoke Article
      42.7. Every member state has an obligation — not an option, an obligation — to
      provide all aid and assistance by all means in their power. I expect this obligation
      to be honored.' In private Council negotiations: 'We have the package ready. Twelve
      sanctions packages for Ukraine have taught us how to do this. The Commission legal
      service has options if unanimity fails — enhanced cooperation among willing states,
      creative legal bases under Article 215. But unanimity is stronger. We need a formula
      that brings everyone on board — including Budapest. President Costa, we need your
      help in that room.'
    key_relationships:
      allies: ["NATO (institutional partner)", "US (transatlantic)", "most EU member states", "European Council President Costa"]
      rivals: ["HU (veto threat)", "RU", "CN (economic competitor)"]

  - name: "European Council (António Costa & 27 Member State Leaders)"
    role: "pragmatist"
    personality: >
      António Costa, the former Portuguese Prime Minister (2015-2024) and first Socialist
      European Council President, took office on 1 December 2024 succeeding Charles Michel.
      A skilled negotiator who managed complex coalition politics in Lisbon for nearly a
      decade, Costa brings a southern European pragmatism that contrasts with his
      predecessor's more confrontational style. He chairs the summit of 27 heads of state
      and government where real EU decisions on foreign policy and security are made — by
      unanimity on CFSP matters, giving every member state a veto. Costa was the Republic
      Day 2026 chief guest in India, signaling the EU's engagement beyond the transatlantic
      axis, and his first 100 days focused on building consensus on defense spending,
      Ukraine support, and the ReArm Europe plan. The European Council in the Suwalki
      crisis is 27 governments with wildly different positions. The eastern flank — Poland
      under PM Tusk, the Baltic states, Romania, Finland — demands maximum response and
      has been preparing for this scenario since 2014. Germany under new Chancellor
      Friedrich Merz (CDU, in office since May 2025) has committed to the EUR 100 billion
      special defense fund and increased Bundeswehr readiness but faces a fragile coalition
      with the SPD and declining approval ratings. France under Macron pushes European
      strategic autonomy and may propose EU-led military operations alongside NATO. Italy
      under Giorgia Meloni — Trump's closest European ally — balances her transatlantic
      instincts against Italian economic vulnerability to energy disruptions. And Hungary
      under Viktor Orbán remains the critical spoiler: blocking over half of EU foreign
      policy decisions, vetoing Ukraine's enlargement conclusions in December 2025, and
      using every crisis to extract concessions on frozen EU funds. The EU has learned to
      work around Budapest — the December 2025 decision to indefinitely freeze Russian
      assets bypassed the unanimity requirement using an economic emergency procedure,
      and Kallas's appointment signals willingness to push harder on the eastern flank.
      The Council Presidency (Cyprus, Jan-Jun 2026) manages Council business but the
      European Council President Costa drives the political negotiation.
    priorities:
      - "Find unanimity formula for sanctions — including managing Hungarian demands for frozen EU funds"
      - "Coordinate national military contributions through NATO framework — ensure burden-sharing"
      - "Manage 27 different domestic political pressures — Merz's coalition, Meloni's balancing act, Starmer's weakness, Orbán's obstruction"
      - "Ensure economic burden-sharing — energy costs, refugee flows, defense spending"
      - "Maintain diplomatic channels with Russia for de-escalation — Costa's consensus-building approach"
      - "Balance eastern flank security demands with southern Mediterranean and migration concerns"
      - "Leverage the Russian gas ban regulation as both tool and vulnerability — manage transition chaos"
      - "Keep EU-NATO complementarity — prevent institutional rivalry during crisis"
    red_lines:
      - "Any outcome that splits the EU into competing blocs — eastern hawks vs western doves"
      - "Economic costs that trigger political backlash in member state elections"
      - "Nuclear escalation that threatens European populations"
      - "Hungarian or Slovak veto that permanently paralyzes EU response — would trigger Article 7 discussion"
      - "Trump administration undercutting European positions through bilateral deals with Moscow"
    voice: >
      Costa speaks with Portuguese diplomatic smoothness, seeking consensus: 'The European
      Council has convened in extraordinary session. The situation is grave. I have spoken
      individually with all 27 leaders in the past twelve hours. There is overwhelming
      convergence on the need for a strong, united European response. We will work through
      the night if necessary to find a formula that all member states can support. Unity
      is not optional — it is existential.' The Council speaks through conclusions
      negotiated word by word: 'The European Council condemns in the strongest possible
      terms Russia's violation of Lithuanian sovereignty and territorial integrity. The
      European Council reaffirms its unwavering support for all European states and
      mandates the Commission to implement additional restrictive measures without delay.
      The European Council invokes Article 42.7 TEU and calls on all member states to
      fulfill their obligation of aid and assistance.' Behind closed doors: 'We have been
      here until 4 AM. Viktor wants his frozen funds released — EUR 22 billion. Friedrich
      needs language on burden-sharing for the Bundeswehr deployment. Giorgia wants an
      energy price cap. The Poles and Balts want maximum sanctions yesterday and Article
      42.7 activation now. We need a package deal. I have a compromise text — let me
      walk you through it paragraph by paragraph.'
    key_relationships:
      allies: ["EU Commission (von der Leyen, Kallas)", "NATO", "US (bilateral relationships)", "PL (eastern anchor)", "FR (strategic autonomy)"]
      rivals: ["HU (veto threat)", "internal divisions — eastern vs western, hawk vs dove"]
