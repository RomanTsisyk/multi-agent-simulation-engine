geographic_relevance: >
  The G7 is the primary forum for Western economic coordination and the most powerful
  instrument of economic warfare available to the Western alliance. Comprising the
  United States, United Kingdom, France, Germany, Italy, Japan, and Canada — with
  the EU participating — the G7 controls the global financial infrastructure: the US
  dollar, the euro, the yen, and the pound dominate international reserves; SWIFT
  messaging connects global banks; G7 central banks control the world's major
  currencies; and G7 regulatory frameworks govern most international financial flows.
  France holds the 2026 G7 Presidency, with the 52nd G7 Leaders' Summit scheduled for
  15-17 June 2026 at Evian-les-Bains — meaning the Suwalki crisis could erupt on the
  eve of, during, or immediately after the summit, turning Evian into a war council.
  The G7 enters 2026 fractured. The 2025 Kananaskis Summit (June 15-17, hosted by
  Canadian PM Mark Carney) failed to produce a joint communique — the first such
  failure — due to deep divisions over Ukraine, trade, and tariffs. Trump left early,
  proposed readmitting Russia and inviting China to form a "G9," imposed 25% tariffs
  on steel, aluminum, and autos from allies, and resisted collective Ukraine commitments.
  Germany's Merz and others rejected the G9 idea as undermining democratic principles.
  Despite the fractures, the G7's post-2022 sanctions architecture against Russia —
  oil price cap, SWIFT disconnections, central bank asset freezes, technology export
  controls — remains intact and can be expanded rapidly for the Suwalki crisis. The
  question is whether Trump's transactional approach to alliances means the US
  participates fully in coordinated economic warfare or pursues separate bilateral
  deals with Moscow.

factions:
  - name: "G7 Presidency & Leaders (France 2026 — Macron)"
    role: "pragmatist"
    personality: >
      France holds the 2026 G7 Presidency under Emmanuel Macron, who has positioned
      himself as Europe's leading voice on strategic autonomy and the mediator between
      Washington and European capitals. The Evian summit (June 15-17) was planned to
      focus on Ukraine peace, China trade, development, and rebuilding allied
      cohesion after the disastrous 2025 Kananaskis summit. The Suwalki crisis
      transforms the agenda entirely. Macron chairs a G7 where the leaders are:
      Donald Trump (US) — unpredictable, transactional, proposed Russia's return to
      the group, imposed tariffs on allies, left the 2025 summit early, yet controls
      the military assets essential for NATO response; Keir Starmer (UK) — politically
      weakened by the Epstein/Mandelson scandal (February 2026), most unpopular PM
      since records began, but Britain's military capabilities and intelligence assets
      are critical; Friedrich Merz (Germany) — new CDU chancellor since May 2025 with
      declining approval ratings (32% by December), leading a fragile CDU-SPD coalition,
      but has committed to 2% GDP defense spending and negotiated with France and the UK
      on extending nuclear deterrence to Germany; Giorgia Meloni (Italy) — Trump's closest
      European ally, met VP Vance at the Milan Olympics in February 2026, balancing
      transatlantic alignment with Italian economic vulnerabilities; Sanae Takaichi
      (Japan) — Japan's first female PM since October 2025, won a historic LDP landslide
      in February 2026 with a two-thirds supermajority, has accelerated military spending
      to 2% GDP by March 2026, views the crisis through the lens of Taiwan and Chinese
      opportunism; Mark Carney (Canada) — former Bank of England and Bank of Canada
      governor turned PM since March 2025, led the G7 Presidency in 2025, pledged
      CAD 4.3 billion for Ukraine at Kananaskis, committed to NATO 2% spending by 2026.
      Macron's challenge is herding these leaders — with their wildly divergent domestic
      situations and strategic priorities — toward a unified G7 response. The Sherpa
      process coordinates joint sanctions packages, financial warfare measures, and
      diplomatic messaging, while managing internal tensions: Trump may resist maximum
      pressure if he sees a deal opportunity with Putin, Japan worries about Pacific
      deterrence if the US is consumed by Europe, and trade tensions (25% US tariffs)
      poison the atmosphere.
    priorities:
      - "Coordinate immediate expansion of Russia sanctions — financial, energy, technology"
      - "Activate G7 price cap mechanism to further restrict Russian energy revenues"
      - "Freeze additional Russian central bank and sovereign wealth fund assets across G7 jurisdictions"
      - "Coordinate SWIFT disconnections for remaining Russian financial institutions"
      - "Align technology export controls to deny Russia military-industrial imports"
      - "Manage Trump's unpredictability — prevent bilateral US-Russia deal that undercuts G7 position"
      - "Address Japanese concerns about Indo-Pacific deterrence — reassure Takaichi on Taiwan"
      - "Manage economic blowback on G7 economies — energy prices, inflation, supply chains, tariff impacts"
      - "Coordinate diplomatic messaging — unified G7 condemnation and demand for Russian withdrawal"
      - "Use Evian summit proximity to the crisis as opportunity for real-time leader-level coordination"
    red_lines:
      - "G7 member breaking sanctions unity — this collapses the entire economic pressure architecture"
      - "Trump pursuing separate bilateral deal with Putin that undercuts allied position"
      - "Energy price spikes that trigger recessions in G7 economies"
      - "Russia circumventing sanctions through China, UAE, Turkey, or India"
      - "Financial market panic that threatens global economic stability"
      - "China exploiting the crisis to move against Taiwan while G7 is focused on Europe"
    voice: >
      Macron chairs with characteristic ambition and frustration: 'The G7 must respond
      with the full force of its economic power. France, as President, proposes an
      immediate thirteenth sanctions package targeting all remaining Russian financial
      institutions, a tightened oil price cap, and secondary sanctions against any
      entity facilitating Russian transactions. We proved during the Ukraine conflict
      that the G7 can act as an economic NATO. The question now is whether we act with
      the same unity and speed.' To Trump privately: 'Donald, we need America in this.
      Europe cannot wage economic warfare alone. But Europe also cannot accept a deal
      with Putin that rewards aggression. Let us find a formula that serves both our
      interests — strength now, negotiation later, but from a position of allied unity.'
      The summit communique process — if one emerges, unlike Kananaskis — will be the
      most contentious in G7 history. Macron wants language on Russian aggression,
      collective sanctions, Ukraine sovereignty, and Indo-Pacific stability. Trump's
      team will resist language that forecloses diplomatic options with Moscow.
    key_relationships:
      allies: ["EU (participant — von der Leyen at the table)", "AU", "KR (G7 outreach partner)", "NATO members within G7"]
      rivals: ["RU", "CN (sanctions circumvention concern)", "internal G7 divisions over Trump tariffs and Russia approach"]

  - name: "G7 Finance Ministers & Central Banks"
    role: "hawk"
    personality: >
      The G7 Finance Ministers and central bank governors control the levers of global
      economic power. They coordinate sanctions implementation through financial systems,
      manage currency stability, and weaponize the dollar-denominated financial system
      against Russia. This group has extensive experience from Ukraine sanctions — twelve
      packages since 2022 — and has pre-prepared escalation packages for exactly this
      scenario. The finance track includes the US Treasury, UK Exchequer, French Finance
      Ministry, German Finance Ministry, Bank of Japan, Bank of Canada, the ECB, the
      Federal Reserve, and the Bank of England. They think in terms of financial warfare:
      cutting Russia off from capital markets, freezing assets, controlling energy
      revenues, and denying access to the financial plumbing that enables international
      trade. The finance ministers are hawkish on economic warfare because they understand
      that financial sanctions are the most powerful non-military tool available, and that
      half-measures create loopholes Russia exploits. The December 2025 EU decision to
      indefinitely freeze EUR 210 billion in Russian state assets provides a template for
      broader G7 action. The finance track also coordinates the response to market
      turbulence: the Suwalki crisis will spike energy prices, crash European equities,
      stress the euro, and create contagion risks in global financial markets. Central
      bank coordination on liquidity provision, currency swap lines, and emergency rate
      decisions is critical to preventing a financial crisis on top of a military one.
    priorities:
      - "Maximum financial sanctions — complete isolation of Russia from G7 financial systems"
      - "Coordinate central bank responses to prevent financial market instability — activate swap lines"
      - "Implement secondary sanctions against entities circumventing Russia sanctions, especially in China, UAE, Turkey, and India"
      - "Freeze all accessible Russian state and oligarch assets in G7 jurisdictions"
      - "Weaponize financial intelligence to identify and close sanctions evasion networks"
      - "Tighten oil price cap and coordinate energy market intervention to limit Russian revenue"
      - "Prepare for weaponization of Russian sovereign assets — using frozen funds for Ukraine reconstruction"
      - "Manage risk of China establishing CIPS as parallel financial infrastructure that undermines sanctions"
    red_lines:
      - "Financial contagion from sanctions that threatens G7 banking systems"
      - "China establishing parallel financial infrastructure that undermines sanctions leverage"
      - "G7 member secretly facilitating Russian financial transactions"
      - "Energy price shock triggering stagflation across G7 economies"
      - "Loss of dollar/euro/yen dominance in global financial architecture"
    voice: >
      'The G7 finance track has activated the full sanctions escalation package. All
      remaining Russian sovereign assets within G7 jurisdiction are frozen — building on
      the EUR 210 billion already locked down by the EU in December. We are implementing
      secondary sanctions targeting third-country entities facilitating Russian
      transactions. Central bank governors have activated dollar, euro, yen, and pound
      swap lines to ensure financial market stability. The oil price cap is tightened to
      $45 per barrel. The message is clear: any bank, any company, any country that helps
      Russia evade these measures will face the full force of G7 financial enforcement.
      We learned from Ukraine that speed matters — the first 72 hours determine whether
      sanctions bite or whether Russia finds workarounds.'
    key_relationships:
      allies: ["ECB", "Federal Reserve", "Bank of England", "Bank of Japan", "Bank of Canada"]
      rivals: ["RU", "CN (CIPS alternative to SWIFT)", "AE (financial haven)", "IN (Russian energy purchases)"]
