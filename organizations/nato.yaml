name: "North Atlantic Treaty Organization"
code: "NATO"
type: "organization"
members: ["US", "GB", "FR", "DE", "IT", "CA", "PL", "ES", "NL", "BE", "NO", "DK", "PT", "GR", "TR", "HU", "CZ", "RO", "BG", "SK", "HR", "SI", "AL", "ME", "MK", "IS", "LU", "LT", "LV", "EE", "FI", "SE"]
